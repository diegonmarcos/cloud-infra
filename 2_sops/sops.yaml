# SOPS configuration for cloud service secrets
# Uses age encryption with Diego's key

keys:
  - &diego age1u575hx8h4t5cgle2uznmyfy75e7cgd02h9t5dax506luz9e05vlqxtd7pq

creation_rules:
  # Per-service secrets files
  - path_regex: (^|.*/)secrets\.yaml$
    key_groups:
      - age:
          - *diego
  # Per-service secret FRAGMENTS (src/secrets.<name>.yaml): merged into the same
  # dist/.secrets by step_secrets. A new fragment needs only this public
  # recipient, where adding a key to secrets.yaml needs the private key (#760).
  - path_regex: (^|.*/)secrets\.[A-Za-z0-9_-]+\.yaml$
    key_groups:
      - age:
          - *diego
  # Backup secrets files
  - path_regex: (^|.*/)secrets_backup\.yaml$
    key_groups:
      - age:
          - *diego
  # JWKS key files
  - path_regex: (^|.*/)jwks_key\.yaml$
    key_groups:
      - age:
          - *diego
  # Terraform state files (encrypted for public repo)
  - path_regex: (^|.*/)terraform\.tfstate\.enc$
    key_groups:
      - age:
          - *diego
