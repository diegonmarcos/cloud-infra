name: Auto-sync submodules

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update submodules
        run: git submodule update --remote

      - name: Run
        shell: bash {0}
        run: |
          # Stage submodule pointer changes first, then check staged diff.
          # `.gitmodules` has `ignore=all` (avoids noisy working-tree diffs),
          # which also silences `git diff` for submodule pointer bumps —
          # we must stage + check `--cached` to detect real pointer changes.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 2_configs/dist II_tools III_unix
          if ! git diff --cached --quiet; then
            git commit -m "auto: update submodules [skip ci]"
            git push
          fi
