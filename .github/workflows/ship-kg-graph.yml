name: Ship KG Graph (SurrealDB)

on:
  push:
    paths:
      - "a_solutions/container-nix/ca-dat_kg-graph/**"
      - ".github/workflows/ship-kg-graph.yml"
    branches: [main]
  workflow_dispatch:
    inputs:
      wipe_data:
        description: "Wipe SurrealDB data (fresh start, re-seeds)"
        required: false
        type: boolean
        default: false

concurrency:
  group: ship-kg-graph
  cancel-in-progress: false

jobs:
  ship-kg-graph:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-24.11

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "${{ secrets.OCI_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          ssh-keyscan -H 82.70.229.129 >> ~/.ssh/known_hosts 2>/dev/null || true

          cat > ~/.ssh/config <<EOF
          Host oci-apps
            HostName 82.70.229.129
            User ubuntu
            IdentityFile ~/.ssh/id_deploy
            ServerAliveInterval 30
            ServerAliveCountMax 10
          EOF
          chmod 600 ~/.ssh/config

      - name: Setup SOPS age key
        run: |
          mkdir -p ~/.config/sops/age
          echo "${{ secrets.SOPS_AGE_KEY }}" > ~/.config/sops/age/keys.txt
          echo "SOPS_AGE_KEY_FILE=$HOME/.config/sops/age/keys.txt" >> "$GITHUB_ENV"

      - name: Install sops
        run: nix profile install nixpkgs#sops

      - name: Ship kg-graph
        working-directory: a_solutions/container-nix/ca-dat_kg-graph
        run: bash build.sh ship

      - name: Wipe SurrealDB data (fresh start)
        if: github.event.inputs.wipe_data == 'true'
        run: |
          ssh oci-apps "cd /opt/containers/kg-graph && docker compose down 2>/dev/null; sudo rm -rf /opt/data/surrealdb && sudo mkdir -p /opt/data/surrealdb && sudo chown 65532:65532 /opt/data/surrealdb"
          ssh oci-apps "cd /opt/containers/kg-graph && docker compose --env-file .secrets up -d"
          echo "Waiting for SurrealDB to start..."
          sleep 10

      - name: Copy seed resources
        run: |
          rsync -avz a_solutions/container-nix/ca-dat_kg-graph/scripts/ oci-apps:/opt/containers/kg-graph/scripts/
          rsync -avz a_solutions/container-nix/config.json oci-apps:/opt/containers/kg-graph/config.json

      - name: Seed KG
        if: github.event.inputs.wipe_data == 'true'
        run: |
          ssh oci-apps "chmod +x /opt/containers/kg-graph/scripts/seed_from_config.sh && cd /opt/containers/kg-graph && bash scripts/seed_from_config.sh http://localhost:8001 /opt/containers/kg-graph/config.json"

      - name: Verify
        run: |
          ssh oci-apps "curl -sf http://localhost:8001/health && echo ' <- SurrealDB health OK' || echo 'SurrealDB health FAILED'"
