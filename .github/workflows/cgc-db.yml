# ┌──────────────────────────────────────────────────────────────┐
# │  cloud-cgc octocode DB — TWO-PHASE ORCHESTRATOR.            │
# │                                                              │
# │  Schedule + workflow_dispatch entry point. Carries ZERO      │
# │  logic: it only chains the reusable cgc-db-index.yml twice,   │
# │  once per phase, in order.                                   │
# │                                                              │
# │    1. semantic — structural FastEmbed index (USE_LLM=false), │
# │       change-gated on the .cgc-manifest-semantic.json commit │
# │       per repo.                                              │
# │    2. graphrag — LLM relationship enrichment (USE_LLM=true),  │
# │       runs ONLY after semantic succeeds, change-gated on its │
# │       OWN .cgc-manifest-graphrag.json so it is not skipped    │
# │       by semantic having advanced HEAD.                      │
# │                                                              │
# │  Schedule is data-driven from build.json                     │
# │    runtime.octocode.update.schedule (twice daily 4/16 UTC).  │
# │                                                              │
# │  workflow_dispatch supports running a SINGLE phase manually   │
# │  via the `phase` input (both | semantic | graphrag).        │
# └──────────────────────────────────────────────────────────────┘

name: "cgc-db (two-phase octocode index → GHCR → oci-apps)"
# #418: a queued run has zero jobs and the API does not return dispatch inputs, so
# with queue:max holding several runs nobody could tell whether "the forced
# cloud-infra reindex" was already waiting — a duplicate costs hours, a missing one
# blocks #375. The title carries every dispatch input (the tester derives the list
# from `inputs:` below, so a new input that is not surfaced here goes RED).
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && format('cgc-db · dispatch · phase={0} repos={1} force={2} restore={3} surfaces={4}',
                inputs.phase, inputs.repos || 'all', inputs.force, inputs.restore, inputs.surfaces)
      || format('cgc-db · {0}', github.event_name) }}

on:
  workflow_dispatch:
    inputs:
      phase:
        description: "Which phase(s) to run manually."
        required: false
        default: both
        type: choice
        options:
          - both
          - semantic
          - graphrag
      repos:
        description: "Optional space/comma-separated subset of index_repos to run (default: all). Use to re-run one repo without paying for a full 8-repo cycle."
        required: false
        default: ""
        type: string
      restore:
        description: "Propagate the result to the box afterwards (default true). Set false when the run only publishes repos the target volume filters out anyway, so the ~50min restore-all buys nothing."
        required: false
        default: true
        type: boolean
      force:
        description: "Reindex even when HEAD matches the phase manifest. Use after an INDEXER change (fixed LLM endpoint, new embedding model) — the manifest keys on HEAD alone, so an unchanged repo indexed badly would otherwise never be reindexed."
        required: false
        default: false
        type: boolean
      surfaces:
        description: "Which DB surfaces the restore propagates to. 'pvt' repairs the private volume without re-paying the ~50 min public restore, which is the whole reason this input exists."
        required: false
        default: both
        type: choice
        options:
          - both
          - pub
          - pvt
  # Schedule is data-driven from build.json runtime.octocode.update.schedule.
  # Twice daily (4:00 and 16:00 UTC): keeps the graph current with minimal runner
  # load. Each phase is change-gated per repo (skips repos whose HEAD is already
  # indexed in that phase's manifest) so unchanged repos cost seconds, not hours.
  schedule:
    - cron: "0 4,16 * * *"

# Serialise cgc-db against ITSELF, not against the deploy fleet.
#
# This used to be `group: ship-wg-runner`. Workflow-level concurrency holds the
# group for the WHOLE run, so the 8-way index matrix — which touches no mesh at
# all (it pushes to GHCR and calls openrouter.ai over the public internet, and
# carries neither a `WireGuard up` step nor an SSH key) — sat on the fleet's
# single deploy lock for as long as it ran. On 2026-09-09 run 34329534560
# (`phase · semantic / cgc-db · semantic · cloud-u-android`, an INDEX matrix job)
# was still going 91 minutes after its eight siblings finished, holding the group
# with a Deploy pending behind it and nothing running. GitHub keeps exactly one
# pending entry per group, so the next deploy to queue evicted that pending one as
# a grey "cancelled" — a whole day of container deploys silently did not happen.
#
# Only `restore-all` in cgc-db-index.yml needs the mesh identity, so only
# restore-all declares ship-wg-runner now, at job level. What stays here is the
# narrower guarantee this workflow actually needs: two cgc-db runs must not
# overlap, because they write the same per-phase manifest and the same per-repo
# GHCR tags. cancel-in-progress is false so a running semantic→graphrag chain is
# NEVER cancelled mid-flight — the sequential chain always completes.
#
# #418: `queue: max`. Without it a group holds ONE running and ONE pending run,
# and every newer entrant CANCELS the pending one before it has started a single
# job. Measured 2026-09-24 over the last 40 runs: 20 ended `cancelled`, 6 of the 8
# workflow_dispatch reindexes among them — each with zero jobs, i.e. it never
# executed. 35908826779 (schedule) was cancelled at 08:53:55Z, one second after
# schedule 35977946827 was created. A forced reindex (#352/#375) cannot survive
# that: the next cron evicts it. max = FIFO, up to 100 waiting, nothing evicted.
concurrency:
  group: cgc-db
  cancel-in-progress: false
  queue: max

jobs:
  # #418: the price of `queue: max`. One run keeps its jobs busy ~14h (35840158564:
  # 19:03Z -> 09:27Z next day) and cron fires every 12h, so an unbounded FIFO of
  # scheduled runs would grow forever and a dispatch would wait behind all of them.
  # A scheduled run that reaches the front while a NEWER scheduled run is already
  # queued is redundant — same inputs (all repos, both phases, change-gated), and
  # the newer one clones newer HEADs. So it cancels ITSELF, naming its successor:
  # conclusion `cancelled`, never a green run that did nothing. Dispatches are never
  # coalesced — their inputs (repos, force, phase) are what the requester asked for.
  coalesce:
    name: "coalesce · newer scheduled run queued?"
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Cancel this scheduled run if a newer scheduled run waits behind it
        env:
          GH_TOKEN: ${{ github.token }}
          ME: ${{ github.run_id }}
          # The tester (9_others/test/cgc-db-queue-no-eviction.test.sh) extracts and
          # EXECUTES this filter. Run ids are monotonic, so "newer" is `.id > ME`.
          SUPERSEDED_BY: '[.workflow_runs[] | select(.event == "schedule" and .status != "completed" and .id > (env.ME | tonumber)) | .id] | max // empty'
        run: |
          NEWER=$(gh api "repos/${{ github.repository }}/actions/workflows/cgc-db.yml/runs?event=schedule&per_page=50" --jq "$SUPERSEDED_BY")
          [ -z "$NEWER" ] && { echo "no newer scheduled run queued — this run proceeds"; exit 0; }
          echo "::notice::superseded by queued scheduled run $NEWER (same inputs, newer HEADs) — cancelling $ME so the queue stays bounded"
          gh run cancel "$ME" -R "${{ github.repository }}"
          sleep 300
          echo "::error::cancel of run $ME did not take effect within 300s"
          exit 1

  # Phase 1 — structural semantic index. Runs unless the manual dispatch asked for
  # graphrag only. On schedule (event_name != workflow_dispatch) it always runs.
  semantic:
    name: "phase · semantic"
    # needs coalesce, which is SKIPPED on dispatch — hence !cancelled() (a status
    # function), without which a skipped need would skip this job too.
    needs: coalesce
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.phase == 'both' || inputs.phase == 'semantic') }}
    uses: ./.github/workflows/cgc-db-index.yml
    with:
      phase: semantic
      # Empty on schedule (github.event.inputs is null there) = all repos.
      repos: ${{ github.event.inputs.repos || '' }}
      # Scheduled runs have no inputs and must always propagate, hence the
      # "not explicitly false" form rather than a plain truthy check.
      restore: ${{ github.event.inputs.restore != 'false' }}
      # Null on schedule (github.event.inputs is null there) = both surfaces.
      surfaces: ${{ github.event.inputs.surfaces || 'both' }}
      # Null on schedule = 'false' = honour the manifest (the daily run must stay incremental).
      force: ${{ github.event.inputs.force || 'false' }}
    secrets: inherit

  # Phase 2 — GraphRAG LLM enrichment. On a full run it waits for semantic; a
  # graphrag-only manual dispatch skips that dependency entirely (needs is conditional).
  #
  # `failure` is ACCEPTED, not just success. Since the per-repo split, semantic is a
  # fail-fast:false matrix — one repo failing is the NORMAL case (a private repo with
  # no checkpoint image, a transient push drop), and it makes the whole reusable-
  # workflow result `failure` even when every other repo published fine. Gating on
  # `success` therefore skipped GraphRAG for ALL repos whenever ANY single repo failed:
  # run 32574580997 indexed 6 of 8 repos cleanly and still produced zero graph nodes.
  # That gate was correct for the old SERIAL job (all-or-nothing); it is wrong for a
  # per-repo matrix, where each graphrag job restores its own repo's image and stands
  # or falls alone. `cancelled` stays excluded — that means the operator stopped the run.
  # !cancelled(), not always(): always() starts this job even in a CANCELLED run, so a
  # run the operator stopped — or that #418's coalesce job cancelled — still ran graphrag.
  graphrag:
    name: "phase · graphrag"
    needs: semantic
    if: >-
      ${{
        !cancelled()
        && (github.event_name != 'workflow_dispatch' || inputs.phase == 'both' || inputs.phase == 'graphrag')
        && (needs.semantic.result == 'success' || needs.semantic.result == 'skipped' || needs.semantic.result == 'failure')
      }}
    uses: ./.github/workflows/cgc-db-index.yml
    with:
      phase: graphrag
      # Empty on schedule (github.event.inputs is null there) = all repos.
      repos: ${{ github.event.inputs.repos || '' }}
      # Scheduled runs have no inputs and must always propagate, hence the
      # "not explicitly false" form rather than a plain truthy check.
      restore: ${{ github.event.inputs.restore != 'false' }}
      # Null on schedule (github.event.inputs is null there) = both surfaces.
      surfaces: ${{ github.event.inputs.surfaces || 'both' }}
      # Null on schedule = 'false' = honour the manifest (the daily run must stay incremental).
      force: ${{ github.event.inputs.force || 'false' }}
    secrets: inherit
