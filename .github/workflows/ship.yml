name: Ship services

on:
  push:
    paths:
      - "a_solutions/container-nix/bb-sec_*/**"
      - ".github/workflows/ship.yml"
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        description: "Force ship a specific service (leave empty for auto-detect)"
        required: false
        type: string

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      caddy: ${{ steps.changes.outputs.caddy }}
      rust-api: ${{ steps.changes.outputs.rust-api }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changes
        id: changes
        uses: dorny/paths-filter@v3
        if: github.event_name == 'push'
        with:
          filters: |
            caddy:
              - 'a_solutions/container-nix/bb-sec_caddy/**'
            rust-api:
              - 'a_solutions/container-nix/bb-sec_rust-api/**'

      - name: Force service override
        if: github.event_name == 'workflow_dispatch'
        run: |
          svc="${{ inputs.service }}"
          if [ -z "$svc" ] || [ "$svc" = "caddy" ]; then
            echo "caddy=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "$svc" ] || [ "$svc" = "rust-api" ]; then
            echo "rust-api=true" >> "$GITHUB_OUTPUT"
          fi
        id: force

      - name: Merge outputs
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "caddy=${{ steps.force.outputs.caddy || 'false' }}" >> "$GITHUB_OUTPUT"
          echo "rust-api=${{ steps.force.outputs.rust-api || 'false' }}" >> "$GITHUB_OUTPUT"
        id: merge

  ship-caddy:
    needs: detect
    if: needs.detect.outputs.caddy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-24.11

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GCP_PROXY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          cat >> ~/.ssh/config <<EOF
          Host gcp-proxy
            HostName ${{ secrets.GCP_PROXY_HOST }}
            User ${{ secrets.GCP_PROXY_USER }}
            IdentityFile ~/.ssh/id_deploy
            StrictHostKeyChecking no
          EOF

      - name: Setup SOPS age key
        run: |
          mkdir -p ~/.config/sops/age
          echo "${{ secrets.SOPS_AGE_KEY }}" > ~/.config/sops/age/keys.txt
          echo "SOPS_AGE_KEY_FILE=$HOME/.config/sops/age/keys.txt" >> "$GITHUB_ENV"

      - name: Install sops
        run: nix profile install nixpkgs#sops

      - name: Ship caddy
        run: bash a_solutions/container-nix/bb-sec_caddy/build.sh ship

  ship-rust-api:
    needs: detect
    if: needs.detect.outputs.rust-api == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-24.11

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GCP_PROXY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          cat >> ~/.ssh/config <<EOF
          Host gcp-proxy
            HostName ${{ secrets.GCP_PROXY_HOST }}
            User ${{ secrets.GCP_PROXY_USER }}
            IdentityFile ~/.ssh/id_deploy
            StrictHostKeyChecking no
          EOF

      - name: Setup SOPS age key
        run: |
          mkdir -p ~/.config/sops/age
          echo "${{ secrets.SOPS_AGE_KEY }}" > ~/.config/sops/age/keys.txt
          echo "SOPS_AGE_KEY_FILE=$HOME/.config/sops/age/keys.txt" >> "$GITHUB_ENV"

      - name: Install sops
        run: nix profile install nixpkgs#sops

      - name: Ship rust-api
        run: bash a_solutions/container-nix/bb-sec_rust-api/build.sh ship
