name: "Retag reports image (amd64+arm64 → latest)"

on:
  workflow_dispatch:

permissions:
  packages: write

jobs:
  retag:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Login to GHCR
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Create and push multi-arch manifest
        run: |
          docker pull ghcr.io/diegonmarcos/cloud-data-reports:amd64
          docker pull ghcr.io/diegonmarcos/cloud-data-reports:arm64
          docker manifest create ghcr.io/diegonmarcos/cloud-data-reports:latest \
            ghcr.io/diegonmarcos/cloud-data-reports:amd64 \
            ghcr.io/diegonmarcos/cloud-data-reports:arm64
          docker manifest push ghcr.io/diegonmarcos/cloud-data-reports:latest
          echo "Done — latest now points to new amd64 + old arm64"
