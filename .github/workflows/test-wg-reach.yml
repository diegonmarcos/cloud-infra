# ONE-SHOT PROPAGATE — trigger oci-apps to pull the GHCR DB ITSELF (fast, direct)
# and load it into the octocode_db volume. WG only carries the short SSH command;
# the ~3GB DB never traverses the flaky WG tunnel (that dropped mid-rsync).
# Manual dispatch. Fold into the engine (cloud-cgc-db-restore.sh) once proven.
name: "cgc-db propagate-only (oci-apps pulls GHCR DB)"

on:
  workflow_dispatch: {}

env:
  WG_PRIVATE_KEY: ${{ secrets.WG_PRIVATE_KEY }}
  WG_HUB_PUBKEY: ${{ vars.WG_HUB_PUBKEY }}
  OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}

jobs:
  propagate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Provision SSH key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$OCI_SSH_KEY" > ~/.ssh/cgc_deploy && chmod 600 ~/.ssh/cgc_deploy
      - name: WireGuard up
        run: bash 1_workflows/src/scripts/cloud-ship-ci-setup-wireguard.sh
      - name: Trigger oci-apps to pull GHCR DB into the volume
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SSHOPTS="-i $HOME/.ssh/cgc_deploy -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -o ServerAliveInterval=15"
          TARGET="ubuntu@10.0.0.6"
          IMAGE="ghcr.io/diegonmarcos/cloud-cgc-mcp-octocode-db:latest"
          VOL="octocode_db"; CTR="cloud-cgc-mcp"
          ssh $SSHOPTS "$TARGET" \
            "GHCR_USER='$GHCR_USER' GHCR_TOKEN='$GHCR_TOKEN' IMAGE='$IMAGE' VOL='$VOL' CTR='$CTR' bash -s" <<'REMOTE'
          set -e
          echo "--- disk before ---"; df -h / | tail -1
          echo "$GHCR_TOKEN" | sudo docker login ghcr.io -u "$GHCR_USER" --password-stdin
          echo "--- pulling DB image on oci-apps (direct from GHCR) ---"
          sudo docker pull -q "$IMAGE"
          sudo docker stop "$CTR" 2>/dev/null || true
          echo "--- loading DB into volume $VOL ---"
          sudo docker run --rm -v "$VOL:/dst" "$IMAGE" sh -c 'rm -rf /dst/* && cp -a /octocode-db/. /dst/'
          sudo docker start "$CTR" 2>/dev/null || true
          sudo docker logout ghcr.io || true
          sudo docker rmi "$IMAGE" 2>/dev/null || true
          echo "=== verify ==="
          sudo du -sh "/var/lib/docker/volumes/$VOL/_data"
          df -h / | tail -1
          sudo docker ps -a --format '{{.Names}} {{.Status}}' | grep -i cgc || echo 'DB loaded in volume (no cgc container running)'
          REMOTE
