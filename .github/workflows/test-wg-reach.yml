# ONE-SHOT PROPAGATE — pulls the DB that green cgc-db runs already pushed to
# GHCR and rsyncs it straight into oci-apps' octocode_db volume over the WG mesh,
# then restarts cloud-cgc-mcp. Runs in ~5 min (no index). Mesh path proven via
# the WG-up + hub-pubkey fixes. Manual dispatch only.
name: "cgc-db propagate-only (GHCR DB -> oci-apps)"

on:
  workflow_dispatch: {}

env:
  WG_PRIVATE_KEY: ${{ secrets.WG_PRIVATE_KEY }}
  WG_HUB_PUBKEY: ${{ vars.WG_HUB_PUBKEY }}
  OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}

jobs:
  propagate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: WireGuard up
        run: bash 1_workflows/src/scripts/cloud-ship-ci-setup-wireguard.sh
      - name: Provision SSH key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$OCI_SSH_KEY" > ~/.ssh/cgc_deploy && chmod 600 ~/.ssh/cgc_deploy
      - name: Pull GHCR DB + extract
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/diegonmarcos/cloud-cgc-mcp-octocode-db:latest"
          docker pull -q "$IMAGE"
          mkdir -p /tmp/octodb
          docker run --rm -v /tmp/octodb:/out "$IMAGE" sh -c 'cp -a /octocode-db/. /out/'
          echo "extracted $(du -sh /tmp/octodb | cut -f1) to /tmp/octodb"
      - name: rsync DB into oci-apps volume + restart cgc-mcp
        run: |
          set -euo pipefail
          SSHOPTS="-i $HOME/.ssh/cgc_deploy -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15"
          TARGET="ubuntu@10.0.0.6"
          VOL="octocode_db"; CTR="cloud-cgc-mcp"
          ssh $SSHOPTS "$TARGET" "sudo docker stop $CTR" || true
          rsync -az --delete --rsync-path="sudo rsync" -e "ssh $SSHOPTS" \
            /tmp/octodb/ "$TARGET:/var/lib/docker/volumes/$VOL/_data/"
          ssh $SSHOPTS "$TARGET" "sudo docker start $CTR"
          echo "=== verify ==="
          ssh $SSHOPTS "$TARGET" "sudo du -sh /var/lib/docker/volumes/$VOL/_data; sudo docker ps --format '{{.Names}} {{.Status}}' | grep cgc"
