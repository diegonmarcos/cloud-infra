name: "Deploy → gcp-t4 (LEGACY — use deploy.yml)"

# SUPERSEDED by deploy.yml (manifest-driven deploy)
# Push triggers removed to avoid double deploys.
# Keep workflow_dispatch as manual fallback.
on:
  workflow_dispatch:
    inputs:
      service:
        description: "Ship specific service (leave empty for all changed)"
        required: false
        type: string

concurrency:
  group: ship-gcp-t4
  cancel-in-progress: false

jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: true

      - name: Detect changes
        id: changes
        uses: dorny/paths-filter@v3
        if: github.event_name == 'push'
        with:
          filters: |
            ollama:
              - 'a_solutions/ad-agi_ollama/src/**'

      - name: Force service override
        id: force
        if: github.event_name == 'workflow_dispatch'
        run: |
          svc="${{ inputs.service }}"
          for name in ollama; do
            if [ -z "$svc" ] || [ "$svc" = "$name" ]; then
              echo "$name=true" >> "$GITHUB_OUTPUT"
            fi
          done

      - uses: ./.github/actions/setup-deps
        with:
          ssh_key: ${{ secrets.GCP_T4_SSH_KEY }}
          ssh_host: ${{ secrets.GCP_T4_HOST }}
          ssh_user: ${{ secrets.GCP_T4_USER }}
          ssh_alias: gcp-t4
          sops_age_key: ${{ secrets.SOPS_AGE_KEY }}

      - name: Ship ollama
        if: steps.changes.outputs.ollama == 'true' || steps.force.outputs.ollama == 'true'
        run: bash a_solutions/ad-agi_ollama/build.sh ship
