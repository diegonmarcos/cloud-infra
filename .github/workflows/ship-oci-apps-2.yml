name: "Ship → oci-apps-2"

on:
  push:
    paths:
      - "a_solutions/ad-agi_ollama-arm/src/**"
      - ".github/workflows/ship-oci-apps-2.yml"
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        description: "Ship specific service (leave empty for all changed)"
        required: false
        type: string

concurrency:
  group: ship-oci-apps-2
  cancel-in-progress: false

jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changes
        id: changes
        uses: dorny/paths-filter@v3
        if: github.event_name == 'push'
        with:
          filters: |
            ollama-arm:
              - 'a_solutions/ad-agi_ollama-arm/src/**'

      - name: Force service override
        id: force
        if: github.event_name == 'workflow_dispatch'
        run: |
          svc="${{ inputs.service }}"
          for name in ollama-arm; do
            if [ -z "$svc" ] || [ "$svc" = "$name" ]; then
              echo "$name=true" >> "$GITHUB_OUTPUT"
            fi
          done

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-24.11

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.OCI_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          mkdir -p ~/.ssh/sockets
          cat > ~/.ssh/config <<EOF
          Host oci-apps-2
            HostName 79.72.28.10
            User ubuntu
            IdentityFile ~/.ssh/id_deploy
            StrictHostKeyChecking no
            ServerAliveInterval 30
            ServerAliveCountMax 10
            ControlMaster auto
            ControlPath ~/.ssh/sockets/%r@%h-%p
            ControlPersist 600
          EOF
          chmod 600 ~/.ssh/config

      - name: Setup SOPS age key
        run: |
          mkdir -p ~/.config/sops/age
          echo "${{ secrets.SOPS_AGE_KEY }}" > ~/.config/sops/age/keys.txt
          echo "SOPS_AGE_KEY_FILE=$HOME/.config/sops/age/keys.txt" >> "$GITHUB_ENV"

      - name: Install sops
        run: nix profile install nixpkgs#sops

      - name: Ship ollama-arm
        if: steps.changes.outputs.ollama-arm == 'true' || steps.force.outputs.ollama-arm == 'true'
        continue-on-error: true
        run: bash a_solutions/ad-agi_ollama-arm/build.sh ship
