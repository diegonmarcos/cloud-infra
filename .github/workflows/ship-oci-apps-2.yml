name: "Ship → oci-apps-2"

on:
  push:
    paths:
      - "a_solutions/ad-agi_ollama-arm/src/**"
      - ".github/workflows/ship-oci-apps-2.yml"
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        description: "Ship specific service (leave empty for all changed)"
        required: false
        type: string

concurrency:
  group: ship-oci-apps-2
  cancel-in-progress: false

jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: true

      - name: Detect changes
        id: changes
        uses: dorny/paths-filter@v3
        if: github.event_name == 'push'
        with:
          filters: |
            ollama-arm:
              - 'a_solutions/ad-agi_ollama-arm/src/**'

      - name: Force service override
        id: force
        if: github.event_name == 'workflow_dispatch'
        run: |
          svc="${{ inputs.service }}"
          for name in ollama-arm; do
            if [ -z "$svc" ] || [ "$svc" = "$name" ]; then
              echo "$name=true" >> "$GITHUB_OUTPUT"
            fi
          done

      - uses: ./.github/actions/setup-deps
        with:
          ssh_key: ${{ secrets.OCI_SSH_KEY }}
          ssh_host: 79.72.28.10
          ssh_user: ubuntu
          ssh_alias: oci-apps-2
          sops_age_key: ${{ secrets.SOPS_AGE_KEY }}

      - name: Ship ollama-arm
        if: steps.changes.outputs.ollama-arm == 'true' || steps.force.outputs.ollama-arm == 'true'
        run: bash a_solutions/ad-agi_ollama-arm/build.sh ship
