name: "Ship → oci-apps-2"

on:
  push:
    paths:
      # Add service paths here when services are deployed to oci-apps-2
      # Example: - "a_solutions/SERVICE_DIR/src/**"
      - ".github/workflows/ship-oci-apps-2.yml"
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        description: "Ship specific service (leave empty for all changed)"
        required: false
        type: string

concurrency:
  group: ship-oci-apps-2
  cancel-in-progress: false

jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect changes
        id: changes
        uses: dorny/paths-filter@v3
        if: github.event_name == 'push'
        with:
          filters: |
            # Add service filters here when services are deployed to oci-apps-2
            # Example:
            # service-name:
            #   - 'a_solutions/SERVICE_DIR/src/**'
            placeholder:
              - '.github/workflows/ship-oci-apps-2.yml'

      - name: Force service override
        id: force
        if: github.event_name == 'workflow_dispatch'
        run: |
          svc="${{ inputs.service }}"
          # Add service names here when services are deployed to oci-apps-2
          # Example: for name in service-a service-b; do
          for name in placeholder; do
            if [ -z "$svc" ] || [ "$svc" = "$name" ]; then
              echo "$name=true" >> "$GITHUB_OUTPUT"
            fi
          done

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-24.11

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.OCI_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          cat > ~/.ssh/config <<EOF
          Host oci-apps-2
            HostName 79.72.28.10
            User ubuntu
            IdentityFile ~/.ssh/id_deploy
            StrictHostKeyChecking no
            ServerAliveInterval 30
            ServerAliveCountMax 10
          EOF
          chmod 600 ~/.ssh/config

      - name: Setup SOPS age key
        run: |
          mkdir -p ~/.config/sops/age
          echo "${{ secrets.SOPS_AGE_KEY }}" > ~/.config/sops/age/keys.txt
          echo "SOPS_AGE_KEY_FILE=$HOME/.config/sops/age/keys.txt" >> "$GITHUB_ENV"

      - name: Install sops
        run: nix profile install nixpkgs#sops

      # ========================================================================
      # Add service deployment steps here when services are deployed to oci-apps-2
      # ========================================================================
      # Example:
      #
      # - name: Ship service-name
      #   if: steps.changes.outputs.service-name == 'true' || steps.force.outputs.service-name == 'true'
      #   continue-on-error: true
      #   run: bash a_solutions/SERVICE_DIR/build.sh ship
      # ========================================================================
