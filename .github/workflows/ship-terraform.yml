name: "Ship → terraform"

on:
  push:
    paths:
      - "c_vps/ba-clo_cloudflare/src/**"
      - "c_vps/vps_gcloud/src/**"
      - "c_vps/vps_oci/src/**"
      - "c_vps/vps_hetzner/src/**"
      - "a_solutions/ba-clo_cloudflare-worker/src/**"
      - ".github/workflows/ship-terraform.yml"
    branches: [main]
  workflow_dispatch:
    inputs:
      project:
        description: "Target project (cloudflare, gcloud, oci, hetzner, cf-worker, or empty for all changed)"
        required: false
        type: string

concurrency:
  group: terraform
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 2

      - name: Update submodules
        run: git submodule update --remote

      - name: Detect changes
        id: changes
        uses: dorny/paths-filter@v3
        if: github.event_name == 'push'
        with:
          filters: |
            cloudflare:
              - 'c_vps/ba-clo_cloudflare/src/**'
            gcloud:
              - 'c_vps/vps_gcloud/src/**'
            oci:
              - 'c_vps/vps_oci/src/**'
            hetzner:
              - 'c_vps/vps_hetzner/src/**'
            cf-worker:
              - 'a_solutions/ba-clo_cloudflare-worker/src/**'

      - name: Force project override
        id: force
        if: github.event_name == 'workflow_dispatch'
        run: |
          proj="${{ inputs.project }}"
          for name in cloudflare gcloud oci hetzner cf-worker; do
            if [ -z "$proj" ] || [ "$proj" = "$name" ]; then
              echo "$name=true" >> "$GITHUB_OUTPUT"
            fi
          done

      - name: Authenticate GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Run
        shell: bash {0}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull ghcr.io/diegonmarcos/cloud-builder-x-deb-nixhm:latest
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$CLOUDSDK_CONFIG:/root/.config/gcloud" \
            -w /workspace \
            -e INPUT_PROJECT='${{ inputs.project }}' \
            -e EVENT_NAME='${{ github.event_name }}' \
            -e CHANGES_CLOUDFLARE='${{ steps.changes.outputs.cloudflare }}' \
            -e CHANGES_GCLOUD='${{ steps.changes.outputs.gcloud }}' \
            -e CHANGES_OCI='${{ steps.changes.outputs.oci }}' \
            -e CHANGES_HETZNER='${{ steps.changes.outputs.hetzner }}' \
            -e CHANGES_CF_WORKER='${{ steps.changes.outputs.cf-worker }}' \
            -e SOPS_AGE_KEY='${{ secrets.SOPS_AGE_KEY }}' \
            -e TF_VAR_cloudflare_api_key='${{ secrets.CLOUDFLARE_API_KEY }}' \
            -e CLOUDFLARE_API_KEY='${{ secrets.CLOUDFLARE_API_KEY }}' \
            -e CLOUDFLARE_EMAIL='${{ secrets.CLOUDFLARE_EMAIL }}' \
            -e TF_VAR_ssh_public_key='${{ secrets.GCP_SSH_PUBLIC_KEY }}' \
            -e TF_VAR_tenancy_ocid='${{ secrets.OCI_TENANCY_OCID }}' \
            -e TF_VAR_compartment_ocid='${{ secrets.OCI_COMPARTMENT_OCID }}' \
            -e TF_VAR_region='${{ secrets.OCI_REGION }}' \
            -e OCI_TENANCY_OCID='${{ secrets.OCI_TENANCY_OCID }}' \
            -e OCI_USER_OCID='${{ secrets.OCI_USER_OCID }}' \
            -e OCI_FINGERPRINT='${{ secrets.OCI_FINGERPRINT }}' \
            -e OCI_PRIVATE_KEY='${{ secrets.OCI_PRIVATE_KEY }}' \
            -e OCI_REGION='${{ secrets.OCI_REGION }}' \
            -e TF_VAR_hcloud_token='${{ secrets.HETZNER_API_TOKEN }}' \
            -e GITHUB_TOKEN='${{ secrets.GITHUB_TOKEN }}' \
            -e GITHUB_REPOSITORY='diegonmarcos/cloud' \
            -e GITHUB_SHA='${{ github.sha }}' \
            ghcr.io/diegonmarcos/cloud-builder-x-deb-nixhm:latest \
            bash /workspace/.github/workflows/scripts/ship-terraform.sh
