# ┌──────────────────────────────────────────────────────────────┐
# │  Ship home-manager to VMs                                    │
# │                                                              │
# │  Thin GHA wrapper — logic in ship-home-manager.sh            │
# │  Per-VM matrix from cloud-data-gha-config.json               │
# └──────────────────────────────────────────────────────────────┘

name: "Ship → home-manager"

on:
  push:
    paths:
      - "b_infra/home-manager/**"
    branches: [main]
  workflow_dispatch:
    inputs:
      vm:
        description: "Target VM (e.g. gcp-proxy, oci-apps) or empty for all"
        required: false
        type: string

concurrency:
  group: home-manager-deploy
  cancel-in-progress: false

jobs:
  deploy:
    strategy:
      fail-fast: false
      matrix:
        vm: [gcp-proxy, gcp-t4, oci-mail, oci-analytics, oci-apps]
    runs-on: ubuntu-latest
    name: ${{ matrix.vm }}
    permissions:
      contents: read
      packages: write
    env:
      OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
      GCP_PROXY_SSH_KEY: ${{ secrets.GCP_PROXY_SSH_KEY }}
      GCP_PROXY_HOST: ${{ secrets.GCP_PROXY_HOST }}
      GCP_PROXY_USER: ${{ secrets.GCP_PROXY_USER }}
      GCP_T4_SSH_KEY: ${{ secrets.GCP_T4_SSH_KEY }}
      GCP_T4_HOST: ${{ secrets.GCP_T4_HOST }}
      GCP_T4_USER: ${{ secrets.GCP_T4_USER }}
    steps:
      - name: Gate
        id: gate
        run: |
          TARGET="${{ inputs.vm }}"
          VM="${{ matrix.vm }}"
          if [ -n "$TARGET" ] && [ "$TARGET" != "$VM" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          submodules: true

      - name: Setup WireGuard
        if: steps.gate.outputs.skip != 'true'
        env:
          WG_PRIVATE_KEY: ${{ secrets.WG_PRIVATE_KEY }}
        run: bash .github/workflows/scripts/setup-wireguard.sh

      - name: Resolve SSH + Ship
        if: steps.gate.outputs.skip != 'true'
        run: |
          GHA_CONFIG="cloud-data/cloud-data-gha-config.json"
          VM="${{ matrix.vm }}"
          # Use WG IPs from cloud-data (SSH via WireGuard mesh)
          HOST=$(jq -r --arg vm "$VM" '.vms[$vm].wg_ip // .vms[$vm].host' "$GHA_CONFIG")
          USER=$(jq -r --arg vm "$VM" '.vms[$vm].user' "$GHA_CONFIG")
          case "$VM" in
            gcp-proxy) KEY="$GCP_PROXY_SSH_KEY"; USER="${GCP_PROXY_USER:-$USER}" ;;
            gcp-t4)    KEY="$GCP_T4_SSH_KEY";    USER="${GCP_T4_USER:-$USER}" ;;
            *)         KEY="$OCI_SSH_KEY" ;;
          esac
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull ghcr.io/diegonmarcos/cloud-builder-x86-nixos:latest
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v $HOME/.docker:/root/.docker \
            -e SSH_KEY="$KEY" \
            -e SSH_HOST="$HOST" \
            -e SSH_USER="$USER" \
            -e SSH_ALIAS="$VM" \
            -e SOPS_AGE_KEY='${{ secrets.SOPS_AGE_KEY }}' \
            -e GITHUB_TOKEN='${{ secrets.GITHUB_TOKEN }}' \
            -e GITHUB_ACTOR='${{ github.actor }}' \
            -e GITHUB_ACTIONS=true \
            -e GITHUB_REPOSITORY='diegonmarcos/cloud' \
            -e GITHUB_SHA='${{ github.sha }}' \
            ghcr.io/diegonmarcos/cloud-builder-x86-nixos:latest \
            bash -c '
              set -e
              mkdir -p ~/.ssh && ssh-keyscan github.com >>~/.ssh/known_hosts 2>/dev/null
              git clone --depth 2 --recurse-submodules https://github.com/$GITHUB_REPOSITORY.git /workspace
              cd /workspace
              git submodule update --remote
              git -C cloud-data fetch origin main && git -C cloud-data reset --hard origin/main
              nix flake update config-json --flake /opt/cloud-builder-flake 2>&1 || echo "[builder] flake update skipped"
              bash .github/workflows/scripts/cloud-builder-secrets.sh
              bash .github/workflows/scripts/ship-home-manager.sh $SSH_ALIAS 2>&1
            '
