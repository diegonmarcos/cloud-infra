name: "Ship → home-manager"

on:
  push:
    paths:
      - "b_infra/home-manager/**"
    branches: [main]
  workflow_dispatch:
    inputs:
      vm:
        description: "Target VM (e.g. gcp-proxy, oci-apps) or empty for all"
        required: false
        type: string

concurrency:
  group: home-manager-deploy
  cancel-in-progress: false

jobs:
  deploy:
    strategy:
      fail-fast: false
      matrix:
        vm: [gcp-proxy, gcp-t4, oci-mail, oci-analytics, oci-apps]
    runs-on: ubuntu-latest
    name: ${{ matrix.vm }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Gate
        id: gate
        run: |
          TARGET="${{ inputs.vm }}"
          VM="${{ matrix.vm }}"
          if [ -n "$TARGET" ] && [ "$TARGET" != "$VM" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          submodules: true

      - name: Setup WireGuard
        if: steps.gate.outputs.skip != 'true'
        env:
          WG_PRIVATE_KEY: ${{ secrets.WG_PRIVATE_KEY }}
        run: bash .github/workflows/scripts/cloud-ship-ci-setup-wireguard.sh

      - name: Ship
        if: steps.gate.outputs.skip != 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull ghcr.io/diegonmarcos/cloud-builder-x-deb-nixhm:latest
          docker run --rm --network=host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v $HOME/.docker:/root/.docker \
            -e VM="${{ matrix.vm }}" \
            -e OCI_SSH_KEY='${{ secrets.OCI_SSH_KEY }}' \
            -e GCP_PROXY_SSH_KEY='${{ secrets.GCP_PROXY_SSH_KEY }}' \
            -e GCP_T4_SSH_KEY='${{ secrets.GCP_T4_SSH_KEY }}' \
            -e SOPS_AGE_KEY='${{ secrets.SOPS_AGE_KEY }}' \
            -e GITHUB_TOKEN='${{ secrets.GITHUB_TOKEN }}' \
            -e GITHUB_ACTOR='${{ github.actor }}' \
            -e GITHUB_ACTIONS=true \
            -e GITHUB_REPOSITORY='diegonmarcos/cloud' \
            -e GITHUB_SHA='${{ github.sha }}' \
            ghcr.io/diegonmarcos/cloud-builder-x-deb-nixhm:latest \
            bash -c 'bash /opt/cloud-builder/ship-hm.sh'
