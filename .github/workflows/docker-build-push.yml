name: "Build → Docker images (GHCR)"

on:
  push:
    paths:
      - "a_solutions/aa-sui_google-workspace-mcp/src/**"
      - "a_solutions/aa-sui_mail-mcp/src/**"
      - "a_solutions/aa-sui_mattermost-mcp/src/**"
      - "a_solutions/bb-sec_caddy/src/**"
      - "a_solutions/bb-sec_introspect-proxy/src/**"
      - "a_solutions/bc-obs_c3-infra-mcp-api/src/**"
      - "a_solutions/bc-obs_c3-services-mcp-api/src/**"
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        description: "Build specific service (leave empty for all changed)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        if: github.event_name == 'push'
        with:
          filters: |
            google-workspace-mcp:
              - 'a_solutions/aa-sui_google-workspace-mcp/src/**'
            mail-mcp:
              - 'a_solutions/aa-sui_mail-mcp/src/**'
            mattermost-mcp:
              - 'a_solutions/aa-sui_mattermost-mcp/src/**'
            caddy:
              - 'a_solutions/bb-sec_caddy/src/**'
            introspect-proxy:
              - 'a_solutions/bb-sec_introspect-proxy/src/**'
            c3-infra-mcp-api:
              - 'a_solutions/bc-obs_c3-infra-mcp-api/src/**'
            c3-services-mcp-api:
              - 'a_solutions/bc-obs_c3-services-mcp-api/src/**'
      - id: set
        run: |
          SERVICES=()
          FORCE="${{ inputs.service }}"

          add() {
            local name="$1" dir="$2" ctx="${3:-src}"
            if [ -n "$FORCE" ]; then
              [ "$FORCE" = "$name" ] || [ -z "$FORCE" ] && SERVICES+=("{\"name\":\"$name\",\"dir\":\"$dir\",\"ctx\":\"$ctx\"}")
            elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              SERVICES+=("{\"name\":\"$name\",\"dir\":\"$dir\",\"ctx\":\"$ctx\"}")
            elif [ "${{ steps.changes.outputs[format('{0}', name)] }}" = "true" ] 2>/dev/null; then
              SERVICES+=("{\"name\":\"$name\",\"dir\":\"$dir\",\"ctx\":\"$ctx\"}")
            fi
          }

          add google-workspace-mcp a_solutions/aa-sui_google-workspace-mcp src
          add mail-mcp a_solutions/aa-sui_mail-mcp src
          add mattermost-mcp a_solutions/aa-sui_mattermost-mcp src
          add caddy a_solutions/bb-sec_caddy src
          add introspect-proxy a_solutions/bb-sec_introspect-proxy src
          add c3-infra-mcp-api a_solutions/bc-obs_c3-infra-mcp-api src
          add c3-services-mcp-api a_solutions/bc-obs_c3-services-mcp-api src

          if [ ${#SERVICES[@]} -eq 0 ]; then
            echo "matrix={\"include\":[]}" >> "$GITHUB_OUTPUT"
          else
            JSON=$(printf '%s,' "${SERVICES[@]}")
            echo "matrix={\"include\":[${JSON%,}]}" >> "$GITHUB_OUTPUT"
          fi
          echo "Building: ${#SERVICES[@]} services"

  build:
    needs: detect
    if: needs.detect.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.dir }}/${{ matrix.ctx }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/diegonmarcos/${{ matrix.name }}:latest
            ghcr.io/diegonmarcos/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
