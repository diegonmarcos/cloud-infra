name: Cloud Health Reports

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      report:
        description: 'Report target (all|cloud|mail|url|sec-network|sec-data|daily-mail)'
        default: 'all'

concurrency:
  group: cloud-health-reports
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-reports:
    name: Run reports
    runs-on: ubuntu-latest
    env:
      REPORT_TARGET: ${{ inputs.report || 'all' }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch I_cloud-data submodule via SSH
        env:
          CLOUD_DATA_DEPLOY_KEY: ${{ secrets.CLOUD_DATA_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$CLOUD_DATA_DEPLOY_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no"
          git submodule update --init --depth=1 I_cloud-data

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull reports image
        run: docker pull ghcr.io/diegonmarcos/cloud-data-reports:latest

      - name: Setup SSH config for reports container
        env:
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          GCP_PROXY_SSH_KEY: ${{ secrets.GCP_PROXY_SSH_KEY }}
          GCP_T4_SSH_KEY: ${{ secrets.GCP_T4_SSH_KEY }}
        run: |
          sudo mkdir -p /tmp/reports-ssh
          printf '%s\n' "$OCI_SSH_KEY"       | sudo tee /tmp/reports-ssh/oci_key       > /dev/null
          printf '%s\n' "$GCP_PROXY_SSH_KEY" | sudo tee /tmp/reports-ssh/gcp_proxy_key > /dev/null
          printf '%s\n' "$GCP_T4_SSH_KEY"    | sudo tee /tmp/reports-ssh/gcp_t4_key   > /dev/null
          sudo tee /tmp/reports-ssh/config > /dev/null <<'EOF'
Host oci-mail
  HostName 10.0.0.3
  User ubuntu
  IdentityFile /root/.ssh/oci_key
  StrictHostKeyChecking no
  BatchMode yes
Host oci-analytics
  HostName 10.0.0.4
  User ubuntu
  IdentityFile /root/.ssh/oci_key
  StrictHostKeyChecking no
  BatchMode yes
Host oci-apps
  HostName 10.0.0.6
  User ubuntu
  IdentityFile /root/.ssh/oci_key
  StrictHostKeyChecking no
  BatchMode yes
Host gcp-proxy
  HostName 10.0.0.1
  User diego
  IdentityFile /root/.ssh/gcp_proxy_key
  StrictHostKeyChecking no
  BatchMode yes
Host gcp-t4
  HostName 10.0.0.8
  User diego
  IdentityFile /root/.ssh/gcp_t4_key
  StrictHostKeyChecking no
  BatchMode yes
EOF
          sudo chown -R root:root /tmp/reports-ssh
          sudo chmod 700 /tmp/reports-ssh
          sudo chmod 600 /tmp/reports-ssh/oci_key /tmp/reports-ssh/gcp_proxy_key /tmp/reports-ssh/gcp_t4_key /tmp/reports-ssh/config

      - name: Run reports
        run: |
          docker run --rm \
            --cap-add NET_ADMIN \
            --network host \
            -v "$GITHUB_WORKSPACE:/root/git/cloud" \
            -v "$GITHUB_WORKSPACE/I_cloud-data:/root/git/cloud-data" \
            -v "/tmp/reports-ssh:/root/.ssh:ro" \
            -e WG_PRIVATE_KEY \
            -e SOPS_AGE_KEY \
            -e GITHUB_TOKEN \
            -e BEARER_TOKEN \
            -e REQUIRE_BEARER=false \
            ghcr.io/diegonmarcos/cloud-data-reports:latest \
            "$REPORT_TARGET"
        env:
          WG_PRIVATE_KEY: ${{ secrets.WG_PRIVATE_KEY }}
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEARER_TOKEN: ${{ secrets.BEARER_TOKEN }}

      - name: Fix dist permissions
        run: sudo chmod -R a+rX "$GITHUB_WORKSPACE/I_cloud-data/reports/dist/"

      - name: Publish to cloud-data
        env:
          CLOUD_DATA_DEPLOY_KEY: ${{ secrets.CLOUD_DATA_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$CLOUD_DATA_DEPLOY_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git clone --depth=1 \
            --config core.sshCommand="ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no" \
            git@github.com:diegonmarcos/cloud-data.git /tmp/cd
          cp -r "$GITHUB_WORKSPACE/I_cloud-data/reports/dist/." /tmp/cd/reports/dist/
          cd /tmp/cd
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/dist/
          git diff --cached --quiet && echo "No changes to commit" || \
            git commit -m "chore: update health reports $(date -u +%Y-%m-%dT%H:%M:%SZ)" && \
            git push
