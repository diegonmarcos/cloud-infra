name: Cloud Health Reports

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      report:
        description: 'Report target (all|cloud|mail|url|sec-network|sec-data|daily-mail)'
        default: 'all'

concurrency:
  group: cloud-health-reports
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-reports:
    name: Run reports
    runs-on: ubuntu-latest
    env:
      REPORT_TARGET: ${{ inputs.report || 'all' }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull reports image
        run: docker pull ghcr.io/diegonmarcos/cloud-data-reports:latest

      - name: Run reports
        run: |
          docker run --rm \
            --cap-add NET_ADMIN \
            --network host \
            -v "$GITHUB_WORKSPACE/I_cloud-data:/root/git/cloud-data" \
            -e WG_PRIVATE_KEY \
            -e SOPS_AGE_KEY \
            -e GITHUB_TOKEN \
            -e BEARER_TOKEN \
            ghcr.io/diegonmarcos/cloud-data-reports:latest \
            "$REPORT_TARGET"
        env:
          WG_PRIVATE_KEY: ${{ secrets.WG_PRIVATE_KEY }}
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEARER_TOKEN: ${{ secrets.BEARER_TOKEN }}

      - name: Publish to cloud-data
        env:
          CLOUD_DATA_DEPLOY_KEY: ${{ secrets.CLOUD_DATA_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$CLOUD_DATA_DEPLOY_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git clone --depth=1 \
            --config core.sshCommand="ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no" \
            git@github.com:diegonmarcos/cloud-data.git /tmp/cd
          cp -r "$GITHUB_WORKSPACE/I_cloud-data/reports/dist/." /tmp/cd/reports/dist/
          cd /tmp/cd
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/dist/
          git diff --cached --quiet && echo "No changes to commit" || \
            git commit -m "chore: update health reports $(date -u +%Y-%m-%dT%H:%M:%SZ)" && \
            git push
