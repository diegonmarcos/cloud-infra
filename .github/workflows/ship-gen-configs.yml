name: "Ship → gen-configs (cloud-data)"

on:
  push:
    branches: [main]
    paths:
      - "a_solutions/*/build.json"
      - "config.json"
      - "c_vps/ba-clo_cloudflare/src/main.tf"
      - "c_vps/vps_*/src/main.tf"
      - "b_infra/home-manager/**/src/*.nix"
      - "a_solutions/bb-sec_caddy/src/**"
      - "a_solutions/bb-sec_authelia/src/**"
      - "a_solutions/ba-clo_hickory-dns/src/**"
      - "a_solutions/bc-obs_c3-infra-mcp/src/engines/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gen-configs
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - name: Generate inside cloud-builder
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull ghcr.io/diegonmarcos/cloud-builder-x-deb-nixhm:latest
          docker run --rm \
            -e SOPS_AGE_KEY='${{ secrets.SOPS_AGE_KEY }}' \
            -e CLOUD_DATA_DEPLOY_KEY='${{ secrets.CLOUD_DATA_DEPLOY_KEY }}' \
            -e GITHUB_TOKEN='${{ secrets.GITHUB_TOKEN }}' \
            -e GITHUB_ACTIONS=true \
            -e GITHUB_REPOSITORY='diegonmarcos/cloud' \
            -e GITHUB_SHA='${{ github.sha }}' \
            -e GIT_AUTHOR_NAME="github-actions[bot]" \
            -e GIT_AUTHOR_EMAIL="github-actions[bot]@users.noreply.github.com" \
            ghcr.io/diegonmarcos/cloud-builder-x-deb-nixhm:latest \
            bash /opt/cloud-builder/gen-configs.sh
