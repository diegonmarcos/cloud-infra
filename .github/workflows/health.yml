# ┌──────────────────────────────────────────────────────────────┐
# │  Health — single consolidated health check                  │
# │                                                            │
# │  Replaces: health-http-public, health-http-private,        │
# │            health_mail_full, health-all-vms, health (VMs)  │
# │                                                            │
# │  Runs inside cloud-builder container on GHA runner.        │
# │  Script: workflows/src/scripts/health-full.sh              │
# └──────────────────────────────────────────────────────────────┘

name: "Health"

on:
  workflow_run:
    workflows: ["Ship"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: health
  cancel-in-progress: true

jobs:
  health:
    name: "Full health check"
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - name: Wait for containers to settle
        if: github.event_name != 'workflow_dispatch'
        run: sleep 300

      - name: Run health check
        shell: bash {0}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull ghcr.io/diegonmarcos/cloud-builder-x-deb-nixhm:latest
          docker run --rm --network=host --cap-add=NET_ADMIN \
            -e WG_PRIVATE_KEY='${{ secrets.WG_PRIVATE_KEY }}' \
            -e SOPS_AGE_KEY='${{ secrets.SOPS_AGE_KEY }}' \
            -e OIDC_TOKEN='${{ secrets.AUTHELIA_OIDC_BEARER_TOKEN }}' \
            -e GITHUB_TOKEN='${{ secrets.GITHUB_TOKEN }}' \
            -e GITHUB_REPOSITORY='diegonmarcos/cloud' \
            ghcr.io/diegonmarcos/cloud-builder-x-deb-nixhm:latest \
            bash /opt/cloud-builder/health.sh
