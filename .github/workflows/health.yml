# ┌──────────────────────────────────────────────────────────────┐
# │  Health — single consolidated health check                  │
# │                                                            │
# │  Replaces: health-http-public, health-http-private,        │
# │            health_mail_full, health-all-vms, health (VMs)  │
# │                                                            │
# │  Runs inside cloud-builder container on GHA runner.        │
# │  Script: 1_workflows/src/scripts/health-full.sh              │
# └──────────────────────────────────────────────────────────────┘

name: "Health"

on:
  workflow_run:
    workflows: ["Ship"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: health
  cancel-in-progress: true

jobs:
  health:
    name: "Full health check"
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - name: Wait for containers to settle
        if: github.event_name != 'workflow_dispatch'
        run: sleep 300

      - name: Run health check
        shell: bash {0}
        env:
          OIDC_TOKEN: ${{ secrets.AUTHELIA_OIDC_BEARER_TOKEN }}
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          WG_PRIVATE_KEY: ${{ secrets.WG_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          IMAGE="ghcr.io/diegonmarcos/cloud-builder-x-deb-nixhm:latest"
          docker pull "$IMAGE"
          # Write secrets to runner fs — compose mounts :ro
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null || true
          mkdir -p ~/.config/sops/age
          echo "$SOPS_AGE_KEY" > ~/.config/sops/age/keys.txt
          # Run
          docker run --rm "$IMAGE" cat /opt/cloud-builder/compose.yaml > /tmp/cloud-builder-compose.yaml
          docker compose -f /tmp/cloud-builder-compose.yaml run --rm \
            -e OIDC_TOKEN \
            cloud-builder health
