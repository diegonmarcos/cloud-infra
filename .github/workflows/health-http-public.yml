name: "Health → HTTP public"

on:
  workflow_run:
    workflows:
      - "Deploy → gcp-proxy"
      - "Deploy → oci-apps"
      - "Deploy → oci-mail"
      - "Deploy → oci-analytics"
      - "Deploy → gcp-t4"
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"  # daily at 06:00 UTC

concurrency:
  group: health-http-public
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Check all public URLs
        env:
          OIDC_TOKEN: ${{ secrets.AUTHELIA_OIDC_BEARER_TOKEN }}
        run: |
          set +e
          ROUTES_FILE="a_solutions/bb-sec_caddy/src/cloud-data-caddy-routes.json"

          if [ ! -f "$ROUTES_FILE" ]; then
            echo "::error::$ROUTES_FILE not found"
            exit 1
          fi

          PASS=0
          FAIL=0
          WARN=0

          check_url() {
            local url="$1"
            local name="$2"
            local auth="$3"
            local expected="${4:-200}"

            HEADERS=""
            if [ "$auth" != "none" ] && [ "$auth" != "public" ] && [ -n "$OIDC_TOKEN" ]; then
              HEADERS="-H \"Authorization: Bearer $OIDC_TOKEN\""
            fi

            CODE=$(eval curl -sk -o /dev/null -w '%{http_code}' --max-time 10 -L $HEADERS "\"$url\"" 2>/dev/null)

            if [ "$CODE" = "000" ]; then
              echo "::error::$name — $url — TIMEOUT (no response)"
              FAIL=$((FAIL + 1))
              return 1
            elif [ "$CODE" = "502" ] || [ "$CODE" = "503" ]; then
              echo "::error::$name — $url — HTTP $CODE (upstream down)"
              FAIL=$((FAIL + 1))
              return 1
            elif [ "$CODE" = "401" ] || [ "$CODE" = "403" ]; then
              echo "::warning::$name — $url — HTTP $CODE (auth issue)"
              WARN=$((WARN + 1))
              return 0
            else
              echo "✓ $name — $url — HTTP $CODE"
              PASS=$((PASS + 1))
              return 0
            fi
          }

          echo "=== Subdomain Routes ==="
          jq -r '.routes[] | "\(.domain)|\(.auth // "two_factor")|\(.comment // .domain)"' "$ROUTES_FILE" | while IFS='|' read -r domain auth comment; do
            check_url "https://$domain/" "$comment" "$auth"
          done

          echo ""
          echo "=== Path Routes ==="
          jq -r '.path_routes[]? | .parent_domain as $pd | .paths[]? | "\($pd)\(.base_path)/|\(.auth // "two_factor")|\(.comment // .base_path)"' "$ROUTES_FILE" | while IFS='|' read -r url auth comment; do
            check_url "https://$url" "$comment" "$auth"
          done

          echo ""
          echo "=== GitHub Pages Proxies ==="
          jq -r '.github_pages_proxies[]? | "\(.domain | split(",") | .[0] | gsub("^ +| +$";""))|\(.comment // .domain)"' "$ROUTES_FILE" | while IFS='|' read -r domain comment; do
            check_url "https://$domain/" "$comment" "none"
          done

          echo ""
          echo "=== MCP Endpoints ==="
          jq -r '.mcp_routes[]? | .parent_domain as $pd | .endpoints[]? | "\($pd)\(.base_path)/mcp|\(.comment // .base_path)"' "$ROUTES_FILE" | while IFS='|' read -r url comment; do
            # MCP endpoints return 400 on GET (need POST with JSON-RPC) — 400 = alive
            CODE=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 10 "https://$url" 2>/dev/null)
            if [ "$CODE" = "400" ] || [ "$CODE" = "405" ]; then
              echo "✓ MCP $comment — https://$url — HTTP $CODE (alive)"
              PASS=$((PASS + 1))
            elif [ "$CODE" = "000" ]; then
              echo "::error::MCP $comment — https://$url — TIMEOUT"
              FAIL=$((FAIL + 1))
            else
              echo "::warning::MCP $comment — https://$url — HTTP $CODE"
              WARN=$((WARN + 1))
            fi
          done

          echo ""
          echo "=== L4 TCP Ports ==="
          jq -r '.l4_routes[]? | "\(.port)|\(.comment // "port")"' "$ROUTES_FILE" | while IFS='|' read -r port comment; do
            if timeout 3 bash -c "echo > /dev/tcp/mail.diegonmarcos.com/$port" 2>/dev/null; then
              echo "✓ L4 :$port — $comment"
              PASS=$((PASS + 1))
            else
              echo "::error::L4 :$port — $comment — CLOSED"
              FAIL=$((FAIL + 1))
            fi
          done

          echo ""
          echo "=== Special Routes ==="
          jq -r '.special | to_entries[]? | "\(.value.domain)|\(.key)"' "$ROUTES_FILE" | while IFS='|' read -r domain name; do
            [ -z "$domain" ] && continue
            check_url "https://$domain/" "$name" "two_factor"
          done

          echo ""
          echo "════════════════════════════════════════"
          echo "RESULT: $PASS passed, $FAIL failed, $WARN warnings"

          if [ "$FAIL" -gt 0 ]; then
            echo "::error::$FAIL URL(s) failed"
            exit 1
          fi
          echo "All public URLs healthy"
