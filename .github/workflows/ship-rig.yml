name: Ship Rig (aarch64 on-VM build)

on:
  push:
    paths:
      - "a_solutions/container-nix/bc-obs_rig/**"
      - ".github/workflows/ship-rig.yml"
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ship-rig
  cancel-in-progress: false

jobs:
  ship-rig:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-24.11

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "${{ secrets.OCI_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          ssh-keyscan -H 82.70.229.129 >> ~/.ssh/known_hosts 2>/dev/null || true

          cat > ~/.ssh/config <<EOF
          Host oci-apps
            HostName 82.70.229.129
            User ubuntu
            IdentityFile ~/.ssh/id_deploy
            ServerAliveInterval 30
            ServerAliveCountMax 10
          EOF
          chmod 600 ~/.ssh/config

      - name: Setup SOPS age key
        run: |
          mkdir -p ~/.config/sops/age
          echo "${{ secrets.SOPS_AGE_KEY }}" > ~/.config/sops/age/keys.txt
          echo "SOPS_AGE_KEY_FILE=$HOME/.config/sops/age/keys.txt" >> "$GITHUB_ENV"

      - name: Install sops
        run: nix profile install nixpkgs#sops

      - name: Build nix flake + prepare dist
        working-directory: a_solutions/container-nix/bc-obs_rig
        run: bash build.sh build

      - name: Decrypt secrets
        working-directory: a_solutions/container-nix/bc-obs_rig
        run: bash build.sh secrets

      - name: Deploy to oci-apps
        working-directory: a_solutions/container-nix/bc-obs_rig
        run: bash build.sh deploy

      - name: Build Docker image + start on VM (aarch64)
        run: |
          echo "Building Rust binary inside Docker on oci-apps (aarch64)..."
          ssh oci-apps "cd /opt/containers/rig && docker compose \$([ -f .secrets ] && echo '--env-file .secrets') up -d --build" 2>&1
          echo "Waiting for container to start..."
          sleep 15
          ssh oci-apps "docker ps --filter name=rig --format '{{.Names}}\t{{.Status}}'"

      - name: Verify deployment
        run: |
          ssh oci-apps "curl -sf http://localhost:8090/health && echo ' <- Rig health OK' || echo 'Rig health FAILED'"
