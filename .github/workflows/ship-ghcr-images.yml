name: "Ship → GHCR images"

on:
  push:
    paths:
      - "a_solutions/aa-sui_google-personal-mcp/src/**"
      - "a_solutions/aa-sui_google-workspace-mcp/src/**"
      - "a_solutions/aa-sui_mail-mcp/src/**"
      - "a_solutions/aa-sui_mattermost-mcp/src/**"
      - "a_solutions/bb-sec_introspect-proxy/src/**"
      - "a_solutions/bc-obs_c3-infra-mcp/src/**"
      - "a_solutions/bc-obs_c3-infra-api/src/**"
      - "a_solutions/bc-obs_c3-services-mcp/src/**"
      - "a_solutions/bc-obs_c3-services-api/src/**"
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  preflight-symlinks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Fail on broken symlinks in build contexts
        run: |
          set -e
          # Skip dist/ and build outputs — they can legitimately hold
          # machine-local symlinks that don't affect the docker build context.
          broken=$(find a_solutions -xtype l \
            -not -path "*/.git/*" \
            -not -path "*/dist/*" \
            -not -path "*/target/*" \
            -not -path "*/node_modules/*" \
            -not -path "*/z_archive/*" 2>/dev/null || true)
          if [ -n "$broken" ]; then
            echo "::error::Broken symlinks found in a_solutions/ source:"
            echo "$broken"
            exit 1
          fi
          echo "No broken symlinks in a_solutions/ source tree."
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Phase 0 — dispatch + nix-step hygiene
        run: bash 1_workflows/src/test/test_dispatch_hygiene.sh
      - name: Phase 1 — arch → runner routing
        run: bash 1_workflows/src/test/test_arch_runner_routing.sh
      - name: Phase 2 — step_docker guards (inline skip + rust binary)
        run: bash 1_workflows/src/test/test_step_docker_guards.sh
      - name: Phase 3D — mattermost base image is multi-arch
        run: bash 1_workflows/src/test/test_mattermost_multiarch.sh
      - name: Phase 3E — npm ci services ship a lockfile
        run: bash 1_workflows/src/test/test_npm_lockfile_present.sh
      - name: Phase 4 — build-{container}.json symlinks all resolve
        run: bash 1_workflows/src/test/test_build_container_json_pattern.sh
      - name: Phase 5 — cloud-builder SSH mount safety
        run: bash 1_workflows/src/test/test_cloud_builder_ssh_safety.sh
      - name: Phase 6 — ship.yml passes WG_PRIVATE_KEY
        run: bash 1_workflows/src/test/test_ship_wireguard_secret.sh
      - name: Phase 8 — GHCR packages public (report-only)
        # Private packages block ship ("write_package denied") but the
        # flip is a GitHub-UI action, not a repo change. Report only.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash 1_workflows/src/test/test_ghcr_visibility.sh
      - name: Phase 9 — proxy-mcp retry is bounded (no OOM leak)
        run: bash 1_workflows/src/test/test_retry_bounded_backoff.sh
      - name: Phase 10 — no live refs to z_archive/ services (report-only)
        # Pre-existing drift reported but not blocking; cleanup happens
        # in the same PR as each service's retirement.
        continue-on-error: true
        run: bash 1_workflows/src/test/test_no_retired_service_refs.sh
      - name: Phase 11 — container_name matches build.json (report-only)
        # Pending unix submodule sync + pre-existing drift cases;
        # cleanup happens per service.
        continue-on-error: true
        run: bash 1_workflows/src/test/test_container_name_matches_declaration.sh
      - name: Phase 12 — health-report engine B5+B7 semantics (report-only)
        # Checks cloud-data submodule copy; hard-passes only after auto-sync
        # propagates the cloud-data commit.
        continue-on-error: true
        run: bash 1_workflows/src/test/test_health_report_semantics.sh

  build:
    needs: preflight-symlinks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Context + Dockerfile live under src/code/ after the v2 engine cutover
        # (2026-04-22). Symlinks inside src/code/ to sibling src/code/shared and
        # src/code/registry are resolved in the "Resolve symlinks" step below so
        # the docker build context is self-contained.
        include:
          - name: google-personal-mcp
            context: a_solutions/aa-sui_google-personal-mcp/src/code
            file: a_solutions/aa-sui_google-personal-mcp/src/code/Dockerfile
          - name: google-workspace-mcp
            context: a_solutions/aa-sui_google-workspace-mcp/src/code
            file: a_solutions/aa-sui_google-workspace-mcp/src/code/Dockerfile
          - name: mail-mcp
            context: a_solutions/aa-sui_mail-mcp/src/code
            file: a_solutions/aa-sui_mail-mcp/src/code/Dockerfile
          - name: mattermost-mcp
            context: a_solutions/aa-sui_mattermost-mcp/src/code
            file: a_solutions/aa-sui_mattermost-mcp/src/code/Dockerfile
          - name: introspect-proxy
            context: a_solutions/bb-sec_introspect-proxy/src/code
            file: a_solutions/bb-sec_introspect-proxy/src/code/Dockerfile
          - name: c3-infra-mcp
            context: a_solutions/bc-obs_c3-infra-mcp/src/code
            file: a_solutions/bc-obs_c3-infra-mcp/src/code/Dockerfile
          - name: c3-infra-api
            context: a_solutions/bc-obs_c3-infra-api/src/code
            file: a_solutions/bc-obs_c3-infra-api/src/code/Dockerfile
          - name: c3-services-mcp
            context: a_solutions/bc-obs_c3-services-mcp/src/code
            file: a_solutions/bc-obs_c3-services-mcp/src/code/Dockerfile
          - name: c3-services-api
            context: a_solutions/bc-obs_c3-services-api/src/code
            file: a_solutions/bc-obs_c3-services-api/src/code/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Update submodules
        run: git submodule update --remote

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve symlinks in build context
        run: |
          ctx="${{ matrix.context }}"
          find "$ctx" -maxdepth 1 -type l | while read link; do
            target=$(readlink -f "$link")
            rm "$link"
            cp -r "$target" "$link"
          done

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/diegonmarcos/${{ matrix.name }}:latest
            ghcr.io/diegonmarcos/${{ matrix.name }}:${{ github.sha }}
          # Force the OCI source label so GHCR auto-links the package to
          # this repo on first push. Without this link, GITHUB_TOKEN cannot
          # change package visibility.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

      # ── Flip GHCR package visibility to public ──
      # Idempotent. Uses the same `/visibility` PUT form already proven in
      # cloud-ship-orchestrate-ghcr.sh and cloud-ship-nix-homemanager-step-deploy-push.sh.
      # GITHUB_TOKEN works because the image carries
      # org.opencontainers.image.source=https://github.com/${{ github.repository }}
      # which links the package to this repo on first push.
      - name: Set GHCR package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG: ${{ matrix.name }}
        run: |
          set -e
          for attempt in 1 2 3 4 5; do
            current=$(gh api "/user/packages/container/${PKG}" --jq '.visibility' 2>/dev/null || echo "missing")
            case "$current" in
              public)
                echo "Package $PKG already public — nothing to do."
                exit 0
                ;;
              private|internal)
                echo "Package $PKG is $current — flipping to public (attempt $attempt)..."
                if gh api --method PUT "/user/packages/container/${PKG}/visibility" -f visibility=public >/dev/null 2>&1; then
                  echo "Package $PKG → public"
                  exit 0
                fi
                ;;
              missing)
                echo "Package $PKG not yet visible to API (attempt $attempt) — waiting 6s..."
                ;;
            esac
            sleep 6
          done
          echo "::warning::Could not confirm $PKG is public after 5 attempts; flip manually with: gh api --method PUT /user/packages/container/${PKG}/visibility -f visibility=public"
