name: "Ship → GHCR images"

on:
  push:
    paths:
      - "a_solutions/aa-sui_google-workspace-mcp/src/**"
      - "a_solutions/aa-sui_mail-mcp/src/**"
      - "a_solutions/aa-sui_mattermost-mcp/src/**"
      - "a_solutions/bb-sec_introspect-proxy/src/**"
      - "a_solutions/bc-obs_c3-infra-mcp/src/**"
      - "a_solutions/bc-obs_c3-infra-api/src/**"
      - "a_solutions/bc-obs_c3-services-mcp/src/**"
      - "a_solutions/bc-obs_c3-services-api/src/**"
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: aa-sui_google-workspace-mcp
          - dir: aa-sui_mail-mcp
          - dir: aa-sui_mattermost-mcp
          - dir: bb-sec_introspect-proxy
          - dir: bc-obs_c3-infra-mcp
          - dir: bc-obs_c3-infra-api
          - dir: bc-obs_c3-services-mcp
          - dir: bc-obs_c3-services-api
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Update submodules
        run: git submodule update --remote

      - name: Build via cloud-builder
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull ghcr.io/diegonmarcos/cloud-builder-x-deb-nixhm:latest
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e GITHUB_TOKEN='${{ secrets.GITHUB_TOKEN }}' \
            -e GITHUB_ACTOR='${{ github.actor }}' \
            -e GITHUB_ACTIONS=true \
            -e GITHUB_SHA='${{ github.sha }}' \
            -e GITHUB_REPOSITORY='diegonmarcos/cloud' \
            ghcr.io/diegonmarcos/cloud-builder-x-deb-nixhm:latest \
            bash -c '
              git clone --depth 2 --recurse-submodules https://github.com/$GITHUB_REPOSITORY.git /workspace
              cd /workspace && git submodule update --remote
              cd a_solutions/${{ matrix.dir }}
              bash build.sh docker
            '
