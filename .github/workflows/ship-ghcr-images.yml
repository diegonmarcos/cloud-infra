name: "Ship → GHCR images"

on:
  push:
    paths:
      - "a_solutions/aa-sui_google-workspace-mcp/src/**"
      - "a_solutions/aa-sui_mail-mcp/src/**"
      - "a_solutions/aa-sui_mattermost-mcp/src/**"
      - "a_solutions/bb-sec_introspect-proxy/src/**"
      - "a_solutions/bc-obs_c3-infra-mcp/src/**"
      - "a_solutions/bc-obs_c3-infra-api/src/**"
      - "a_solutions/bc-obs_c3-services-mcp/src/**"
      - "a_solutions/bc-obs_c3-services-api/src/**"
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: google-workspace-mcp
            context: a_solutions/aa-sui_google-workspace-mcp/src
            file: a_solutions/aa-sui_google-workspace-mcp/src/Dockerfile
          - name: mail-mcp
            context: a_solutions/aa-sui_mail-mcp/src
            file: a_solutions/aa-sui_mail-mcp/src/Dockerfile
          - name: mattermost-mcp
            context: a_solutions/aa-sui_mattermost-mcp/src
            file: a_solutions/aa-sui_mattermost-mcp/src/Dockerfile
          - name: introspect-proxy
            context: a_solutions/bb-sec_introspect-proxy/src
            file: a_solutions/bb-sec_introspect-proxy/src/Dockerfile
          - name: c3-infra-mcp
            context: a_solutions/bc-obs_c3-infra-mcp/src
            file: a_solutions/bc-obs_c3-infra-mcp/src/Dockerfile
          - name: c3-infra-api
            context: a_solutions/bc-obs_c3-infra-api/src
            file: a_solutions/bc-obs_c3-infra-api/src/Dockerfile
          - name: c3-services-mcp
            context: a_solutions/bc-obs_c3-services-mcp/src
            file: a_solutions/bc-obs_c3-services-mcp/src/Dockerfile
          - name: c3-services-api
            context: a_solutions/bc-obs_c3-services-api/src
            file: a_solutions/bc-obs_c3-services-api/src/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Update submodules
        run: git submodule update --remote

      - name: Build and push via cloud-builder
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull ghcr.io/diegonmarcos/cloud-builder-x-deb-nixhm:latest
          # Resolve symlinks before mounting
          ctx="${{ matrix.context }}"
          find "$ctx" -maxdepth 1 -type l | while read link; do
            target=$(readlink -f "$link")
            rm "$link"
            cp -r "$target" "$link"
          done
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            -e GITHUB_TOKEN='${{ secrets.GITHUB_TOKEN }}' \
            -e GITHUB_ACTOR='${{ github.actor }}' \
            ghcr.io/diegonmarcos/cloud-builder-x-deb-nixhm:latest \
            bash -c '
              echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
              cd /workspace/${{ matrix.context }}
              docker build \
                -t ghcr.io/diegonmarcos/${{ matrix.name }}:latest \
                -t ghcr.io/diegonmarcos/${{ matrix.name }}:${{ github.sha }} \
                -f ${{ matrix.file }} \
                /workspace/${{ matrix.context }}
              docker push ghcr.io/diegonmarcos/${{ matrix.name }}:latest
              docker push ghcr.io/diegonmarcos/${{ matrix.name }}:${{ github.sha }}
            '
