# ┌──────────────────────────────────────────────────────────────┐
# │  DO NOT EDIT — this file is generated/deployed by the engine  │
# │                                                                │
# │  Source: cloud/workflows/src/  (templates + static)            │
# │  Build:  ./build.sh workflow   (generates → workflows/dist/)   │
# │  Deploy: copies dist/ → .github/workflows/                    │
# │                                                                │
# │  Edit the source, run build.sh workflow, then commit.          │
# └──────────────────────────────────────────────────────────────┘

name: "Ship → CI image"

on:
  push:
    paths:
      - "workflows/src/deps/**"
      - "config.json"
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-image-build
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x86
            nix_system: x86_64-linux
            runner: ubuntu-latest
            image: ghcr.io/diegonmarcos/cloud-builder-x86-nixos
          - arch: arm
            nix_system: aarch64-linux
            runner: ubuntu-24.04-arm
            image: ghcr.io/diegonmarcos/cloud-builder-arm-nixos
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Encode Dockerfile for label
        id: dockerfile
        run: echo "b64=$(base64 -w0 workflows/src/deps/docker/Dockerfile)" >> "$GITHUB_OUTPUT"

      - name: Build and push cloud-builder image (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: workflows/src/deps
          file: workflows/src/deps/docker/Dockerfile
          push: true
          build-args: |
            DOCKERFILE_B64=${{ steps.dockerfile.outputs.b64 }}
            NIX_SYSTEM=${{ matrix.nix_system }}
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ github.sha }}
