name: "Ship → CI image"

on:
  push:
    paths:
      - "1_workflows/src/cicd/ship-ci-image.yml"
      - "config.json"
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-image-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true   # cloud-data → cloud-data-runners.json

      - name: Checkout unix (Dockerfile + build.sh source)
        uses: actions/checkout@v4
        with:
          repository: diegonmarcos/unix
          path: unix-repo
          token: ${{ secrets.GITHUB_TOKEN }}

      # Vault clone — provides ~/git/vault/vault-keys-docker.envfile that
      # cloud-builder's compose.yaml references via env_file:. Without it,
      # `docker compose run cloud-builder` aborts: "env file ... not found".
      - name: Fetch vault
        uses: ./.github/actions/fetch-vault
        with:
          vault_deploy_key: ${{ secrets.VAULT_DEPLOY_KEY }}

      - name: Ship cloud-builder (native multi-arch via oci-apps)
        env:
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          WG_PRIVATE_KEY: ${{ secrets.WG_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          IMAGE="ghcr.io/diegonmarcos/cloud-builder-x-deb-nixhm:latest"
          docker pull "$IMAGE"

          # Secrets on runner FS — compose mounts them :ro at /mnt/host-ssh,
          # entrypoint copies into /root/.ssh/ inside the container. Include
          # the Host oci-apps alias so build.sh can `ssh oci-apps` for the
          # arm64 native build (IP derived from cloud-data-gha-config.json).
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$OCI_SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null || true
          OCI_APPS_IP=$(jq -r '.vms["oci-apps"].wg_ip // .vms["oci-apps"].host' \
            2_configs/dist/cloud-data-gha-config.json)
          OCI_APPS_USER=$(jq -r '.vms["oci-apps"].user // "ubuntu"' \
            2_configs/dist/cloud-data-gha-config.json)
          cat > ~/.ssh/config <<EOF
          Host oci-apps
            HostName ${OCI_APPS_IP}
            User ${OCI_APPS_USER}
            IdentityFile /root/.ssh/id_deploy
            StrictHostKeyChecking accept-new
            ServerAliveInterval 30
            ServerAliveCountMax 10
          EOF
          chmod 600 ~/.ssh/config
          mkdir -p ~/.config/sops/age
          echo "$SOPS_AGE_KEY" > ~/.config/sops/age/keys.txt

          # Write the compose.yaml IN THE WORKFLOW (self-contained, does not
          # depend on the baked compose inside the currently-published image —
          # which may predate compose.yaml changes like cap_add: NET_ADMIN).
          # This is the declarative source used for the bootstrap rebuild.
          cat > /tmp/cb.yaml <<'YML'
          services:
            cloud-builder:
              image: ghcr.io/diegonmarcos/cloud-builder-x-deb-nixhm:latest
              container_name: cloud-builder-x-ship-ci
              network_mode: host
              cap_add:
                - NET_ADMIN
              volumes:
                - /var/run/docker.sock:/var/run/docker.sock
                - ${HOME}/.ssh:/mnt/host-ssh:ro
                - ${HOME}/.config/sops:/mnt/host-sops:ro
                - ${HOME}/.docker/config.json:/root/.docker/config.json:ro
              environment:
                - GITHUB_TOKEN
                - GITHUB_ACTOR
                - GITHUB_SHA
                - WG_PRIVATE_KEY
                - SOPS_AGE_KEY
          YML

          # Mount cloud + unix repos so entrypoint + build.sh find sources
          # at stable paths. entrypoint.sh runs WG setup, then our sh -c runs
          # build.sh which delegates arm64 → oci-apps (WG-reachable from inside
          # container).
          docker compose -f /tmp/cb.yaml run --rm \
            -v "$GITHUB_WORKSPACE:/root/git/cloud-gha" \
            -v "$GITHUB_WORKSPACE/unix-repo:/root/git/unix-gha" \
            -v "$HOME/git/vault:/root/git/vault:ro" \
            -e CLOUD_DATA_RUNNERS_JSON=/root/git/cloud-gha/2_configs/dist/cloud-data-runners.json \
            -e CLOUD_CONFIG=/root/git/cloud-gha/config.json \
            cloud-builder \
            sh -c "cd /root/git/unix-gha/cb_containers-builders && sh build.sh ship cloud-builder-x-deb-nixhm"
