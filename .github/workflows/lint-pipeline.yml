name: lint-pipeline

# Build-pipeline hygiene — runs on every PR + push to main + manual dispatch.
# Was previously the `preflight-symlinks` job inside ship-ghcr-images.yml.
# Extracted when ship-ghcr-images.yml was retired (step_docker covers builds).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Fail on broken symlinks in build contexts
        run: |
          set -e
          # Skip dist/ and build outputs — they can legitimately hold
          # machine-local symlinks that don't affect the docker build context.
          broken=$(find a_solutions -xtype l \
            -not -path "*/.git/*" \
            -not -path "*/dist/*" \
            -not -path "*/target/*" \
            -not -path "*/node_modules/*" \
            -not -path "*/z_archive/*" 2>/dev/null || true)
          if [ -n "$broken" ]; then
            echo "::error::Broken symlinks found in a_solutions/ source:"
            echo "$broken"
            exit 1
          fi
          echo "No broken symlinks in a_solutions/ source tree."
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Phase 0 — dispatch + nix-step hygiene
        run: bash 1_workflows/src/test/test_dispatch_hygiene.sh
      - name: Phase 1 — arch → runner routing
        run: bash 1_workflows/src/test/test_arch_runner_routing.sh
      - name: Phase 2 — step_docker guards (inline skip + rust binary)
        run: bash 1_workflows/src/test/test_step_docker_guards.sh
      - name: Phase 3D — mattermost base image is multi-arch
        run: bash 1_workflows/src/test/test_mattermost_multiarch.sh
      - name: Phase 3E — npm ci services ship a lockfile
        run: bash 1_workflows/src/test/test_npm_lockfile_present.sh
      - name: Phase 4 — build-{container}.json symlinks all resolve
        run: bash 1_workflows/src/test/test_build_container_json_pattern.sh
      - name: Phase 5 — cloud-builder SSH mount safety
        run: bash 1_workflows/src/test/test_cloud_builder_ssh_safety.sh
      - name: Phase 6 — ship.yml passes WG_PRIVATE_KEY
        run: bash 1_workflows/src/test/test_ship_wireguard_secret.sh
      - name: Phase 8 — GHCR packages public (report-only)
        # Private packages block ship ("write_package denied") but the
        # flip is a GitHub-UI action, not a repo change. Report only.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash 1_workflows/src/test/test_ghcr_visibility.sh
      - name: Phase 9 — proxy-mcp retry is bounded (no OOM leak)
        run: bash 1_workflows/src/test/test_retry_bounded_backoff.sh
      - name: Phase 10 — no live refs to z_archive/ services (report-only)
        # Pre-existing drift reported but not blocking; cleanup happens
        # in the same PR as each service's retirement.
        continue-on-error: true
        run: bash 1_workflows/src/test/test_no_retired_service_refs.sh
      - name: Phase 13 — every flake.nix has a committed flake.lock
        run: bash 1_workflows/src/test/test_flake_lock_present.sh
      - name: Phase 14 — proxied_mcps children resolve to real services
        run: bash 1_workflows/src/test/test_proxied_mcps_resolution.sh
      - name: Phase 15 — engine layout detection works pre-build
        run: bash 1_workflows/src/test/test_layout_detection_pre_build.sh
      - name: Phase 16 — every published image also has -binaries tag (report-only)
        # Report-only until all 30+ services redeploy with the new engine —
        # they self-heal as their next ship pushes the missing -binaries tag.
        # Will flip to hard fail once steady-state.
        continue-on-error: true
        run: bash 1_workflows/src/test/test_binaries_image_published.sh
      - name: Phase 17 — runners[].builder_image is published on GHCR
        run: bash 1_workflows/src/test/test_runners_image_published.sh
      - name: Phase 18 — type=app native_build app_dir resolves to manifest
        run: bash 1_workflows/src/test/test_native_build_app_dir.sh
      - name: Phase 19 — compose-up never rebuilds on the VM (--no-build)
        run: bash 1_workflows/src/test/test_compose_no_build_on_vm.sh
      - name: Phase 11 — container_name matches build.json (report-only)
        # Pending unix submodule sync + pre-existing drift cases;
        # cleanup happens per service.
        continue-on-error: true
        run: bash 1_workflows/src/test/test_container_name_matches_declaration.sh
      - name: Phase 12 — health-report engine B5+B7 semantics (report-only)
        # Checks cloud-data submodule copy; hard-passes only after auto-sync
        # propagates the cloud-data commit.
        continue-on-error: true
        run: bash 1_workflows/src/test/test_health_report_semantics.sh
      - name: Phase 20 — fetch-vault wired into every cloud-builder workflow
        run: bash 1_workflows/src/test/test_workflows_fetch_vault.sh
      - name: Phase 21 — no workflow uses docker/build-push-action (single-engine rule)
        run: bash 1_workflows/src/test/test_no_duplicate_image_builders.sh
      - name: Phase 22 — step_docker uses --cache-from layer cache (both branches)
        run: bash 1_workflows/src/test/test_step_docker_uses_cache.sh
      - name: Phase 23 — step_secrets writes to compose/.secrets for v2 layout
        run: bash 1_workflows/src/test/test_secrets_v2_layout_path.sh
      - name: Phase 24 — engine sources step files defensively (no engine-drift abort)
        run: bash 1_workflows/src/test/test_engine_step_sourcing_tolerant.sh
      - name: Phase 25 — every referenced cloud-ship-*-step-*.sh is git-tracked
        run: bash 1_workflows/src/test/test_engine_steps_tracked.sh
      - name: Phase 26 — step_docker installs ERR trap (no silent set -e exits)
        run: bash 1_workflows/src/test/test_step_docker_err_trap.sh
      - name: Phase 27 — step_docker GHCR login tolerates failure (no abort on RO config.json)
        run: bash 1_workflows/src/test/test_step_docker_login_tolerant.sh
      - name: Phase 28 — step_docker SSH branch ships GHCR token via stdin + uses pipefail
        run: bash 1_workflows/src/test/test_step_docker_ssh_token_passthrough.sh
      - name: Phase 30 — every workflow's 2_configs/build.sh verb is valid
        run: bash 1_workflows/src/test/test_workflow_regen_verb_valid.sh
      - name: Phase 29 — SSH-builder docker run pins cwd to /workspace (entrypoint-cd guard)
        run: bash 1_workflows/src/test/test_ssh_builder_pins_workspace.sh
      - name: Phase 31 — no retired per-domain cloud-data-*.json refs in a_solutions/*/src/
        run: bash 1_workflows/src/test/test_no_stale_cloud_data_symlinks.sh
      - name: Phase 32 — every lint-pipeline tester ref is tracked + executable
        run: bash 1_workflows/src/test/test_lint_pipeline_referenced_files_tracked.sh
      - name: Phase 33 — dist/ + .github/workflows/ in sync with src/ (no agent drift)
        # report-only: false-positives in CI when local + origin match but
        # CI's freshly-built dist differs (likely env-dependent — node/npm
        # version, jq version, locale, etc.). Keeps the signal visible
        # without blocking lint. Investigate + flip to fail-mode once the
        # env-dependence is removed.
        continue-on-error: true
        run: bash 1_workflows/src/test/test_dist_in_sync_with_src.sh
