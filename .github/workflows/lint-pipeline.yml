name: lint-pipeline

# Build-pipeline hygiene — runs on every PR + push to main + manual dispatch.
# Was previously the `preflight-symlinks` job inside ship-ghcr-images.yml.
# Extracted when ship-ghcr-images.yml was retired (step_docker covers builds).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      # Allowlist: `submodules: true` aborts checkout on the first submodule
      # CI cannot reach (vault / notes / cloud-data-lfs are private siblings;
      # cloud-master's own .gitmodules is SSH-only). Init just what is used.
      - uses: ./.github/actions/init-submodules
        with:
          include: I_cloud a_solutions
          cloud_data_deploy_key: ${{ secrets.CLOUD_DATA_DEPLOY_KEY }}

      - name: Fail on broken symlinks in build contexts
        run: |
          set -e
          # Skip dist/ and build outputs — they can legitimately hold
          # machine-local symlinks that don't affect the docker build context.
          broken=$(find a_solutions -xtype l \
            -not -path "*/.git/*" \
            -not -path "*/dist/*" \
            -not -path "*/target/*" \
            -not -path "*/node_modules/*" \
            -not -path "*/z_archive/*" 2>/dev/null || true)
          if [ -n "$broken" ]; then
            echo "::error::Broken symlinks found in a_solutions/ source:"
            echo "$broken"
            exit 1
          fi
          echo "No broken symlinks in a_solutions/ source tree."
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Phase 0 — dispatch + nix-step hygiene
        run: bash 9_others/test/test_dispatch_hygiene.sh
      - name: Phase 1 — arch → runner routing
        run: bash 9_others/test/test_arch_runner_routing.sh
      - name: Phase 2 — step_docker guards (inline skip + rust binary)
        run: bash 9_others/test/test_step_docker_guards.sh
      - name: Phase 3D — mattermost base image is multi-arch
        run: bash 9_others/test/test_mattermost_multiarch.sh
      - name: Phase 3F — mail rules stay one source of truth across engines
        run: bash 9_others/test/test_mail_rules_engines_in_sync.sh
      - name: Phase 3G — mail filter views partition their axis
        run: bash 9_others/test/test_mail_filter_views_partition.sh
      - name: Phase 3E — npm ci services ship a lockfile
        run: bash 9_others/test/test_npm_lockfile_present.sh
      - name: Phase 4 — build-{container}.json symlinks all resolve
        run: bash 9_others/test/test_build_container_json_pattern.sh
      - name: Phase 5 — cloud-builder SSH mount safety
        run: bash 9_others/test/test_cloud_builder_ssh_safety.sh
      - name: Phase 6 — ship.yml passes WG_PRIVATE_KEY
        run: bash 9_others/test/test_ship_wireguard_secret.sh
      - name: Phase 8 — GHCR packages public (report-only)
        # Private packages block ship ("write_package denied") but the
        # flip is a GitHub-UI action, not a repo change. Report only.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash 9_others/test/test_ghcr_visibility.sh
      - name: Phase 9 — proxy-mcp retry is bounded (no OOM leak)
        run: bash 9_others/test/test_retry_bounded_backoff.sh
      - name: Phase 10 — no live refs to z_archive/ services
        # 2026-05-05: flipped from continue-on-error to hard-fail. The test's
        # filter chain now correctly excludes false positives (compound
        # names, shell-command fields, retirement-cleanup hooks, successor
        # services) so a hit is a real drift bug.
        run: bash 9_others/test/test_no_retired_service_refs.sh
      - name: Phase 13 — every flake.nix has a committed flake.lock
        run: bash 9_others/test/test_flake_lock_present.sh
      - name: Phase 14 — proxied_mcps children resolve to real services
        run: bash 9_others/test/test_proxied_mcps_resolution.sh
      - name: Phase 15 — engine layout detection works pre-build
        run: bash 9_others/test/test_layout_detection_pre_build.sh
      - name: Phase 16 — every published image also has -binaries tag (report-only)
        # 2026-05-05: scope-fixed to skip compose-build services (those use
        # dockerfile_inline so the image is built on the VM, never shipped to
        # GHCR — out of scope). Remaining ~9 hits are services awaiting
        # next-ship to push the new -binaries tag (self-heal).
        # Will flip to hard fail once those services next ship.
        continue-on-error: true
        run: bash 9_others/test/test_binaries_image_published.sh
      - name: Phase 17 — runners[].builder_image is published on GHCR
        run: bash 9_others/test/test_runners_image_published.sh
      - name: Phase 18 — type=app native_build app_dir resolves to manifest
        run: bash 9_others/test/test_native_build_app_dir.sh
      - name: Phase 19 — compose-up never rebuilds on the VM (--no-build)
        run: bash 9_others/test/test_compose_no_build_on_vm.sh
      - name: Phase 11 — container_name matches build.json (report-only)
        # Pending unix submodule sync + pre-existing drift cases;
        # cleanup happens per service.
        continue-on-error: true
        run: bash 9_others/test/test_container_name_matches_declaration.sh
      - name: Phase 12 — health-report engine B5+B7 semantics (report-only)
        # Checks cloud-data submodule copy; hard-passes only after auto-sync
        # propagates the cloud-data commit.
        continue-on-error: true
        run: bash 9_others/test/test_health_report_semantics.sh
      - name: Phase 20 — fetch-vault wired into every cloud-builder workflow
        run: bash 9_others/test/test_workflows_fetch_vault.sh
      - name: Phase 21 — no workflow uses docker/build-push-action (single-engine rule)
        run: bash 9_others/test/test_no_duplicate_image_builders.sh
      - name: Phase 22 — step_docker uses --cache-from layer cache (both branches)
        run: bash 9_others/test/test_step_docker_uses_cache.sh
      - name: Phase 23 — step_secrets writes to compose/.secrets for v2 layout
        run: bash 9_others/test/test_secrets_v2_layout_path.sh
      - name: Phase 24 — engine sources step files defensively (no engine-drift abort)
        run: bash 9_others/test/test_engine_step_sourcing_tolerant.sh
      - name: Phase 25 — every referenced cloud-ship-*-step-*.sh is git-tracked
        run: bash 9_others/test/test_engine_steps_tracked.sh
      - name: Phase 26 — step_docker installs ERR trap (no silent set -e exits)
        run: bash 9_others/test/test_step_docker_err_trap.sh
      - name: Phase 27 — step_docker GHCR login tolerates failure (no abort on RO config.json)
        run: bash 9_others/test/test_step_docker_login_tolerant.sh
      - name: Phase 28 — step_docker SSH branch ships GHCR token via stdin + uses pipefail
        run: bash 9_others/test/test_step_docker_ssh_token_passthrough.sh
      - name: Phase 30 — every workflow's 9_others/build.sh verb is valid
        run: bash 9_others/test/test_workflow_regen_verb_valid.sh
      - name: Phase 29 — SSH-builder docker run pins cwd to /workspace (entrypoint-cd guard)
        run: bash 9_others/test/test_ssh_builder_pins_workspace.sh
      - name: Phase 31 — no retired per-domain cloud-data-*.json refs in a_solutions/*/src/
        run: bash 9_others/test/test_no_stale_cloud_data_symlinks.sh
      - name: Phase 32 — every lint-pipeline tester ref is tracked + executable
        run: bash 9_others/test/test_lint_pipeline_referenced_files_tracked.sh
      - name: Phase 34 — no hardcoded cloud-builder-x image literals in wrappers
        # Wrapper-layer drift guard. Engine scripts read image from
        # II_Unix/cb_containers-builders/build.json (data-driven); wrappers
        # MUST resolve from the same source — never re-paste the literal.
        # See test header for the 2026-05-05 root-cause story.
        run: bash 9_others/test/test_no_hardcoded_builder_image_literals.sh
      - name: Phase 35 — no legacy cloud-data-gha-config.json silent fallback
        # ship-ci-image.yml + ship.yml used to silently fall through to a
        # retired config file — masked stale-image divergence (audit P1 #3).
        run: bash 9_others/test/test_no_silent_fallback_in_ship_ci_image.sh
      - name: Phase 36 — engine scripts derive workspace paths
        # cloud-ship-*.sh must use ${WORKSPACE:-/root/git}/... not bare
        # /root/git/... — paths that break in non-default mount setups.
        run: bash 9_others/test/test_engine_workspace_paths_derived.sh
      - name: Phase 37 — build-workflows.json schema invariants
        # Top-level _comment + _source + runners; per-runner type/host contract.
        # Image identity NOT in this file — lives in unix master.
        # Migrated 2026-05-09: source is 9_others/build.json; dist file is build-workflows.json.
        run: bash 9_others/test/test_runners_json_schema.sh
      - name: Phase 38 — no dead `nix profile install` branch in engine
        # Host-state mutation forbidden in engine scripts. nix_install must use
        # `nix shell` / `nix build` only (audit follow-up 2026-05-05).
        run: bash 9_others/test/test_no_dead_nix_install_branch.sh
      - name: Phase 39 — legacy unix workflows/src/static/ removed
        # Stale source tree (hardcoded literals); active source is
        # II_Unix/1_cicd/src/cicd/. Skipped if II_Unix not checked out.
        run: bash 9_others/test/test_no_legacy_unix_static_workflows.sh
      - name: Phase 40 — cloud-data-*.json consumers probe dist/z_archive/
        # Derive script archives deprecated cloud-data-*.json slices to
        # dist/z_archive/. Every consumer's probe chain MUST include a
        # dist/z_archive/<file> candidate or it silently 404s.
        run: bash 9_others/test/test_cloud_data_zarchive_probe.sh
      # Phases 41-43: three testers that lived in gha/scripts/ instead of test/
      # and were never wired into any workflow. They were consolidated into
      # test/ by the 1_cloud-configs split; wiring them in is what stops them
      # rotting again — one of them had been failing on an ambient GITHUB_TOKEN
      # for as long as it existed, which nothing would have caught.
      - name: Phase 41 — _ensure_image_public fatal-path + pull gate ordering
        run: bash 9_others/test/test_ensure_image_public_and_pull_gate.sh
      - name: Phase 42 — step_docker emits multi-arch tags
        run: bash 9_others/test/test_step_docker_multiarch_tags.sh
      - name: Phase 43 — step_secrets writes container-readable .secrets
        run: bash 9_others/test/test_step_secrets_container_readable.sh
      - name: Phase 33 — dist/ + .github/workflows/ in sync with src/ (no agent drift)
        # report-only: false-positives in CI when local + origin match but
        # CI's freshly-built dist differs (likely env-dependent — node/npm
        # version, jq version, locale, etc.). Keeps the signal visible
        # without blocking lint. Investigate + flip to fail-mode once the
        # env-dependence is removed.
        continue-on-error: true
        run: bash 9_others/test/test_dist_in_sync_with_src.sh
