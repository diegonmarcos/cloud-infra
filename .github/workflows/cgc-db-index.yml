# ┌──────────────────────────────────────────────────────────────┐
# │  cloud-cgc octocode DB — REUSABLE index / checkpoint /       │
# │  propagate phase (workflow_call).                            │
# │                                                              │
# │  ALL the index + checkpoint-push + propagate logic lives     │
# │  here; the orchestrator (cgc-db.yml) calls this twice — once  │
# │  per phase — and carries ZERO logic itself.                  │
# │                                                              │
# │  The `phase` input drives exactly two things, both passed as  │
# │  environment into cloud-cgc-db-update.sh (environment wins    │
# │  over build.json):                                           │
# │    · USE_LLM             — false for semantic, true for       │
# │                            graphrag (selects the GraphRAG LLM │
# │                            enrichment pass inside octocode).  │
# │    · CGC_MANIFEST_PHASE  — selects the PER-PHASE manifest so  │
# │                            each phase change-gates on its own │
# │                            last-indexed commit per repo and   │
# │                            is not skipped by the other phase. │
# │                                                              │
# │  MATRIX: one job per repo (repos job resolves index_repos     │
# │  from build.json into a JSON list at runtime — GitHub          │
# │  matrices are static YAML, so this is the established         │
# │  read-config/emit-fromJSON pattern this repo already uses     │
# │  in ship.yml's `detect` job; the src→dist→.github header-     │
# │  injection engine (9_others/build.sh) does NOT template       │
# │  build.json values into workflow content, it only stamps a    │
# │  banner, so there is no build-time injection path to reuse    │
# │  here). Each job indexes ONE repo into a FRESH octocode home  │
# │  (never the 15G monolith base) and packages ONLY that repo's  │
# │  own project into its own ghcr.io/diegonmarcos/cgc-db-<repo>   │
# │  image (cloud-cgc-db-update.sh CGC_PACKAGE_MODE=per-repo).    │
# │  fail-fast: false — one repo timing out or failing must never  │
# │  cancel the others. Per-job propagation is OFF                │
# │  (CGC_SKIP_PROPAGATE=1); the restore-all job below runs        │
# │  ONCE per phase, after every matrix job settles (if: always(),│
# │  so a partial matrix still propagates whatever DID publish):  │
# │  cloud-cgc-db-restore-all.sh (Task 4) assembles the shared     │
# │  base + every per-repo image into one octocode home on the     │
# │  runner, then rsync streams that home onto oci-apps.          │
# │                                                              │
# │  Runs on GitHub-hosted ubuntu-latest x86 runners (~14GB disk).│
# │  Using x86 avoids oci-apps disk pressure (disk full).        │
# │  The octocode DB (FastEmbed vectors + graph) is arch-portable│
# │  so an x86 index is consumed by arm oci-apps cgc-mcp fine.   │
# │  Runner SSHes into oci-apps over WireGuard to propagate.     │
# │                                                              │
# │  MONOLITH PATH NOT YET RETIRED: cloud-cgc-db-update.sh's      │
# │  default (non per-repo) mode, cloud-cgc-db-package.sh, and     │
# │  db_publish.image keep working untouched — the monolith        │
# │  publish/propagate is retired only after this matrix is        │
# │  proven green, per the migration plan.                        │
# └──────────────────────────────────────────────────────────────┘

name: "cgc-db-index (reusable octocode index phase)"

on:
  workflow_call:
    inputs:
      phase:
        description: "Index phase: semantic (structural, no LLM) or graphrag (LLM relationship enrichment)."
        required: true
        type: string
      repos:
        description: "Optional subset of .runtime.octocode.index_repos to build the matrix from. Empty = all."
        required: false
        default: ""
        type: string
      force:
        description: "Reindex even when the repo HEAD matches the phase manifest. Needed whenever the INDEXER changed rather than the code — a fixed LLM endpoint, a new embedding model — since the manifest is keyed on HEAD alone and would otherwise skip every repo forever."
        required: false
        default: "false"
        type: string
      restore:
        description: "Run the restore-all propagation job after indexing. Empty/true = yes."
        required: false
        default: true
        type: boolean
      surfaces:
        description: "Which DB surfaces the restore propagates to: both (default), pub, or pvt."
        required: false
        default: both
        type: string

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # GITHUB_TOKEN is scoped to cloud-infra alone. Cloning other private repos was already
  # worked around below with per-repo deploy keys, but two things still need real repo
  # reach and had no workaround at all:
  #   1. cloud-cgc-db-package.sh's `gh repo view <repo> --json isPrivate` — with no reach
  #      it returns empty, the resolver fails safe to "private", and the job errors.
  #   2. GHCR package auto-linking. A pushed package inherits the visibility of the repo
  #      named in its org.opencontainers.image.source LABEL, but ONLY if the pushing token
  #      can see that repo. It could not, so the package was created PUBLIC and the
  #      verify-or-delete backstop deleted it — every run, for cloud-data and my-ai_memory.
  # A PAT with repo + read:packages + delete:packages fixes both. Optional by design:
  # unset, everything falls back to GITHUB_TOKEN and the public repos index exactly as
  # before, so a missing secret degrades to today's behaviour instead of breaking the run.
  CGC_GHCR_PAT: ${{ secrets.CGC_GHCR_PAT }}
  # gh(1) reads GH_TOKEN first. This is what gives the package script's visibility probe
  # its reach; it falls back to GITHUB_TOKEN when no PAT is configured.
  GH_TOKEN: ${{ secrets.CGC_GHCR_PAT || secrets.GITHUB_TOKEN }}
  # THE ONE THAT ACTUALLY MATTERS. cloud-cgc-db-update.sh:143 reads
  #   TOKEN="${GHCR_TOKEN:-${GITHUB_TOKEN:-}}"
  # and that login is what pushes every per-repo package. Setting CGC_GHCR_PAT and
  # GH_TOKEN alone (67f7c12e1) fixed the `gh repo view` probe and the restore-all
  # login -- neither of which pushes anything -- and left the push itself on
  # GITHUB_TOKEN. GHCR associates a GITHUB_TOKEN push with the WORKFLOW'S repo
  # (cloud-infra, public), so the package was created PUBLIC no matter what
  # org.opencontainers.image.source said, and the backstop deleted it. Every run.
  #
  # Verified empirically 2026-08-23 with content-free busybox probes:
  #   no label, PAT           -> private   (this account defaults new pkgs private)
  #   label -> cloud-data, PAT -> private, linked diegonmarcos/cloud-data
  # i.e. with a PAT that can see the private repo, the auto-link resolves and the
  # package is born private with no UI step and no race (private at t+0s).
  #
  # Falls back to GITHUB_TOKEN when no PAT is configured, so a missing secret
  # degrades to public-repos-only exactly as before instead of breaking the run.
  GHCR_TOKEN: ${{ secrets.CGC_GHCR_PAT || secrets.GITHUB_TOKEN }}
  GITHUB_ACTOR: ${{ github.actor }}
  # NO OPENROUTER_API_KEY here — deliberately. octocode's LLM is my-ai-api on the
  # mesh (.runtime.octocode.llm), which injects its own OpenRouter key inside the
  # container (passthrough_auth=false); the caller sends the `sk-dummy` placeholder.
  # A `secrets.OPENROUTER_API_KEY` used to be passed here, but no such repo secret
  # exists, so it expanded to "" and the graphrag phase logged "LLM client not
  # initialized" and shipped structural-only graphs. cloud-cgc-db-update.sh now
  # exports OPENAI_API_URL/OPENAI_API_KEY from build.json and preflights the
  # endpoint, so this path needs no GHA secret at all.
  CGC_FORCE: ${{ inputs.force == 'true' && '1' || '0' }}
  WG_PRIVATE_KEY: ${{ secrets.WG_PRIVATE_KEY }}
  WG_HUB_PUBKEY: ${{ vars.WG_HUB_PUBKEY }}
  OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
  # PRIVATE index_repos: GITHUB_TOKEN above is scoped to cloud-infra alone and can never
  # clone another private repo — cloud-data failed here on every run and was silently absent
  # from the DB. ensure_repos() reads CGC_DEPLOY_KEY_<local_dir, non-alnum folded to _>, so
  # the script stays generic; only this wiring is per-repo, because Actions resolves secrets
  # by literal name and cannot index into them dynamically. Add one line per private repo in
  # .runtime.octocode.index_repos — public repos need nothing. Declared at the WORKFLOW level
  # so it reaches every job below (repos/index/restore-all) without repeating it per job.
  CGC_DEPLOY_KEY_cloud_data: ${{ secrets.CLOUD_DATA_DEPLOY_KEY }}
  CGC_DEPLOY_KEY_cloud_my_ai_memory: ${{ secrets.CLOUD_MY_AI_MEMORY_DEPLOY_KEY }}

jobs:
  # ── Resolve the repo matrix from build.json (data-driven; see header) ──
  repos:
    name: "cgc-db · ${{ inputs.phase }} · resolve repo matrix"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      repos: ${{ steps.repos.outputs.repos }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate phase input
        run: |
          case "${{ inputs.phase }}" in
            semantic|graphrag) : ;;
            *) echo "::error::unknown phase '${{ inputs.phase }}' (expected semantic|graphrag)"; exit 1 ;;
          esac
      - name: Resolve .runtime.octocode.index_repos → matrix JSON
        id: repos
        run: |
          set -eu
          BJ="a_solutions/user-ai_cloud-cgc-pub-mcp/build.json"
          [ -f "$BJ" ] || { echo "::error::$BJ not found"; exit 1; }
          REPOS_JSON=$(jq -c '[.runtime.octocode.index_repos[]]' "$BJ")
          # Optional subset. index_repos stays the single source of truth: the input
          # can only NARROW it, never introduce a repo, and an unknown name is a hard
          # error rather than a silently-empty matrix that looks like a clean run.
          FILTER='${{ inputs.repos }}'
          if [ -n "$FILTER" ]; then
            SEL=$(printf '%s' "$FILTER" | tr ' ,' '\n\n' | jq -Rc . | jq -sc 'map(select(length > 0))')
            UNKNOWN=$(jq -nc --argjson all "$REPOS_JSON" --argjson sel "$SEL" '$sel - $all')
            [ "$UNKNOWN" = "[]" ] || { echo "::error::repos input names repo(s) not in .runtime.octocode.index_repos: $(printf '%s' "$UNKNOWN" | jq -r 'join(" ")')"; exit 1; }
            # Intersection that preserves index_repos order, so matrix order is stable.
            REPOS_JSON=$(jq -nc --argjson all "$REPOS_JSON" --argjson sel "$SEL" '$all - ($all - $sel)')
            echo "[cgc-db] repos input active — matrix narrowed to: $(printf '%s' "$REPOS_JSON" | jq -r 'join(" ")')"
          fi
          COUNT=$(printf '%s' "$REPOS_JSON" | jq 'length')
          [ "$COUNT" -gt 0 ] || { echo "::error::.runtime.octocode.index_repos is empty — nothing to index"; exit 1; }
          echo "repos=$REPOS_JSON" >> "$GITHUB_OUTPUT"
          echo "[cgc-db] ${{ inputs.phase }} matrix ($COUNT repos): $(printf '%s' "$REPOS_JSON" | jq -r 'join(" ")')"

  # ── One job per repo. fail-fast: false — one repo's failure/timeout must
  # never cancel the others; each publishes to its OWN GHCR image so a
  # failure is isolated to that one repo's checkpoint, not the whole cycle.
  index:
    name: "cgc-db · ${{ inputs.phase }} · ${{ matrix.repo }}"
    needs: repos
    runs-on: ubuntu-latest
    # Same declared ceiling as the pre-matrix single job (see build.json
    # .runtime.octocode.update._budget_comment): max_minutes(300) is the true
    # worst case per repo now that repo_timeout_min is a clamp, not a
    # reservation, so 330 leaves slack for clone + packaging + push. Per-job
    # now, not per-cycle — a slow repo no longer eats every other repo's turn.
    timeout-minutes: 330
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      # Full fan-out for BOTH phases. The graphrag phase used to be pinned to
      # max-parallel:1 because its LLM calls crossed the WireGuard mesh to
      # my-ai-api, and N matrix jobs sharing the single gha-runner peer slot
      # stole each other's endpoint (random preflight failures — and worse, a
      # job losing the slot MID-index, where octocode logs the dead LLM as a
      # warning and ships a structural-only graph with exit 0). The LLM now
      # goes straight to openrouter.ai over the public internet (env on the
      # update step below), so no job in this matrix touches the mesh at all:
      # nothing left to contend for, and the WireGuard step is gone with it.
      max-parallel: 8
      matrix:
        repo: ${{ fromJson(needs.repos.outputs.repos) }}
    steps:
      - uses: actions/checkout@v4
      - name: Fresh per-repo octocode home
        # Must end in /octocode: cloud-cgc-db-update.sh's per-repo mode exports
        # XDG_DATA_HOME as this path's PARENT so octocode 0.12.2's own
        # $XDG_DATA_HOME/octocode resolution (it has no relocation knob of its
        # own — storage.rs:39-47) lands exactly here instead of silently
        # writing the real DB to $HOME/.local/share/octocode (production
        # incident: run 32512759559, every job "no project directory found").
        # update.sh normalizes+warns if this ever drifts, but the source of
        # truth should already conform.
        run: |
          mkdir -p "$RUNNER_TEMP/octocode-home/octocode"
          echo "OCTOCODE_HOME=$RUNNER_TEMP/octocode-home/octocode" >> "$GITHUB_ENV"
      - name: "cgc-db incremental update — ${{ matrix.repo }} only (checkpoint push, no propagate)"
        # No SSH key / CGC_SSH_OPTS here (unlike the pre-matrix single job): with
        # CGC_SKIP_PROPAGATE=1 + CGC_PACKAGE_MODE=per-repo, update.sh's
        # propagate_to_host() is NEVER reached in this job (see cloud-cgc-db-update.sh),
        # so provisioning deploy-key material on every one of N parallel runners would
        # be pure unused attack surface. restore-all below is the only job that needs it.
        env:
          # phase → USE_LLM (environment is authoritative over build.json).
          # semantic = structural only (no LLM); graphrag = LLM relationship pass.
          USE_LLM: ${{ inputs.phase == 'graphrag' && 'true' || 'false' }}
          # DIRECT OpenRouter, not the mesh-only my-ai-api relay that build.json
          # declares. Environment is authoritative over build.json in
          # cloud-cgc-db-update.sh, so these three override the declared mesh
          # URL / placeholder key / health triple for CI only; local and dagu
          # runs keep the relay, which injects this same key server-side.
          # Going direct is what freed this matrix from WireGuard (see
          # max-parallel above). /models answers 200 unauthenticated, which
          # makes it a valid keyless preflight target.
          OPENROUTER_API_URL: https://openrouter.ai/api/v1/chat/completions
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LLM_HEALTH_URL: https://openrouter.ai/api/v1/models
          # phase → PER-PHASE manifest so each phase change-gates independently and
          # graphrag is not skipped just because semantic already advanced HEAD.
          CGC_MANIFEST_PHASE: ${{ inputs.phase }}
          # ONE repo, indexed into the FRESH home set up above.
          CGC_INDEX_REPOS: ${{ matrix.repo }}
          # Per-repo packaging path (cloud-cgc-db-package.sh, mode auto-detected
          # from the image name) instead of monolith package+propagate — see
          # cloud-cgc-db-update.sh checkpoint_publish().
          CGC_PACKAGE_MODE: per-repo
          # Propagation is centralised in the restore-all job below, which runs ONCE
          # per phase after every matrix job settles, not once per repo per job.
          CGC_SKIP_PROPAGATE: "1"
        run: sh 1_cicd/src/ops/cloud-cgc-db-update.sh

  # ── Multi-image restore onto oci-apps: base + every per-repo image, ONCE
  # per phase. if: always() so a partial/failed matrix still propagates
  # whatever DID publish this run instead of leaving oci-apps stale on a
  # single unrelated repo's failure; this job's own success is what gates
  # the phase.
  #
  # cloud-cgc-db-restore-all.sh (Task 4) assembles base + every per-repo
  # image into a LOCAL target dir — it runs docker directly against whatever
  # host it is invoked on, the same contract as cloud-cgc-db-pull.sh, not an
  # SSH-remote script. So this job assembles the full home HERE on the runner
  # (where build.json/GHCR-auth/docker already are, from the checkout above),
  # then transports the assembled result onto oci-apps with the SAME
  # rsync-into-the-live-volume mechanism cloud-cgc-db-update.sh's
  # propagate_to_host() already uses for the monolith path (stop container,
  # rsync --delete, start container) — proven, not reinvented.
  restore-all:
    name: "cgc-db · ${{ inputs.phase }} · restore-all → oci-apps"
    needs: index
    # always() so a single repo's failure still propagates the ones that DID
    # succeed; inputs.restore lets a caller skip propagation entirely when the
    # run only touched repos this volume filters out anyway.
    if: always() && inputs.restore
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    env:
      # BOOTSTRAP: this cron job's very first run ever has no base image on GHCR
      # yet (nothing seeded, no matrix job publishes the base — see
      # cloud-cgc-db-package.sh). Without this, cloud-cgc-db-restore-all.sh hard-
      # errors on the missing base and this job goes red, which — because cgc-db.yml
      # gates the graphrag phase on the semantic phase's result — blocks graphrag too,
      # on every scheduled run, forever, until someone manually seeds a base out of
      # band. CGC_BOOTSTRAP_TOLERANT=1 makes a missing base a ::warning:: + exit 0
      # instead, so the cycle goes green and simply has nothing to propagate yet.
      # The dagu/manual restore path (cloud-cgc-db-restore-all.sh invoked directly,
      # not through this workflow) does NOT set this and keeps the hard error, since
      # there a missing base is an operator mistake worth surfacing loudly.
      CGC_BOOTSTRAP_TOLERANT: "1"
    steps:
      - uses: actions/checkout@v4
      - name: WireGuard up
        continue-on-error: true
        run: bash 1_cicd/src/scripts/cloud-ship-ci-setup-wireguard.sh
      - name: Provision SSH key for propagation
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$OCI_SSH_KEY" > ~/.ssh/cgc_deploy && chmod 600 ~/.ssh/cgc_deploy
      # NO runner-side `docker login` here, deliberately. There used to be one, named
      # "restore-all pulls every per-repo image itself" -- which is exactly backwards:
      # the BOX pulls, the runner only holds an ssh control channel. The runner's
      # credentials were never used by anything in this job. The login that matters is
      # the one made ON the box inside the step below, and it is undone afterwards.
      # PROPAGATION: the BOX PULLS, the runner does not push.
      #
      # This step used to assemble the whole octocode home on the runner and rsync
      # it into oci-apps' volume. That transfer never once succeeded. The last
      # failure is the clearest: ssh connected fine, then died 53s into the data
      # with "client_loop: send disconnect: Broken pipe" -- ServerAliveInterval=15
      # times the default ServerAliveCountMax of 3 is exactly 45s of silence, and a
      # loaded ARM VM at 80%+ disk stalls longer than that while writing hundreds of
      # MB into a docker volume. Raising the keepalive would only move the cliff.
      #
      # The transfer itself is the defect. Every per-repo image is already sitting
      # on GHCR, and oci-apps can fetch them directly at registry speed, so nothing
      # bulk needs to cross WireGuard at all -- only a short ssh control channel.
      # That is the path cloud-cgc-db-restore-all.sh was written for, and it is the
      # one proven to work end to end on this box (rc=0, 6 repos + base).
      #
      # Run DETACHED and poll: the restore takes ~50 min on this hardware, and
      # holding one ssh session open that long invites exactly the broken pipe this
      # step exists to avoid. Each poll is its own short-lived connection, so a
      # dropped link costs one poll instead of the whole restore.
      - name: restore-all on oci-apps (box pulls per-repo images from GHCR)
        env:
          CGC_SURFACES: ${{ inputs.surfaces }}
          CGC_SSH_OPTS: "-i /home/runner/.ssh/cgc_deploy -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -o ServerAliveInterval=15"
        run: |
          set -eu
          BJ="a_solutions/user-ai_cloud-cgc-pub-mcp/build.json"
          HOST=$(jq -r '.db_publish.host' "$BJ")
          # The PUBLIC volume's name, passed to every surface. The private restore
          # refuses to run unless it can prove its target is not this one (see the
          # CGC_INCLUDE_PRIVATE guard in cloud-cgc-db-restore-all.sh), and the box
          # has no checkout to look it up in.
          PUBVOL=$(jq -r '.runtime.octocode.db_volume' "$BJ")
          PREFIX=$(jq -r '.per_repo_publish.image_prefix' "$BJ")
          BASE=$(jq -r '.per_repo_publish.base_image' "$BJ")
          TAG=$(jq -r '.per_repo_publish.tag' "$BJ")
          # The box has no repo checkout, so every value the script would otherwise
          # read from build.json is passed in explicitly -- including the private
          # list, without which the restore's public/private filter has nothing to
          # filter on and a private repo could land in the PUBLIC MCP's volume.
          REPOS=$(jq -r '.runtime.octocode.index_repos | join(" ")' "$BJ")
          PRIV=$(jq -r '.runtime.octocode.private_repos // [] | join(" ")' "$BJ")
          # Same SSH-target resolution as cloud-cgc-db-update.sh's propagate_to_host()
          # and cloud-cgc-db-seed.sh: user@wg_ip from build-gha.json in CI, ssh alias locally.
          GHA="1_cloud-configs/dist/build-gha.json"
          TARGET="$HOST"
          if [ -f "$GHA" ]; then
            WGIP=$(jq -r --arg h "$HOST" '.vms[$h].wg_ip // empty'  "$GHA" 2>/dev/null)
            SUSER=$(jq -r --arg h "$HOST" '.vms[$h].user // "ubuntu"' "$GHA" 2>/dev/null)
            [ -n "$WGIP" ] && TARGET="$SUSER@$WGIP"
          fi
          echo "[cgc-db] restore-all → $TARGET (box pulls ${PREFIX}<repo>:${TAG} from GHCR)"
          # shellcheck disable=SC2086
          scp $CGC_SSH_OPTS 1_cicd/dist/scripts/cloud-cgc-db-restore-all.sh "$TARGET:/tmp/cgc-restore-all.sh"

          # TWO SURFACES, one script. cloud-cgc-pub-mcp serves a volume the private
          # repos are filtered OUT of; cloud-cgc-pvt-mcp serves its own volume with
          # everything in it. Same restore, different target volume and container --
          # which is the entire public/private mechanism: octocode can only answer
          # about the LanceDB tree it is pointed at.
          #
          # Serial, not parallel, and that is cheap rather than slow: the public pass
          # pulls every shared image, so the private pass re-pulls nothing but the two
          # private repos' own images and spends the rest of its time on cp -a.
          # Parallel would also mean two multi-GB staging trees on a box that sits at
          # ~87% disk.
          # The BOX pulls, so the BOX is what needs GHCR credentials -- the runner's
          # own `docker login` in the step above pulls nothing at all. Public packages
          # need none, which is why the public surface has worked against an
          # unauthenticated box all along (verified: oci-apps' ~/.docker/config.json
          # has an empty auths map, and cgc-db-base + every public repo's package are
          # public). The two private repos' packages are the reason this exists.
          #
          # The token crosses the WireGuard ssh channel straight into
          # --password-stdin: never in argv, never in an env var on the box, never
          # echoed. And it is removed again in the trap below rather than left at rest
          # in ~/.docker/config.json on a box that holds no other registry credentials
          # -- the implicit "oci-apps cannot pull private packages" guard the restore
          # script's header describes stays true outside this step's own window.
          cleanup_box_ghcr() {
            # shellcheck disable=SC2086
            ssh $CGC_SSH_OPTS "$TARGET" 'docker logout ghcr.io' >/dev/null 2>&1 || true
          }
          # oci-apps is a 4-core box that keeps serving the live MCP throughout a
          # restore; its load average sits above 6 for the duration and a single ssh
          # can simply time out. On 2026-08-23 one such timeout on the launch below
          # took the whole step down with exit 255 *after* all 8 repos had indexed
          # successfully. Transient unreachability is the normal case here, so the
          # one-shot ssh calls retry. The poll loop already tolerates failure by
          # construction ("|| echo ''"), so it is left alone.
          #   $1 = file to feed on stdin (/dev/null when there is nothing to send)
          ssh_retry() {
            _sr_f=$1; shift
            _sr_n=0
            while :; do
              _sr_n=$((_sr_n + 1))
              # shellcheck disable=SC2086
              ssh $CGC_SSH_OPTS "$@" < "$_sr_f" && return 0
              [ "$_sr_n" -ge 3 ] && return 1
              echo "[cgc-db] ssh to $HOST failed (attempt $_sr_n/3) — retrying in 20s"
              sleep 20
            done
          }
          # Called LAZILY, immediately before the pvt restore, never up front. Only the
          # private surface's packages need auth -- the public ones pull anonymously --
          # so an eager login buys nothing and costs two things: the token sits at rest
          # on the box for the whole ~2h step instead of the pvt window, and the attempt
          # lands exactly when the box is busiest, at the start of the pub pass. On
          # 2026-08-23 that eager login lost all three of its attempts to box saturation
          # inside its first minute; an hour later the pvt half was refused purely on the
          # stale flag it left behind, while the box itself was idle and perfectly able
          # to authenticate. Retrying after the pub pass instead means retrying against a
          # box that has just gone quiet.
          box_ghcr_login() {
            [ -n "${CGC_GHCR_PAT:-}" ] || {
              echo "::error::[cgc-db] CGC_GHCR_PAT is empty in this job. The per-repo images are private by design and are linked to their OWN source repos, not to this one, so this job's GITHUB_TOKEN cannot read them either — a cross-repo classic PAT with read:packages is the only credential that works here."
              return 1
            }
            trap cleanup_box_ghcr EXIT INT TERM
            _li=0
            while :; do
              _li=$((_li + 1))
              # Keep the error text. Discarding it bought five identical retries and
              # a restore that aborted with no cause recorded anywhere. The token
              # goes in on stdin and docker never echoes it, so this is safe to log.
              # ConnectTimeout is overridden UP for this one call. The login lands
              # immediately after the pub restore, i.e. at the box's busiest moment
              # of the whole job -- on 2026-08-23 ssh carried a full pub restore at
              # 18:32 and then every login attempt died in ~15s at 18:33, which is
              # the inherited ConnectTimeout=15 expiring against a saturated box,
              # not GHCR turning the credential down. A later -o wins in ssh.
              # shellcheck disable=SC2086
              _lo=$(printf '%s' "$CGC_GHCR_PAT" | ssh $CGC_SSH_OPTS -o ConnectTimeout=60 "$TARGET" \
                   "docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin" 2>&1) && {
                echo "[cgc-db] box authenticated to GHCR (needed for the private surface's images)"
                return 0
              }
              # A rejected credential is not a transient fault. Retrying one costs
              # 100s and cannot ever succeed, so separate the two cases: back off
              # only for things that might clear on their own.
              case "$_lo" in
                *denied*|*unauthorized*|*"incorrect username or password"*)
                  echo "::error::[cgc-db] GHCR rejected CGC_GHCR_PAT as '$GITHUB_ACTOR': $_lo"
                  echo "::error::[cgc-db] not retried — a rejected credential is not transient. ghcr.io accepts CLASSIC PATs with read:packages; a fine-grained PAT is refused here no matter which repositories or permissions it grants. Verified the same day: a classic token with read:packages reads these exact manifests, so the package side is fine and the token is not."
                  return 1 ;;
              esac
              # 5x20s gave a 3-minute window to outlast congestion on a box that
              # needs ~60 minutes just to complete one restore. Widened to ~12min,
              # which is proportionate to how long the box actually stays busy.
              if [ "$_li" -ge 8 ]; then
                echo "::error::[cgc-db] box GHCR login failed 8x over ~12min, last error: $_lo"
                return 1
              fi
              echo "[cgc-db] box GHCR login failed (attempt $_li/8): $_lo — retrying in 30s"
              sleep 30
            done
          }

          # Surface selection exists because the two restores are independent -- the
          # pvt pass reads the public volume's NAME only, as the "target is not the
          # public volume" safety check, never its contents. So repairing the private
          # surface does not require re-running the ~50 min public one, and a failed
          # pvt half no longer costs a full cycle to retry.
          case "${CGC_SURFACES:-both}" in
            pub) SURFACE_LIST="pub" ;;
            pvt) SURFACE_LIST="pvt" ;;
            *)   SURFACE_LIST="pub pvt" ;;
          esac
          echo "[cgc-db] restoring surface(s): $SURFACE_LIST"
          for SURFACE in $SURFACE_LIST; do
            case "$SURFACE" in
              pub)
                VOL=$(jq -r '.runtime.octocode.db_volume' "$BJ")
                CTR=$(jq -r '.containers.app.container_name' "$BJ")
                INCPRIV=0
                ;;
              pvt)
                VOL=$(jq -r '.runtime.octocode.pvt_db_volume // empty' "$BJ")
                CTR=$(jq -r '.containers.pvt.container_name // empty' "$BJ")
                INCPRIV=1
                # Absent keys = no private surface declared yet. Skip quietly rather
                # than failing the propagation of the public one.
                if [ -z "$VOL" ] || [ -z "$CTR" ]; then
                  echo "[cgc-db] no private surface declared in build.json — skipping pvt restore"
                  continue
                fi
                # Without GHCR auth the box can pull only the PUBLIC packages, so an
                # include_private=1 restore would quietly produce a private volume
                # holding exactly the public repos -- a pvt surface indistinguishable
                # from the pub one, and nothing in the logs saying so. Refuse instead.
                # The pub surface above has already propagated by this point.
                #
                # Gate on the CAPABILITY, not on bookkeeping. A recorded "login ok" flag
                # can be true while the pull still fails (token scope, package renamed,
                # tag never pushed) and -- the case that actually bit -- false while the
                # box is perfectly able to pull, refusing a restore that would have
                # worked. So: log in, then ask the box to resolve one private package's
                # manifest for real. Manifest only, no layers, so the probe is cheap.
                box_ghcr_login || true
                _probe_repo=$(printf '%s\n' "$PRIV" | awk '{print $1}')
                if [ -n "$_probe_repo" ]; then
                  _probe_img="${PREFIX}${_probe_repo}:${TAG}"
                  # shellcheck disable=SC2086
                  if ssh $CGC_SSH_OPTS "$TARGET" "docker manifest inspect $_probe_img" >/dev/null 2>&1; then
                    echo "[cgc-db] box can resolve $_probe_img — private packages are pullable"
                    BOX_GHCR_OK=1
                  else
                    BOX_GHCR_OK=0
                  fi
                else
                  # Nothing declared private: the pvt volume is the pub set by definition
                  # and no auth is required to build it.
                  BOX_GHCR_OK=1
                fi
                if [ "$BOX_GHCR_OK" != "1" ]; then
                  echo "::error::[cgc-db] refusing the pvt restore: box cannot resolve $_probe_img, so the private repos' images are unpullable and $VOL would silently end up with public data only"
                  exit 1
                fi
                ;;
            esac
            LOG="/tmp/cgc-restore-$SURFACE.log"
            RCF="/tmp/cgc-restore-$SURFACE.rc"
            echo "[cgc-db] --- surface $SURFACE → volume $VOL, container $CTR (include_private=$INCPRIV) ---"
            # Deliberately NOT stopping the container here. The restore stays up through
          # the pull/stage phases (~50 min) and takes itself down only across the volume
          # swap, via MCP_CONTAINER below. Bracketing the whole restore from out here --
          # which is what this step used to do -- made every scheduled refresh a
          # 50-minute MCP outage in order to protect a swap that lasts seconds.
          # Built as a heredoc and piped to `sh -s` rather than crammed into one
          # ssh argument: the launch needs nested quoting three levels deep
          # (ssh -> sh -c -> nohup sh -c) and inlining it is how quoting bugs get
          # shipped. Unquoted heredoc so the runner expands the values below,
          # with \$? escaped so the REMOTE shell is the one that evaluates it.
          cat > /tmp/remote-restore.sh <<EOF
          rm -f $LOG $RCF
          setsid nohup env \
            CGC_DB_IMAGE_PREFIX='$PREFIX' \
            CGC_DB_BASE_IMAGE='$BASE' \
            CGC_DB_TAG='$TAG' \
            CGC_DB_TARGET_VOLUME='$VOL' \
            CGC_PUBLIC_DB_VOLUME='$PUBVOL' \
            CGC_INCLUDE_PRIVATE='$INCPRIV' \
            CGC_DB_OWNER='10001:999' \
            CGC_INDEX_REPOS='$REPOS' \
            CGC_PRIVATE_REPOS='$PRIV' \
            MCP_CONTAINER='$CTR' \
            sh -c 'sh /tmp/cgc-restore-all.sh > $LOG 2>&1; echo \$? > $RCF' \
            >/dev/null 2>&1 </dev/null &
          sleep 2
          echo launched
          EOF
          ssh_retry /tmp/remote-restore.sh "$TARGET" 'sh -s'
          # Poll with short-lived connections. The termination condition is the real
          # one -- the restore either writes its rc file or its process disappears --
          # not a stopwatch. The old 60-minute ceiling encoded "a restore takes ~50
          # min on this box", which stopped being true the moment graphrag enrichment
          # grew the per-repo images: on 2026-08-23 the box was pulling at ~25 min per
          # repo, so the step would have declared a perfectly healthy restore dead at
          # 2 repos of 6, killed the job, and left the detached script still running on
          # the box for another two hours with nobody reading its result.
          #
          # A wall-clock guess cannot tell "slow" from "stuck"; process liveness can.
          # The 4h counter below is a backstop against a poll loop that somehow never
          # terminates, not the thing that is supposed to fire.
            RC=""
            i=0
            GONE=0
            while [ $i -lt 480 ]; do
              sleep 30
              i=$((i + 1))
              # One round trip for both facts. `[c]gc` so the poll's own remote command
              # line -- which contains this very pattern -- does not count itself.
              # The parent `sh -c` holds the same string in its argv and outlives the
              # script until `echo $? > $RCF` has run, so "alive" cannot go 0 before
              # the rc file exists.
              # shellcheck disable=SC2086
              OUT=$(ssh $CGC_SSH_OPTS "$TARGET" \
                "cat $RCF 2>/dev/null; echo '@'; ps -o args 2>/dev/null | grep -c '[c]gc-restore-all.sh'" \
                2>/dev/null || echo "@?")
              RC=$(printf '%s' "${OUT%%@*}" | tr -d ' \n')
              ALIVE=$(printf '%s' "${OUT##*@}" | tr -d ' \n')
              [ -n "$RC" ] && break
              # A failed poll reports "?" — unknown, not dead. Never let a flaky ssh
              # over a loaded WireGuard link be read as a crashed restore.
              if [ "$ALIVE" = "0" ]; then
                GONE=$((GONE + 1))
              else
                GONE=0
              fi
              if [ "$GONE" -ge 3 ]; then
                echo "::error::[cgc-db] $SURFACE restore process is gone from $HOST and never wrote $RCF — it died mid-restore"
                break
              fi
              [ $((i % 10)) -eq 0 ] && echo "[cgc-db] $SURFACE still restoring ($((i / 2)) min elapsed, process alive)..."
            done
            # shellcheck disable=SC2086
            ssh $CGC_SSH_OPTS "$TARGET" "tail -25 $LOG" || true
            # shellcheck disable=SC2086
            # Safety net only: the script restarts the container itself on success, but a
            # failure between its stop and its restart would otherwise leave the MCP down.
            # Starting an already-running container is a no-op error here, hence || true.
            ssh $CGC_SSH_OPTS "$TARGET" "sudo docker start $CTR" >/dev/null 2>&1 || true
            if [ -z "$RC" ]; then
              echo "::error::[cgc-db] $SURFACE restore-all produced no result on $HOST (process gone, or the 4h backstop fired)"
              exit 1
            fi
            if [ "$RC" != "0" ]; then
              echo "::error::[cgc-db] $SURFACE restore-all failed on $HOST (rc=$RC)"
              exit "$RC"
            fi
            echo "[cgc-db] $SURFACE restore-all OK — $CTR now serving volume $VOL"
          done
          echo "[cgc-db] restore-all OK — $HOST serving surface(s) $SURFACE_LIST from the freshly pulled multi-image DB"
