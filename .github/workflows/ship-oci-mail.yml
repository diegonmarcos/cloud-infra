name: "Ship → oci-mail"

on:
  push:
    paths:
      - "a_solutions/bc-obs_dagu/src/**"
      - "a_solutions/aa-sui_tools-smtp-proxy/src/**"
      - "a_solutions/aa-sui_snappymail/src/**"
      - "a_solutions/aa-sui_tools-stalwart/src/**"
      - "a_solutions/bc-obs_syslog-forwarder/src/**"
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ship-oci-mail
  cancel-in-progress: false

jobs:
  ship:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: true

      - name: Update submodules to latest
        run: git submodule update --remote

      - uses: ./.github/actions/setup-deps
        with:
          ssh_key: ${{ secrets.OCI_SSH_KEY }}
          ssh_host: 130.110.251.193
          ssh_user: ubuntu
          ssh_alias: oci-mail
          sops_age_key: ${{ secrets.SOPS_AGE_KEY }}

      - name: Ship services
        run: bash .github/workflows/scripts/ship-vm.sh oci-mail
