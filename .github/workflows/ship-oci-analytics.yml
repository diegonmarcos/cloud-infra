name: "Ship → oci-analytics"

on:
  push:
    paths:
      - "a_solutions/bc-obs_matomo/src/**"
      - "a_solutions/bc-obs_umami/src/**"
      - "a_solutions/bc-obs_sauron-forwarder/src/**"
      - "a_solutions/bb-sec_sauron-central/src/**"
      - "a_solutions/bc-obs_alerts-api/src/**"
      - "a_solutions/bc-obs_dozzle/src/**"
      - "a_solutions/bc-obs_fluent-bit/src/**"
      - ".github/workflows/ship-oci-analytics.yml"
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        description: "Ship specific service (leave empty for all changed)"
        required: false
        type: string

concurrency:
  group: ship-oci-analytics
  cancel-in-progress: false

jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changes
        id: changes
        uses: dorny/paths-filter@v3
        if: github.event_name == 'push'
        with:
          filters: |
            matomo:
              - 'a_solutions/bc-obs_matomo/src/**'
            umami:
              - 'a_solutions/bc-obs_umami/src/**'
            sauron-forwarder:
              - 'a_solutions/bc-obs_sauron-forwarder/src/**'
            sauron-central:
              - 'a_solutions/bb-sec_sauron-central/src/**'
            alerts-api:
              - 'a_solutions/bc-obs_alerts-api/src/**'
            dozzle:
              - 'a_solutions/bc-obs_dozzle/src/**'
            fluent-bit:
              - 'a_solutions/bc-obs_fluent-bit/src/**'

      - name: Force service override
        id: force
        if: github.event_name == 'workflow_dispatch'
        run: |
          svc="${{ inputs.service }}"
          for name in matomo umami sauron-forwarder sauron-central alerts-api dozzle fluent-bit; do
            if [ -z "$svc" ] || [ "$svc" = "$name" ]; then
              echo "$name=true" >> "$GITHUB_OUTPUT"
            fi
          done

      - uses: ./.github/actions/setup-deps
        with:
          ssh_key: ${{ secrets.OCI_SSH_KEY }}
          ssh_host: 129.151.228.66
          ssh_user: ubuntu
          ssh_alias: oci-analytics
          sops_age_key: ${{ secrets.SOPS_AGE_KEY }}

      - name: Ship matomo
        if: steps.changes.outputs.matomo == 'true' || steps.force.outputs.matomo == 'true'
        run: bash a_solutions/bc-obs_matomo/build.sh ship

      - name: Ship umami
        if: steps.changes.outputs.umami == 'true' || steps.force.outputs.umami == 'true'
        run: bash a_solutions/bc-obs_umami/build.sh ship

      - name: Ship sauron-forwarder
        if: steps.changes.outputs.sauron-forwarder == 'true' || steps.force.outputs.sauron-forwarder == 'true'
        run: bash a_solutions/bc-obs_sauron-forwarder/build.sh ship

      - name: Ship sauron-central
        if: steps.changes.outputs.sauron-central == 'true' || steps.force.outputs.sauron-central == 'true'
        run: bash a_solutions/bb-sec_sauron-central/build.sh ship

      - name: Ship alerts-api
        if: steps.changes.outputs.alerts-api == 'true' || steps.force.outputs.alerts-api == 'true'
        run: bash a_solutions/bc-obs_alerts-api/build.sh ship

      - name: Ship dozzle
        if: steps.changes.outputs.dozzle == 'true' || steps.force.outputs.dozzle == 'true'
        run: bash a_solutions/bc-obs_dozzle/build.sh ship

      - name: Ship fluent-bit
        if: steps.changes.outputs.fluent-bit == 'true' || steps.force.outputs.fluent-bit == 'true'
        run: bash a_solutions/bc-obs_fluent-bit/build.sh ship
