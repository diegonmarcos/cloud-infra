# ┌──────────────────────────────────────────────────────────────┐
# │  DO NOT EDIT — this file is generated/deployed by the engine  │
# │                                                                │
# │  Source: cloud/workflows/src/  (templates + static)            │
# │  Build:  ./build.sh workflow   (generates → workflows/dist/)   │
# │  Deploy: copies dist/ → .github/workflows/                    │
# │                                                                │
# │  Edit the source, run build.sh workflow, then commit.          │
# └──────────────────────────────────────────────────────────────┘

name: "Ship → oci-analytics"

on:
  push:
    paths:
      - "a_solutions/bb-sec_sauron-central/src/**"
      - "a_solutions/bc-obs_alerts-api/src/**"
      - "a_solutions/bc-obs_dozzle/src/**"
      - "a_solutions/bc-obs_fluent-bit/src/**"
      - "a_solutions/bc-obs_matomo/src/**"
      - "a_solutions/bc-obs_sauron-forwarder/src/**"
      - "a_solutions/bc-obs_umami/src/**"
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ship-oci-analytics
  cancel-in-progress: false

jobs:
  ship:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: true

      - name: Detect changed services
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "dirs=ALL" >> "$GITHUB_OUTPUT"
          else
            dirs=$(git diff --name-only HEAD~1 HEAD -- 'a_solutions/*/src/' | awk -F/ '{print $2}' | sort -u | tr '\n' ' ')
            echo "dirs=$dirs" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/setup-deps
        with:
          ssh_key: ${{ secrets.OCI_SSH_KEY }}
          ssh_host: 129.151.228.66
          ssh_user: ubuntu
          ssh_alias: oci-analytics
          sops_age_key: ${{ secrets.SOPS_AGE_KEY }}


      - name: Ship sauron-central
        if: contains(steps.changed.outputs.dirs, 'bb-sec_sauron-central') || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: bash a_solutions/bb-sec_sauron-central/build.sh ship

      - name: Ship alerts-api
        if: contains(steps.changed.outputs.dirs, 'bc-obs_alerts-api') || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: bash a_solutions/bc-obs_alerts-api/build.sh ship

      - name: Ship dozzle
        if: contains(steps.changed.outputs.dirs, 'bc-obs_dozzle') || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: bash a_solutions/bc-obs_dozzle/build.sh ship

      - name: Ship fluent-bit
        if: contains(steps.changed.outputs.dirs, 'bc-obs_fluent-bit') || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: bash a_solutions/bc-obs_fluent-bit/build.sh ship

      - name: Ship matomo
        if: contains(steps.changed.outputs.dirs, 'bc-obs_matomo') || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: bash a_solutions/bc-obs_matomo/build.sh ship

      - name: Ship sauron-forwarder
        if: contains(steps.changed.outputs.dirs, 'bc-obs_sauron-forwarder') || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: bash a_solutions/bc-obs_sauron-forwarder/build.sh ship

      - name: Ship umami
        if: contains(steps.changed.outputs.dirs, 'bc-obs_umami') || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: bash a_solutions/bc-obs_umami/build.sh ship

