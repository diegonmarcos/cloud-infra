name: "Ship → oci-analytics"

on:
  push:
    paths:
      - "a_solutions/bc-obs_matomo/src/**"
      - "a_solutions/bc-obs_umami/src/**"
      - "a_solutions/bc-obs_sauron-forwarder/src/**"
      - ".github/workflows/ship-oci-analytics.yml"
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        description: "Ship specific service (leave empty for all changed)"
        required: false
        type: string

concurrency:
  group: ship-oci-analytics
  cancel-in-progress: false

jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changes
        id: changes
        uses: dorny/paths-filter@v3
        if: github.event_name == 'push'
        with:
          filters: |
            matomo:
              - 'a_solutions/bc-obs_matomo/src/**'
            umami:
              - 'a_solutions/bc-obs_umami/src/**'
            sauron-forwarder:
              - 'a_solutions/bc-obs_sauron-forwarder/src/**'

      - name: Force service override
        id: force
        if: github.event_name == 'workflow_dispatch'
        run: |
          svc="${{ inputs.service }}"
          for name in matomo umami sauron-forwarder; do
            if [ -z "$svc" ] || [ "$svc" = "$name" ]; then
              echo "$name=true" >> "$GITHUB_OUTPUT"
            fi
          done

      - uses: ./.github/actions/setup-deps
        with:
          ssh_key: ${{ secrets.OCI_SSH_KEY }}
          ssh_host: 129.151.228.66
          ssh_user: ubuntu
          ssh_alias: oci-analytics
          sops_age_key: ${{ secrets.SOPS_AGE_KEY }}

      - name: Ship matomo
        if: steps.changes.outputs.matomo == 'true' || steps.force.outputs.matomo == 'true'
        run: bash a_solutions/bc-obs_matomo/build.sh ship

      - name: Ship umami
        if: steps.changes.outputs.umami == 'true' || steps.force.outputs.umami == 'true'
        run: bash a_solutions/bc-obs_umami/build.sh ship

      - name: Ship sauron-forwarder
        if: steps.changes.outputs.sauron-forwarder == 'true' || steps.force.outputs.sauron-forwarder == 'true'
        run: bash a_solutions/bc-obs_sauron-forwarder/build.sh ship
