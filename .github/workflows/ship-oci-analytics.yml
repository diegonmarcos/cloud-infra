name: "Ship → oci-analytics"

on:
  push:
    paths:
      - "a_solutions/bc-obs_matomo/src/**"
      - "a_solutions/bc-obs_windmill/src/**"
      - "a_solutions/bc-obs_sauron-forwarder/src/**"
      - ".github/workflows/ship-oci-analytics.yml"
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        description: "Ship specific service (leave empty for all changed)"
        required: false
        type: string

concurrency:
  group: ship-oci-analytics
  cancel-in-progress: false

jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changes
        id: changes
        uses: dorny/paths-filter@v3
        if: github.event_name == 'push'
        with:
          filters: |
            matomo:
              - 'a_solutions/bc-obs_matomo/src/**'
            windmill:
              - 'a_solutions/bc-obs_windmill/src/**'
            sauron-forwarder:
              - 'a_solutions/bc-obs_sauron-forwarder/src/**'

      - name: Force service override
        id: force
        if: github.event_name == 'workflow_dispatch'
        run: |
          svc="${{ inputs.service }}"
          for name in matomo windmill sauron-forwarder; do
            if [ -z "$svc" ] || [ "$svc" = "$name" ]; then
              echo "$name=true" >> "$GITHUB_OUTPUT"
            fi
          done

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-24.11

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.OCI_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          cat > ~/.ssh/config <<EOF
          Host oci-analytics
            HostName 129.151.228.66
            User ubuntu
            IdentityFile ~/.ssh/id_deploy
            StrictHostKeyChecking no
            ServerAliveInterval 30
            ServerAliveCountMax 10
          EOF
          chmod 600 ~/.ssh/config

      - name: Setup SOPS age key
        run: |
          mkdir -p ~/.config/sops/age
          echo "${{ secrets.SOPS_AGE_KEY }}" > ~/.config/sops/age/keys.txt
          echo "SOPS_AGE_KEY_FILE=$HOME/.config/sops/age/keys.txt" >> "$GITHUB_ENV"

      - name: Install sops
        run: nix profile install nixpkgs#sops

      - name: Ship matomo
        if: steps.changes.outputs.matomo == 'true' || steps.force.outputs.matomo == 'true'
        continue-on-error: true
        run: bash a_solutions/bc-obs_matomo/build.sh ship

      - name: Ship windmill
        if: steps.changes.outputs.windmill == 'true' || steps.force.outputs.windmill == 'true'
        continue-on-error: true
        run: bash a_solutions/bc-obs_windmill/build.sh ship

      - name: Ship sauron-forwarder
        if: steps.changes.outputs.sauron-forwarder == 'true' || steps.force.outputs.sauron-forwarder == 'true'
        continue-on-error: true
        run: bash a_solutions/bc-obs_sauron-forwarder/build.sh ship
