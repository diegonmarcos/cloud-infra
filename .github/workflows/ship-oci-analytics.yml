name: "Ship → oci-analytics"

on:
  push:
    paths:
      - "a_solutions/bc-obs_alerts-api/src/**"
      - "a_solutions/bc-obs_dozzle/src/**"
      - "a_solutions/bc-obs_fluent-bit/src/**"
      - "a_solutions/bc-obs_matomo/src/**"
      - "a_solutions/bb-sec_sauron-central/src/**"
      - "a_solutions/bc-obs_sauron-forwarder/src/**"
      - "a_solutions/bc-obs_umami/src/**"
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ship-oci-analytics
  cancel-in-progress: false

jobs:
  ship:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: true

      - name: Update submodules to latest
        run: git submodule update --remote

      - uses: ./.github/actions/setup-deps
        with:
          ssh_key: ${{ secrets.OCI_SSH_KEY }}
          ssh_host: 129.151.228.66
          ssh_user: ubuntu
          ssh_alias: oci-analytics
          sops_age_key: ${{ secrets.SOPS_AGE_KEY }}

      - name: Ship services
        shell: bash {0}
        run: bash .github/workflows/scripts/ship-vm.sh oci-analytics
