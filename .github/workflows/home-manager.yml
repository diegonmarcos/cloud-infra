name: Deploy Home Manager (All VMs)

on:
  push:
    paths:
      - "b_infra/home-manager/**"
    branches: [main]
  workflow_dispatch:
    inputs:
      vm:
        description: "Target VM (gcp-proxy, gcp-t4, oci-mail, oci-analytics, oci-apps, oci-apps-2, or empty for all)"
        required: false
        type: string

concurrency:
  group: home-manager-deploy
  cancel-in-progress: false

jobs:
  deploy:
    strategy:
      fail-fast: false
      matrix:
        include:
          - vm: gcp-proxy
            host: ""
            user: ""
            key_secret: GCP_PROXY_SSH_KEY
            use_gcp_secrets: "true"
          - vm: gcp-t4
            host: ""
            user: ""
            key_secret: GCP_T4_SSH_KEY
            use_gcp_t4_secrets: "true"
          - vm: oci-mail
            host: "130.110.251.193"
            user: "ubuntu"
            key_secret: OCI_SSH_KEY
          - vm: oci-analytics
            host: "129.151.228.66"
            user: "ubuntu"
            key_secret: OCI_SSH_KEY
          - vm: oci-apps
            host: "82.70.229.129"
            user: "ubuntu"
            key_secret: OCI_SSH_KEY
          - vm: oci-apps-2
            host: "79.72.28.10"
            user: "ubuntu"
            key_secret: OCI_SSH_KEY

    runs-on: ubuntu-latest
    name: ${{ matrix.vm }}

    steps:
      - name: Check if should run
        id: gate
        run: |
          EVENT="${{ github.event_name }}"
          TARGET="${{ inputs.vm }}"
          VM="${{ matrix.vm }}"
          if [ "$EVENT" != "workflow_dispatch" ] || [ -z "$TARGET" ] || [ "$TARGET" = "$VM" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping $VM (target: $TARGET)"
          fi

      - name: Checkout
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Install Nix
        if: steps.gate.outputs.skip != 'true'
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-24.11

      - name: Setup SSH
        if: steps.gate.outputs.skip != 'true'
        env:
          SSH_KEY: ${{ secrets[matrix.key_secret] }}
          GCP_PROXY_HOST: ${{ secrets.GCP_PROXY_HOST }}
          GCP_PROXY_USER: ${{ secrets.GCP_PROXY_USER }}
          GCP_T4_HOST: ${{ secrets.GCP_T4_HOST }}
          GCP_T4_USER: ${{ secrets.GCP_T4_USER }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${SSH_KEY}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          mkdir -p ~/.ssh/sockets

          # Resolve host/user (GCP VMs use secrets for dynamic IPs)
          if [ "${{ matrix.use_gcp_secrets }}" = "true" ]; then
            HOST="${GCP_PROXY_HOST}"
            USER="${GCP_PROXY_USER}"
          elif [ "${{ matrix.use_gcp_t4_secrets }}" = "true" ]; then
            HOST="${GCP_T4_HOST}"
            USER="${GCP_T4_USER}"
          else
            HOST="${{ matrix.host }}"
            USER="${{ matrix.user }}"
          fi

          ssh-keyscan -H "${HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true

          cat > ~/.ssh/config <<EOF
          Host ${{ matrix.vm }}
            HostName ${HOST}
            User ${USER}
            IdentityFile ~/.ssh/id_deploy
            StrictHostKeyChecking no
            ServerAliveInterval 30
            ServerAliveCountMax 5
            ControlMaster auto
            ControlPath ~/.ssh/sockets/%r@%h-%p
            ControlPersist 600
          EOF
          chmod 600 ~/.ssh/config

      - name: Setup SOPS age key
        if: steps.gate.outputs.skip != 'true'
        run: |
          mkdir -p ~/.config/sops/age
          echo "${{ secrets.SOPS_AGE_KEY }}" > ~/.config/sops/age/keys.txt
          echo "SOPS_AGE_KEY_FILE=$HOME/.config/sops/age/keys.txt" >> "$GITHUB_ENV"

      - name: Install sops
        if: steps.gate.outputs.skip != 'true'
        run: nix profile install nixpkgs#sops

      - name: Ship home-manager
        if: steps.gate.outputs.skip != 'true'
        continue-on-error: true
        run: bash b_infra/home-manager/build.sh ship ${{ matrix.vm }}
