name: Deploy Home Manager (x86_64 VMs)

on:
  push:
    paths:
      - "a_solutions/home-manager/**"
    branches: [main]
  workflow_dispatch:
    inputs:
      vm:
        description: "Target VM (gcp-proxy, oci-mail, oci-analytics, or empty for all)"
        required: false
        type: string

concurrency:
  group: home-manager-deploy
  cancel-in-progress: false

jobs:
  deploy:
    strategy:
      fail-fast: false
      matrix:
        include:
          - vm: gcp-proxy
            config: "diego@gcp-proxy"
            host: ""
            user: ""
            key_secret: GCP_PROXY_SSH_KEY
            use_gcp_secrets: "true"
          - vm: oci-mail
            config: "ubuntu@oci-mail"
            host: "130.110.251.193"
            user: "ubuntu"
            key_secret: OCI_SSH_KEY
            use_gcp_secrets: "false"
          - vm: oci-analytics
            config: "ubuntu@oci-analytics"
            host: "129.151.228.66"
            user: "ubuntu"
            key_secret: OCI_SSH_KEY
            use_gcp_secrets: "false"

    runs-on: ubuntu-latest
    name: ${{ matrix.vm }}

    steps:
      - name: Check if should run
        id: gate
        run: |
          EVENT="${{ github.event_name }}"
          TARGET="${{ inputs.vm }}"
          VM="${{ matrix.vm }}"
          if [ "$EVENT" != "workflow_dispatch" ] || [ -z "$TARGET" ] || [ "$TARGET" = "$VM" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping $VM (target: $TARGET)"
          fi

      - name: Checkout
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Install Nix
        if: steps.gate.outputs.skip != 'true'
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-24.11

      - name: Build activation package
        if: steps.gate.outputs.skip != 'true'
        working-directory: a_solutions/home-manager
        run: |
          echo "::group::Building ${{ matrix.config }}"
          STORE_PATH=$(nix build \
            ".#homeConfigurations.\"${{ matrix.config }}\".activationPackage" \
            --no-link --print-out-paths)
          echo "::endgroup::"
          echo "STORE_PATH=${STORE_PATH}" >> "$GITHUB_ENV"
          echo "Built: ${STORE_PATH}"

      - name: Setup SSH
        if: steps.gate.outputs.skip != 'true'
        env:
          SSH_KEY: ${{ secrets[matrix.key_secret] }}
          GCP_HOST: ${{ secrets.GCP_PROXY_HOST }}
          GCP_USER: ${{ secrets.GCP_PROXY_USER }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "${SSH_KEY}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          # Resolve host/user
          if [ "${{ matrix.use_gcp_secrets }}" = "true" ]; then
            HOST="${GCP_HOST}"
            USER="${GCP_USER}"
          else
            HOST="${{ matrix.host }}"
            USER="${{ matrix.user }}"
          fi

          ssh-keyscan -H "${HOST}" >> ~/.ssh/known_hosts 2>/dev/null

          cat > ~/.ssh/config <<EOF
          Host ${{ matrix.vm }}
            HostName ${HOST}
            User ${USER}
            IdentityFile ~/.ssh/id_deploy
            ServerAliveInterval 30
            ServerAliveCountMax 5
          EOF
          chmod 600 ~/.ssh/config

          echo "DEPLOY_HOST=${HOST}" >> "$GITHUB_ENV"
          echo "DEPLOY_USER=${USER}" >> "$GITHUB_ENV"

      - name: Copy Nix closure to VM
        if: steps.gate.outputs.skip != 'true'
        env:
          NIX_SSHOPTS: "-i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new"
        run: |
          echo "Copying closure to ${{ matrix.vm }} (${DEPLOY_USER}@${DEPLOY_HOST})..."
          nix copy --to "ssh://${DEPLOY_USER}@${DEPLOY_HOST}" "$STORE_PATH"

      - name: Activate home-manager
        if: steps.gate.outputs.skip != 'true'
        run: |
          echo "Activating on ${{ matrix.vm }}..."
          ssh ${{ matrix.vm }} "${STORE_PATH}/activate"
