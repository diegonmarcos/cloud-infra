name: Deploy Home Manager (All VMs)

on:
  push:
    paths:
      - "a_solutions/home-manager/**"
    branches: [main]
  workflow_dispatch:
    inputs:
      vm:
        description: "Target VM (gcp-proxy, oci-mail, oci-analytics, oci-apps, oci-apps-1, oci-apps-2, or empty for all)"
        required: false
        type: string

concurrency:
  group: home-manager-deploy
  cancel-in-progress: false

jobs:
  deploy:
    strategy:
      fail-fast: false
      matrix:
        include:
          - vm: gcp-proxy
            config: "diego@gcp-proxy"
            host: ""
            user: ""
            key_secret: GCP_PROXY_SSH_KEY
            use_gcp_secrets: "true"
            arch: "x86_64-linux"
          - vm: oci-mail
            config: "ubuntu@oci-mail"
            host: "130.110.251.193"
            user: "ubuntu"
            key_secret: OCI_SSH_KEY
            use_gcp_secrets: "false"
            arch: "x86_64-linux"
          - vm: oci-analytics
            config: "ubuntu@oci-analytics"
            host: "129.151.228.66"
            user: "ubuntu"
            key_secret: OCI_SSH_KEY
            use_gcp_secrets: "false"
            arch: "x86_64-linux"
          - vm: oci-apps
            config: "ubuntu@oci-apps"
            host: "82.70.229.129"
            user: "ubuntu"
            key_secret: OCI_SSH_KEY
            use_gcp_secrets: "false"
            arch: "aarch64-linux"
          - vm: oci-apps-1
            config: "ubuntu@oci-apps-1"
            host: "144.24.196.72"
            user: "ubuntu"
            key_secret: OCI_SSH_KEY
            use_gcp_secrets: "false"
            arch: "aarch64-linux"
          - vm: oci-apps-2
            config: "ubuntu@oci-apps-2"
            host: "79.72.28.10"
            user: "ubuntu"
            key_secret: OCI_SSH_KEY
            use_gcp_secrets: "false"
            arch: "aarch64-linux"

    runs-on: ubuntu-latest
    name: ${{ matrix.vm }}

    steps:
      - name: Check if should run
        id: gate
        run: |
          EVENT="${{ github.event_name }}"
          TARGET="${{ inputs.vm }}"
          VM="${{ matrix.vm }}"
          if [ "$EVENT" != "workflow_dispatch" ] || [ -z "$TARGET" ] || [ "$TARGET" = "$VM" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping $VM (target: $TARGET)"
          fi

      - name: Checkout
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Install Nix
        if: steps.gate.outputs.skip != 'true'
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-24.11

      - name: Build activation package (x86_64 VMs)
        if: steps.gate.outputs.skip != 'true' && matrix.arch == 'x86_64-linux'
        working-directory: a_solutions/home-manager
        run: |
          echo "::group::Building ${{ matrix.config }}"
          STORE_PATH=$(nix build \
            ".#homeConfigurations.\"${{ matrix.config }}\".activationPackage" \
            --no-link --print-out-paths)
          echo "::endgroup::"
          echo "STORE_PATH=${STORE_PATH}" >> "$GITHUB_ENV"
          echo "Built: ${STORE_PATH}"

      - name: Setup SSH
        if: steps.gate.outputs.skip != 'true'
        env:
          SSH_KEY: ${{ secrets[matrix.key_secret] }}
          GCP_HOST: ${{ secrets.GCP_PROXY_HOST }}
          GCP_USER: ${{ secrets.GCP_PROXY_USER }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "${SSH_KEY}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          # Resolve host/user
          if [ "${{ matrix.use_gcp_secrets }}" = "true" ]; then
            HOST="${GCP_HOST}"
            USER="${GCP_USER}"
          else
            HOST="${{ matrix.host }}"
            USER="${{ matrix.user }}"
          fi

          ssh-keyscan -H "${HOST}" >> ~/.ssh/known_hosts 2>/dev/null

          cat > ~/.ssh/config <<EOF
          Host ${{ matrix.vm }}
            HostName ${HOST}
            User ${USER}
            IdentityFile ~/.ssh/id_deploy
            ServerAliveInterval 30
            ServerAliveCountMax 5
          EOF
          chmod 600 ~/.ssh/config

          echo "DEPLOY_HOST=${HOST}" >> "$GITHUB_ENV"
          echo "DEPLOY_USER=${USER}" >> "$GITHUB_ENV"

      - name: Prepare remote nix for closure copy (x86_64 VMs)
        if: steps.gate.outputs.skip != 'true' && matrix.arch == 'x86_64-linux'
        run: |
          ssh ${{ matrix.vm }} '
            NIX_BIN="/nix/var/nix/profiles/default/bin"
            [ ! -x "$NIX_BIN/nix-store" ] && NIX_BIN="$HOME/.nix-profile/bin"
            for bin in nix nix-build nix-store nix-daemon; do
              [ -x "$NIX_BIN/$bin" ] && sudo ln -sf "$NIX_BIN/$bin" "/usr/local/bin/$bin"
            done
            CONF="/etc/nix/nix.custom.conf"
            grep -q "trusted-users.*$(whoami)" "$CONF" 2>/dev/null || {
              echo "trusted-users = root $(whoami)" | sudo tee -a "$CONF"
              sudo systemctl restart nix-daemon
            }
          '

      - name: Copy Nix closure to VM (x86_64 VMs)
        if: steps.gate.outputs.skip != 'true' && matrix.arch == 'x86_64-linux'
        env:
          NIX_SSHOPTS: "-i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new"
        run: |
          echo "Copying closure to ${{ matrix.vm }} (${DEPLOY_USER}@${DEPLOY_HOST})..."
          nix copy --to "ssh://${DEPLOY_USER}@${DEPLOY_HOST}" "$STORE_PATH"

      - name: Copy flake to ARM VM and build on-VM (aarch64 VMs)
        if: steps.gate.outputs.skip != 'true' && matrix.arch == 'aarch64-linux'
        run: |
          echo "Copying flake to ${{ matrix.vm }}..."
          ssh ${{ matrix.vm }} "mkdir -p ~/.config/home-manager"
          rsync -avz --delete \
            --include="flake.nix" \
            --include="flake.lock" \
            --include="*.nix" \
            --include="modules/" \
            --include="modules/**" \
            --exclude="*" \
            a_solutions/home-manager/ "${{ matrix.vm }}:~/.config/home-manager/"

          echo "Building on ${{ matrix.vm }}..."
          STORE_PATH=$(ssh ${{ matrix.vm }} "export PATH=\$HOME/.nix-profile/bin:/nix/var/nix/profiles/default/bin:/usr/local/bin:\$PATH && cd ~/.config/home-manager && nix build \".#homeConfigurations.\\\"${{ matrix.config }}\\\".activationPackage\" --no-link --print-out-paths" | tail -1)
          echo "STORE_PATH=${STORE_PATH}" >> "$GITHUB_ENV"
          echo "Built: ${STORE_PATH}"

      - name: Activate home-manager
        if: steps.gate.outputs.skip != 'true'
        run: |
          echo "Activating on ${{ matrix.vm }}..."
          ssh ${{ matrix.vm }} "export PATH=/nix/var/nix/profiles/default/bin:/usr/local/bin:\$PATH && ${STORE_PATH}/activate"
