name: "Ship → oci-apps"

on:
  push:
    paths:
      - "a_solutions/ca-dat_backup-borg/src/**"
      - "a_solutions/ca-dat_backup-bup/src/**"
      - "a_solutions/ca-dat_backup-gitea/src/**"
      - "a_solutions/bc-obs_c3-infra-api/src/**"
      - "a_solutions/bc-obs_c3-infra-mcp/src/**"
      - "a_solutions/bc-obs_c3-services-api/src/**"
      - "a_solutions/bc-obs_c3-services-mcp/src/**"
      - "a_solutions/bc-obs_cloud-cgc-mcp/src/**"
      - "a_solutions/bc-obs_cloud-spec/src/**"
      - "a_solutions/aa-sui_code-server/src/**"
      - "a_solutions/ac-fin_crawlee-cloud/src/**"
      - "a_solutions/aa-sui_etherpad/src/**"
      - "a_solutions/aa-sui_filebrowser/src/**"
      - "a_solutions/ca-dat_gitea/src/**"
      - "a_solutions/aa-sui_google-workspace-mcp/src/**"
      - "a_solutions/aa-sui_grist/src/**"
      - "a_solutions/aa-sui_hedgedoc/src/**"
      - "a_solutions/ca-dat_kg-graph/src/**"
      - "a_solutions/bc-obs_lgtm/src/**"
      - "a_solutions/aa-sui_mail-mcp/src/**"
      - "a_solutions/aa-sui_mattermost-bots/src/**"
      - "a_solutions/aa-sui_mattermost-mcp/src/**"
      - "a_solutions/bc-obs_nocodb/src/**"
      - "a_solutions/ad-agi_ollama-hai/src/**"
      - "a_solutions/bb-sec_orchestrator/src/**"
      - "a_solutions/aa-sui_photoprism/src/**"
      - "a_solutions/aa-sui_photos-webhook/src/**"
      - "a_solutions/ac-fin_quant-lab-light/src/**"
      - "a_solutions/aa-sui_radicale/src/**"
      - "a_solutions/aa-sui_revealmd/src/**"
      - "a_solutions/ad-agi_rig-agentic-hai-1.5bq4/src/**"
      - "a_solutions/ad-agi_rig-agentic-sonn-14bq8/src/**"
      - "a_solutions/bc-obs_windmill/src/**"
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ship-oci-apps
  cancel-in-progress: false

jobs:
  ship:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Ship inside cloud-builder
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull ghcr.io/diegonmarcos/cloud-builder:latest
          mkdir -p "${{ runner.temp }}/traces"
          docker run --rm \
            -v "${{ runner.temp }}/traces:/traces" \
            -e TRACE_DIR=/traces \
            -e SSH_KEY='${{ secrets.OCI_SSH_KEY }}' \
            -e SSH_HOST='82.70.229.129' \
            -e SSH_USER='ubuntu' \
            -e SSH_ALIAS='oci-apps' \
            -e SOPS_AGE_KEY='${{ secrets.SOPS_AGE_KEY }}' \
            -e GITHUB_ACTIONS=true \
            -e GITHUB_EVENT_NAME="${GITHUB_EVENT_NAME:-}" \
            -e GITHUB_REPOSITORY="${GITHUB_REPOSITORY}" \
            -e GITHUB_RUN_ID="${{ github.run_id }}" \
            -e GITHUB_SHA="${{ github.sha }}" \
            -e FORCE_DEPLOY=1 \
            ghcr.io/diegonmarcos/cloud-builder:latest \
            bash -c 'mkdir -p ~/.ssh && ssh-keyscan github.com >>~/.ssh/known_hosts 2>/dev/null && git clone --depth 2 --recurse-submodules https://github.com/$GITHUB_REPOSITORY.git /workspace && cd /workspace && git submodule update --remote && bash .github/workflows/scripts/cloud-builder.sh ship $SSH_ALIAS'

      - name: Push traces to cloud-data
        if: always()
        continue-on-error: true
        run: |
          TRACE_FILE="${{ runner.temp }}/traces/oci-apps.json"
          [ -f "$TRACE_FILE" ] || { echo "No trace file produced"; exit 0; }
          # Setup SSH for cloud-data repo
          mkdir -p ~/.ssh
          echo '${{ secrets.CLOUD_DATA_DEPLOY_KEY }}' > ~/.ssh/cloud_data_key
          chmod 600 ~/.ssh/cloud_data_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/cloud_data_key -o StrictHostKeyChecking=no"
          # Clone cloud-data, merge trace, push
          git clone --depth 1 git@github.com:diegonmarcos/cloud-data.git /tmp/cloud-data
          cd /tmp/cloud-data
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p traces-gha
          TARGET="traces-gha/oci-apps.json"
          if [ -f "$TARGET" ]; then
            jq --slurpfile new "$TRACE_FILE" '. + $new | .[-200:]' "$TARGET" > "${TARGET}.tmp" \
              && mv "${TARGET}.tmp" "$TARGET"
          else
            jq -s '.' "$TRACE_FILE" > "$TARGET"
          fi
          git add traces-gha/
          git diff --cached --quiet && { echo "No trace changes"; exit 0; }
          git commit -m "auto: trace ship-oci-apps [skip ci]"
          for i in 1 2 3; do
            git push origin main && break
            echo "Push attempt $i failed — pulling and retrying..."
            git pull --rebase origin main 2>/dev/null || true
          done
