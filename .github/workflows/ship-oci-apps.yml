name: "Ship → oci-apps"

on:
  push:
    paths:
      - "a_solutions/aa-sui_mattermost-mcp/src/**"
      - "a_solutions/aa-sui_mailu-mcp/src/**"
      - "a_solutions/aa-sui_mattermost-bots/src/**"
      - "a_solutions/aa-sui_code-server/src/**"
      - "a_solutions/aa-sui_etherpad/src/**"
      - "a_solutions/aa-sui_filebrowser/src/**"
      - "a_solutions/aa-sui_grist/src/**"
      - "a_solutions/aa-sui_hedgedoc/src/**"
      - "a_solutions/aa-sui_photoprism/src/**"
      - "a_solutions/aa-sui_radicale/src/**"
      - "a_solutions/aa-sui_revealmd/src/**"
      - "a_solutions/ac-fin_crawlee-cloud/src/**"
      - "a_solutions/ac-fin_quant-lab-full/src/**"
      - "a_solutions/ac-fin_quant-lab-light/src/**"
      - "a_solutions/bb-sec_orchestrator/src/**"
      - "a_solutions/bc-obs_lgtm/src/**"
      - "a_solutions/bc-obs_nocodb/src/**"
      - "a_solutions/ad-agi_rig-agentic/src/**"
      - "a_solutions/ca-dat_gitea/src/**"
      - "a_solutions/ca-dat_kg-graph/src/**"
      - "a_solutions/bc-obs_c3-infra-mcp-api/src/**"
      - "a_solutions/bc-obs_c3-services-mcp-api/src/**"
      - "a_solutions/bc-obs_cloud-spec/src/**"
      - "a_solutions/bc-obs_windmill/src/**"
      - "a_solutions/aa-sui_google-workspace-mcp/src/**"
      - ".github/workflows/ship-oci-apps.yml"
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        description: "Ship specific service (leave empty for all changed)"
        required: false
        type: string
      wipe_data:
        description: "Wipe KG Graph data (fresh start, re-seeds)"
        required: false
        type: boolean
        default: false

concurrency:
  group: ship-oci-apps
  cancel-in-progress: false

jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: true

      - name: Detect changes
        id: changes
        uses: dorny/paths-filter@v3
        if: github.event_name == 'push'
        with:
          filters: |
            mattermost-mcp:
              - 'a_solutions/aa-sui_mattermost-mcp/src/**'
            mailu-mcp:
              - 'a_solutions/aa-sui_mailu-mcp/src/**'
            mattermost-bots:
              - 'a_solutions/aa-sui_mattermost-bots/src/**'
            code-server:
              - 'a_solutions/aa-sui_code-server/src/**'
            etherpad:
              - 'a_solutions/aa-sui_etherpad/src/**'
            filebrowser:
              - 'a_solutions/aa-sui_filebrowser/src/**'
            grist:
              - 'a_solutions/aa-sui_grist/src/**'
            hedgedoc:
              - 'a_solutions/aa-sui_hedgedoc/src/**'
            photoprism:
              - 'a_solutions/aa-sui_photoprism/src/**'
            radicale:
              - 'a_solutions/aa-sui_radicale/src/**'
            revealmd:
              - 'a_solutions/aa-sui_revealmd/src/**'
            crawlee-cloud:
              - 'a_solutions/ac-fin_crawlee-cloud/src/**'
            quant-lab-full:
              - 'a_solutions/ac-fin_quant-lab-full/src/**'
            quant-lab-light:
              - 'a_solutions/ac-fin_quant-lab-light/src/**'
            orchestrator:
              - 'a_solutions/bb-sec_orchestrator/src/**'
            lgtm:
              - 'a_solutions/bc-obs_lgtm/src/**'
            nocodb:
              - 'a_solutions/bc-obs_nocodb/src/**'
            rig-agentic:
              - 'a_solutions/ad-agi_rig-agentic/src/**'
            gitea:
              - 'a_solutions/ca-dat_gitea/src/**'
            kg-graph:
              - 'a_solutions/ca-dat_kg-graph/src/**'
            c3-api:
              - 'a_solutions/bc-obs_c3-infra-mcp-api/src/**'
            c3-services-api:
              - 'a_solutions/bc-obs_c3-services-mcp-api/src/**'
            cloud-spec:
              - 'a_solutions/bc-obs_cloud-spec/src/**'
            windmill:
              - 'a_solutions/bc-obs_windmill/src/**'
            google-workspace-mcp:
              - 'a_solutions/aa-sui_google-workspace-mcp/src/**'

      - name: Force service override
        id: force
        if: github.event_name == 'workflow_dispatch'
        run: |
          svc="${{ inputs.service }}"
          for name in mattermost-mcp mailu-mcp mattermost-bots code-server etherpad filebrowser grist hedgedoc photoprism radicale revealmd crawlee-cloud quant-lab-full quant-lab-light orchestrator lgtm nocodb rig-agentic gitea kg-graph c3-api c3-services-api cloud-spec windmill google-workspace-mcp; do
            if [ -z "$svc" ] || [ "$svc" = "$name" ]; then
              echo "$name=true" >> "$GITHUB_OUTPUT"
            fi
          done

      - uses: ./.github/actions/setup-deps
        with:
          ssh_key: ${{ secrets.OCI_SSH_KEY }}
          ssh_host: 82.70.229.129
          ssh_user: ubuntu
          ssh_alias: oci-apps
          sops_age_key: ${{ secrets.SOPS_AGE_KEY }}

      - name: Ship mattermost-mcp
        if: steps.changes.outputs.mattermost-mcp == 'true' || steps.force.outputs.mattermost-mcp == 'true'
        env:
          REMOTE_BUILD: "true"
        run: bash a_solutions/aa-sui_mattermost-mcp/build.sh ship

      - name: Ship mailu-mcp
        if: steps.changes.outputs.mailu-mcp == 'true' || steps.force.outputs.mailu-mcp == 'true'
        env:
          REMOTE_BUILD: "true"
        run: bash a_solutions/aa-sui_mailu-mcp/build.sh ship

      - name: Ship mattermost-bots
        if: steps.changes.outputs.mattermost-bots == 'true' || steps.force.outputs.mattermost-bots == 'true'
        run: bash a_solutions/aa-sui_mattermost-bots/build.sh ship

      - name: Ship code-server
        if: steps.changes.outputs.code-server == 'true' || steps.force.outputs.code-server == 'true'
        run: bash a_solutions/aa-sui_code-server/build.sh ship

      - name: Ship etherpad
        if: steps.changes.outputs.etherpad == 'true' || steps.force.outputs.etherpad == 'true'
        run: bash a_solutions/aa-sui_etherpad/build.sh ship

      - name: Ship filebrowser
        if: steps.changes.outputs.filebrowser == 'true' || steps.force.outputs.filebrowser == 'true'
        run: bash a_solutions/aa-sui_filebrowser/build.sh ship

      - name: Ship grist
        if: steps.changes.outputs.grist == 'true' || steps.force.outputs.grist == 'true'
        run: bash a_solutions/aa-sui_grist/build.sh ship

      - name: Ship hedgedoc
        if: steps.changes.outputs.hedgedoc == 'true' || steps.force.outputs.hedgedoc == 'true'
        run: bash a_solutions/aa-sui_hedgedoc/build.sh ship

      - name: Ship photoprism
        if: steps.changes.outputs.photoprism == 'true' || steps.force.outputs.photoprism == 'true'
        run: bash a_solutions/aa-sui_photoprism/build.sh ship

      - name: Ship radicale
        if: steps.changes.outputs.radicale == 'true' || steps.force.outputs.radicale == 'true'
        run: bash a_solutions/aa-sui_radicale/build.sh ship

      - name: Ship revealmd
        if: steps.changes.outputs.revealmd == 'true' || steps.force.outputs.revealmd == 'true'
        run: bash a_solutions/aa-sui_revealmd/build.sh ship

      - name: Ship crawlee-cloud
        if: steps.changes.outputs.crawlee-cloud == 'true' || steps.force.outputs.crawlee-cloud == 'true'
        run: bash a_solutions/ac-fin_crawlee-cloud/build.sh ship

      - name: Ship quant-lab-full
        if: steps.changes.outputs.quant-lab-full == 'true' || steps.force.outputs.quant-lab-full == 'true'
        run: bash a_solutions/ac-fin_quant-lab-full/build.sh ship

      - name: Ship quant-lab-light
        if: steps.changes.outputs.quant-lab-light == 'true' || steps.force.outputs.quant-lab-light == 'true'
        run: bash a_solutions/ac-fin_quant-lab-light/build.sh ship

      - name: Ship orchestrator
        if: steps.changes.outputs.orchestrator == 'true' || steps.force.outputs.orchestrator == 'true'
        run: bash a_solutions/bb-sec_orchestrator/build.sh ship

      - name: Ship lgtm
        if: steps.changes.outputs.lgtm == 'true' || steps.force.outputs.lgtm == 'true'
        run: bash a_solutions/bc-obs_lgtm/build.sh ship

      - name: Ship nocodb
        if: steps.changes.outputs.nocodb == 'true' || steps.force.outputs.nocodb == 'true'
        run: bash a_solutions/bc-obs_nocodb/build.sh ship

      - name: Ship rig-agentic
        if: steps.changes.outputs.rig-agentic == 'true' || steps.force.outputs.rig-agentic == 'true'
        env:
          REMOTE_BUILD: "true"
        run: bash a_solutions/ad-agi_rig-agentic/build.sh ship

      - name: Ship gitea
        if: steps.changes.outputs.gitea == 'true' || steps.force.outputs.gitea == 'true'
        run: bash a_solutions/ca-dat_gitea/build.sh ship

      - name: Ship c3-api
        if: steps.changes.outputs.c3-api == 'true' || steps.force.outputs.c3-api == 'true'
        env:
          REMOTE_BUILD: "true"
        run: bash a_solutions/bc-obs_c3-infra-mcp-api/build.sh ship

      - name: Ship c3-services-api
        if: steps.changes.outputs.c3-services-api == 'true' || steps.force.outputs.c3-services-api == 'true'
        env:
          REMOTE_BUILD: "true"
        run: bash a_solutions/bc-obs_c3-services-mcp-api/build.sh ship

      - name: Ship cloud-spec
        if: steps.changes.outputs.cloud-spec == 'true' || steps.force.outputs.cloud-spec == 'true'
        run: bash a_solutions/bc-obs_cloud-spec/build.sh ship

      - name: Ship windmill
        if: steps.changes.outputs.windmill == 'true' || steps.force.outputs.windmill == 'true'
        run: bash a_solutions/bc-obs_windmill/build.sh ship

      - name: Ship google-workspace-mcp
        if: steps.changes.outputs.google-workspace-mcp == 'true' || steps.force.outputs.google-workspace-mcp == 'true'
        env:
          REMOTE_BUILD: "true"
        run: bash a_solutions/aa-sui_google-workspace-mcp/build.sh ship

      - name: Ship kg-graph
        id: ship-kg-graph
        if: steps.changes.outputs.kg-graph == 'true' || steps.force.outputs.kg-graph == 'true'
        run: bash a_solutions/ca-dat_kg-graph/build.sh ship

      - name: Copy KG seed resources
        if: steps.ship-kg-graph.outcome == 'success'
        run: |
          rsync -avz a_solutions/ca-dat_kg-graph/scripts/ oci-apps:/opt/containers/kg-graph/scripts/
          rsync -avz cloud-topology.json oci-apps:/opt/containers/kg-graph/cloud-topology.json

      - name: Wipe KG Graph data (fresh start)
        if: steps.ship-kg-graph.outcome == 'success' && github.event.inputs.wipe_data == 'true'
        run: |
          ssh oci-apps "cd /opt/containers/kg-graph && docker compose down 2>/dev/null; sudo rm -rf /opt/data/surrealdb && sudo mkdir -p /opt/data/surrealdb && sudo chown 65532:65532 /opt/data/surrealdb"
          ssh oci-apps "cd /opt/containers/kg-graph && docker compose --env-file .secrets up -d"
          echo "Waiting for SurrealDB to start..."
          sleep 10

      - name: Seed KG Graph
        if: steps.ship-kg-graph.outcome == 'success' && github.event.inputs.wipe_data == 'true'
        run: ssh oci-apps "chmod +x /opt/containers/kg-graph/scripts/seed_from_config.sh && cd /opt/containers/kg-graph && bash scripts/seed_from_config.sh http://localhost:8001 /opt/containers/kg-graph/cloud-topology.json"

      - name: Verify KG Graph
        if: steps.ship-kg-graph.outcome == 'success'
        run: ssh oci-apps "curl -sf http://localhost:8001/health && echo ' <- SurrealDB health OK' || echo 'SurrealDB health FAILED'"

      # ── Collect deployed services ──
      - name: Collect deployed services
        id: deployed
        if: always()
        env:
          EVENT: ${{ github.event_name }}
          # Push trigger — from path changes
          CH_mattermost_mcp: ${{ steps.changes.outputs.mattermost-mcp }}
          CH_mailu_mcp: ${{ steps.changes.outputs.mailu-mcp }}
          CH_mattermost_bots: ${{ steps.changes.outputs.mattermost-bots }}
          CH_code_server: ${{ steps.changes.outputs.code-server }}
          CH_etherpad: ${{ steps.changes.outputs.etherpad }}
          CH_filebrowser: ${{ steps.changes.outputs.filebrowser }}
          CH_grist: ${{ steps.changes.outputs.grist }}
          CH_hedgedoc: ${{ steps.changes.outputs.hedgedoc }}
          CH_photoprism: ${{ steps.changes.outputs.photoprism }}
          CH_radicale: ${{ steps.changes.outputs.radicale }}
          CH_revealmd: ${{ steps.changes.outputs.revealmd }}
          CH_crawlee_cloud: ${{ steps.changes.outputs.crawlee-cloud }}
          CH_quant_lab_full: ${{ steps.changes.outputs.quant-lab-full }}
          CH_quant_lab_light: ${{ steps.changes.outputs.quant-lab-light }}
          CH_orchestrator: ${{ steps.changes.outputs.orchestrator }}
          CH_lgtm: ${{ steps.changes.outputs.lgtm }}
          CH_nocodb: ${{ steps.changes.outputs.nocodb }}
          CH_rig_agentic: ${{ steps.changes.outputs.rig-agentic }}
          CH_gitea: ${{ steps.changes.outputs.gitea }}
          CH_c3_api: ${{ steps.changes.outputs.c3-api }}
          CH_c3_services_api: ${{ steps.changes.outputs.c3-services-api }}
          CH_cloud_spec: ${{ steps.changes.outputs.cloud-spec }}
          CH_windmill: ${{ steps.changes.outputs.windmill }}
          CH_google_workspace_mcp: ${{ steps.changes.outputs.google-workspace-mcp }}
          CH_kg_graph: ${{ steps.changes.outputs.kg-graph }}
          # Force trigger
          F_mattermost_mcp: ${{ steps.force.outputs.mattermost-mcp }}
          F_mailu_mcp: ${{ steps.force.outputs.mailu-mcp }}
          F_mattermost_bots: ${{ steps.force.outputs.mattermost-bots }}
          F_code_server: ${{ steps.force.outputs.code-server }}
          F_etherpad: ${{ steps.force.outputs.etherpad }}
          F_filebrowser: ${{ steps.force.outputs.filebrowser }}
          F_grist: ${{ steps.force.outputs.grist }}
          F_hedgedoc: ${{ steps.force.outputs.hedgedoc }}
          F_photoprism: ${{ steps.force.outputs.photoprism }}
          F_radicale: ${{ steps.force.outputs.radicale }}
          F_revealmd: ${{ steps.force.outputs.revealmd }}
          F_crawlee_cloud: ${{ steps.force.outputs.crawlee-cloud }}
          F_quant_lab_full: ${{ steps.force.outputs.quant-lab-full }}
          F_quant_lab_light: ${{ steps.force.outputs.quant-lab-light }}
          F_orchestrator: ${{ steps.force.outputs.orchestrator }}
          F_lgtm: ${{ steps.force.outputs.lgtm }}
          F_nocodb: ${{ steps.force.outputs.nocodb }}
          F_rig_agentic: ${{ steps.force.outputs.rig-agentic }}
          F_gitea: ${{ steps.force.outputs.gitea }}
          F_c3_api: ${{ steps.force.outputs.c3-api }}
          F_c3_services_api: ${{ steps.force.outputs.c3-services-api }}
          F_cloud_spec: ${{ steps.force.outputs.cloud-spec }}
          F_windmill: ${{ steps.force.outputs.windmill }}
          F_google_workspace_mcp: ${{ steps.force.outputs.google-workspace-mcp }}
          F_kg_graph: ${{ steps.force.outputs.kg-graph }}
        run: |
          deployed=""
          for name in mattermost_mcp mailu_mcp mattermost_bots code_server etherpad filebrowser grist hedgedoc photoprism radicale revealmd crawlee_cloud quant_lab_full quant_lab_light orchestrator lgtm nocodb rig_agentic gitea c3_api c3_services_api cloud_spec windmill google_workspace_mcp kg_graph; do
            ch_var="CH_${name}"
            f_var="F_${name}"
            if [ "${!ch_var}" = "true" ] || [ "${!f_var}" = "true" ]; then
              deployed="$deployed $name"
            fi
          done
          echo "list=$deployed" >> "$GITHUB_OUTPUT"
          echo "Deployed services:$deployed"

      # ── Health verification ──
      - name: Health check deployed services
        if: always() && steps.deployed.outputs.list != ''
        run: |
          echo "=== Post-deploy health checks ==="
          failed=0
          for name in ${{ steps.deployed.outputs.list }}; do
            # Map underscore names to folder paths
            case "$name" in
              c3_api)              dir="bc-obs_c3-infra-mcp-api" ;;
              c3_services_api)     dir="bc-obs_c3-services-mcp-api" ;;
              cloud_spec)          dir="bc-obs_cloud-spec" ;;
              crawlee_cloud)       dir="ac-fin_crawlee-cloud" ;;
              quant_lab_full)      dir="ac-fin_quant-lab-full" ;;
              quant_lab_light)     dir="ac-fin_quant-lab-light" ;;
              orchestrator)        dir="bb-sec_orchestrator" ;;
              lgtm)                dir="bc-obs_lgtm" ;;
              nocodb)              dir="bc-obs_nocodb" ;;
              rig_agentic)         dir="ad-agi_rig-agentic" ;;
              gitea)               dir="ca-dat_gitea" ;;
              kg_graph)            dir="ca-dat_kg-graph" ;;
              windmill)            dir="bc-obs_windmill" ;;
              google_workspace_mcp) dir="aa-sui_google-workspace-mcp" ;;
              *)                   dir="aa-sui_$(echo "$name" | tr '_' '-')" ;;
            esac
            echo "--- Health: $name ---"
            if bash "a_solutions/$dir/build.sh" health; then
              echo "  OK: $name healthy"
            else
              echo "  FAIL: $name"
              failed=$((failed + 1))
            fi
          done
          if [ "$failed" -gt 0 ]; then
            echo "::warning::$failed service(s) failed health checks"
          else
            echo "All deployed services healthy"
          fi
