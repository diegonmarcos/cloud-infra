name: "Ship → oci-apps"

on:
  push:
    paths:
      - "a_solutions/ca-dat_backup-borg/src/**"
      - "a_solutions/ca-dat_backup-bup/src/**"
      - "a_solutions/ca-dat_backup-gitea/src/**"
      - "a_solutions/bc-obs_c3-infra-api/src/**"
      - "a_solutions/bc-obs_c3-infra-mcp/src/**"
      - "a_solutions/bc-obs_c3-services-api/src/**"
      - "a_solutions/bc-obs_c3-services-mcp/src/**"
      - "a_solutions/bc-obs_cloud-cgc-mcp/src/**"
      - "a_solutions/bc-obs_cloud-spec/src/**"
      - "a_solutions/aa-sui_code-server/src/**"
      - "a_solutions/ac-fin_crawlee-cloud/src/**"
      - "a_solutions/aa-sui_etherpad/src/**"
      - "a_solutions/aa-sui_filebrowser/src/**"
      - "a_solutions/ca-dat_gitea/src/**"
      - "a_solutions/aa-sui_google-workspace-mcp/src/**"
      - "a_solutions/aa-sui_grist/src/**"
      - "a_solutions/aa-sui_hedgedoc/src/**"
      - "a_solutions/ca-dat_kg-graph/src/**"
      - "a_solutions/bc-obs_lgtm/src/**"
      - "a_solutions/aa-sui_mail-mcp/src/**"
      - "a_solutions/aa-sui_mattermost-bots/src/**"
      - "a_solutions/aa-sui_mattermost-mcp/src/**"
      - "a_solutions/bc-obs_nocodb/src/**"
      - "a_solutions/ad-agi_ollama-hai/src/**"
      - "a_solutions/bb-sec_orchestrator/src/**"
      - "a_solutions/aa-sui_photoprism/src/**"
      - "a_solutions/aa-sui_photos-webhook/src/**"
      - "a_solutions/ac-fin_quant-lab-light/src/**"
      - "a_solutions/aa-sui_radicale/src/**"
      - "a_solutions/aa-sui_revealmd/src/**"
      - "a_solutions/ad-agi_rig-agentic-hai-1.5bq4/src/**"
      - "a_solutions/ad-agi_rig-agentic-sonn-14bq8/src/**"
      - "a_solutions/bc-obs_windmill/src/**"
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ship-oci-apps
  cancel-in-progress: false

jobs:
  ship:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: true

      - name: Update submodules to latest
        run: git submodule update --remote

      - uses: ./.github/actions/setup-deps
        with:
          ssh_key: ${{ secrets.OCI_SSH_KEY }}
          ssh_host: 82.70.229.129
          ssh_user: ubuntu
          ssh_alias: oci-apps
          sops_age_key: ${{ secrets.SOPS_AGE_KEY }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Ship services
        run: bash .github/workflows/scripts/ship-vm.sh oci-apps
