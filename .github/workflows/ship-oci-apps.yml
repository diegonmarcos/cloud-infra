        run: bash a_solutions/bc-obs_c3-infra-mcp-api/build.sh ship

      - name: Ship c3-services-mcp-api
        if: contains(steps.changed.outputs.dirs, 'bc-obs_c3-services-mcp-api') || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          REMOTE_BUILD: "true"
        run: bash a_solutions/bc-obs_c3-services-mcp-api/build.sh ship

      - name: Ship cloud-spec
        if: contains(steps.changed.outputs.dirs, 'bc-obs_cloud-spec') || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: bash a_solutions/bc-obs_cloud-spec/build.sh ship

      - name: Ship lgtm
        if: contains(steps.changed.outputs.dirs, 'bc-obs_lgtm') || github.event_name == 'workflow_dispatch'
        continue-on-error: true
