name: "Ship → oci-apps"

on:
  push:
    paths:
      - "a_solutions/aa-sui_mattermost-bots/src/**"
      - "a_solutions/aa-sui_code-server/src/**"
      - "a_solutions/aa-sui_etherpad/src/**"
      - "a_solutions/aa-sui_filebrowser/src/**"
      - "a_solutions/aa-sui_grist/src/**"
      - "a_solutions/aa-sui_hedgedoc/src/**"
      - "a_solutions/aa-sui_photoprism/src/**"
      - "a_solutions/aa-sui_radicale/src/**"
      - "a_solutions/aa-sui_revealmd/src/**"
      - "a_solutions/ac-fin_crawlee-cloud/src/**"
      - "a_solutions/ac-fin_quant-lab-full/src/**"
      - "a_solutions/ac-fin_quant-lab-light/src/**"
      - "a_solutions/bb-sec_orchestrator/src/**"
      - "a_solutions/bc-obs_lgtm/src/**"
      - "a_solutions/bc-obs_nocodb/src/**"
      - "a_solutions/ad-agi_rig-agentic/src/**"
      - "a_solutions/ca-dat_gitea/src/**"
      - "a_solutions/ca-dat_kg-graph/src/**"
      - "a_solutions/mcp-api-c3/src/**"
      - "a_solutions/bc-obs_cloud-spec/src/**"
      - ".github/workflows/ship-oci-apps.yml"
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        description: "Ship specific service (leave empty for all changed)"
        required: false
        type: string
      wipe_data:
        description: "Wipe KG Graph data (fresh start, re-seeds)"
        required: false
        type: boolean
        default: false

concurrency:
  group: ship-oci-apps
  cancel-in-progress: false

jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changes
        id: changes
        uses: dorny/paths-filter@v3
        if: github.event_name == 'push'
        with:
          filters: |
            mattermost-bots:
              - 'a_solutions/aa-sui_mattermost-bots/src/**'
            code-server:
              - 'a_solutions/aa-sui_code-server/src/**'
            etherpad:
              - 'a_solutions/aa-sui_etherpad/src/**'
            filebrowser:
              - 'a_solutions/aa-sui_filebrowser/src/**'
            grist:
              - 'a_solutions/aa-sui_grist/src/**'
            hedgedoc:
              - 'a_solutions/aa-sui_hedgedoc/src/**'
            photoprism:
              - 'a_solutions/aa-sui_photoprism/src/**'
            radicale:
              - 'a_solutions/aa-sui_radicale/src/**'
            revealmd:
              - 'a_solutions/aa-sui_revealmd/src/**'
            crawlee-cloud:
              - 'a_solutions/ac-fin_crawlee-cloud/src/**'
            quant-lab-full:
              - 'a_solutions/ac-fin_quant-lab-full/src/**'
            quant-lab-light:
              - 'a_solutions/ac-fin_quant-lab-light/src/**'
            orchestrator:
              - 'a_solutions/bb-sec_orchestrator/src/**'
            lgtm:
              - 'a_solutions/bc-obs_lgtm/src/**'
            nocodb:
              - 'a_solutions/bc-obs_nocodb/src/**'
            rig-agentic:
              - 'a_solutions/ad-agi_rig-agentic/src/**'
            gitea:
              - 'a_solutions/ca-dat_gitea/src/**'
            kg-graph:
              - 'a_solutions/ca-dat_kg-graph/src/**'
            c3-api:
              - 'a_solutions/mcp-api-c3/src/**'
            cloud-spec:
              - 'a_solutions/bc-obs_cloud-spec/src/**'

      - name: Force service override
        id: force
        if: github.event_name == 'workflow_dispatch'
        run: |
          svc="${{ inputs.service }}"
          for name in mattermost-bots code-server etherpad filebrowser grist hedgedoc photoprism radicale revealmd crawlee-cloud quant-lab-full quant-lab-light orchestrator lgtm nocodb rig-agentic gitea kg-graph c3-api cloud-spec; do
            if [ -z "$svc" ] || [ "$svc" = "$name" ]; then
              echo "$name=true" >> "$GITHUB_OUTPUT"
            fi
          done

      - uses: ./.github/actions/setup-deps
        with:
          ssh_key: ${{ secrets.OCI_SSH_KEY }}
          ssh_host: 82.70.229.129
          ssh_user: ubuntu
          ssh_alias: oci-apps
          sops_age_key: ${{ secrets.SOPS_AGE_KEY }}

      - name: Ship mattermost-bots
        if: steps.changes.outputs.mattermost-bots == 'true' || steps.force.outputs.mattermost-bots == 'true'
        run: bash a_solutions/aa-sui_mattermost-bots/build.sh ship

      - name: Ship code-server
        if: steps.changes.outputs.code-server == 'true' || steps.force.outputs.code-server == 'true'
        run: bash a_solutions/aa-sui_code-server/build.sh ship

      - name: Ship etherpad
        if: steps.changes.outputs.etherpad == 'true' || steps.force.outputs.etherpad == 'true'
        run: bash a_solutions/aa-sui_etherpad/build.sh ship

      - name: Ship filebrowser
        if: steps.changes.outputs.filebrowser == 'true' || steps.force.outputs.filebrowser == 'true'
        run: bash a_solutions/aa-sui_filebrowser/build.sh ship

      - name: Ship grist
        if: steps.changes.outputs.grist == 'true' || steps.force.outputs.grist == 'true'
        run: bash a_solutions/aa-sui_grist/build.sh ship

      - name: Ship hedgedoc
        if: steps.changes.outputs.hedgedoc == 'true' || steps.force.outputs.hedgedoc == 'true'
        run: bash a_solutions/aa-sui_hedgedoc/build.sh ship

      - name: Ship photoprism
        if: steps.changes.outputs.photoprism == 'true' || steps.force.outputs.photoprism == 'true'
        run: bash a_solutions/aa-sui_photoprism/build.sh ship

      - name: Ship radicale
        if: steps.changes.outputs.radicale == 'true' || steps.force.outputs.radicale == 'true'
        run: bash a_solutions/aa-sui_radicale/build.sh ship

      - name: Ship revealmd
        if: steps.changes.outputs.revealmd == 'true' || steps.force.outputs.revealmd == 'true'
        run: bash a_solutions/aa-sui_revealmd/build.sh ship

      - name: Ship crawlee-cloud
        if: steps.changes.outputs.crawlee-cloud == 'true' || steps.force.outputs.crawlee-cloud == 'true'
        run: bash a_solutions/ac-fin_crawlee-cloud/build.sh ship

      - name: Ship quant-lab-full
        if: steps.changes.outputs.quant-lab-full == 'true' || steps.force.outputs.quant-lab-full == 'true'
        run: bash a_solutions/ac-fin_quant-lab-full/build.sh ship

      - name: Ship quant-lab-light
        if: steps.changes.outputs.quant-lab-light == 'true' || steps.force.outputs.quant-lab-light == 'true'
        run: bash a_solutions/ac-fin_quant-lab-light/build.sh ship

      - name: Ship orchestrator
        if: steps.changes.outputs.orchestrator == 'true' || steps.force.outputs.orchestrator == 'true'
        run: bash a_solutions/bb-sec_orchestrator/build.sh ship

      - name: Ship lgtm
        if: steps.changes.outputs.lgtm == 'true' || steps.force.outputs.lgtm == 'true'
        run: bash a_solutions/bc-obs_lgtm/build.sh ship

      - name: Ship nocodb
        if: steps.changes.outputs.nocodb == 'true' || steps.force.outputs.nocodb == 'true'
        run: bash a_solutions/bc-obs_nocodb/build.sh ship

      - name: Ship rig-agentic
        if: steps.changes.outputs.rig-agentic == 'true' || steps.force.outputs.rig-agentic == 'true'
        env:
          REMOTE_BUILD: "true"
        run: bash a_solutions/ad-agi_rig-agentic/build.sh ship

      - name: Ship gitea
        if: steps.changes.outputs.gitea == 'true' || steps.force.outputs.gitea == 'true'
        run: bash a_solutions/ca-dat_gitea/build.sh ship

      - name: Ship c3-api
        if: steps.changes.outputs.c3-api == 'true' || steps.force.outputs.c3-api == 'true'
        env:
          REMOTE_BUILD: "true"
        run: bash a_solutions/mcp-api-c3/build.sh ship

      - name: Ship cloud-spec
        if: steps.changes.outputs.cloud-spec == 'true' || steps.force.outputs.cloud-spec == 'true'
        run: bash a_solutions/bc-obs_cloud-spec/build.sh ship

      - name: Ship kg-graph
        id: ship-kg-graph
        if: steps.changes.outputs.kg-graph == 'true' || steps.force.outputs.kg-graph == 'true'
        run: bash a_solutions/ca-dat_kg-graph/build.sh ship

      - name: Copy KG seed resources
        if: steps.ship-kg-graph.outcome == 'success'
        run: |
          rsync -avz a_solutions/ca-dat_kg-graph/scripts/ oci-apps:/opt/containers/kg-graph/scripts/
          rsync -avz cloud-topology.json oci-apps:/opt/containers/kg-graph/cloud-topology.json

      - name: Wipe KG Graph data (fresh start)
        if: steps.ship-kg-graph.outcome == 'success' && github.event.inputs.wipe_data == 'true'
        run: |
          ssh oci-apps "cd /opt/containers/kg-graph && docker compose down 2>/dev/null; sudo rm -rf /opt/data/surrealdb && sudo mkdir -p /opt/data/surrealdb && sudo chown 65532:65532 /opt/data/surrealdb"
          ssh oci-apps "cd /opt/containers/kg-graph && docker compose --env-file .secrets up -d"
          echo "Waiting for SurrealDB to start..."
          sleep 10

      - name: Seed KG Graph
        if: steps.ship-kg-graph.outcome == 'success' && github.event.inputs.wipe_data == 'true'
        run: ssh oci-apps "chmod +x /opt/containers/kg-graph/scripts/seed_from_config.sh && cd /opt/containers/kg-graph && bash scripts/seed_from_config.sh http://localhost:8001 /opt/containers/kg-graph/cloud-topology.json"

      - name: Verify KG Graph
        if: steps.ship-kg-graph.outcome == 'success'
        run: ssh oci-apps "curl -sf http://localhost:8001/health && echo ' <- SurrealDB health OK' || echo 'SurrealDB health FAILED'"
