# ┌──────────────────────────────────────────────────────────────┐
# │  DO NOT EDIT — this file is generated/deployed by the engine  │
# │                                                                │
# │  Source: cloud/workflows/src/  (templates + static)            │
# │  Build:  ./build.sh workflow   (generates → workflows/dist/)   │
# │  Deploy: copies dist/ → .github/workflows/                    │
# │                                                                │
# │  Edit the source, run build.sh workflow, then commit.          │
# └──────────────────────────────────────────────────────────────┘

name: "Ship → oci-apps"

on:
  push:
    paths:
      - "a_solutions/aa-sui_code-server/src/**"
      - "a_solutions/aa-sui_etherpad/src/**"
      - "a_solutions/aa-sui_filebrowser/src/**"
      - "a_solutions/aa-sui_google-workspace-mcp/src/**"
      - "a_solutions/aa-sui_grist/src/**"
      - "a_solutions/aa-sui_hedgedoc/src/**"
      - "a_solutions/aa-sui_mail-mcp/src/**"
      - "a_solutions/aa-sui_mattermost-bots/src/**"
      - "a_solutions/aa-sui_mattermost-mcp/src/**"
      - "a_solutions/aa-sui_photoprism/src/**"
      - "a_solutions/aa-sui_photos-webhook/src/**"
      - "a_solutions/aa-sui_radicale/src/**"
      - "a_solutions/aa-sui_revealmd/src/**"
      - "a_solutions/ac-fin_crawlee-cloud/src/**"
      - "a_solutions/ac-fin_quant-lab-light/src/**"
      - "a_solutions/ad-agi_rig-agentic/src/**"
      - "a_solutions/bb-sec_orchestrator/src/**"
      - "a_solutions/bc-obs_c3-infra-mcp-api/src/**"
      - "a_solutions/bc-obs_c3-services-mcp-api/src/**"
      - "a_solutions/bc-obs_cloud-spec/src/**"
      - "a_solutions/bc-obs_lgtm/src/**"
      - "a_solutions/bc-obs_nocodb/src/**"
      - "a_solutions/bc-obs_windmill/src/**"
      - "a_solutions/ca-dat_backup-borg/src/**"
      - "a_solutions/ca-dat_backup-bup/src/**"
      - "a_solutions/ca-dat_backup-gitea/src/**"
      - "a_solutions/ca-dat_gitea/src/**"
      - "a_solutions/ca-dat_kg-graph/src/**"
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ship-oci-apps
  cancel-in-progress: false

jobs:
  ship:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: true

      - name: Detect changed services
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "dirs=ALL" >> "$GITHUB_OUTPUT"
          else
            dirs=$(git diff --name-only HEAD~1 HEAD -- 'a_solutions/*/src/' | awk -F/ '{print $2}' | sort -u | tr '\n' ' ')
            echo "dirs=$dirs" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/setup-deps
        with:
          ssh_key: ${{ secrets.OCI_SSH_KEY }}
          ssh_host: 82.70.229.129
          ssh_user: ubuntu
          ssh_alias: oci-apps
          sops_age_key: ${{ secrets.SOPS_AGE_KEY }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Ship code-server
        if: contains(steps.changed.outputs.dirs, 'aa-sui_code-server') || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: bash a_solutions/aa-sui_code-server/build.sh ship

      - name: Ship etherpad
        if: contains(steps.changed.outputs.dirs, 'aa-sui_etherpad') || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: bash a_solutions/aa-sui_etherpad/build.sh ship

      - name: Ship filebrowser
        if: contains(steps.changed.outputs.dirs, 'aa-sui_filebrowser') || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: bash a_solutions/aa-sui_filebrowser/build.sh ship

      - name: Ship google-workspace-mcp
        if: contains(steps.changed.outputs.dirs, 'aa-sui_google-workspace-mcp') || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          REMOTE_BUILD: "true"
        run: bash a_solutions/aa-sui_google-workspace-mcp/build.sh ship

      - name: Ship grist
        if: contains(steps.changed.outputs.dirs, 'aa-sui_grist') || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: bash a_solutions/aa-sui_grist/build.sh ship

      - name: Ship hedgedoc
        if: contains(steps.changed.outputs.dirs, 'aa-sui_hedgedoc') || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: bash a_solutions/aa-sui_hedgedoc/build.sh ship

      - name: Ship mail-mcp
        if: contains(steps.changed.outputs.dirs, 'aa-sui_mail-mcp') || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          REMOTE_BUILD: "true"
        run: bash a_solutions/aa-sui_mail-mcp/build.sh ship

      - name: Ship mattermost-bots
        if: contains(steps.changed.outputs.dirs, 'aa-sui_mattermost-bots') || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: bash a_solutions/aa-sui_mattermost-bots/build.sh ship

      - name: Ship mattermost-mcp
        if: contains(steps.changed.outputs.dirs, 'aa-sui_mattermost-mcp') || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          REMOTE_BUILD: "true"
        run: bash a_solutions/aa-sui_mattermost-mcp/build.sh ship

      - name: Ship photoprism
        if: contains(steps.changed.outputs.dirs, 'aa-sui_photoprism') || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: bash a_solutions/aa-sui_photoprism/build.sh ship

      - name: Ship photos-webhook
        if: contains(steps.changed.outputs.dirs, 'aa-sui_photos-webhook') || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: bash a_solutions/aa-sui_photos-webhook/build.sh ship

      - name: Ship radicale
        if: contains(steps.changed.outputs.dirs, 'aa-sui_radicale') || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: bash a_solutions/aa-sui_radicale/build.sh ship

      - name: Ship revealmd
        if: contains(steps.changed.outputs.dirs, 'aa-sui_revealmd') || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: bash a_solutions/aa-sui_revealmd/build.sh ship

      - name: Ship crawlee-cloud
