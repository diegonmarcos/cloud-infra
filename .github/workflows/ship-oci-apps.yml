      - name: Ship backup-borg
        if: contains(steps.changed.outputs.dirs, 'ca-dat_backup-borg') || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: bash a_solutions/ca-dat_backup-borg/build.sh ship

      - name: Ship backup-bup
        if: contains(steps.changed.outputs.dirs, 'ca-dat_backup-bup') || github.event_name == 'workflow_dispatch'
