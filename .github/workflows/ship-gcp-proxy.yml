name: "Ship → gcp-proxy"

on:
  push:
    paths:
      - "a_solutions/bb-sec_caddy/src/**"
      - "a_solutions/bb-sec_go-api/src/**"
      - "a_solutions/bb-sec_authelia/src/**"
      - "a_solutions/bb-sec_flask-api/src/**"
      - "a_solutions/ab-mic_vaultwarden/src/**"
      - "a_solutions/ba-clo_hickory-dns/src/**"
      - "a_solutions/bc-obs_dozzle/src/**"
      - "a_solutions/bc-obs_fluent-bit/src/**"
      - "a_solutions/bc-obs_ntfy/src/**"
      - "a_solutions/ca-dat_redis/src/**"
      - ".github/workflows/ship-gcp-proxy.yml"
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        description: "Ship specific service (leave empty for all changed)"
        required: false
        type: string

concurrency:
  group: ship-gcp-proxy
  cancel-in-progress: false

jobs:
  ship:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changes
        id: changes
        uses: dorny/paths-filter@v3
        if: github.event_name == 'push'
        with:
          filters: |
            caddy:
              - 'a_solutions/bb-sec_caddy/src/**'
            go-api:
              - 'a_solutions/bb-sec_go-api/src/**'
            authelia:
              - 'a_solutions/bb-sec_authelia/src/**'
            flask-api:
              - 'a_solutions/bb-sec_flask-api/src/**'
            vaultwarden:
              - 'a_solutions/ab-mic_vaultwarden/src/**'
            hickory-dns:
              - 'a_solutions/ba-clo_hickory-dns/src/**'
            dozzle:
              - 'a_solutions/bc-obs_dozzle/src/**'
            fluent-bit:
              - 'a_solutions/bc-obs_fluent-bit/src/**'
            ntfy:
              - 'a_solutions/bc-obs_ntfy/src/**'
            redis:
              - 'a_solutions/ca-dat_redis/src/**'

      - name: Force service override
        id: force
        if: github.event_name == 'workflow_dispatch'
        run: |
          svc="${{ inputs.service }}"
          for name in caddy go-api authelia flask-api vaultwarden hickory-dns dozzle fluent-bit ntfy redis; do
            if [ -z "$svc" ] || [ "$svc" = "$name" ]; then
              echo "$name=true" >> "$GITHUB_OUTPUT"
            fi
          done

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-24.11

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.GCP_PROXY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          mkdir -p ~/.ssh/sockets
          cat > ~/.ssh/config <<EOF
          Host gcp-proxy
            HostName ${{ secrets.GCP_PROXY_HOST }}
            User ${{ secrets.GCP_PROXY_USER }}
            IdentityFile ~/.ssh/id_deploy
            StrictHostKeyChecking no
            ServerAliveInterval 30
            ServerAliveCountMax 10
            ControlMaster auto
            ControlPath ~/.ssh/sockets/%r@%h-%p
            ControlPersist 600
          EOF
          chmod 600 ~/.ssh/config

      - name: Setup SOPS age key
        run: |
          mkdir -p ~/.config/sops/age
          echo "${{ secrets.SOPS_AGE_KEY }}" > ~/.config/sops/age/keys.txt
          echo "SOPS_AGE_KEY_FILE=$HOME/.config/sops/age/keys.txt" >> "$GITHUB_ENV"

      - name: Install sops
        run: nix profile install nixpkgs#sops

      - name: Setup Docker Buildx
        if: steps.changes.outputs.caddy == 'true' || steps.force.outputs.caddy == 'true' || steps.changes.outputs.go-api == 'true' || steps.force.outputs.go-api == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.changes.outputs.caddy == 'true' || steps.force.outputs.caddy == 'true' || steps.changes.outputs.go-api == 'true' || steps.force.outputs.go-api == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Ship caddy
        if: steps.changes.outputs.caddy == 'true' || steps.force.outputs.caddy == 'true'
        continue-on-error: true
        run: bash a_solutions/bb-sec_caddy/build.sh ship

      - name: Ship go-api
        if: steps.changes.outputs.go-api == 'true' || steps.force.outputs.go-api == 'true'
        continue-on-error: true
        run: bash a_solutions/bb-sec_go-api/build.sh ship

      - name: Ship authelia
        if: steps.changes.outputs.authelia == 'true' || steps.force.outputs.authelia == 'true'
        continue-on-error: true
        run: bash a_solutions/bb-sec_authelia/build.sh ship

      - name: Ship flask-api
        if: steps.changes.outputs.flask-api == 'true' || steps.force.outputs.flask-api == 'true'
        continue-on-error: true
        run: bash a_solutions/bb-sec_flask-api/build.sh ship

      - name: Ship vaultwarden
        if: steps.changes.outputs.vaultwarden == 'true' || steps.force.outputs.vaultwarden == 'true'
        continue-on-error: true
        run: bash a_solutions/ab-mic_vaultwarden/build.sh ship

      - name: Ship hickory-dns
        if: steps.changes.outputs.hickory-dns == 'true' || steps.force.outputs.hickory-dns == 'true'
        continue-on-error: true
        run: bash a_solutions/ba-clo_hickory-dns/build.sh ship

      - name: Ship dozzle
        if: steps.changes.outputs.dozzle == 'true' || steps.force.outputs.dozzle == 'true'
        continue-on-error: true
        run: bash a_solutions/bc-obs_dozzle/build.sh ship

      - name: Ship fluent-bit
        if: steps.changes.outputs.fluent-bit == 'true' || steps.force.outputs.fluent-bit == 'true'
        continue-on-error: true
        run: bash a_solutions/bc-obs_fluent-bit/build.sh ship

      - name: Ship ntfy
        if: steps.changes.outputs.ntfy == 'true' || steps.force.outputs.ntfy == 'true'
        continue-on-error: true
        run: bash a_solutions/bc-obs_ntfy/build.sh ship

      - name: Ship redis
        if: steps.changes.outputs.redis == 'true' || steps.force.outputs.redis == 'true'
        continue-on-error: true
        run: bash a_solutions/ca-dat_redis/build.sh ship
