name: "Ship → gcp-proxy"

on:
  push:
    paths:
      - "a_solutions/bb-sec_caddy-l4-image/src/**"
      - "a_solutions/bb-sec_caddy/src/**"
      - "a_solutions/bb-sec_authelia/src/**"
      - "a_solutions/ab-mic_vaultwarden/src/**"
      - "a_solutions/ba-clo_hickory-dns/src/**"
      - "a_solutions/bc-obs_dozzle/src/**"
      - "a_solutions/bc-obs_fluent-bit/src/**"
      - "a_solutions/bc-obs_ntfy/src/**"
      - "a_solutions/ca-dat_redis/src/**"
      - ".github/workflows/ship-gcp-proxy.yml"
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        description: "Ship specific service (leave empty for all changed)"
        required: false
        type: string

concurrency:
  group: ship-gcp-proxy
  cancel-in-progress: false

jobs:
  ship:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changes
        id: changes
        uses: dorny/paths-filter@v3
        if: github.event_name == 'push'
        with:
          filters: |
            caddy-l4-image:
              - 'a_solutions/bb-sec_caddy-l4-image/src/**'
            caddy:
              - 'a_solutions/bb-sec_caddy/src/**'
            authelia:
              - 'a_solutions/bb-sec_authelia/src/**'
            vaultwarden:
              - 'a_solutions/ab-mic_vaultwarden/src/**'
            hickory-dns:
              - 'a_solutions/ba-clo_hickory-dns/src/**'
            dozzle:
              - 'a_solutions/bc-obs_dozzle/src/**'
            fluent-bit:
              - 'a_solutions/bc-obs_fluent-bit/src/**'
            ntfy:
              - 'a_solutions/bc-obs_ntfy/src/**'
            redis:
              - 'a_solutions/ca-dat_redis/src/**'

      - name: Force service override
        id: force
        if: github.event_name == 'workflow_dispatch'
        run: |
          svc="${{ inputs.service }}"
          for name in caddy-l4-image caddy authelia vaultwarden hickory-dns dozzle fluent-bit ntfy redis; do
            if [ -z "$svc" ] || [ "$svc" = "$name" ]; then
              echo "$name=true" >> "$GITHUB_OUTPUT"
            fi
          done

      - uses: ./.github/actions/setup-deps
        with:
          ssh_key: ${{ secrets.GCP_PROXY_SSH_KEY }}
          ssh_host: ${{ secrets.GCP_PROXY_HOST }}
          ssh_user: ${{ secrets.GCP_PROXY_USER }}
          ssh_alias: gcp-proxy
          sops_age_key: ${{ secrets.SOPS_AGE_KEY }}

      - name: Setup Docker Buildx
        if: steps.changes.outputs.caddy-l4-image == 'true' || steps.force.outputs.caddy-l4-image == 'true' || steps.changes.outputs.caddy == 'true' || steps.force.outputs.caddy == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.changes.outputs.caddy-l4-image == 'true' || steps.force.outputs.caddy-l4-image == 'true' || steps.changes.outputs.caddy == 'true' || steps.force.outputs.caddy == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build caddy-l4 image
        if: steps.changes.outputs.caddy-l4-image == 'true' || steps.force.outputs.caddy-l4-image == 'true'
        run: bash a_solutions/bb-sec_caddy-l4-image/build.sh docker

      - name: Make caddy-l4 image public
        if: steps.changes.outputs.caddy-l4-image == 'true' || steps.force.outputs.caddy-l4-image == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PUT \
            /user/packages/container/caddy-l4/visibility \
            -f visibility=public 2>/dev/null || echo "Package visibility already set or API unavailable"

      - name: Ship caddy
        if: steps.changes.outputs.caddy == 'true' || steps.force.outputs.caddy == 'true'
        run: bash a_solutions/bb-sec_caddy/build.sh ship

      - name: Ship authelia
        if: steps.changes.outputs.authelia == 'true' || steps.force.outputs.authelia == 'true'
        run: bash a_solutions/bb-sec_authelia/build.sh ship

      - name: Ship vaultwarden
        if: steps.changes.outputs.vaultwarden == 'true' || steps.force.outputs.vaultwarden == 'true'
        run: bash a_solutions/ab-mic_vaultwarden/build.sh ship

      - name: Ship hickory-dns
        if: steps.changes.outputs.hickory-dns == 'true' || steps.force.outputs.hickory-dns == 'true'
        run: bash a_solutions/ba-clo_hickory-dns/build.sh ship

      - name: Ship dozzle
        if: steps.changes.outputs.dozzle == 'true' || steps.force.outputs.dozzle == 'true'
        run: bash a_solutions/bc-obs_dozzle/build.sh ship

      - name: Ship fluent-bit
        if: steps.changes.outputs.fluent-bit == 'true' || steps.force.outputs.fluent-bit == 'true'
        run: bash a_solutions/bc-obs_fluent-bit/build.sh ship

      - name: Ship ntfy
        if: steps.changes.outputs.ntfy == 'true' || steps.force.outputs.ntfy == 'true'
        run: bash a_solutions/bc-obs_ntfy/build.sh ship

      - name: Ship redis
        if: steps.changes.outputs.redis == 'true' || steps.force.outputs.redis == 'true'
        run: bash a_solutions/ca-dat_redis/build.sh ship
