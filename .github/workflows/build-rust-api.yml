name: Build rust-api Docker image

on:
  push:
    paths:
      - "a_solutions/container-nix/bb-sec_rust-api/src/**"
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: diegonmarcos/rust-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: a_solutions/container-nix/bb-sec_rust-api/src/
          file: a_solutions/container-nix/bb-sec_rust-api/src/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to gcp-proxy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.GCP_PROXY_HOST }}
          username: ${{ secrets.GCP_PROXY_USER }}
          key: ${{ secrets.GCP_PROXY_SSH_KEY }}
          script: |
            cd /opt/containers/rust-api
            docker compose pull rust-api
            docker compose up -d --no-deps rust-api
