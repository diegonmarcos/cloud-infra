name: "Setup Dependencies"
description: "Universal dependency setup — pulls cloud-ci image + SSH + SOPS"

inputs:
  ssh_key:
    description: "SSH private key for target VM"
    required: false
  ssh_host:
    description: "SSH host IP/hostname"
    required: false
  ssh_user:
    description: "SSH username"
    required: false
    default: "ubuntu"
  ssh_alias:
    description: "SSH config Host alias (e.g. oci-apps, gcp-proxy)"
    required: false
  sops_age_key:
    description: "SOPS age private key"
    required: false

runs:
  using: "composite"
  steps:
    - name: Install Nix
      uses: cachix/install-nix-action@v30
      with:
        nix_path: nixpkgs=channel:nixos-24.11

    - name: Pull cloud-ci nix store from GHCR
      shell: bash
      run: |
        CI_IMAGE="ghcr.io/diegonmarcos/cloud-ci:latest"
        # Pull the pre-built nix store image
        if docker pull "$CI_IMAGE" 2>/dev/null; then
          CID=$(docker create "$CI_IMAGE" true)
          # Copy node_modules + deps flake (NOT nix store — use image for builds)
          docker cp "$CID:/root/.node_modules" "$HOME/.node_modules" 2>/dev/null || true
          docker cp "$CID:/opt/deps-flake" "$HOME/.deps-flake" 2>/dev/null || true
          docker rm "$CID" >/dev/null
          # Export image name for _engine.sh to use
          echo "CLOUD_CI_IMAGE=$CI_IMAGE" >> "$GITHUB_ENV"
          echo "Pulled cloud-ci image — builds will run inside container"
        else
          echo "::warning::cloud-ci image not available — building deps from scratch"
        fi

    - name: Setup nix develop PATH
      shell: bash
      run: |
        # Add deps devShell tools to PATH
        DEPS_FLAKE="${HOME}/.deps-flake"
        [ ! -d "$DEPS_FLAKE" ] && DEPS_FLAKE="$GITHUB_WORKSPACE/.github"
        if [ -f "$DEPS_FLAKE/flake.nix" ]; then
          nix flake update config-json --flake "$DEPS_FLAKE" 2>/dev/null || true
          for pkg_path in $(nix develop "$DEPS_FLAKE#" --command sh -c 'echo $PATH' | tr ':' '\n' | grep /nix/store); do
            echo "$pkg_path" >> "$GITHUB_PATH"
          done
        fi
        # Add shared node_modules to PATH + NODE_PATH
        if [ -d "$HOME/.node_modules/node_modules" ]; then
          echo "$HOME/.node_modules/node_modules/.bin" >> "$GITHUB_PATH"
          echo "NODE_PATH=$HOME/.node_modules/node_modules" >> "$GITHUB_ENV"
        fi

    - name: Install dependencies via build.sh
      shell: bash
      run: ./build.sh deps

    - name: Setup SSH
      if: inputs.ssh_key != ''
      shell: bash
      run: |
        mkdir -p ~/.ssh/sockets
        chmod 700 ~/.ssh
        echo "${{ inputs.ssh_key }}" > ~/.ssh/id_deploy
        chmod 600 ~/.ssh/id_deploy
        cat > ~/.ssh/config <<EOF
        Host ${{ inputs.ssh_alias }}
          HostName ${{ inputs.ssh_host }}
          User ${{ inputs.ssh_user }}
          IdentityFile ~/.ssh/id_deploy
          StrictHostKeyChecking no
          ServerAliveInterval 30
          ServerAliveCountMax 10
          ControlMaster auto
          ControlPath ~/.ssh/sockets/%r@%h-%p
          ControlPersist 600
        EOF
        chmod 600 ~/.ssh/config

    - name: Setup SOPS age key
      if: inputs.sops_age_key != ''
      shell: bash
      run: |
        mkdir -p ~/.config/sops/age
        echo "${{ inputs.sops_age_key }}" > ~/.config/sops/age/keys.txt
        echo "SOPS_AGE_KEY_FILE=$HOME/.config/sops/age/keys.txt" >> "$GITHUB_ENV"
