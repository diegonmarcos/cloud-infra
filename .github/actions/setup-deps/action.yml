name: "Setup Dependencies"
description: "Universal dependency setup — reads deps.json from repo root"

inputs:
  ssh_key:
    description: "SSH private key for target VM"
    required: false
  ssh_host:
    description: "SSH host IP/hostname"
    required: false
  ssh_user:
    description: "SSH username"
    required: false
    default: "ubuntu"
  ssh_alias:
    description: "SSH config Host alias (e.g. oci-apps, gcp-proxy)"
    required: false
  sops_age_key:
    description: "SOPS age private key"
    required: false

runs:
  using: "composite"
  steps:
    - name: Read nix channel from deps.json
      id: deps
      shell: bash
      run: |
        echo "nix_channel=$(jq -r '.gha.nix_channel' "$GITHUB_WORKSPACE/deps.json")" >> "$GITHUB_OUTPUT"

    - name: Install Nix
      uses: cachix/install-nix-action@v30
      with:
        nix_path: nixpkgs=channel:${{ steps.deps.outputs.nix_channel }}

    - name: Install dependencies via build.sh
      shell: bash
      run: ./build.sh deps

    - name: Setup SSH
      if: inputs.ssh_key != ''
      shell: bash
      run: |
        mkdir -p ~/.ssh/sockets
        chmod 700 ~/.ssh
        echo "${{ inputs.ssh_key }}" > ~/.ssh/id_deploy
        chmod 600 ~/.ssh/id_deploy
        cat > ~/.ssh/config <<EOF
        Host ${{ inputs.ssh_alias }}
          HostName ${{ inputs.ssh_host }}
          User ${{ inputs.ssh_user }}
          IdentityFile ~/.ssh/id_deploy
          StrictHostKeyChecking no
          ServerAliveInterval 30
          ServerAliveCountMax 10
          ControlMaster auto
          ControlPath ~/.ssh/sockets/%r@%h-%p
          ControlPersist 600
        EOF
        chmod 600 ~/.ssh/config

    - name: Setup SOPS age key
      if: inputs.sops_age_key != ''
      shell: bash
      run: |
        mkdir -p ~/.config/sops/age
        echo "${{ inputs.sops_age_key }}" > ~/.config/sops/age/keys.txt
        echo "SOPS_AGE_KEY_FILE=$HOME/.config/sops/age/keys.txt" >> "$GITHUB_ENV"
