name: "Setup Dependencies"
description: "Universal dependency setup — nix flake + cache + SSH + SOPS"

inputs:
  ssh_key:
    description: "SSH private key for target VM"
    required: false
  ssh_host:
    description: "SSH host IP/hostname"
    required: false
  ssh_user:
    description: "SSH username"
    required: false
    default: "ubuntu"
  ssh_alias:
    description: "SSH config Host alias (e.g. oci-apps, gcp-proxy)"
    required: false
  sops_age_key:
    description: "SOPS age private key"
    required: false

runs:
  using: "composite"
  steps:
    - name: Read nix channel from config.json
      id: deps
      shell: bash
      run: |
        echo "nix_channel=$(jq -r '.deps.gha.nix_channel' "$GITHUB_WORKSPACE/config.json")" >> "$GITHUB_OUTPUT"

    - name: Install Nix
      uses: cachix/install-nix-action@v30
      with:
        nix_path: nixpkgs=channel:${{ steps.deps.outputs.nix_channel }}

    - name: Cache nix store
      uses: nix-community/cache-nix-action@v6
      with:
        # Cache = Layer 1 (deps only). Key only hashes the GHA flake.lock (deps).
        # Service flake.lock changes don't bust cache — deps are shared.
        # Prefix fallback is safe because Layer 2 (outputs) is GC'd after restore.
        primary-key: nix-deps-${{ runner.os }}-${{ hashFiles('.github/flake.lock') }}
        restore-prefixes-first-match: nix-deps-${{ runner.os }}-
        gc-max-store-size-linux: 2G
        purge: true
        purge-created: 604800
        purge-primary-key: never
        purge-prefixes: nix-${{ runner.os }}-

    - name: GC stale build outputs (keep deps only)
      shell: bash
      run: |
        # Layer 2 eviction: remove all GC roots except profiles and gha-devshell.
        # This makes build outputs (docker-compose.yml, configs) unreferenced.
        # GC collects them. Deps (Layer 1) survive via gha-devshell root + profiles.
        find /nix/var/nix/gcroots/auto -type l 2>/dev/null | while read root; do
          target=$(readlink "$root" 2>/dev/null || true)
          case "$target" in
            */profiles/*|*/per-user/*|*gha-devshell*) ;;  # keep Layer 1 roots
            *) rm -f "$root" 2>/dev/null || true ;;
          esac
        done
        nix-store --gc 2>/dev/null || true

    - name: Build Layer 1 (deps devShell) + add to PATH
      shell: bash
      run: |
        if [ -f "$GITHUB_WORKSPACE/.github/flake.nix" ]; then
          # Build dev shell as a GC root — survives cache GC, gets cached for next run
          nix build "$GITHUB_WORKSPACE/.github#devShells.x86_64-linux.default.inputDerivation" \
            --out-link /nix/var/nix/gcroots/gha-devshell
          # Add all nix store paths from the dev shell to $PATH
          for pkg_path in $(nix develop "$GITHUB_WORKSPACE/.github#" --command sh -c 'echo $PATH' | tr ':' '\n' | grep /nix/store); do
            echo "$pkg_path" >> "$GITHUB_PATH"
          done
        fi

    - name: Install dependencies via build.sh
      shell: bash
      run: ./build.sh deps

    - name: Setup SSH
      if: inputs.ssh_key != ''
      shell: bash
      run: |
        mkdir -p ~/.ssh/sockets
        chmod 700 ~/.ssh
        echo "${{ inputs.ssh_key }}" > ~/.ssh/id_deploy
        chmod 600 ~/.ssh/id_deploy
        cat > ~/.ssh/config <<EOF
        Host ${{ inputs.ssh_alias }}
          HostName ${{ inputs.ssh_host }}
          User ${{ inputs.ssh_user }}
          IdentityFile ~/.ssh/id_deploy
          StrictHostKeyChecking no
          ServerAliveInterval 30
          ServerAliveCountMax 10
          ControlMaster auto
          ControlPath ~/.ssh/sockets/%r@%h-%p
          ControlPersist 600
        EOF
        chmod 600 ~/.ssh/config

    - name: Setup SOPS age key
      if: inputs.sops_age_key != ''
      shell: bash
      run: |
        mkdir -p ~/.config/sops/age
        echo "${{ inputs.sops_age_key }}" > ~/.config/sops/age/keys.txt
        echo "SOPS_AGE_KEY_FILE=$HOME/.config/sops/age/keys.txt" >> "$GITHUB_ENV"
