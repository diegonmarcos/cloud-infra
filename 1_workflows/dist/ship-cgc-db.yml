name: "cgc-db (octocode incremental update → GHCR → oci-apps)"

on:
  workflow_dispatch: {}
  schedule:
    # Mirrors runtime.octocode.update.schedule in build.json.
    # 02:23 UTC = 04:23 Madrid (CEST, UTC+2 in summer).
    - cron: "23 2 * * *"
    # Second daily update: 01:30 UTC = 03:30 Madrid (CEST).
    - cron: "30 1 * * *"

# Serialise so concurrent Ship workflows don't race on shared resources.
concurrency:
  group: ship-wg-runner
  cancel-in-progress: false

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_ACTOR: ${{ github.actor }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  WG_PRIVATE_KEY: ${{ secrets.WG_PRIVATE_KEY }}
  OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}

jobs:
  update-db:
    name: "cgc-db · index all repos + propagate"
    runs-on: [self-hosted, linux, arm64, oci-apps]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: WireGuard up
        continue-on-error: true
        run: bash 1_workflows/src/scripts/cloud-ship-ci-setup-wireguard.sh
      - name: Provision SSH key for propagation
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$OCI_SSH_KEY" > ~/.ssh/cgc_deploy && chmod 600 ~/.ssh/cgc_deploy
      - name: cgc-db incremental update + propagate
        env:
          CGC_SSH_OPTS: "-i $HOME/.ssh/cgc_deploy -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
        run: sh 1_workflows/src/scripts/cloud-cgc-db-update.sh
