# ┌──────────────────────────────────────────────────────────────┐
# │  cloud-cgc octocode DB — INCREMENTAL update → GHCR          │
# │  → PROPAGATE to the deployed oci-apps server.               │
# │                                                              │
# │  Runs on GitHub-hosted ubuntu-latest x86 runner (~14GB disk).│
# │  Using x86 avoids oci-apps disk pressure (disk full).        │
# │  The octocode DB (FastEmbed vectors + graph) is arch-portable│
# │  so an x86 index is consumed by arm oci-apps cgc-mcp fine.   │
# │  Runner SSHes into oci-apps over WireGuard to propagate.     │
# │                                                              │
# │  ALL business logic lives in cloud-cgc-db-update.sh — ZERO  │
# │  logic here.                                                 │
# └──────────────────────────────────────────────────────────────┘

name: "cgc-db (octocode incremental update → GHCR → oci-apps)"

on:
  workflow_dispatch: {}
  # Schedule is data-driven from build.json runtime.octocode.update.schedule.
  # Twice daily (4:00 and 16:00 UTC): keeps the graph current with minimal runner load.
  # The job is change-gated per repo (skips repos whose HEAD is already indexed)
  # so unchanged repos cost seconds, not hours.
  schedule:
    - cron: "0 4,16 * * *"

# Serialise so concurrent Ship workflows don't race on shared resources.
concurrency:
  group: ship-wg-runner
  cancel-in-progress: false

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_ACTOR: ${{ github.actor }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  WG_PRIVATE_KEY: ${{ secrets.WG_PRIVATE_KEY }}
  WG_HUB_PUBKEY: ${{ vars.WG_HUB_PUBKEY }}
  OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}

jobs:
  update-db:
    name: "cgc-db · index all repos + propagate"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: WireGuard up
        continue-on-error: true
        run: bash 1_workflows/src/scripts/cloud-ship-ci-setup-wireguard.sh
      - name: Provision SSH key for propagation
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$OCI_SSH_KEY" > ~/.ssh/cgc_deploy && chmod 600 ~/.ssh/cgc_deploy
      - name: cgc-db incremental update + propagate
        env:
          CGC_SSH_OPTS: "-i $HOME/.ssh/cgc_deploy -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
        run: sh 1_workflows/src/scripts/cloud-cgc-db-update.sh
