name: "Ship → CI image"

on:
  push:
    paths:
      - "1_workflows/src/cicd/ship-ci-image.yml"
      - "config.json"
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-image-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout cloud (config.json)
        uses: actions/checkout@v4

      - name: Checkout unix (Dockerfile source)
        uses: actions/checkout@v4
        with:
          repository: diegonmarcos/unix
          path: unix-repo

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Ship cloud-builder-x-deb-nixhm image
        run: |
          CLOUD_CONFIG="$GITHUB_WORKSPACE/config.json" \
          cd unix-repo/cb_containers-builders && sh build.sh ship cloud-builder-x-deb-nixhm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
