# │  cloud-cgc kg-store ingest — GHA → SSH → oci-apps (workflow b)│
# │                                                              │
# │  Same ingest as ship-cgc-kg-store.yml (workflow a) but runs   │
# │  on a GHA cloud runner (ubuntu-latest) and reaches the       │
# │  cloud-cgc-mcp container + SurrealDB on oci-apps over SSH     │
# │  (WireGuard mesh). Use this when the oci-apps self-hosted     │
# │  runner is unavailable, or to trigger from GHA without it.   │
# │                                                              │
# │  ZERO logic here: reads build.json on the GHA runner, passes  │
# │  CONTAINER + REPOS as env to the SSH command, and STREAMS    │
# │  cloud-cgc-kg-ingest.sh to oci-apps via `sh -s` (the same     │
# │  streaming pattern cloud-cgc-db-update.sh uses for restore).  │
# │  The script runs remotely on oci-apps and does `docker exec`.│
# └──────────────────────────────────────────────────────────────┘

name: "cgc-kg-store (GHA → SSH → oci-apps → SurrealDB)"

on:
  workflow_dispatch: {}

concurrency:
  group: ship-wg-runner
  cancel-in-progress: false

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_ACTOR: ${{ github.actor }}
  WG_PRIVATE_KEY: ${{ secrets.WG_PRIVATE_KEY }}
  OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}

jobs:
  kg-store-ingest-ssh:
    name: "kg-store · mirror octocode → SurrealDB (SSH)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install runtime deps (wireguard-tools, jq)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq wireguard-tools jq

      - name: WireGuard up
        run: bash 1_workflows/src/scripts/cloud-ship-ci-setup-wireguard.sh

      - name: Provision SSH key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$OCI_SSH_KEY" > ~/.ssh/cgc_deploy && chmod 600 ~/.ssh/cgc_deploy

      - name: Read build.json + stream kg-ingest.sh to oci-apps
        env:
          CGC_SSH_OPTS: "-i /home/runner/.ssh/cgc_deploy -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          BJ: a_solutions/user-ai_cloud-cgc-mcp/build.json
        run: |
          # Resolve the SSH target (user@wg_ip) from build-gha.json — same as the seed.
          GHA="2_configs/dist/build-gha.json"
          HOST=$(jq -r '.db_publish.host // "oci-apps"' "$BJ")
          TARGET="$HOST"
          if [ -f "$GHA" ]; then
            WGIP=$(jq -r --arg h "$HOST" '.vms[$h].wg_ip // empty'  "$GHA" 2>/dev/null)
            SUSER=$(jq -r --arg h "$HOST" '.vms[$h].user // "ubuntu"' "$GHA" 2>/dev/null)
            [ -n "$WGIP" ] && TARGET="$SUSER@$WGIP"
          fi
          # Read container name + repo list from build.json (available on the GHA runner's
          # checkout) and pass them as env to the streamed script (oci-apps has no checkout).
          MCP_CONTAINER=$(jq -r '.containers.app.container_name' "$BJ")
          OCTOCODE_REPOS=$(jq -r '.runtime.octocode.index_repos | join(" ")' "$BJ")
          NTFY_URL="http://10.0.0.6:8090"
          echo "[kg-store-ssh] target=$TARGET container=$MCP_CONTAINER repos=[$OCTOCODE_REPOS]"
          # shellcheck disable=SC2086
          ssh $CGC_SSH_OPTS "$TARGET" \
              "MCP_CONTAINER='$MCP_CONTAINER' OCTOCODE_REPOS='$OCTOCODE_REPOS' NTFY_URL='$NTFY_URL' sh -s" \
            < 1_workflows/src/scripts/cloud-cgc-kg-ingest.sh
