name: "Ship → terraform"

on:
  push:
    paths:
      - "c_vps/ba-clo_cloudflare/src/**"
      - "c_vps/vps_gcloud/src/**"
      - "c_vps/vps_oci/src/**"
      - "c_vps/vps_hetzner/src/**"
      - "a_solutions/ba-clo_cloudflare-worker/src/**"
      - "1_workflows/src/cicd/ship-terraform.yml"
    branches: [main]
  workflow_dispatch:
    inputs:
      project:
        description: "Target project (cloudflare, gcloud, oci, hetzner, cf-worker, or empty for all changed)"
        required: false
        type: string

concurrency:
  group: terraform
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 2

      - name: Update submodules
        run: git submodule update --remote

      # 2_configs/build.sh self-bootstraps tsx + yaml + nunjucks if missing.
      - name: Regenerate dist/ from build.json sources
        run: bash 2_configs/build.sh all

      - name: Detect changes
        id: changes
        uses: dorny/paths-filter@v3
        if: github.event_name == 'push'
        with:
          filters: |
            cloudflare:
              - 'c_vps/ba-clo_cloudflare/src/**'
            gcloud:
              - 'c_vps/vps_gcloud/src/**'
            oci:
              - 'c_vps/vps_oci/src/**'
            hetzner:
              - 'c_vps/vps_hetzner/src/**'
            cf-worker:
              - 'a_solutions/ba-clo_cloudflare-worker/src/**'

      # Vault clone — provides ~/git/vault/vault-keys-docker.envfile that
      # cloud-builder's compose.yaml references via env_file:. Without it,
      # `docker compose run cloud-builder` aborts: "env file ... not found".
      - name: Fetch vault
        uses: ./.github/actions/fetch-vault
        with:
          vault_deploy_key: ${{ secrets.VAULT_DEPLOY_KEY }}

      # GCP auth — writes a service-account JSON to $GOOGLE_APPLICATION_CREDENTIALS
      # on the runner. Mounted into cloud-builder below at a stable path.
      - name: Authenticate GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          create_credentials_file: true

      - name: Run terraform inside cloud-builder
        env:
          INPUT_PROJECT: ${{ inputs.project }}
          EVENT_NAME: ${{ github.event_name }}
          CHANGES_CLOUDFLARE: ${{ steps.changes.outputs.cloudflare }}
          CHANGES_GCLOUD: ${{ steps.changes.outputs.gcloud }}
          CHANGES_OCI: ${{ steps.changes.outputs.oci }}
          CHANGES_HETZNER: ${{ steps.changes.outputs.hetzner }}
          CHANGES_CF_WORKER: ${{ steps.changes.outputs.cf-worker }}
          # TF_VAR_* — terraform variable passthrough.
          # Phase 1: still per-secret. Phase 2 (PREVIEW migration): move all
          # of these to vault and source them via vault-keys-bash.env.
          TF_VAR_cloudflare_api_key: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          TF_VAR_ssh_public_key: ${{ secrets.GCP_SSH_PUBLIC_KEY }}
          TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          TF_VAR_compartment_ocid: ${{ secrets.OCI_COMPARTMENT_OCID }}
          TF_VAR_region: ${{ secrets.OCI_REGION }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          TF_VAR_hcloud_token: ${{ secrets.HETZNER_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -eu
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          IMAGE="ghcr.io/diegonmarcos/cloud-builder-x-deb-nixhm:latest"
          docker pull "$IMAGE"
          # Pull the canonical compose.yaml from the image, then run terraform
          # inside it. Engine script (cloud-ship-terraform-deploy-apply.sh) is
          # the universal engine — same script runs locally + in CI.
          docker run --rm "$IMAGE" cat /opt/cloud-builder/compose.yaml > /tmp/cb.yaml
          docker compose -f /tmp/cb.yaml run --rm \
            --cap-add NET_ADMIN \
            -v "$HOME/git/vault:/root/git/vault:ro" \
            -v "$GITHUB_WORKSPACE:/root/git/cloud-gha" \
            -v "$GOOGLE_APPLICATION_CREDENTIALS:/tmp/gcp-sa.json:ro" \
            -e GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-sa.json \
            -e INPUT_PROJECT \
            -e EVENT_NAME \
            -e CHANGES_CLOUDFLARE -e CHANGES_GCLOUD -e CHANGES_OCI -e CHANGES_HETZNER -e CHANGES_CF_WORKER \
            -e TF_VAR_cloudflare_api_key -e CLOUDFLARE_API_KEY -e CLOUDFLARE_EMAIL \
            -e TF_VAR_ssh_public_key \
            -e TF_VAR_tenancy_ocid -e TF_VAR_compartment_ocid -e TF_VAR_region \
            -e OCI_TENANCY_OCID -e OCI_USER_OCID -e OCI_FINGERPRINT -e OCI_PRIVATE_KEY -e OCI_REGION \
            -e TF_VAR_hcloud_token \
            cloud-builder \
            sh -c "cd /root/git/cloud-gha && bash 1_workflows/dist/scripts/cloud-ship-terraform-deploy-apply.sh"
