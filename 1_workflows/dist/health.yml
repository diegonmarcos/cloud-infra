# ┌──────────────────────────────────────────────────────────────┐
# │  Health — single consolidated health check                  │
# │                                                            │
# │  Replaces: health-http-public, health-http-private,        │
# │            health_mail_full, health-all-vms, health (VMs)  │
# │                                                            │
# │  Runs inside cloud-builder container on GHA runner.        │
# │  Script: 1_workflows/src/scripts/health-full.sh              │
# └──────────────────────────────────────────────────────────────┘

name: "Health"

on:
  workflow_run:
    workflows: ["Ship"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: health
  cancel-in-progress: true

jobs:
  health:
    name: "Full health check"
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Update submodules
        run: git submodule update --remote

      - uses: ./.github/actions/setup-deps
        with:
          sops_age_key: ${{ secrets.SOPS_AGE_KEY }}
          wg_private_key: ${{ secrets.WG_PRIVATE_KEY }}

      - name: Wait for containers to settle
        if: github.event_name != 'workflow_dispatch'
        run: sleep 300

      - name: Run health check
        shell: bash {0}
        env:
          OIDC_TOKEN: ${{ secrets.AUTHELIA_OIDC_BEARER_TOKEN }}
        run: |
          docker run --rm "$CLOUD_CI_IMAGE" cat /opt/cloud-builder/compose.yaml > /tmp/cloud-builder-compose.yaml
          docker compose -f /tmp/cloud-builder-compose.yaml run --rm \
            -e OIDC_TOKEN="$OIDC_TOKEN" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            cloud-builder health
