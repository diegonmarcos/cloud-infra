name: lint-secrets-coverage
on:
  pull_request:
    paths:
      - 'a_solutions/**/secrets*.yaml'
      - 'a_solutions/**/templates/*.tpl'
      - 'a_solutions/**/templates/*.sh.tpl'
      - 'a_solutions/**/code/**/*.sh'
      - 'a_solutions/**/dags/*.yaml'
      - 'a_solutions/**/compose.nix'
      - 'b_infra/**/secrets*.yaml'
      - 'c_vps/**/secrets*.yaml'
      - 'III_unix/**/secrets*.yaml'
      - '1_workflows/src/scripts/audit-credentials-coverage.sh'
      - '1_workflows/src/scripts/lint-secrets-coverage.sh'
      - '1_workflows/src/scripts/cloud-ship-container-step-verify-secret-consumption.sh'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install sops + jq
        run: |
          set -euo pipefail
          curl -fsSL -o sops https://github.com/getsops/sops/releases/download/v3.9.4/sops-v3.9.4.linux.amd64
          chmod +x sops && sudo mv sops /usr/local/bin/
          sudo apt-get update -qq && sudo apt-get install -qq -y jq

      - name: Write SOPS age key from secret
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/sops/age"
          printf '%s' "$SOPS_AGE_KEY" > "$HOME/.config/sops/age/keys.txt"
          chmod 600 "$HOME/.config/sops/age/keys.txt"

      - name: Run coverage lint
        run: bash 1_workflows/src/scripts/lint-secrets-coverage.sh

      # Verify secret consumption: scans every service for forbidden patterns
      # (sed/awk/eval/argv/host-mount on secret material). Warn-mode during
      # repo-wide migration; flips to fail-mode in Phase 8 of the redesign.
      - name: Verify secret consumption (warn-mode)
        run: bash 1_workflows/src/scripts/cloud-ship-container-step-verify-secret-consumption.sh --warn
