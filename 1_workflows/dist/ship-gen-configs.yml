name: "Ship → gen-configs (cloud-data)"

on:
  push:
    branches: [main]
    paths:
      - "a_solutions/*/build.json"
      - "config.json"
      - "c_vps/ba-clo_cloudflare/src/main.tf"
      - "c_vps/vps_*/src/main.tf"
      - "b_infra/home-manager/**/src/*.nix"
      - "a_solutions/bb-sec_caddy/src/**"
      - "a_solutions/bb-sec_authelia/src/**"
      - "a_solutions/ba-clo_hickory-dns/src/**"
      - "a_solutions/bc-obs_c3-infra-mcp/src/engines/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gen-configs
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - name: Generate inside cloud-builder
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          CLOUD_DATA_DEPLOY_KEY: ${{ secrets.CLOUD_DATA_DEPLOY_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTIONS: true
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMAGE="ghcr.io/diegonmarcos/cloud-builder-x-deb-nixhm:latest"
          docker pull "$IMAGE"
          docker run --rm "$IMAGE" cat /opt/cloud-builder/compose.yaml > /tmp/cloud-builder-compose.yaml
          docker compose -f /tmp/cloud-builder-compose.yaml run --rm \
            -e CLOUD_DATA_DEPLOY_KEY \
            cloud-builder gen-configs
