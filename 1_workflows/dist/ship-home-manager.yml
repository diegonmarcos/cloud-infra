name: "Ship → home-manager"

on:
  push:
    paths:
      - "b_infra/home-manager/**"
    branches: [main]
  workflow_dispatch:
    inputs:
      vm:
        description: "Target VM (e.g. gcp-proxy, oci-apps) or empty for all"
        required: false
        type: string

concurrency:
  group: home-manager-deploy
  cancel-in-progress: false

jobs:
  deploy:
    strategy:
      fail-fast: false
      matrix:
        vm: [gcp-proxy, gcp-t4, oci-mail, oci-analytics, oci-apps]
    runs-on: ubuntu-latest
    name: ${{ matrix.vm }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Gate
        id: gate
        run: |
          TARGET="${{ inputs.vm }}"
          VM="${{ matrix.vm }}"
          if [ -n "$TARGET" ] && [ "$TARGET" != "$VM" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          submodules: true

      - name: Ship
        if: steps.gate.outputs.skip != 'true'
        env:
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          GCP_PROXY_SSH_KEY: ${{ secrets.GCP_PROXY_SSH_KEY }}
          GCP_T4_SSH_KEY: ${{ secrets.GCP_T4_SSH_KEY }}
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          WG_PRIVATE_KEY: ${{ secrets.WG_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_ACTIONS: true
          GITHUB_REPOSITORY: diegonmarcos/cloud
          GITHUB_SHA: ${{ github.sha }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          IMAGE="ghcr.io/diegonmarcos/cloud-builder-x-deb-nixhm:latest"
          docker pull "$IMAGE"
          # Write secrets to runner fs — compose mounts ~/.ssh and ~/.config/sops as :ro
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$OCI_SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null || true
          mkdir -p ~/.config/sops/age
          echo "$SOPS_AGE_KEY" > ~/.config/sops/age/keys.txt
          # Run — --cap-add NET_ADMIN bootstraps wg-quick inside the container
          # until new cloud-builder images ship with cap_add baked in compose.yaml.
          docker run --rm "$IMAGE" cat /opt/cloud-builder/compose.yaml > /tmp/cloud-builder-compose.yaml
          docker compose -f /tmp/cloud-builder-compose.yaml run --rm \
            --cap-add NET_ADMIN \
            -e VM="${{ matrix.vm }}" \
            cloud-builder ship-hm ${{ matrix.vm }}
