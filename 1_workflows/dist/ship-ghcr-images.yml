name: "Ship → GHCR images"

on:
  push:
    paths:
      - "a_solutions/aa-sui_google-workspace-mcp/src/**"
      - "a_solutions/aa-sui_mail-mcp/src/**"
      - "a_solutions/aa-sui_mattermost-mcp/src/**"
      - "a_solutions/bb-sec_introspect-proxy/src/**"
      - "a_solutions/bc-obs_c3-infra-mcp/src/**"
      - "a_solutions/bc-obs_c3-infra-api/src/**"
      - "a_solutions/bc-obs_c3-services-mcp/src/**"
      - "a_solutions/bc-obs_c3-services-api/src/**"
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  preflight-symlinks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Fail on broken symlinks in build contexts
        run: |
          set -e
          # Skip dist/ and build outputs — they can legitimately hold
          # machine-local symlinks that don't affect the docker build context.
          broken=$(find a_solutions -xtype l \
            -not -path "*/.git/*" \
            -not -path "*/dist/*" \
            -not -path "*/target/*" \
            -not -path "*/node_modules/*" \
            -not -path "*/z_archive/*" 2>/dev/null || true)
          if [ -n "$broken" ]; then
            echo "::error::Broken symlinks found in a_solutions/ source:"
            echo "$broken"
            exit 1
          fi
          echo "No broken symlinks in a_solutions/ source tree."
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Phase 0 — dispatch + nix-step hygiene
        run: bash 1_workflows/src/test/test_dispatch_hygiene.sh
      - name: Phase 1 — arch → runner routing
        run: bash 1_workflows/src/test/test_arch_runner_routing.sh
      - name: Phase 2 — step_docker guards (inline skip + rust binary)
        run: bash 1_workflows/src/test/test_step_docker_guards.sh
      - name: Phase 3D — mattermost base image is multi-arch
        run: bash 1_workflows/src/test/test_mattermost_multiarch.sh
      - name: Phase 3E — npm ci services ship a lockfile
        run: bash 1_workflows/src/test/test_npm_lockfile_present.sh
      - name: Phase 4 — build-{container}.json symlinks all resolve
        run: bash 1_workflows/src/test/test_build_container_json_pattern.sh

  build:
    needs: preflight-symlinks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: google-workspace-mcp
            context: a_solutions/aa-sui_google-workspace-mcp/src
            file: a_solutions/aa-sui_google-workspace-mcp/src/Dockerfile
          - name: mail-mcp
            context: a_solutions/aa-sui_mail-mcp/src
            file: a_solutions/aa-sui_mail-mcp/src/Dockerfile
          - name: mattermost-mcp
            context: a_solutions/aa-sui_mattermost-mcp/src
            file: a_solutions/aa-sui_mattermost-mcp/src/Dockerfile
          - name: introspect-proxy
            context: a_solutions/bb-sec_introspect-proxy/src
            file: a_solutions/bb-sec_introspect-proxy/src/Dockerfile
          - name: c3-infra-mcp
            context: a_solutions/bc-obs_c3-infra-mcp/src
            file: a_solutions/bc-obs_c3-infra-mcp/src/Dockerfile
          - name: c3-infra-api
            context: a_solutions/bc-obs_c3-infra-api/src
            file: a_solutions/bc-obs_c3-infra-api/src/Dockerfile
          - name: c3-services-mcp
            context: a_solutions/bc-obs_c3-services-mcp/src
            file: a_solutions/bc-obs_c3-services-mcp/src/Dockerfile
          - name: c3-services-api
            context: a_solutions/bc-obs_c3-services-api/src
            file: a_solutions/bc-obs_c3-services-api/src/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Update submodules
        run: git submodule update --remote

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve symlinks in build context
        run: |
          ctx="${{ matrix.context }}"
          find "$ctx" -maxdepth 1 -type l | while read link; do
            target=$(readlink -f "$link")
            rm "$link"
            cp -r "$target" "$link"
          done

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/diegonmarcos/${{ matrix.name }}:latest
            ghcr.io/diegonmarcos/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
