name: "Ship → gen-configs (cloud-data)"

on:
  push:
    branches: [main]
    paths:
      - "a_solutions/*/build.json"
      - "config.json"
      - "c_vps/ba-clo_cloudflare/src/main.tf"
      - "c_vps/vps_*/src/main.tf"
      - "b_infra/**/src/*.nix"
      - "a_solutions/bb-sec_caddy/src/**"
      - "a_solutions/bb-sec_authelia/src/**"
      - "a_solutions/ba-clo_hickory-dns/src/**"
      - "2_configs/src/**"
      - "2_configs/dist/1_workflows/src/scripts/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gen-configs
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      # Checkout required so the local composite action ./.github/actions/fetch-vault
      # is on disk before we reference it.
      - uses: actions/checkout@v4
        with:
          submodules: true

      # Vault clone — provides ~/git/vault/vault-keys-docker.envfile that
      # cloud-builder's compose.yaml references via env_file:. Without it,
      # `docker compose run cloud-builder` aborts: "env file ... not found".
      - name: Fetch vault
        uses: ./.github/actions/fetch-vault
        with:
          vault_deploy_key: ${{ secrets.VAULT_DEPLOY_KEY }}

      - name: Resolve builder image
        uses: ./.github/actions/resolve-builder-image

      - name: Generate inside cloud-builder
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          CLOUD_DATA_DEPLOY_KEY: ${{ secrets.CLOUD_DATA_DEPLOY_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTIONS: true
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          # BUILDER_IMAGE is exported by ./.github/actions/resolve-builder-image
          # which reads III_unix/cb_containers-builders/build.json (master).
          IMAGE="$BUILDER_IMAGE"
          docker pull "$IMAGE"
          # Write secrets to runner fs — compose mounts :ro
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null || true
          mkdir -p ~/.config/sops/age
          echo "$SOPS_AGE_KEY" > ~/.config/sops/age/keys.txt
          # Run
          # --cap-add NET_ADMIN bootstraps wg-quick inside the container until
          # new cloud-builder images ship with cap_add baked in compose.yaml.
          docker run --rm "$IMAGE" cat /opt/cloud-builder/compose.yaml > /tmp/cloud-builder-compose.yaml
          docker compose -f /tmp/cloud-builder-compose.yaml run --rm \
            --cap-add NET_ADMIN \
            -v "$HOME/git/vault:/root/git/vault:ro" \
            -e CLOUD_DATA_DEPLOY_KEY \
            cloud-builder gen-configs

      # Commit + push the regenerated dist/ back to main.
      #
      # The orchestrator script (1_workflows/src/scripts/cloud-ship-orchestrate-gen-configs.sh)
      # explicitly says "The regenerated files are committed by the standard
      # ci flow (the workflow caller commits + pushes)" — but until this step
      # was added, no such commit happened. dist/ on origin diverged from what
      # the engine actually produces, and downstream ship-home-manager (which
      # checks out workflow_run.head_sha and reads committed dist/ as-is) saw
      # stale data. Newly declared peers — e.g. wg-public clients added via
      # config.json or new vault keys — never propagated to the running VMs.
      #
      # Why this won't infinite-loop:
      #   • commits made with GITHUB_TOKEN do not re-trigger workflows
      #     (documented GitHub Actions anti-loop)
      #   • the commit message carries [skip ci] as belt-and-braces
      #   • a downstream workflow_run consumer (ship-home-manager) still fires
      #     once per parent ship-gen-configs completion, but by that point
      #     origin/main has the fresh dist for its checkout to pull
      - name: Commit regenerated dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # Stage every path the engine writes to. Globs that match no files
          # are silently ignored (|| true on the whole add invocation).
          git add 2_configs/dist/ \
                  b_infra/_shared/vm-pilot/dist/ \
                  b_infra/nixhm-sudo-*/dist/ \
                  a_solutions/*/src/_cloud-data-consolidated.json \
                  a_solutions/*/src/build-*.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "::notice::dist/ unchanged — nothing to commit"
            exit 0
          fi
          # Per-command identity (does NOT pollute .git/config — same pattern
          # adopted in cloud-ship-terraform-deploy-apply.sh after b7ec24e6).
          # Subject-only commit message — keep it on ONE line. A multi-line
          # message inside a YAML run-block scalar requires every line to be
          # indented at the block's base indent; lines at column 1 silently
          # break the YAML and the whole workflow fails to validate.
          git \
            -c user.name="github-actions" \
            -c user.email="actions@github.com" \
            commit -m "ci(gen-configs): refresh dist/ from trigger ${GITHUB_SHA::8} via run ${GITHUB_RUN_ID} [skip ci]"
          git push origin HEAD:main
