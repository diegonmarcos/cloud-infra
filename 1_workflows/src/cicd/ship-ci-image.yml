name: "Ship → CI image"

on:
  push:
    paths:
      - "1_workflows/src/cicd/ship-ci-image.yml"
      - "config.json"
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-image-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true   # cloud-data → cloud-data-runners.json + III_unix → cb_containers-builders/build.json

      # 2_configs/build.sh self-bootstraps tsx + yaml + nunjucks if missing.
      - name: Regenerate dist/ from build.json sources
        run: bash 2_configs/build.sh all

      - name: Resolve builder image
        uses: ./.github/actions/resolve-builder-image

      - name: Checkout unix (Dockerfile + build.sh source)
        uses: actions/checkout@v4
        with:
          repository: diegonmarcos/unix
          path: unix-repo
          token: ${{ secrets.GITHUB_TOKEN }}

      # Vault clone — provides ~/git/vault/vault-keys-docker.envfile that
      # cloud-builder's compose.yaml references via env_file:. Without it,
      # `docker compose run cloud-builder` aborts: "env file ... not found".
      - name: Fetch vault
        uses: ./.github/actions/fetch-vault
        with:
          vault_deploy_key: ${{ secrets.VAULT_DEPLOY_KEY }}

      - name: Ship cloud-builder (native multi-arch via oci-apps)
        env:
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          WG_PRIVATE_KEY: ${{ secrets.WG_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # BUILDER_IMAGE is exported by ./.github/actions/resolve-builder-image
          # which reads III_unix/cb_containers-builders/build.json (master).
          docker pull "$BUILDER_IMAGE"

          # Secrets on runner FS — compose mounts them :ro at /mnt/host-ssh,
          # entrypoint copies into /root/.ssh/ inside the container. Include
          # the Host oci-apps alias so build.sh can `ssh oci-apps` for the
          # arm64 native build (IP derived from cloud-data-gha-config.json).
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$OCI_SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null || true
          # Resolve GHA config — fail loud if missing.
          # Canonical: build-gha.json (generated by 2_configs/build.sh from
          # build.json sources). Legacy cloud-data-gha-config.json was retired
          # 2026-04-27 — removing the silent fallback prevents stale-image
          # divergence (audit P1 #3, 2026-05-05).
          GHA_CFG=""
          for _p in \
              "/app/build-gha.json" \
              "${CLOUD_ROOT:-$PWD}/2_configs/dist/build-gha.json" \
              "${CLOUD_ROOT:-$PWD}/cloud-data/build-gha.json" \
              "${CLOUD_ROOT:-$PWD}/build-gha.json"; do
              [ -f "$_p" ] && { GHA_CFG="$_p"; break; }
          done
          if [ -z "$GHA_CFG" ]; then
              # Last-resort: derive from consolidated cloud-data JSON. This is
              # the supported alternative when build-gha.json hasn't been
              # generated yet (e.g. fresh checkout without 2_configs/build.sh).
              _CONS=""
              for _p in \
                  "/app/_cloud-data-consolidated.json" \
                  "${CLOUD_ROOT:-$PWD}/2_configs/dist/_cloud-data-consolidated.json" \
                  "${CLOUD_ROOT:-$PWD}/cloud-data/_cloud-data-consolidated.json" \
                  "${CLOUD_ROOT:-$PWD}/_cloud-data-consolidated.json"; do
                  [ -f "$_p" ] && { _CONS="$_p"; break; }
              done
              if [ -n "$_CONS" ]; then
                  echo "::warning::build-gha.json not found; deriving from $_CONS — run 2_configs/build.sh to materialise the canonical file."
                  GHA_CFG="${RUNNER_TEMP:-/tmp}/gha-config.json"
                  jq '
                    ._gha as $g
                    | (.vms | to_entries | map({key: .value.ssh_alias, value: .value.wg_ip}) | from_entries) as $alias_to_wg
                    | $g
                    | .vms |= with_entries(.value += {wg_ip: ($alias_to_wg[.key] // null)})
                  ' "$_CONS" > "$GHA_CFG"
              fi
          fi
          [ -n "$GHA_CFG" ] || { echo "::error::build-gha.json not found and no consolidated fallback available — run 2_configs/build.sh" >&2; exit 1; }
          OCI_APPS_IP=$(jq -r '.vms["oci-apps"].wg_ip // .vms["oci-apps"].host' "$GHA_CFG")
          OCI_APPS_USER=$(jq -r '.vms["oci-apps"].user // "ubuntu"' "$GHA_CFG")
          cat > ~/.ssh/config <<EOF
          Host oci-apps
            HostName ${OCI_APPS_IP}
            User ${OCI_APPS_USER}
            IdentityFile /root/.ssh/id_deploy
            StrictHostKeyChecking accept-new
            ServerAliveInterval 30
            ServerAliveCountMax 10
          EOF
          chmod 600 ~/.ssh/config
          mkdir -p ~/.config/sops/age
          echo "$SOPS_AGE_KEY" > ~/.config/sops/age/keys.txt

          # Write the compose.yaml IN THE WORKFLOW (self-contained, does not
          # depend on the baked compose inside the currently-published image —
          # which may predate compose.yaml changes like cap_add: NET_ADMIN).
          # This is the declarative source used for the bootstrap rebuild.
          # Heredoc is unquoted so $BUILDER_IMAGE expands at write time;
          # \${HOME} is escaped so docker-compose itself expands it at run time.
          cat > /tmp/cb.yaml <<YML
          services:
            cloud-builder:
              image: ${BUILDER_IMAGE}
              container_name: cloud-builder-x-ship-ci
              network_mode: host
              cap_add:
                - NET_ADMIN
              volumes:
                - /var/run/docker.sock:/var/run/docker.sock
                - \${HOME}/.ssh:/mnt/host-ssh:ro
                - \${HOME}/.config/sops:/mnt/host-sops:ro
                - \${HOME}/.docker/config.json:/root/.docker/config.json:ro
              environment:
                - GITHUB_TOKEN
                - GITHUB_ACTOR
                - GITHUB_SHA
                - WG_PRIVATE_KEY
                - SOPS_AGE_KEY
          YML

          # Mount cloud + unix repos so entrypoint + build.sh find sources
          # at stable paths. entrypoint.sh runs WG setup, then our sh -c runs
          # build.sh which delegates arm64 → oci-apps (WG-reachable from inside
          # container).
          docker compose -f /tmp/cb.yaml run --rm \
            -v "$GITHUB_WORKSPACE:/root/git/cloud-gha" \
            -v "$GITHUB_WORKSPACE/unix-repo:/root/git/unix-gha" \
            -v "$HOME/git/vault:/root/git/vault:ro" \
            -e CLOUD_DATA_RUNNERS_JSON=/root/git/cloud-gha/2_configs/dist/cloud-data-runners.json \
            -e CLOUD_CONFIG=/root/git/cloud-gha/config.json \
            cloud-builder \
            sh -c "cd /root/git/unix-gha/cb_containers-builders && sh build.sh ship cloud-builder-x-deb-nixhm"
