# ┌──────────────────────────────────────────────────────────────┐
# │  cloud-cgc octocode DB — INCREMENTAL update on x86 → GHCR     │
# │                                                              │
# │  This workflow carries ZERO logic — it only provides the     │
# │  runtime (checkout + secrets) and TRIGGERS the one universal  │
# │  script. ALL routines (octocode install, GHCR auth, fresh    │
# │  repo checkout, incremental index, package, push) live in    │
# │  1_workflows/src/scripts/cloud-cgc-db-update.sh and run       │
# │  identically anywhere (GHA / VM / local).                    │
# └──────────────────────────────────────────────────────────────┘

name: "cgc-db (octocode incremental update → GHCR)"

on:
  workflow_dispatch: {}
  schedule:
    # Mirrors runtime.octocode.update.schedule in build.json.
    - cron: "0 4 * * *"

concurrency:
  group: cgc-db-update
  cancel-in-progress: false

jobs:
  update:
    name: octocode incremental → GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_ACTOR: ${{ github.actor }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4   # only to obtain the script + build.json
      - name: cgc-db incremental update (all logic in the script)
        run: sh 1_workflows/src/scripts/cloud-cgc-db-update.sh
