name: Fetch GitHub repos

# Refreshes 2_configs/src/inputs/github-repos.json — the source of truth for
# WHICH REPOS EXIST.
#
# Why a scheduled fetch-and-commit rather than an API call inside build.sh:
# the consolidator runs offline and reproducibly (same inputs → byte-identical
# output), and every consumer — home-manager, CI, a fresh clone — depends on
# that. Calling GitHub mid-build would make the output depend on network,
# auth, and the moment it ran. Fetching on a schedule and committing the
# result keeps the data real AND the build hermetic.
#
# What this protects against: gitea.mirrors and octocode.repo_map are policy
# declarations. They cannot answer "does this repo exist" — and when a mirror
# pointed at diegonmarcos/front, a repo that has never existed, nothing
# noticed and it silently never synced. buildDatabases now cross-checks every
# declaration against this inventory and reports `_dangling_declarations`.
#
# SCOPE: PUBLIC REPOS ONLY. `cloud` is a public repository, so private repo
# NAMES must never be committed here — that is a disclosure even though no
# secret is involved. This job therefore runs with the repo-scoped
# github.token, which cannot see private repos at all: least privilege is the
# control, and the explicit private-entry check is only a backstop. The
# private half of the inventory is produced where the vault credentials
# already live and committed to the PRIVATE cloud-data submodule as
# I_cloud-data/github-repos-private.json; the consolidator merges it when
# present and builds public-only when it is not.

on:
  schedule:
    - cron: "0 6 * * 1"          # Mondays 06:00 UTC — repo lists move slowly
  workflow_dispatch:
    inputs:
      allow_shrink:
        description: "Permit the inventory to lose repos (only if repos were genuinely deleted)"
        required: false
        default: "false"
  push:
    paths:
      - "1_workflows/src/cicd/fetch-github-repos.yml"
      - ".github/workflows/fetch-github-repos.yml"

permissions:
  contents: write

concurrency:
  group: fetch-github-repos
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Fetch repo inventory
        env:
          # DELIBERATELY the repo-scoped default token, never the vault's.
          # This job writes a file into a PUBLIC repo, so it must not be able
          # to see private repos in the first place — a privileged token here
          # would publish private repo names on the next commit. Least
          # privilege is the control; the guard below is only the backstop.
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          page=1
          echo '[]' > /tmp/acc.json
          while :; do
            curl -sS -H "Authorization: Bearer $GH_TOKEN" \
                 -H "Accept: application/vnd.github+json" \
                 "https://api.github.com/users/$OWNER/repos?per_page=100&type=owner&page=$page" \
                 > /tmp/raw.json
            # An error response is an OBJECT, not an array. Fail on it — an
            # earlier version fell back to a narrower endpoint on error and
            # silently wrote a truncated inventory over a complete one while
            # reporting success. No silent degradation.
            if ! jq -e 'type == "array"' /tmp/raw.json >/dev/null 2>&1; then
              echo "::error::/users/$OWNER/repos did not return a list. Response: $(head -c 300 /tmp/raw.json)"
              exit 1
            fi
            # Backstop: if a privileged token is ever wired in by mistake, fail
            # rather than write private names into this public repo.
            if jq -e '[.[] | select(.private == true)] | length > 0' /tmp/raw.json >/dev/null 2>&1; then
              echo "::error::response contains PRIVATE repos — this file is committed to a PUBLIC repo. Refusing. Use the cloud-data-side job for the private inventory."
              exit 1
            fi
            n=$(jq 'length' /tmp/raw.json)
            jq -s '.[0] + .[1]' /tmp/acc.json /tmp/raw.json > /tmp/acc.next && mv /tmp/acc.next /tmp/acc.json
            [ "$n" -lt 100 ] && break
            page=$((page + 1))
          done

          # Second belt: a token can be valid yet scoped to fewer repos than
          # last time. Never let an inventory shrink silently — losing a repo
          # here turns its declarations into false "dangling" reports
          # downstream. Shrinking requires a human via workflow_dispatch.
          if [ -f 2_configs/src/inputs/github-repos.json ]; then
            before=$(jq '.repos | length' 2_configs/src/inputs/github-repos.json)
            after=$(jq 'length' /tmp/acc.json)
            if [ "$after" -lt "$before" ] && [ "${{ github.event.inputs.allow_shrink }}" != "true" ]; then
              echo "::error::inventory would shrink ${before} -> ${after}. Refusing: this usually means a token scope regression, not deleted repos. Re-run via workflow_dispatch with allow_shrink=true if the loss is real."
              jq -r --slurpfile new /tmp/acc.json '.repos[].name' 2_configs/src/inputs/github-repos.json \
                | grep -vxF -f <(jq -r '.[].name' /tmp/acc.json) | sed 's/^/  missing: /' || true
              exit 1
            fi
          fi

          # Sorted by pushed_at desc so the diff is stable run to run.
          jq --arg owner "$OWNER" --arg now "$(date -u +%FT%TZ)" '{
            _warning: "FETCHED DATA — do not hand-edit. Refreshed by .github/workflows/fetch-github-repos.yml using the repo-scoped github.token, which by construction can only see PUBLIC repos.",
            _doc: "PUBLIC repo inventory only. `cloud` is a public repository, so private repo NAMES must never be committed here — the private half lives in the private cloud-data submodule (I_cloud-data/github-repos-private.json). The consolidator merges the two when the private submodule is present and degrades to public-only when it is not.",
            _source: "GitHub API (public)",
            visibility_scope: "public-only",
            fetched_at: $now,
            owner: $owner,
            repos: ([.[] | {name: .name, visibility: (.visibility // (if .private then "private" else "public" end)), fork: .fork, pushed_at: .pushed_at}] | sort_by(.pushed_at) | reverse)
          }' /tmp/acc.json > 2_configs/src/inputs/github-repos.json

          echo "repos: $(jq '.repos | length' 2_configs/src/inputs/github-repos.json)"

      - name: Commit if changed
        run: |
          set -euo pipefail
          # fetched_at always moves; only commit when the repo LIST changed,
          # otherwise this would push a no-op commit every single week.
          if git diff --quiet -- 2_configs/src/inputs/github-repos.json; then
            echo "no change"; exit 0
          fi
          if [ -z "$(git diff -- 2_configs/src/inputs/github-repos.json | grep -E '^[+-] +"(name|visibility|fork)"' || true)" ]; then
            echo "only fetched_at/pushed_at moved — skipping commit"
            git checkout -- 2_configs/src/inputs/github-repos.json
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 2_configs/src/inputs/github-repos.json
          git commit -m "chore(configs): refresh GitHub repo inventory"
          git push origin HEAD:main
