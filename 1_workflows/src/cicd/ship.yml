# ┌──────────────────────────────────────────────────────────────┐
# │  Ship services to VMs                                        │
# │                                                              │
# │  Thin GHA wrapper around ship.sh — all logic lives in the    │
# │  POSIX script, making it portable to Dagu, CLI, or any CI.   │
# │                                                              │
# │  Script: 1_workflows/src/scripts/ship.sh                       │
# └──────────────────────────────────────────────────────────────┘

name: Ship

on:
  push:
    paths:
      - "a_solutions/*/src/**"
    branches: [main]
  workflow_dispatch:
    inputs:
      services:
        description: "Comma-separated service dirs (e.g. bb-sec_caddy,bc-obs_ntfy) or 'all'"
        required: false
        default: "all"
      vm:
        description: "Target VM (e.g. gcp-proxy, oci-apps) or 'all'"
        required: false
        default: "all"

jobs:
  # ── Detect which VMs have changed services ──────────────────
  detect:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_vms: ${{ steps.matrix.outputs.has_vms }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: true

      # Always regenerate dist/build-{name}.json + cloud-data-*.json from
      # the latest a_solutions/*/build.json before reading anything from
      # dist/. Cheap (a few seconds), removes drift entirely. Even if a
      # commit lands without dist/ updated, ship still runs against fresh
      # data.
      - name: Regenerate dist/ from build.json sources
        run: bash 2_configs/build.sh config

      - name: Build VM matrix
        id: matrix
        run: |
          # Reuse the portable detect logic from ship.sh
          GHA_CONFIG=""
          for _p in \
              "/app/cloud-data-gha-config.json" \
              "${CLOUD_ROOT:-$PWD}/2_configs/dist/cloud-data-gha-config.json" \
              "${CLOUD_ROOT:-$PWD}/cloud-data/cloud-data-gha-config.json" \
              "${CLOUD_ROOT:-$PWD}/cloud-data-gha-config.json"; do
              [ -f "$_p" ] && { GHA_CONFIG="$_p"; break; }
          done
          [ -n "$GHA_CONFIG" ] || { echo "FATAL: cloud-data-gha-config.json not found" >&2; exit 1; }

          # ── Resolve args from GHA inputs ──
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT_SERVICES="${{ github.event.inputs.services }}"
            INPUT_VM="${{ github.event.inputs.vm }}"
            if [ "$INPUT_SERVICES" = "all" ] && [ "$INPUT_VM" = "all" ]; then
              CHANGED_DIRS=""; VM_FILTER=""
            elif [ "$INPUT_SERVICES" != "all" ]; then
              CHANGED_DIRS=$(printf '%s' "$INPUT_SERVICES" | tr ',' ' '); VM_FILTER=""
            else
              CHANGED_DIRS=""; VM_FILTER="$INPUT_VM"
            fi
          else
            CHANGED_DIRS=$(git diff --name-only HEAD~1 HEAD -- a_solutions/*/src/ \
              | awk -F/ '{print $2}' | sort -u | tr '\n' ' ')
            VM_FILTER=""
            if [ -z "$CHANGED_DIRS" ]; then
              echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
              echo "has_vms=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          # ── Build matrix JSON ──
          MATRIX_JSON=$(jq -c \
            --arg changed "$CHANGED_DIRS" --arg vm_filter "$VM_FILTER" '
            ($changed | split(" ") | map(select(. != ""))) as $cl |
            .services | to_entries | group_by(.value.vm)
            | map({
                vm: .[0].value.vm,
                changed: ([.[] | .value.dir] as $a |
                  if ($cl | length) == 0 then "" else [$cl[] | select(. as $d | $a | any(. == $d))] | join(" ") end)
              })
            | map(select(($vm_filter == "" or .vm == $vm_filter) and (($cl | length) == 0 or (.changed | length) > 0)))
            | map({vm: .vm, changed_dirs: .changed})
          ' "$GHA_CONFIG")

          echo "matrix={\"include\":$MATRIX_JSON}" >> "$GITHUB_OUTPUT"
          COUNT=$(printf '%s' "$MATRIX_JSON" | jq 'length')
          [ "$COUNT" -gt 0 ] && echo "has_vms=true" >> "$GITHUB_OUTPUT" || echo "has_vms=false" >> "$GITHUB_OUTPUT"
          echo "VMs: $COUNT — $(printf '%s' "$MATRIX_JSON" | jq -r '.[].vm' | tr '\n' ' ')"

  # ── Ship: one matrix job per VM, calls ship.sh per-VM path ──
  ship:
    name: "Ship → ${{ matrix.vm }}"
    needs: detect
    if: needs.detect.outputs.has_vms == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
      fail-fast: false
      max-parallel: 5
    concurrency:
      group: ship-${{ matrix.vm }}
      cancel-in-progress: false
    env:
      OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
      GCP_PROXY_SSH_KEY: ${{ secrets.GCP_PROXY_SSH_KEY }}
      GCP_PROXY_HOST: ${{ secrets.GCP_PROXY_HOST }}
      GCP_PROXY_USER: ${{ secrets.GCP_PROXY_USER }}
      GCP_T4_SSH_KEY: ${{ secrets.GCP_T4_SSH_KEY }}
      GCP_T4_HOST: ${{ secrets.GCP_T4_HOST }}
      GCP_T4_USER: ${{ secrets.GCP_T4_USER }}
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: true

      # Always regenerate dist/build-{name}.json + cloud-data-*.json from
      # build.json sources. Each ship job runs against fresh data —
      # the bundled dist/ files in the image come from THIS step, not
      # from the cloud repo's HEAD checkout.
      - name: Regenerate dist/ from build.json sources
        run: bash 2_configs/build.sh config

      # Vault clone — provides ~/git/vault/vault-keys-docker.envfile that
      # cloud-builder's compose.yaml references via env_file:. Without it,
      # `docker compose run cloud-builder` aborts: "env file ... not found".
      - name: Fetch vault
        uses: ./.github/actions/fetch-vault
        with:
          vault_deploy_key: ${{ secrets.VAULT_DEPLOY_KEY }}

      # ── Cache warming: cargo registry/git + target dir ─────────────────
      # Rust services (fin-api, mail-puller, rig-agentic-*, smtp-proxy)
      # run a host-side `cargo build` inside cloud-builder. Without cache,
      # every build re-downloads ~500MB of crates and recompiles from scratch
      # (5-10 min per service). We restore ~/.cargo/{registry,git} keyed on
      # all Cargo.lock files in the repo, plus a per-arch shared target/
      # dir at $RUNNER_TEMP/cargo-target. Mounted into cloud-builder at
      # /root/.cargo and /cargo-target via -v flags in the run step below.
      - name: Restore Rust cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/cargo-target
          key: ${{ runner.os }}-cargo-${{ matrix.vm }}-${{ hashFiles('a_solutions/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.vm }}-
            ${{ runner.os }}-cargo-

      # ── Cache warming: pre-pull cloud-builder image (single docker layer pull) ──
      - name: Prepare cloud-builder + cache mounts
        run: |
          mkdir -p "$HOME/.cargo/registry" "$HOME/.cargo/git" "${{ runner.temp }}/cargo-target"
          # Avoid permission churn on cache restore — cloud-builder runs as root
          chmod -R a+rwX "$HOME/.cargo" "${{ runner.temp }}/cargo-target" 2>/dev/null || true

      - name: Resolve SSH credentials
        id: ssh
        run: |
          GHA_CONFIG=""
          for _p in \
              "/app/cloud-data-gha-config.json" \
              "${CLOUD_ROOT:-$PWD}/2_configs/dist/cloud-data-gha-config.json" \
              "${CLOUD_ROOT:-$PWD}/cloud-data/cloud-data-gha-config.json" \
              "${CLOUD_ROOT:-$PWD}/cloud-data-gha-config.json"; do
              [ -f "$_p" ] && { GHA_CONFIG="$_p"; break; }
          done
          [ -n "$GHA_CONFIG" ] || { echo "FATAL: cloud-data-gha-config.json not found" >&2; exit 1; }
          VM="${{ matrix.vm }}"
          case "$VM" in
            gcp-proxy) KEY="$GCP_PROXY_SSH_KEY"; HOST="$GCP_PROXY_HOST"; USER="$GCP_PROXY_USER" ;;
            gcp-t4)    KEY="$GCP_T4_SSH_KEY";    HOST="$GCP_T4_HOST";    USER="$GCP_T4_USER" ;;
            *)         KEY="$OCI_SSH_KEY"
                       HOST=$(jq -r --arg vm "$VM" '.vms[$vm].wg_ip // .vms[$vm].host' "$GHA_CONFIG")
                       USER=$(jq -r --arg vm "$VM" '.vms[$vm].user' "$GHA_CONFIG") ;;
          esac
          echo "ssh_key<<EOFKEY" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$KEY"  >> "$GITHUB_OUTPUT"
          echo "EOFKEY"         >> "$GITHUB_OUTPUT"
          echo "ssh_host=$HOST" >> "$GITHUB_OUTPUT"
          echo "ssh_user=$USER" >> "$GITHUB_OUTPUT"

      - name: Ship via cloud-builder
        env:
          CHANGED_DIRS: ${{ matrix.changed_dirs }}
          SSH_KEY: ${{ steps.ssh.outputs.ssh_key }}
          SSH_HOST: ${{ steps.ssh.outputs.ssh_host }}
          SSH_USER: ${{ steps.ssh.outputs.ssh_user }}
          SSH_ALIAS: ${{ matrix.vm }}
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          # WG is required for *.wg_ip targets (oci-mail 10.0.0.3, oci-apps
          # 10.0.0.2, etc.). Without it the entrypoint's wg-quick block skips
          # and every ssh to a WG-only VM times out. ship-home-manager.yml has
          # passed this secret since day 1 — ship.yml was missing it.
          WG_PRIVATE_KEY: ${{ secrets.WG_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_ACTIONS: true
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: diegonmarcos/cloud
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          TRACE_DIR: ${{ runner.temp }}/traces
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          IMAGE="ghcr.io/diegonmarcos/cloud-builder-x-deb-nixhm:latest"
          docker pull "$IMAGE"
          mkdir -p "$TRACE_DIR"
          # Write secrets to runner filesystem — compose mounts them :ro into container
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          cat > ~/.ssh/config <<SSHEOF
          Host $SSH_ALIAS
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/id_deploy
            StrictHostKeyChecking no
            ServerAliveInterval 30
            ServerAliveCountMax 10
          SSHEOF
          chmod 600 ~/.ssh/config
          mkdir -p ~/.config/sops/age
          echo "$SOPS_AGE_KEY" > ~/.config/sops/age/keys.txt
          # Run cloud-builder via compose (image has compose.yaml with writable SSH mount)
          docker run --rm "$IMAGE" cat /opt/cloud-builder/compose.yaml > /tmp/cloud-builder-compose.yaml
          # --cap-add NET_ADMIN — required for wg-quick up wg0 inside the
          # container. Currently published images don't yet have cap_add in
          # their baked compose.yaml; this CLI flag is the bootstrap path
          # until the next cloud-builder image ships with it declared.
          docker compose -f /tmp/cloud-builder-compose.yaml run --rm \
            --cap-add NET_ADMIN \
            -v "$HOME/git/vault:/root/git/vault:ro" \
            -e TRACE_DIR=/traces \
            -v "$TRACE_DIR:/traces" \
            -v "$HOME/.cargo:/root/.cargo" \
            -v "${{ runner.temp }}/cargo-target:/cargo-target" \
            -e CARGO_HOME=/root/.cargo \
            -e CARGO_TARGET_DIR=/cargo-target \
            cloud-builder ship ${{ matrix.vm }}

      - name: Upload trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trace-${{ matrix.vm }}
          path: ${{ runner.temp }}/traces/
          retention-days: 7
          if-no-files-found: ignore

  # ── Collect traces: single push to cloud-data ───────────────
  collect-traces:
    name: Collect traces
    needs: ship
    if: always() && needs.detect.outputs.has_vms == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: trace-*
          merge-multiple: true
          path: traces/

      - name: Push traces
        env:
          CLOUD_DATA_DEPLOY_KEY: ${{ secrets.CLOUD_DATA_DEPLOY_KEY }}
        run: |
          ls traces/*.json 2>/dev/null || { echo "No traces"; exit 0; }
          mkdir -p ~/.ssh
          printf '%s\n' "$CLOUD_DATA_DEPLOY_KEY" > ~/.ssh/cloud_data_key
          chmod 600 ~/.ssh/cloud_data_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/cloud_data_key -o StrictHostKeyChecking=no"
          git clone --depth 1 git@github.com:diegonmarcos/cloud-data.git /tmp/cd
          cd /tmp/cd
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p reports/traces-gha
          for f in "$GITHUB_WORKSPACE/traces/"*.json; do
            [ -f "$f" ] || continue
            VM=$(jq -r '.vm' "$f"); T="reports/traces-gha/${VM}.json"
            if [ -f "$T" ]; then
              jq --slurpfile n "$f" '. + $n | .[-200:]' "$T" > "${T}.tmp" && mv "${T}.tmp" "$T"
            else
              jq -s '.' "$f" > "$T"
            fi
          done
          git add reports/traces-gha/
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "auto: traces [skip ci]"
          i=0; while [ $i -lt 3 ]; do i=$((i+1)); git push origin main && break
            echo "Retry $i..."; git pull --rebase origin main 2>/dev/null || true; done
