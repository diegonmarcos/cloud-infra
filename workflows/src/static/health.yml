# ┌──────────────────────────────────────────────────────────────┐
# │  Health — single 11-layer diagnostic                       │
# │                                                            │
# │  Replaces: health-http-public, health-http-private,        │
# │            health_mail_full, health-all-vms, health (VMs)  │
# │                                                            │
# │  Runs cloud-health-full-report (Rust) on oci-apps via SSH. │
# │  The binary does ALL checks: WG mesh, containers, public   │
# │  URLs, private URLs, mail, DNS, TLS, drift, security.      │
# │                                                            │
# │  Script: workflows/src/scripts/health-full.sh              │
# └──────────────────────────────────────────────────────────────┘

name: "Health"

on:
  workflow_run:
    workflows: ["Ship"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: health
  cancel-in-progress: true

jobs:
  health:
    name: "Full 11-layer check"
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Update submodules
        run: git submodule update --remote

      - uses: ./.github/actions/setup-deps
        with:
          ssh_key: ${{ secrets.OCI_SSH_KEY }}
          ssh_host: ${{ secrets.OCI_APPS_HOST }}
          ssh_user: ubuntu
          ssh_alias: oci-apps
          sops_age_key: ${{ secrets.SOPS_AGE_KEY }}

      - name: Wait for containers to settle
        if: github.event_name != 'workflow_dispatch'
        run: sleep 300

      - name: Run full health check
        shell: bash {0}
        env:
          OIDC_TOKEN: ${{ secrets.AUTHELIA_OIDC_BEARER_TOKEN }}
        run: bash .github/workflows/scripts/health-full.sh
