name: "Ship → gcp-t4"

on:
  push:
    paths:
      - "a_solutions/ad-agi_ollama/src/**"
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ship-gcp-t4
  cancel-in-progress: false

jobs:
  ship:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: true

      - name: Update submodules to latest
        run: git submodule update --remote

      - uses: ./.github/actions/setup-deps
        with:
          ssh_key: ${{ secrets.GCP_T4_SSH_KEY }}
          ssh_host: ${{ secrets.GCP_T4_HOST }}
          ssh_user: ${{ secrets.GCP_T4_USER }}
          ssh_alias: gcp-t4
          sops_age_key: ${{ secrets.SOPS_AGE_KEY }}

      - name: Ship services
        run: bash .github/workflows/scripts/ship-vm.sh gcp-t4
