name: "Build → GHCR images"

on:
  push:
    paths:
      - "a_solutions/bb-sec_caddy-l4-image/src/**"
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: ./.github/actions/setup-deps

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build caddy-l4-image
        run: bash a_solutions/bb-sec_caddy-l4-image/build.sh docker

      - name: Make caddy-l4-image public
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method PUT /user/packages/container/caddy-l4/visibility -f visibility=public 2>/dev/null || true

