name: "Ship → gcp-proxy"

on:
  push:
    paths:
      - "a_solutions/bb-sec_authelia/src/**"
      - "a_solutions/bb-sec_caddy/src/**"
      - "a_solutions/ba-clo_hickory-dns/src/**"
      - "a_solutions/bb-sec_introspect-proxy/src/**"
      - "a_solutions/bc-obs_ntfy/src/**"
      - "a_solutions/ca-dat_postlite/src/**"
      - "a_solutions/ca-dat_redis/src/**"
      - "a_solutions/ab-mic_vaultwarden/src/**"
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ship-gcp-proxy
  cancel-in-progress: false

jobs:
  ship:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: true

      - name: Update submodules to latest
        run: git submodule update --remote

      - uses: ./.github/actions/setup-deps
        with:
          ssh_key: ${{ secrets.GCP_PROXY_SSH_KEY }}
          ssh_host: ${{ secrets.GCP_PROXY_HOST }}
          ssh_user: ${{ secrets.GCP_PROXY_USER }}
          ssh_alias: gcp-proxy
          sops_age_key: ${{ secrets.SOPS_AGE_KEY }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Ship services
        run: bash .github/workflows/scripts/ship-vm.sh gcp-proxy
