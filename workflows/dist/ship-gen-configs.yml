# ┌──────────────────────────────────────────────────────────────┐
# │  DO NOT EDIT — this file is generated/deployed by the engine  │
# │                                                                │
# │  Source: cloud/workflows/src/  (templates + static)            │
# │  Build:  ./build.sh workflow   (generates → workflows/dist/)   │
# │  Deploy: copies dist/ → .github/workflows/                    │
# │                                                                │
# │  Edit the source, run build.sh workflow, then commit.          │
# └──────────────────────────────────────────────────────────────┘

name: "Ship → gen-configs (cloud-data)"

on:
  push:
    branches: [main]
    paths:
      - "a_solutions/*/build.json"
      - "config.json"
      - "a_solutions/ba-clo_cloudflare/src/main.tf"
      - "b_infra/vps_*/src/main.tf"
      - "b_infra/home-manager/**/src/*.nix"
      - "a_solutions/bb-sec_caddy/src/**"
      - "a_solutions/bb-sec_authelia/src/**"
      - "a_solutions/ba-clo_hickory-dns/src/**"
      - "a_solutions/bc-obs_c3-infra-mcp/src/engines/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gen-configs
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/setup-deps

      - name: Generate cloud-data (topology + configs + deps)
        env:
          GIT_BASE: ${{ github.workspace }}/../
        run: bash build.sh config

      - name: Commit and push cloud-data submodule
        run: |
          cd cloud-data
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A *.json *.md
          if git diff --cached --quiet; then
            echo "cloud-data: no changes"
            exit 0
          fi
          git commit -m "auto: regenerate cloud-data from build.json + config.json [skip ci]"
          git push origin HEAD:main

      - name: Update submodule reference in main repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cloud-data
          if git diff --cached --quiet; then
            echo "main repo: submodule ref unchanged"
            exit 0
          fi
          git commit -m "auto: update cloud-data submodule ref [skip ci]"
          git pull --rebase origin main
          git push
