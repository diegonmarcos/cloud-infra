# ┌──────────────────────────────────────────────────────────────┐
# │  DO NOT EDIT — this file is generated/deployed by the engine  │
# │                                                                │
# │  Source: cloud/workflows/src/  (templates + static)            │
# │  Build:  ./build.sh workflow   (generates → workflows/dist/)   │
# │  Deploy: copies dist/ → .github/workflows/                    │
# │                                                                │
# │  Edit the source, run build.sh workflow, then commit.          │
# └──────────────────────────────────────────────────────────────┘

name: "Ship → GHCR images"

on:
  push:
    paths:
      - "a_solutions/bc-obs_c3-infra-api/src/**"
      - "a_solutions/bc-obs_c3-infra-mcp/src/**"
      - "a_solutions/bc-obs_c3-services-api/src/**"
      - "a_solutions/bc-obs_c3-services-mcp/src/**"
      - "a_solutions/bc-obs_cloud-cgc-mcp/src/**"
      - "a_solutions/aa-sui_google-workspace-mcp/src/**"
      - "a_solutions/bb-sec_introspect-proxy/src/**"
      - "a_solutions/aa-sui_mail-mcp/src/**"
      - "a_solutions/aa-sui_mattermost-mcp/src/**"
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Update submodules to latest
        run: git submodule update --remote

      - uses: ./.github/actions/setup-deps

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build c3-infra-api
        run: bash a_solutions/bc-obs_c3-infra-api/build.sh docker

      - name: Make c3-infra-api public
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method PUT /user/packages/container/c3-infra-api/visibility -f visibility=public 2>/dev/null || true

      - name: Build c3-infra-mcp
        run: bash a_solutions/bc-obs_c3-infra-mcp/build.sh docker

      - name: Make c3-infra-mcp public
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method PUT /user/packages/container/c3-infra-mcp/visibility -f visibility=public 2>/dev/null || true

      - name: Build c3-services-api
        run: bash a_solutions/bc-obs_c3-services-api/build.sh docker

      - name: Make c3-services-api public
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method PUT /user/packages/container/c3-services-api/visibility -f visibility=public 2>/dev/null || true

      - name: Build c3-services-mcp
        run: bash a_solutions/bc-obs_c3-services-mcp/build.sh docker

      - name: Make c3-services-mcp public
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method PUT /user/packages/container/c3-services-mcp/visibility -f visibility=public 2>/dev/null || true

      - name: Build cloud-cgc-mcp
        run: bash a_solutions/bc-obs_cloud-cgc-mcp/build.sh docker

      - name: Make cloud-cgc-mcp public
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method PUT /user/packages/container/cloud-cgc-mcp/visibility -f visibility=public 2>/dev/null || true

      - name: Build google-workspace-mcp
        run: bash a_solutions/aa-sui_google-workspace-mcp/build.sh docker

      - name: Make google-workspace-mcp public
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method PUT /user/packages/container/google-workspace-mcp/visibility -f visibility=public 2>/dev/null || true

      - name: Build introspect-proxy
        run: bash a_solutions/bb-sec_introspect-proxy/build.sh docker

      - name: Make introspect-proxy public
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method PUT /user/packages/container/introspect-proxy/visibility -f visibility=public 2>/dev/null || true

      - name: Build mail-mcp
        run: bash a_solutions/aa-sui_mail-mcp/build.sh docker

      - name: Make mail-mcp public
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method PUT /user/packages/container/mail-mcp/visibility -f visibility=public 2>/dev/null || true

      - name: Build mattermost-mcp
        run: bash a_solutions/aa-sui_mattermost-mcp/build.sh docker

      - name: Make mattermost-mcp public
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method PUT /user/packages/container/mattermost-mcp/visibility -f visibility=public 2>/dev/null || true

