# ┌──────────────────────────────────────────────────────────────┐
# │  DO NOT EDIT — this file is generated/deployed by the engine  │
# │                                                                │
# │  Source: cloud/workflows/src/  (templates + static)            │
# │  Build:  ./build.sh workflow   (generates → workflows/dist/)   │
# │  Deploy: copies dist/ → .github/workflows/                    │
# │                                                                │
# │  Edit the source, run build.sh workflow, then commit.          │
# └──────────────────────────────────────────────────────────────┘

name: "Ship → oci-mail"

on:
  push:
    paths:
      - "a_solutions/bc-obs_dagu/src/**"
      - "a_solutions/aa-sui_tools-smtp-proxy/src/**"
      - "a_solutions/aa-sui_snappymail/src/**"
      - "a_solutions/aa-sui_tools-stalwart/src/**"
      - "a_solutions/bc-obs_syslog-forwarder/src/**"
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ship-oci-mail
  cancel-in-progress: false

jobs:
  ship:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Ship inside cloud-builder
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull ghcr.io/diegonmarcos/cloud-builder:latest
          docker run --rm \
            -e SSH_KEY='${{ secrets.OCI_SSH_KEY }}' \
            -e SSH_HOST='130.110.251.193' \
            -e SSH_USER='ubuntu' \
            -e SSH_ALIAS='oci-mail' \
            -e SOPS_AGE_KEY='${{ secrets.SOPS_AGE_KEY }}' \
            -e GITHUB_ACTIONS=true \
            -e GITHUB_EVENT_NAME="${GITHUB_EVENT_NAME:-}" \
            -e GITHUB_REPOSITORY="${GITHUB_REPOSITORY}" \
            -e FORCE_DEPLOY=1 \
            ghcr.io/diegonmarcos/cloud-builder:latest \
            bash -c 'mkdir -p ~/.ssh && ssh-keyscan github.com >>~/.ssh/known_hosts 2>/dev/null && git clone --depth 2 --recurse-submodules https://github.com/$GITHUB_REPOSITORY.git /workspace && cd /workspace && git submodule update --remote && bash .github/workflows/scripts/cloud-builder.sh ship $SSH_ALIAS'
