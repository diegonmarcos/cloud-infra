# Stream the GHCR DB layer directly into oci-apps'
# octocode_db volume. The DB is ~6GB extracted; the docker-image path needs 2x
# (image + extraction) which does NOT fit oci-apps' disk. Streaming the single
# gzipped layer blob through tar writes only the 6GB extracted files — fits.
# WG carries only the short SSH command; the blob is fetched oci-apps<-GHCR.
# Manual dispatch. Fold into cloud-cgc-db-restore.sh once proven.
#
# Was hand-written straight into .github/workflows/test-wg-reach.yml — a name
# left over from whatever it was copied from, and a file with no source, so
# every `build.sh` left it untouched and the generated-header check failed on
# it indefinitely. Promoted into src 2026-08-10 and renamed to match what it
# actually does.
name: "cgc-db propagate-only (stream GHCR layer -> oci-apps)"

on:
  workflow_dispatch: {}

# 2026-09-06: this job brings the WG slot up too — same fleet-wide group as
# every other WG holder (see ship.yml deploy.concurrency).
concurrency:
  group: ship-wg-runner
  cancel-in-progress: false

env:
  WG_PRIVATE_KEY: ${{ secrets.WG_PRIVATE_KEY }}
  WG_HUB_PUBKEY: ${{ vars.WG_HUB_PUBKEY }}
  OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}

jobs:
  propagate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Resolve GHCR pull token + DB layer digest
        id: ghcr
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IMGP="diegonmarcos/cloud-cgc-pub-mcp-octocode-db"
          TOK=$(curl -s -u "$GHCR_USER:$GHCR_TOKEN" "https://ghcr.io/token?scope=repository:$IMGP:pull" | jq -r .token)
          # largest layer = the DB data layer
          LAYER=$(curl -s -H "Authorization: Bearer $TOK" \
            -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/$IMGP/manifests/latest" \
            | jq -r '.layers | max_by(.size) | .digest')
          echo "layer=$LAYER"
          echo "tok=$TOK" >> "$GITHUB_OUTPUT"
          echo "layer=$LAYER" >> "$GITHUB_OUTPUT"
          echo "imgp=$IMGP" >> "$GITHUB_OUTPUT"
      - name: Provision SSH key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$OCI_SSH_KEY" > ~/.ssh/cgc_deploy && chmod 600 ~/.ssh/cgc_deploy
      - name: WireGuard up
        run: bash 1_workflows/src/scripts/cloud-ship-ci-setup-wireguard.sh
      - name: Stream DB layer into oci-apps octocode_db volume
        env:
          TOK: ${{ steps.ghcr.outputs.tok }}
          LAYER: ${{ steps.ghcr.outputs.layer }}
          IMGP: ${{ steps.ghcr.outputs.imgp }}
        run: |
          set -euo pipefail
          SSHOPTS="-i $HOME/.ssh/cgc_deploy -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -o ServerAliveInterval=15"
          TARGET="ubuntu@10.0.0.6"
          ssh $SSHOPTS "$TARGET" "TOK='$TOK' LAYER='$LAYER' IMGP='$IMGP' CTR='cloud-cgc-pub-mcp' VOL='octocode_db' bash -s" <<'REMOTE'
          set -e
          echo "--- free before ---"; df -h / | awk 'NR==2{print $4}'
          sudo docker stop "$CTR" 2>/dev/null || true
          sudo find /var/lib/docker/volumes/$VOL/_data -mindepth 1 -delete 2>/dev/null || true
          echo "--- streaming layer blob -> tar into volume ---"
          curl -sL -H "Authorization: Bearer $TOK" "https://ghcr.io/v2/$IMGP/blobs/$LAYER" \
            | sudo tar xz -C /var/lib/docker/volumes/$VOL/_data --strip-components=1 octocode-db
          sudo docker start "$CTR" 2>/dev/null || true
          echo "=== VERIFY ==="
          echo "DB size: $(sudo du -sh /var/lib/docker/volumes/$VOL/_data | cut -f1)"
          sudo ls /var/lib/docker/volumes/$VOL/_data | head -6
          echo "free after: $(df -h / | awk 'NR==2{print $4" ("$5")"}')"
          sudo docker ps -a --format '{{.Names}} {{.Status}}' | grep -i cgc || echo 'DB in volume (no cgc container)'
          REMOTE
