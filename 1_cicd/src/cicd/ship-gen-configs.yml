name: "Ship → gen-configs (cloud-data)"

on:
  push:
    branches: [main]
    paths:
      - "a_solutions/*/build.json"
      - "config.json"
      - "c_vps/ba-clo_cloudflare/src/main.tf"
      - "c_vps/vps_*/src/main.tf"
      - "b_infra/**/src/*.nix"
      - "a_solutions/infra-sec_caddy/src/**"
      - "a_solutions/infra-sec_authelia/src/**"
      - "a_solutions/infra-net_hickory-dns/src/**"
      # The config tiers, promoted out of the old single 9_others/ directory.
      # (The second entry used to read 1_cicd/dist/1_cicd/src/scripts/**
      # — a doubled path that matched nothing, so script edits never triggered
      # this workflow.)
      - "0_git/src/**"
      - "0_apps/src/**"
      - "1_cicd/src/**"
      - "2_sops/**"
      - "9_others/src/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gen-configs
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    # Job-level so the composite `fetch-vault` action (Fetch vault step) inherits
    # it and can materialise the age key + sops-decrypt BEFORE the Generate step.
    # Without this the run aborts "No SOPS age key available". Same fix as
    # ship-home-manager.yml.
    env:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
    steps:
      # Checkout required so the local composite action ./.github/actions/fetch-vault
      # is on disk before we reference it.
      - uses: actions/checkout@v4
        with:
          submodules: false

      # Allowlist: `submodules: true` aborts checkout on the first submodule
      # CI cannot reach (vault / notes / cloud-data-lfs are private siblings;
      # cloud-master's own .gitmodules is SSH-only). Init just what is used.
      - uses: ./.github/actions/init-submodules
        with:
          include: I_cloud
          cloud_data_deploy_key: ${{ secrets.CLOUD_DATA_DEPLOY_KEY }}

      # Vault clone — provides ~/git/cloud-vault/vault-keys-docker.envfile that
      # cloud-builder's compose.yaml references via env_file:. Without it,
      # `docker compose run cloud-builder` aborts: "env file ... not found".
      - name: Fetch vault
        uses: ./.github/actions/fetch-vault
        with:
          vault_deploy_key: ${{ secrets.VAULT_DEPLOY_KEY }}

      - name: Resolve builder image
        uses: ./.github/actions/resolve-builder-image

      - name: Generate inside cloud-builder
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          CLOUD_DATA_DEPLOY_KEY: ${{ secrets.CLOUD_DATA_DEPLOY_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTIONS: true
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          # BUILDER_IMAGE is exported by ./.github/actions/resolve-builder-image
          # which reads II_Unix/cb_containers-builders/build.json (master).
          IMAGE="$BUILDER_IMAGE"
          docker pull "$IMAGE"
          # Write secrets to runner fs — compose mounts :ro
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null || true
          mkdir -p ~/.config/sops/age
          echo "$SOPS_AGE_KEY" > ~/.config/sops/age/keys.txt
          # Run
          # --cap-add NET_ADMIN bootstraps wg-quick inside the container until
          # new cloud-builder images ship with cap_add baked in compose.yaml.
          docker run --rm "$IMAGE" cat /opt/cloud-builder/compose.yaml > /tmp/cloud-builder-compose.yaml
          # Mount the runner's checkout AS the container's cloud repo so the
          # derive writes the regenerated dist/ INTO the workspace the commit
          # step stages. Without this, gen-configs runs on the image-baked
          # /root/git/cloud-infra and its output is discarded with the --rm container
          # → the commit step saw "nothing to commit", so newly-declared
          # cloud-data (e.g. wg-public clients + vault keys) never reached origin.
          # See a0_tasks/PLAN_gen-configs-dist-propagation-fix.md.
          docker compose -f /tmp/cloud-builder-compose.yaml run --rm \
            --cap-add NET_ADMIN \
            -v "$HOME/git/cloud-vault:/root/git/cloud-vault:ro" \
            -v "$GITHUB_WORKSPACE:/root/git/cloud-infra" \
            -e CLOUD_DATA_DEPLOY_KEY \
            cloud-builder gen-configs
          # The container runs as root inside the mounted workspace; reclaim
          # ownership so the runner's git add/commit (next step) can write .git.
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

      # Commit + push the regenerated dist/ back to main.
      #
      # The orchestrator script (1_cicd/src/scripts/cloud-ship-orchestrate-gen-configs.sh)
      # explicitly says "The regenerated files are committed by the standard
      # ci flow (the workflow caller commits + pushes)" — but until this step
      # was added, no such commit happened. dist/ on origin diverged from what
      # the engine actually produces, and downstream ship-home-manager (which
      # checks out workflow_run.head_sha and reads committed dist/ as-is) saw
      # stale data. Newly declared peers — e.g. wg-public clients added via
      # config.json or new vault keys — never propagated to the running VMs.
      #
      # Why this won't infinite-loop:
      #   • commits made with GITHUB_TOKEN do not re-trigger workflows
      #     (documented GitHub Actions anti-loop)
      #   • the commit message carries [skip ci] as belt-and-braces
      #   • a downstream workflow_run consumer (ship-home-manager) still fires
      #     once per parent ship-gen-configs completion, but by that point
      #     origin/main has the fresh dist for its checkout to pull
      - name: Commit regenerated dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # Stage every path the engine writes to. Globs that match no files
          # are silently ignored (|| true on the whole add invocation).
          # 1_cloud-configs/dist/ is the consolidator's SOLE write target
          # (cloud-data-config-consolidated.ts:48 CLOUD_DATA_DIR). It was
          # missing here, so every run regenerated the master
          # _cloud-data-consolidated.json + build-*.json and then threw them
          # away — ship-home-manager checks out the committed tree and read a
          # stale master, so a newly declared client (wireguard vault-backup,
          # 2026-08-23) never reached the hub's peer list. Same failure mode
          # the block above describes; the materialized a_solutions copies
          # were staged but the file they are copies OF was not.
          git add 0_git/dist/ 0_apps/dist/ 1_cicd/dist/ 9_others/dist/ \
                  1_cloud-configs/dist/ \
                  b_infra/_shared/vm-pilot/dist/ \
                  b_infra/nixhm-sudo-*/dist/ \
                  a_solutions/*/src/_cloud-data-consolidated.json \
                  a_solutions/*/src/build-*.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "::notice::dist/ unchanged — nothing to commit"
            exit 0
          fi
          # Per-command identity (does NOT pollute .git/config — same pattern
          # adopted in cloud-ship-terraform-deploy-apply.sh after b7ec24e6).
          # Subject-only commit message — keep it on ONE line. A multi-line
          # message inside a YAML run-block scalar requires every line to be
          # indented at the block's base indent; lines at column 1 silently
          # break the YAML and the whole workflow fails to validate.
          git \
            -c user.name="Claude" \
            -c user.email="noreply@anthropic.com" \
            commit -m "ci(gen-configs): refresh dist/ from trigger ${GITHUB_SHA::8} via run ${GITHUB_RUN_ID} [skip ci]"
          git push origin HEAD:main
