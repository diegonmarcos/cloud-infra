name: lint-agent-credential
# #359: fails when an agent container DECLARES a GitHub token with more scope
# than 9_others/agent-credential-policy.json allows (admin:enterprise,
# admin:org, delete_repo, ...). The token each holder's sops file declares is
# decrypted and probed read-only (GET api.github.com/user, X-OAuth-Scopes). It
# is never printed.
#
# RED until Diego mints the fine-grained token (policy .diego_must_do). That
# red is the finding, not noise: it is what "the universal PAT is on every
# agent" looks like. The guard's own logic is proven offline by
# 9_others/test/test_agent_credential_scope.sh (case I), a registered tester.
on:
  schedule:
    - cron: '17 6 * * *'
  # Daily, not on every containers-push: until the mint that would put a red
  # run on every container commit. A re-declared admin token shows within 24h.
  push:
    branches: [main]
    paths:
      - '9_others/agent-credential-policy.json'
      - '9_others/src/agent-credential-audit.sh'
      - '9_others/src/agent-credential-declared-guard.sh'
      - '1_cicd/src/cicd/lint-agent-credential.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout cloud-u-containers into a_solutions
        uses: actions/checkout@v4
        with:
          repository: diegonmarcos/cloud-u-containers
          path: a_solutions
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install sops + jq
        run: |
          set -euo pipefail
          curl -fsSL -o sops https://github.com/getsops/sops/releases/download/v3.9.4/sops-v3.9.4.linux.amd64
          chmod +x sops && sudo mv sops /usr/local/bin/
          sudo apt-get update -qq && sudo apt-get install -qq -y jq

      - name: Write SOPS age key from secret
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/sops/age"
          printf '%s' "$SOPS_AGE_KEY" > "$HOME/.config/sops/age/keys.txt"
          chmod 600 "$HOME/.config/sops/age/keys.txt"

      - name: Probe every holder's declared token
        run: bash 9_others/src/agent-credential-declared-guard.sh
