# ┌──────────────────────────────────────────────────────────────┐
# │  cloud-cgc octocode DB — REUSABLE index / checkpoint /       │
# │  propagate phase (workflow_call).                            │
# │                                                              │
# │  ALL the index + checkpoint-push + propagate logic lives     │
# │  here; the orchestrator (cgc-db.yml) calls this twice — once  │
# │  per phase — and carries ZERO logic itself.                  │
# │                                                              │
# │  The `phase` input drives exactly two things, both passed as  │
# │  environment into cloud-cgc-db-update.sh (environment wins    │
# │  over build.json):                                           │
# │    · USE_LLM             — false for semantic, true for       │
# │                            graphrag (selects the GraphRAG LLM │
# │                            enrichment pass inside octocode).  │
# │    · CGC_MANIFEST_PHASE  — selects the PER-PHASE manifest so  │
# │                            each phase change-gates on its own │
# │                            last-indexed commit per repo and   │
# │                            is not skipped by the other phase. │
# │                                                              │
# │  MATRIX: one job per repo (repos job resolves index_repos     │
# │  from build.json into a JSON list at runtime — GitHub          │
# │  matrices are static YAML, so this is the established         │
# │  read-config/emit-fromJSON pattern this repo already uses     │
# │  in ship.yml's `detect` job; the src→dist→.github header-     │
# │  injection engine (9_others/build.sh) does NOT template       │
# │  build.json values into workflow content, it only stamps a    │
# │  banner, so there is no build-time injection path to reuse    │
# │  here). Each job indexes ONE repo into a FRESH octocode home  │
# │  (never the 15G monolith base) and packages ONLY that repo's  │
# │  own project into its own ghcr.io/diegonmarcos/cgc-db-<repo>   │
# │  image (cloud-cgc-db-update.sh CGC_PACKAGE_MODE=per-repo).    │
# │  fail-fast: false — one repo timing out or failing must never  │
# │  cancel the others. Per-job propagation is OFF                │
# │  (CGC_SKIP_PROPAGATE=1); the restore-all job below runs        │
# │  ONCE per phase, after every matrix job settles (if: always(),│
# │  so a partial matrix still propagates whatever DID publish):  │
# │  cloud-cgc-db-restore-all.sh (Task 4) assembles the shared     │
# │  base + every per-repo image into one octocode home on the     │
# │  runner, then rsync streams that home onto oci-apps.          │
# │                                                              │
# │  Runs on GitHub-hosted ubuntu-latest x86 runners (~14GB disk).│
# │  Using x86 avoids oci-apps disk pressure (disk full).        │
# │  The octocode DB (FastEmbed vectors + graph) is arch-portable│
# │  so an x86 index is consumed by arm oci-apps cgc-mcp fine.   │
# │  Runner SSHes into oci-apps over WireGuard to propagate.     │
# │                                                              │
# │  MONOLITH PATH NOT YET RETIRED: cloud-cgc-db-update.sh's      │
# │  default (non per-repo) mode, cloud-cgc-db-package.sh, and     │
# │  db_publish.image keep working untouched — the monolith        │
# │  publish/propagate is retired only after this matrix is        │
# │  proven green, per the migration plan.                        │
# └──────────────────────────────────────────────────────────────┘

name: "cgc-db-index (reusable octocode index phase)"

on:
  workflow_call:
    inputs:
      phase:
        description: "Index phase: semantic (structural, no LLM) or graphrag (LLM relationship enrichment)."
        required: true
        type: string

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # GITHUB_TOKEN is scoped to cloud-infra alone. Cloning other private repos was already
  # worked around below with per-repo deploy keys, but two things still need real repo
  # reach and had no workaround at all:
  #   1. cloud-cgc-db-package.sh's `gh repo view <repo> --json isPrivate` — with no reach
  #      it returns empty, the resolver fails safe to "private", and the job errors.
  #   2. GHCR package auto-linking. A pushed package inherits the visibility of the repo
  #      named in its org.opencontainers.image.source LABEL, but ONLY if the pushing token
  #      can see that repo. It could not, so the package was created PUBLIC and the
  #      verify-or-delete backstop deleted it — every run, for cloud-data and my-ai_memory.
  # A PAT with repo + read:packages + delete:packages fixes both. Optional by design:
  # unset, everything falls back to GITHUB_TOKEN and the public repos index exactly as
  # before, so a missing secret degrades to today's behaviour instead of breaking the run.
  CGC_GHCR_PAT: ${{ secrets.CGC_GHCR_PAT }}
  # gh(1) reads GH_TOKEN first. This is what gives the package script's visibility probe
  # its reach; it falls back to GITHUB_TOKEN when no PAT is configured.
  GH_TOKEN: ${{ secrets.CGC_GHCR_PAT || secrets.GITHUB_TOKEN }}
  GITHUB_ACTOR: ${{ github.actor }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  WG_PRIVATE_KEY: ${{ secrets.WG_PRIVATE_KEY }}
  WG_HUB_PUBKEY: ${{ vars.WG_HUB_PUBKEY }}
  OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
  # PRIVATE index_repos: GITHUB_TOKEN above is scoped to cloud-infra alone and can never
  # clone another private repo — cloud-data failed here on every run and was silently absent
  # from the DB. ensure_repos() reads CGC_DEPLOY_KEY_<local_dir, non-alnum folded to _>, so
  # the script stays generic; only this wiring is per-repo, because Actions resolves secrets
  # by literal name and cannot index into them dynamically. Add one line per private repo in
  # .runtime.octocode.index_repos — public repos need nothing. Declared at the WORKFLOW level
  # so it reaches every job below (repos/index/restore-all) without repeating it per job.
  CGC_DEPLOY_KEY_cloud_data: ${{ secrets.CLOUD_DATA_DEPLOY_KEY }}
  CGC_DEPLOY_KEY_cloud_my_ai_memory: ${{ secrets.CLOUD_MY_AI_MEMORY_DEPLOY_KEY }}

jobs:
  # ── Resolve the repo matrix from build.json (data-driven; see header) ──
  repos:
    name: "cgc-db · ${{ inputs.phase }} · resolve repo matrix"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      repos: ${{ steps.repos.outputs.repos }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate phase input
        run: |
          case "${{ inputs.phase }}" in
            semantic|graphrag) : ;;
            *) echo "::error::unknown phase '${{ inputs.phase }}' (expected semantic|graphrag)"; exit 1 ;;
          esac
      - name: Resolve .runtime.octocode.index_repos → matrix JSON
        id: repos
        run: |
          set -eu
          BJ="a_solutions/user-ai_cloud-cgc-pub-mcp/build.json"
          [ -f "$BJ" ] || { echo "::error::$BJ not found"; exit 1; }
          REPOS_JSON=$(jq -c '[.runtime.octocode.index_repos[]]' "$BJ")
          COUNT=$(printf '%s' "$REPOS_JSON" | jq 'length')
          [ "$COUNT" -gt 0 ] || { echo "::error::.runtime.octocode.index_repos is empty — nothing to index"; exit 1; }
          echo "repos=$REPOS_JSON" >> "$GITHUB_OUTPUT"
          echo "[cgc-db] ${{ inputs.phase }} matrix ($COUNT repos): $(printf '%s' "$REPOS_JSON" | jq -r 'join(" ")')"

  # ── One job per repo. fail-fast: false — one repo's failure/timeout must
  # never cancel the others; each publishes to its OWN GHCR image so a
  # failure is isolated to that one repo's checkpoint, not the whole cycle.
  index:
    name: "cgc-db · ${{ inputs.phase }} · ${{ matrix.repo }}"
    needs: repos
    runs-on: ubuntu-latest
    # Same declared ceiling as the pre-matrix single job (see build.json
    # .runtime.octocode.update._budget_comment): max_minutes(300) is the true
    # worst case per repo now that repo_timeout_min is a clamp, not a
    # reservation, so 330 leaves slack for clone + packaging + push. Per-job
    # now, not per-cycle — a slow repo no longer eats every other repo's turn.
    timeout-minutes: 330
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJson(needs.repos.outputs.repos) }}
    steps:
      - uses: actions/checkout@v4
      # Kept "as today" per the matrix design even though propagation (the
      # only thing that needs a live WG tunnel) is off in this job — a WG
      # handshake race between N parallel matrix jobs sharing one gha-runner
      # peer slot (see ship.yml's max-parallel:1 note) is therefore harmless
      # here: continue-on-error swallows it, and nothing downstream in THIS
      # job depends on WG being up (restore-all, not this job, propagates).
      - name: WireGuard up
        continue-on-error: true
        run: bash 1_cicd/src/scripts/cloud-ship-ci-setup-wireguard.sh
      - name: Fresh per-repo octocode home
        # Must end in /octocode: cloud-cgc-db-update.sh's per-repo mode exports
        # XDG_DATA_HOME as this path's PARENT so octocode 0.12.2's own
        # $XDG_DATA_HOME/octocode resolution (it has no relocation knob of its
        # own — storage.rs:39-47) lands exactly here instead of silently
        # writing the real DB to $HOME/.local/share/octocode (production
        # incident: run 32512759559, every job "no project directory found").
        # update.sh normalizes+warns if this ever drifts, but the source of
        # truth should already conform.
        run: |
          mkdir -p "$RUNNER_TEMP/octocode-home/octocode"
          echo "OCTOCODE_HOME=$RUNNER_TEMP/octocode-home/octocode" >> "$GITHUB_ENV"
      - name: "cgc-db incremental update — ${{ matrix.repo }} only (checkpoint push, no propagate)"
        # No SSH key / CGC_SSH_OPTS here (unlike the pre-matrix single job): with
        # CGC_SKIP_PROPAGATE=1 + CGC_PACKAGE_MODE=per-repo, update.sh's
        # propagate_to_host() is NEVER reached in this job (see cloud-cgc-db-update.sh),
        # so provisioning deploy-key material on every one of N parallel runners would
        # be pure unused attack surface. restore-all below is the only job that needs it.
        env:
          # phase → USE_LLM (environment is authoritative over build.json).
          # semantic = structural only (no LLM); graphrag = LLM relationship pass.
          USE_LLM: ${{ inputs.phase == 'graphrag' && 'true' || 'false' }}
          # phase → PER-PHASE manifest so each phase change-gates independently and
          # graphrag is not skipped just because semantic already advanced HEAD.
          CGC_MANIFEST_PHASE: ${{ inputs.phase }}
          # ONE repo, indexed into the FRESH home set up above.
          CGC_INDEX_REPOS: ${{ matrix.repo }}
          # Per-repo packaging path (cloud-cgc-db-package.sh, mode auto-detected
          # from the image name) instead of monolith package+propagate — see
          # cloud-cgc-db-update.sh checkpoint_publish().
          CGC_PACKAGE_MODE: per-repo
          # Propagation is centralised in the restore-all job below, which runs ONCE
          # per phase after every matrix job settles, not once per repo per job.
          CGC_SKIP_PROPAGATE: "1"
        run: sh 1_cicd/src/ops/cloud-cgc-db-update.sh

  # ── Multi-image restore onto oci-apps: base + every per-repo image, ONCE
  # per phase. if: always() so a partial/failed matrix still propagates
  # whatever DID publish this run instead of leaving oci-apps stale on a
  # single unrelated repo's failure; this job's own success is what gates
  # the phase.
  #
  # cloud-cgc-db-restore-all.sh (Task 4) assembles base + every per-repo
  # image into a LOCAL target dir — it runs docker directly against whatever
  # host it is invoked on, the same contract as cloud-cgc-db-pull.sh, not an
  # SSH-remote script. So this job assembles the full home HERE on the runner
  # (where build.json/GHCR-auth/docker already are, from the checkout above),
  # then transports the assembled result onto oci-apps with the SAME
  # rsync-into-the-live-volume mechanism cloud-cgc-db-update.sh's
  # propagate_to_host() already uses for the monolith path (stop container,
  # rsync --delete, start container) — proven, not reinvented.
  restore-all:
    name: "cgc-db · ${{ inputs.phase }} · restore-all → oci-apps"
    needs: index
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    env:
      # BOOTSTRAP: this cron job's very first run ever has no base image on GHCR
      # yet (nothing seeded, no matrix job publishes the base — see
      # cloud-cgc-db-package.sh). Without this, cloud-cgc-db-restore-all.sh hard-
      # errors on the missing base and this job goes red, which — because cgc-db.yml
      # gates the graphrag phase on the semantic phase's result — blocks graphrag too,
      # on every scheduled run, forever, until someone manually seeds a base out of
      # band. CGC_BOOTSTRAP_TOLERANT=1 makes a missing base a ::warning:: + exit 0
      # instead, so the cycle goes green and simply has nothing to propagate yet.
      # The dagu/manual restore path (cloud-cgc-db-restore-all.sh invoked directly,
      # not through this workflow) does NOT set this and keeps the hard error, since
      # there a missing base is an operator mistake worth surfacing loudly.
      CGC_BOOTSTRAP_TOLERANT: "1"
    steps:
      - uses: actions/checkout@v4
      - name: WireGuard up
        continue-on-error: true
        run: bash 1_cicd/src/scripts/cloud-ship-ci-setup-wireguard.sh
      - name: Provision SSH key for propagation
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$OCI_SSH_KEY" > ~/.ssh/cgc_deploy && chmod 600 ~/.ssh/cgc_deploy
      - name: GHCR auth (restore-all pulls every per-repo image itself)
        run: |
          # PAT when available so the push can auto-link the package to a PRIVATE source
          # repo and inherit its visibility; GITHUB_TOKEN otherwise (public repos only).
          echo "${CGC_GHCR_PAT:-$GITHUB_TOKEN}" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      # PROPAGATION: the BOX PULLS, the runner does not push.
      #
      # This step used to assemble the whole octocode home on the runner and rsync
      # it into oci-apps' volume. That transfer never once succeeded. The last
      # failure is the clearest: ssh connected fine, then died 53s into the data
      # with "client_loop: send disconnect: Broken pipe" -- ServerAliveInterval=15
      # times the default ServerAliveCountMax of 3 is exactly 45s of silence, and a
      # loaded ARM VM at 80%+ disk stalls longer than that while writing hundreds of
      # MB into a docker volume. Raising the keepalive would only move the cliff.
      #
      # The transfer itself is the defect. Every per-repo image is already sitting
      # on GHCR, and oci-apps can fetch them directly at registry speed, so nothing
      # bulk needs to cross WireGuard at all -- only a short ssh control channel.
      # That is the path cloud-cgc-db-restore-all.sh was written for, and it is the
      # one proven to work end to end on this box (rc=0, 6 repos + base).
      #
      # Run DETACHED and poll: the restore takes ~50 min on this hardware, and
      # holding one ssh session open that long invites exactly the broken pipe this
      # step exists to avoid. Each poll is its own short-lived connection, so a
      # dropped link costs one poll instead of the whole restore.
      - name: restore-all on oci-apps (box pulls per-repo images from GHCR)
        env:
          CGC_SSH_OPTS: "-i /home/runner/.ssh/cgc_deploy -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -o ServerAliveInterval=15"
        run: |
          set -eu
          BJ="a_solutions/user-ai_cloud-cgc-pub-mcp/build.json"
          VOL=$(jq -r '.runtime.octocode.db_volume' "$BJ")
          CTR=$(jq -r '.containers.app.container_name' "$BJ")
          HOST=$(jq -r '.db_publish.host' "$BJ")
          PREFIX=$(jq -r '.per_repo_publish.image_prefix' "$BJ")
          BASE=$(jq -r '.per_repo_publish.base_image' "$BJ")
          TAG=$(jq -r '.per_repo_publish.tag' "$BJ")
          # The box has no repo checkout, so every value the script would otherwise
          # read from build.json is passed in explicitly -- including the private
          # list, without which the restore's public/private filter has nothing to
          # filter on and a private repo could land in the PUBLIC MCP's volume.
          REPOS=$(jq -r '.runtime.octocode.index_repos | join(" ")' "$BJ")
          PRIV=$(jq -r '.runtime.octocode.private_repos // [] | join(" ")' "$BJ")
          # Same SSH-target resolution as cloud-cgc-db-update.sh's propagate_to_host()
          # and cloud-cgc-db-seed.sh: user@wg_ip from build-gha.json in CI, ssh alias locally.
          GHA="1_cloud-configs/dist/build-gha.json"
          TARGET="$HOST"
          if [ -f "$GHA" ]; then
            WGIP=$(jq -r --arg h "$HOST" '.vms[$h].wg_ip // empty'  "$GHA" 2>/dev/null)
            SUSER=$(jq -r --arg h "$HOST" '.vms[$h].user // "ubuntu"' "$GHA" 2>/dev/null)
            [ -n "$WGIP" ] && TARGET="$SUSER@$WGIP"
          fi
          echo "[cgc-db] restore-all → $TARGET (box pulls ${PREFIX}<repo>:${TAG} from GHCR)"
          # shellcheck disable=SC2086
          scp $CGC_SSH_OPTS 1_cicd/dist/scripts/cloud-cgc-db-restore-all.sh "$TARGET:/tmp/cgc-restore-all.sh"
          # Stop the MCP first: the volume-swap branch does rm -rf then cp -a, which
          # is not safe under a live process holding LanceDB files open.
          # shellcheck disable=SC2086
          # Deliberately NOT stopping the container here. The restore stays up through
          # the pull/stage phases (~50 min) and takes itself down only across the volume
          # swap, via MCP_CONTAINER below. Bracketing the whole restore from out here --
          # which is what this step used to do -- made every scheduled refresh a
          # 50-minute MCP outage in order to protect a swap that lasts seconds.
          # Built as a heredoc and piped to `sh -s` rather than crammed into one
          # ssh argument: the launch needs nested quoting three levels deep
          # (ssh -> sh -c -> nohup sh -c) and inlining it is how quoting bugs get
          # shipped. Unquoted heredoc so the runner expands the values below,
          # with \$? escaped so the REMOTE shell is the one that evaluates it.
          cat > /tmp/remote-restore.sh <<EOF
          rm -f /tmp/cgc-restore.log /tmp/cgc-restore.rc
          setsid nohup env \
            CGC_DB_IMAGE_PREFIX='$PREFIX' \
            CGC_DB_BASE_IMAGE='$BASE' \
            CGC_DB_TAG='$TAG' \
            CGC_DB_TARGET_VOLUME='$VOL' \
            CGC_DB_OWNER='10001:999' \
            CGC_INDEX_REPOS='$REPOS' \
            CGC_PRIVATE_REPOS='$PRIV' \
            MCP_CONTAINER='$CTR' \
            sh -c 'sh /tmp/cgc-restore-all.sh > /tmp/cgc-restore.log 2>&1; echo \$? > /tmp/cgc-restore.rc' \
            >/dev/null 2>&1 </dev/null &
          sleep 2
          echo launched
          EOF
          # shellcheck disable=SC2086
          ssh $CGC_SSH_OPTS "$TARGET" 'sh -s' < /tmp/remote-restore.sh
          # Poll with short-lived connections. 120 x 30s = 60 min ceiling, against a
          # restore observed at ~50 min on this box.
          RC=""
          i=0
          while [ $i -lt 120 ]; do
            sleep 30
            i=$((i + 1))
            # shellcheck disable=SC2086
            RC=$(ssh $CGC_SSH_OPTS "$TARGET" "cat /tmp/cgc-restore.rc 2>/dev/null" 2>/dev/null || echo "")
            [ -n "$RC" ] && break
            [ $((i % 10)) -eq 0 ] && echo "[cgc-db] still restoring (${i}0s elapsed)..."
          done
          # shellcheck disable=SC2086
          ssh $CGC_SSH_OPTS "$TARGET" "tail -25 /tmp/cgc-restore.log" || true
          # shellcheck disable=SC2086
          # Safety net only: the script restarts the container itself on success, but a
          # failure between its stop and its restart would otherwise leave the MCP down.
          # Starting an already-running container is a no-op error here, hence || true.
          ssh $CGC_SSH_OPTS "$TARGET" "sudo docker start $CTR" >/dev/null 2>&1 || true
          if [ -z "$RC" ]; then
            echo "::error::[cgc-db] restore-all did not finish within 60 min on $HOST"
            exit 1
          fi
          if [ "$RC" != "0" ]; then
            echo "::error::[cgc-db] restore-all failed on $HOST (rc=$RC)"
            exit "$RC"
          fi
          echo "[cgc-db] restore-all OK — $HOST now serving the freshly pulled multi-image DB"
