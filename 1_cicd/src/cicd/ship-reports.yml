name: "Ship → Reports image"

on:
  push:
    paths:
      # 2026-08-19 the source moved cloud-data/reports -> cloud-infra, and
      # 2026-08-27 a_solutions split out to the cloud-u-containers submodule.
      # The old "reports/**" globs pointed at a directory that no longer
      # exists in this repo, so push has not fired since the move (before
      # that, "reports/*/src/**" matched a nonexistent reports/<crate>/src/**
      # shape and never fired either — 2026-07-03).
      #
      # a_solutions is a SUBMODULE: a source change lands here only as a
      # pointer bump, and GitHub does match the gitlink path against these
      # globs. Pointer-only pushes still need a workflow_dispatch when the
      # bump is pushed without touching anything else.
      - "a_solutions"
      - "a_solutions/infra-obs_reports/**"
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  preflight-symlinks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Without the submodules every 1_cloud-configs/src/inputs/builds/*.json
      # symlink dangles (they point into a_solutions/), so the check below
      # reported ~80 "broken" links and failed the run before it built anything.
      - uses: ./.github/actions/init-submodules
        with:
          include: I_cloud a_solutions
      - name: Fail on broken symlinks (source trees only)
        run: |
          set -e
          # Scope: THIS workflow's build inputs — the reports source tree — plus the
          # build-*.json symlinks it resolves. Scanning the whole repo (the original
          # behaviour) failed every single run on symlinks that are dangling by
          # design and are not build inputs: I_cloud/* sibling-repo pointers, the
          # legacy 2_reports/ compatibility shims left by the 2026-08-19 move,
          # z_archive/* archived services, and vendored node_modules links.
          # Skip dist/target — build outputs, not inputs, and cargo legitimately
          # symlinks into ~/.cargo there.
          broken=$(find a_solutions/infra-obs_reports 1_cloud-configs/src/inputs -xtype l \
            -not -path "*/dist/*" \
            -not -path "*/target/*" \
            -not -path "*/node_modules/*" 2>/dev/null || true)
          if [ -n "$broken" ]; then
            echo "::error::Broken symlinks found in source tree:"
            echo "$broken"
            exit 1
          fi
          echo "No broken symlinks in source tree."

  # ── Per-arch NATIVE builds on GitHub-hosted runners ──────────────
  # Doctrine (same as ship.yml and unix's ship-builders.yml): NO QEMU, and
  # never a single-arch :latest. 1_cloud-configs/dist/build-workflows.json
  # declares BOTH .runners.amd64 and .runners.arm64 as {"type":"local"} —
  # amd64 on ubuntu-latest, arm64 on ubuntu-24.04-arm.
  #
  # WHY THIS REPLACED THE cloud-builder ROUTE (2026-08-31): this job used to
  # `docker run <cloud-builder> ship-reports`, whose entrypoint exec'd
  # /root/git/cloud-data/.github/workflows/scripts/ship-reports.sh. That path
  # died with the 2026-08-19 cloud-data -> cloud-infra move, so the workflow
  # had never once completed. Repointing it was not viable: that script
  # dispatched the arm64 leg over WireGuard to an SSH runner via
  # .runners.arm64 {type:ssh, host:oci-apps}, and .runners.arm64 is now
  # type=local — the script's own guard fails loud on that. Hosted arm64
  # runners made the whole builder+mesh+SSH detour obsolete.
  build:
    name: "Build ${{ matrix.arch }} (native)"
    needs: preflight-symlinks
    runs-on: ${{ matrix.runs_on }}
    # Hang guard (same doctrine as ship-home-manager 2026-07-08): a wedged
    # build must never hold a runner hostage. Cold Rust workspace build of
    # the 5 report binaries is ~15-25 min, minutes warm off the layer cache.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs_on: ubuntu-latest
          - arch: arm64
            runs_on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # The build context lives in the a_solutions submodule
      # (cloud-u-containers). A bare checkout leaves it empty and the build
      # fails "Dockerfile not found". This action routes the SSH-spelled
      # public submodule URLs over anonymous HTTPS, so no credential needed.
      - uses: ./.github/actions/init-submodules
        with:
          include: a_solutions

      - name: Resolve image ref from build.json
        id: meta
        run: |
          set -eu
          BJ="a_solutions/infra-obs_reports/build.json"
          [ -f "$BJ" ] || { echo "::error::$BJ missing — a_solutions submodule not initialised"; exit 1; }
          REG=$(jq -r '.docker.registry' "$BJ")
          IMG=$(jq -r '.docker.image' "$BJ")
          {
            echo "image=${REG}/${IMG}"
            echo "context=a_solutions/infra-obs_reports/src"
            echo "short_sha=${GITHUB_SHA:0:7}"
          } >> "$GITHUB_OUTPUT"
          echo "Image:   ${REG}/${IMG}"
          echo "Context: a_solutions/infra-obs_reports/src"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push :${{ matrix.arch }}
        # Plain native docker build — no buildx, no QEMU. Pushes the per-arch
        # tag and its pinned :<sha>-<arch> ONLY. :latest is written
        # EXCLUSIVELY by the manifest job below (incident 2026-07-02: an
        # amd64-only :latest overwrote the multi-arch list and every arm64
        # Dagu DAG on oci-apps died with "exec format error" for six weeks).
        run: |
          set -eu
          IMAGE='${{ steps.meta.outputs.image }}'
          ARCH='${{ matrix.arch }}'
          SHA='${{ steps.meta.outputs.short_sha }}'
          docker pull "$IMAGE:$ARCH" 2>/dev/null || true
          DOCKER_BUILDKIT=1 docker build \
            --network=host \
            --cache-from "$IMAGE:$ARCH" \
            -t "$IMAGE:$ARCH" \
            -t "$IMAGE:$SHA-$ARCH" \
            '${{ steps.meta.outputs.context }}'
          docker push "$IMAGE:$ARCH"
          docker push "$IMAGE:$SHA-$ARCH"

      - name: Smoke-test — report binaries and sops on PATH
        # sops is load-bearing: entrypoint.sh §3b decrypts NOREPLY_PASSWORD
        # (outbound SMTP-AUTH) with it, so an image missing sops sends no
        # daily mail while every DAG still reports green.
        run: |
          set -eu
          IMAGE='${{ steps.meta.outputs.image }}:${{ matrix.arch }}'
          MISSING=""
          for bin in cloud-health-full-daily cloud-mail-health-full \
                     cloud-url-health-report cloud-sec-network cloud-sec-data \
                     sops jq curl; do
            docker run --rm --entrypoint sh "$IMAGE" -c "command -v $bin >/dev/null 2>&1" \
              || MISSING="$MISSING $bin"
          done
          [ -z "$MISSING" ] || { echo "::error::missing from $IMAGE:$MISSING"; exit 1; }
          echo "Smoke-test OK: ${{ matrix.arch }}."

  manifest:
    name: "Publish multi-arch :latest"
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/init-submodules
        with:
          include: a_solutions

      - name: Resolve image ref from build.json
        id: meta
        run: |
          set -eu
          BJ="a_solutions/infra-obs_reports/build.json"
          echo "image=$(jq -r '.docker.registry + "/" + .docker.image' "$BJ")" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create + verify multi-arch manifests
        # TESTER built in: after creating :latest, inspect it and FAIL unless
        # BOTH linux/amd64 and linux/arm64 are present.
        run: |
          set -eu
          IMAGE='${{ steps.meta.outputs.image }}'
          SHA='${{ steps.meta.outputs.short_sha }}'
          docker buildx imagetools create \
            -t "$IMAGE:latest" -t "$IMAGE:$SHA" \
            "$IMAGE:amd64" "$IMAGE:arm64"
          PLATFORMS=$(docker buildx imagetools inspect "$IMAGE:latest" --raw \
            | jq -r '[.manifests[].platform | "\(.os)/\(.architecture)"] | sort | join(",")')
          echo "platforms in :latest → $PLATFORMS"
          case "$PLATFORMS" in
            *linux/amd64*linux/arm64*|*linux/arm64*linux/amd64*) echo "multi-arch OK" ;;
            *) echo "::error::$IMAGE:latest is not multi-arch ($PLATFORMS)"; exit 1 ;;
          esac
