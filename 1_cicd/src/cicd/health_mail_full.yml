name: Health Mail Full

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

# Shares the gha-runner WireGuard identity (10.0.0.200) with ship.yml and the
# cgc-db jobs — two concurrent wg-quick handshakes with the same key evict each
# other from the gcp-proxy hub and every 10.0.0.x SSH then times out. Serialise
# on the same group they use.
concurrency:
  group: ship-wg-runner
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mail-health:
    name: Mail health (liveness + cross-store reconciliation)
    runs-on: ubuntu-latest
    env:
      WG_PRIVATE_KEY: ${{ secrets.WG_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      # SSH below targets WireGuard mesh IPs (10.0.0.4 / 10.0.0.6) — port 22 is
      # firewalled to the mesh, so without wg0 every connection times out.
      - name: Install runtime deps (wireguard-tools, jq)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq wireguard-tools jq

      - name: WireGuard up
        run: bash 1_cicd/src/scripts/cloud-ship-ci-setup-wireguard.sh

      - name: Setup SSH config
        env:
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$OCI_SSH_KEY" > ~/.ssh/oci_key
          chmod 600 ~/.ssh/oci_key
          {
            echo "Host oci-analytics"; echo "  HostName 10.0.0.4"; echo "  User ubuntu"; echo "  IdentityFile ~/.ssh/oci_key"; echo "  StrictHostKeyChecking no"; echo "  BatchMode yes"
            echo "Host oci-apps";      echo "  HostName 10.0.0.6"; echo "  User ubuntu"; echo "  IdentityFile ~/.ssh/oci_key"; echo "  StrictHostKeyChecking no"; echo "  BatchMode yes"
          } >> ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Run mail health check
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          AUTHELIA_BEARER_TOKEN: ${{ secrets.AUTHELIA_BEARER_TOKEN }}
          AUTHELIA_TOKEN_URL: ${{ secrets.AUTHELIA_TOKEN_URL }}
          AUTHELIA_OIDC_CLIENT_ID: ${{ secrets.AUTHELIA_OIDC_CLIENT_ID }}
          AUTHELIA_OIDC_CLIENT_SECRET: ${{ secrets.AUTHELIA_OIDC_CLIENT_SECRET }}
        run: bash 1_cicd/src/ops/cloud-health-mail-full.sh
