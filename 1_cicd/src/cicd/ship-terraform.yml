name: "Ship → terraform"

# Two triggers, by intent:
#   push        → terraform-source change auto-applies immediately.
#   workflow_run → declaration change made gen-configs regen dist/; this
#                 workflow waits for new dist/ to commit, THEN applies.
on:
  push:
    paths:
      - "c_vps/ba-clo_cloudflare/src/**"
      - "c_vps/vps_gcloud/src/**"
      - "c_vps/vps_oci/src/**"
      - "c_vps/vps_hetzner/src/**"
      # a_solutions is DELIBERATELY ABSENT here. Since 2026-09-06 it is a
      # separate repository (diegonmarcos/cloud-u-containers), not a submodule,
      # so a cloudflare-worker change touches no path in THIS repo and no
      # `paths:` entry can match it. It arrives on repository_dispatch below.
      - "1_cicd/src/cicd/ship-terraform.yml"
    branches: [main]
  workflow_run:
    workflows: ["Ship → gen-configs (cloud-data)"]
    types: [completed]
    branches: [main]
  # Container-repo pushes. client_payload.{before,after} is the range the
  # cf-worker detection below diffs inside the a_solutions checkout.
  repository_dispatch:
    types: [containers-push]
  workflow_dispatch:
    inputs:
      project:
        description: "Target project (cloudflare, gcloud, oci, hetzner, cf-worker, or empty for all changed)"
        required: false
        type: string

concurrency:
  group: terraform
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
    # Job-level so the composite fetch-vault action inherits SOPS_AGE_KEY and
    # its Export step's inline branch succeeds (multi-line keys arrive as
    # SOPS_AGE_KEY_FILE=<path> whose file isn't on the runner). Matches
    # ship-gen-configs / ship / ship-home-manager.
    env:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # a_solutions is its OWN repository (diegonmarcos/cloud-u-containers),
      # NOT a submodule of this one (split out 2026-09-06). It is checked out
      # at the path every in-repo reference already uses, so nothing
      # downstream changes. fetch-depth: 0 — per-service change detection
      # walks its history. Both repos are public, so GITHUB_TOKEN suffices.
      - name: Checkout cloud-u-containers into a_solutions
        uses: actions/checkout@v4
        with:
          repository: diegonmarcos/cloud-u-containers
          path: a_solutions
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          # Pin to the exact commit the dispatch announced, so the tree that
          # was detected is the tree that gets shipped. Empty on every other
          # event, which checks out the default branch as before.
          ref: ${{ github.event.client_payload.after }}

      # Allowlist: `submodules: true` aborts checkout on the first submodule
      # CI cannot reach (vault / notes / cloud-data-lfs are private siblings;
      # cloud-master's own .gitmodules is SSH-only). Init just what is used.
      - uses: ./.github/actions/init-submodules
        with:
          include: I_cloud
          cloud_data_deploy_key: ${{ secrets.CLOUD_DATA_DEPLOY_KEY }}

      - name: Path relevance gate
        id: paths
        if: ${{ github.event_name == 'workflow_run' }}
        run: |
          # The a_solutions alternative is gone from this pattern: a_solutions
          # is a separate repository now, so a workflow_run commit in THIS repo
          # can never carry an a_solutions path of any shape. cf-worker changes
          # arrive on repository_dispatch, which this gate does not run for.
          CHANGED=$(git diff --name-only HEAD^ HEAD 2>/dev/null | grep -E '^c_vps/' | head -1 || true)
          if [ -z "$CHANGED" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::skip — no c_vps/ changes in upstream commit"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      # NO local dist/ regen — gen-configs already ran first and committed
      # the canonical dist/ to origin/main, which actions/checkout pulled.

      # Per-project path detection — pure git diff against HEAD^ (we have
      # full history thanks to fetch-depth: 0). dorny/paths-filter was
      # broken because passing `base: HEAD~1` makes it run
      # `git fetch origin HEAD~1` — invalid as a REMOTE refspec. Native
      # git diff is the same logic without the remote-fetch bug.
      - name: Detect changes
        id: changes
        if: ${{ steps.paths.outputs.skip != 'true' && (github.event_name == 'push' || github.event_name == 'workflow_run' || github.event_name == 'repository_dispatch') }}
        run: |
          set -eu
          # On repository_dispatch the event describes a push to the CONTAINER
          # repo and makes no claim about this one, so this repo's HEAD^..HEAD
          # is an unrelated commit. Diffing it would apply terraform for a
          # c_vps edit that this event knows nothing about.
          if [ "$GITHUB_EVENT_NAME" = "repository_dispatch" ]; then
            DIFF=""
          else
            DIFF=$(git diff --name-only HEAD^ HEAD)
          fi
          set_out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
          match() { echo "$DIFF" | grep -qE "$1" && echo true || echo false; }
          set_out cloudflare "$(match '^c_vps/ba-clo_cloudflare/src/')"
          set_out gcloud     "$(match '^c_vps/vps_gcloud/src/')"
          set_out oci        "$(match '^c_vps/vps_oci/src/')"
          set_out hetzner    "$(match '^c_vps/vps_hetzner/src/')"

          # a_solutions is a SEPARATE REPOSITORY (since 2026-09-06). There is no
          # gitlink here to diff, so the cf-worker range comes from the
          # repository_dispatch payload and is diffed inside the a_solutions
          # checkout against its own history. Degrading an unresolvable SHA to
          # an empty diff would make terraform run with cf-worker=false and go
          # green having applied nothing — the exact false-green this guards.
          SUB_DIFF=""
          if [ "$GITHUB_EVENT_NAME" = "repository_dispatch" ]; then
            NEW_SUB="${{ github.event.client_payload.after }}"
            OLD_SUB="${{ github.event.client_payload.before }}"
            if [ -z "$NEW_SUB" ] || ! git -C a_solutions cat-file -e "${NEW_SUB}^{commit}" 2>/dev/null; then
              echo "::error::repository_dispatch client_payload.after is missing or absent from the cloud-u-containers checkout (after='$NEW_SUB') — refusing to apply a silent subset"
              exit 1
            fi
            if [ -z "$OLD_SUB" ] \
               || [ "$OLD_SUB" = "0000000000000000000000000000000000000000" ] \
               || ! git -C a_solutions cat-file -e "${OLD_SUB}^{commit}" 2>/dev/null; then
              echo "::warning::client_payload.before unusable (before='$OLD_SUB') — falling back to ${NEW_SUB}^"
              OLD_SUB=$(git -C a_solutions rev-parse --verify --quiet "${NEW_SUB}^" || true)
              [ -n "$OLD_SUB" ] || { echo "::error::cannot resolve a base commit for a_solutions — refusing to apply a silent subset"; exit 1; }
            fi
            SUB_DIFF=$(git -C a_solutions diff --name-only "$OLD_SUB" "$NEW_SUB")
            echo "detect: a_solutions ${OLD_SUB}..${NEW_SUB}"
          fi
          # Paths here are a_solutions-repo-relative ("<svc>/src/..."), so there
          # is no "a_solutions/" prefix to anchor on.
          match_sub() { echo "$SUB_DIFF" | grep -qE "$1" && echo true || echo false; }
          set_out cf-worker  "$(match_sub '^infra-cloud_cloudflare-worker/src/')"

      # Vault clone — provides ~/git/cloud-vault/vault-keys-docker.envfile that
      # cloud-builder's compose.yaml references via env_file:. Without it,
      # `docker compose run cloud-builder` aborts: "env file ... not found".
      - name: Fetch vault
        if: ${{ steps.paths.outputs.skip != 'true' }}
        uses: ./.github/actions/fetch-vault
        with:
          vault_deploy_key: ${{ secrets.VAULT_DEPLOY_KEY }}

      - name: Resolve builder image
        if: ${{ steps.paths.outputs.skip != 'true' }}
        uses: ./.github/actions/resolve-builder-image

      # GCP auth — writes a service-account JSON to $GOOGLE_APPLICATION_CREDENTIALS
      # on the runner. Mounted into cloud-builder below at a stable path.
      - name: Authenticate GCP
        if: ${{ steps.paths.outputs.skip != 'true' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          create_credentials_file: true

      - name: Run terraform inside cloud-builder
        if: ${{ steps.paths.outputs.skip != 'true' }}
        env:
          INPUT_PROJECT: ${{ inputs.project }}
          EVENT_NAME: ${{ github.event_name }}
          CHANGES_CLOUDFLARE: ${{ steps.changes.outputs.cloudflare }}
          CHANGES_GCLOUD: ${{ steps.changes.outputs.gcloud }}
          CHANGES_OCI: ${{ steps.changes.outputs.oci }}
          CHANGES_HETZNER: ${{ steps.changes.outputs.hetzner }}
          CHANGES_CF_WORKER: ${{ steps.changes.outputs.cf-worker }}
          # TF_VAR_* — terraform variable passthrough.
          # Phase 1: still per-secret. Phase 2 (PREVIEW migration): move all
          # of these to vault and source them via vault-keys-bash.env.
          TF_VAR_cloudflare_api_key: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          TF_VAR_ssh_public_key: ${{ secrets.GCP_SSH_PUBLIC_KEY }}
          TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          TF_VAR_compartment_ocid: ${{ secrets.OCI_COMPARTMENT_OCID }}
          TF_VAR_region: ${{ secrets.OCI_REGION }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          TF_VAR_hcloud_token: ${{ secrets.HETZNER_API_TOKEN }}
          # gcp-gpu-embed's Caddy bearer token (c_vps/vps_gcloud/src/startup-gpu-embed.sh).
          # Same value must be set as the cloud-infra repo secret GPU_EMBED_BEARER_TOKEN
          # so cgc-db-index.yml's runner presents it as LOCAL_EMBED_API_KEY.
          TF_VAR_gpu_embed_bearer_token: ${{ secrets.GPU_EMBED_BEARER_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -eu
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # BUILDER_IMAGE is exported by ./.github/actions/resolve-builder-image
          # which reads II_Unix/cb_containers-builders/build.json (master).
          IMAGE="$BUILDER_IMAGE"
          docker pull "$IMAGE"
          # Pull the canonical compose.yaml from the image, then run terraform
          # inside it. Engine script (cloud-ship-terraform-deploy-apply.sh) is
          # the universal engine — same script runs locally + in CI.
          docker run --rm "$IMAGE" cat /opt/cloud-builder/compose.yaml > /tmp/cb.yaml
          docker compose -f /tmp/cb.yaml run --rm \
            --cap-add NET_ADMIN \
            -v "$HOME/git/cloud-vault:/root/git/cloud-vault:ro" \
            -v "$GITHUB_WORKSPACE:/root/git/cloud-gha" \
            -v "$GOOGLE_APPLICATION_CREDENTIALS:/tmp/gcp-sa.json:ro" \
            -e GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-sa.json \
            -e INPUT_PROJECT \
            -e EVENT_NAME \
            -e CHANGES_CLOUDFLARE -e CHANGES_GCLOUD -e CHANGES_OCI -e CHANGES_HETZNER -e CHANGES_CF_WORKER \
            -e TF_VAR_cloudflare_api_key -e CLOUDFLARE_API_KEY -e CLOUDFLARE_EMAIL \
            -e TF_VAR_ssh_public_key \
            -e TF_VAR_tenancy_ocid -e TF_VAR_compartment_ocid -e TF_VAR_region \
            -e OCI_TENANCY_OCID -e OCI_USER_OCID -e OCI_FINGERPRINT -e OCI_PRIVATE_KEY -e OCI_REGION \
            -e TF_VAR_hcloud_token \
            -e TF_VAR_gpu_embed_bearer_token \
            cloud-builder \
            sh -c "cd /root/git/cloud-gha && bash 1_cicd/dist/scripts/cloud-ship-terraform-deploy-apply.sh"
