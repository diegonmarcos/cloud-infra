name: Fetch GitHub repos

# Refreshes 1_cloud-configs/src/inputs/github-repos.json — the source of truth for
# WHICH REPOS EXIST.
#
# Why a scheduled fetch-and-commit rather than an API call inside build.sh:
# the consolidator runs offline and reproducibly (same inputs → byte-identical
# output), and every consumer — home-manager, CI, a fresh clone — depends on
# that. Calling GitHub mid-build would make the output depend on network,
# auth, and the moment it ran. Fetching on a schedule and committing the
# result keeps the data real AND the build hermetic.
#
# What this protects against: gitea.mirrors and octocode.repo_map are policy
# declarations. They cannot answer "does this repo exist" — and when a mirror
# pointed at diegonmarcos/front, a repo that has never existed, nothing
# noticed and it silently never synced. buildDatabases now cross-checks every
# declaration against this inventory and reports `_dangling_declarations`.
#
# SECRETS: `cloud` is a public repository, but repo NAMES are not sensitive —
# the full inventory including private repos is committed here by design. What
# must never land in the repo is the TOKEN. It is read from the vault at run
# time (GH Actions masks it in logs) and only the resulting names are written.
# Enumerating private repos needs that token: the repo-scoped github.token
# cannot see them and would silently produce a public-only list.

on:
  schedule:
    - cron: "0 6 * * 1"          # Mondays 06:00 UTC — repo lists move slowly
  workflow_dispatch:
    inputs:
      allow_shrink:
        description: "Permit the inventory to lose repos (only if repos were genuinely deleted)"
        required: false
        default: "false"
  push:
    paths:
      - "1_cicd/src/cicd/fetch-github-repos.yml"
      - ".github/workflows/fetch-github-repos.yml"

permissions:
  contents: write

concurrency:
  group: fetch-github-repos
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # fetch-vault runs `vault/build.sh env`, which decrypts with sops —
      # without this the action dies with "No SOPS age key available".
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch vault
        uses: ./.github/actions/fetch-vault
        with:
          vault_deploy_key: ${{ secrets.VAULT_DEPLOY_KEY }}

      - name: Fetch repo inventory
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          # Token comes from the vault, never from a file in this repo.
          set +u; . "$HOME/git/vault/vault-keys-bash.env"; set -u
          export GH_TOKEN="${GITHUB_TOKEN:?GITHUB_TOKEN missing from vault-keys-bash.env}"
          page=1
          echo '[]' > /tmp/acc.json
          while :; do
            curl -sS -H "Authorization: Bearer $GH_TOKEN" \
                 -H "Accept: application/vnd.github+json" \
                 "https://api.github.com/user/repos?per_page=100&affiliation=owner&page=$page" \
                 > /tmp/raw.json
            # An error response is an OBJECT, not an array. Fail on it — an
            # earlier version fell back to a narrower endpoint on error and
            # silently wrote a truncated inventory over a complete one while
            # reporting success. No silent degradation.
            if ! jq -e 'type == "array"' /tmp/raw.json >/dev/null 2>&1; then
              echo "::error::/user/repos did not return a list — token cannot enumerate repos. Response: $(head -c 300 /tmp/raw.json)"
              exit 1
            fi
            n=$(jq 'length' /tmp/raw.json)
            jq -s '.[0] + .[1]' /tmp/acc.json /tmp/raw.json > /tmp/acc.next && mv /tmp/acc.next /tmp/acc.json
            [ "$n" -lt 100 ] && break
            page=$((page + 1))
          done

          # Second belt: a token can be valid yet scoped to fewer repos than
          # last time. Never let an inventory shrink silently — losing a repo
          # here turns its declarations into false "dangling" reports
          # downstream. Shrinking requires a human via workflow_dispatch.
          if [ -f 1_cloud-configs/src/inputs/github-repos.json ]; then
            before=$(jq '.repos | length' 1_cloud-configs/src/inputs/github-repos.json)
            after=$(jq 'length' /tmp/acc.json)
            if [ "$after" -lt "$before" ] && [ "${{ github.event.inputs.allow_shrink }}" != "true" ]; then
              echo "::error::inventory would shrink ${before} -> ${after}. Refusing: this usually means a token scope regression, not deleted repos. Re-run via workflow_dispatch with allow_shrink=true if the loss is real."
              jq -r --slurpfile new /tmp/acc.json '.repos[].name' 1_cloud-configs/src/inputs/github-repos.json \
                | grep -vxF -f <(jq -r '.[].name' /tmp/acc.json) | sed 's/^/  missing: /' || true
              exit 1
            fi
          fi

          # Sorted by pushed_at desc so the diff is stable run to run.
          jq --arg owner "$OWNER" --arg now "$(date -u +%FT%TZ)" '{
            _warning: "FETCHED DATA — do not hand-edit. Refreshed by .github/workflows/fetch-github-repos.yml.",
            _doc: "Source of truth for WHICH REPOS EXIST — all repos, public and private. Repo NAMES are not sensitive; the token used to fetch them is, and never leaves the vault / GH secrets. Declarations (gitea.mirrors / octocode.repo_map) are a policy selection over this, never a substitute.",
            _source: "GitHub API",
            fetched_at: $now,
            owner: $owner,
            repos: ([.[] | {name: .name, visibility: (.visibility // (if .private then "private" else "public" end)), fork: .fork, pushed_at: .pushed_at}] | sort_by(.pushed_at) | reverse)
          }' /tmp/acc.json > 1_cloud-configs/src/inputs/github-repos.json

          echo "repos: $(jq '.repos | length' 1_cloud-configs/src/inputs/github-repos.json)"

      - name: Commit if changed
        run: |
          set -euo pipefail
          # fetched_at always moves; only commit when the repo LIST changed,
          # otherwise this would push a no-op commit every single week.
          if git diff --quiet -- 1_cloud-configs/src/inputs/github-repos.json; then
            echo "no change"; exit 0
          fi
          if [ -z "$(git diff -- 1_cloud-configs/src/inputs/github-repos.json | grep -E '^[+-] +"(name|visibility|fork)"' || true)" ]; then
            echo "only fetched_at/pushed_at moved — skipping commit"
            git checkout -- 1_cloud-configs/src/inputs/github-repos.json
            exit 0
          fi
          git config user.name  "Claude"
          git config user.email "noreply@anthropic.com"
          git add 1_cloud-configs/src/inputs/github-repos.json
          git commit -m "chore(configs): refresh GitHub repo inventory"
          git push origin HEAD:main
