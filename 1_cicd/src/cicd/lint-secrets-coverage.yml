name: lint-secrets-coverage
on:
  pull_request:
    paths:
      # a_solutions is DELIBERATELY ABSENT here. Since 2026-09-06 it is a
      # separate repository (cloud-u-containers), so a pull request against
      # THIS repo can never contain one of its secrets*.yaml / templates/*.tpl
      # / code/**/*.sh / dags/*.yaml / compose.nix files. Their coverage is
      # linted on the repository_dispatch below instead.
      - 'b_infra/**/secrets*.yaml'
      - 'c_vps/**/secrets*.yaml'
      - '1_cicd/src/ops/audit-credentials-coverage.sh'
      - '1_cicd/src/ops/lint-secrets-coverage.sh'
      - '1_cicd/src/scripts/cloud-ship-container-step-verify-secret-consumption.sh'
  # Most of the secret-consuming surface this lints lives in cloud-u-containers.
  repository_dispatch:
    types: [containers-push]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      # a_solutions is its OWN repository (diegonmarcos/cloud-u-containers),
      # NOT a submodule of this one (split out 2026-09-06). It is checked out
      # at the path every in-repo reference already uses, so nothing
      # downstream changes. fetch-depth: 0 — per-service change detection
      # walks its history. Both repos are public, so GITHUB_TOKEN suffices.
      - name: Checkout cloud-u-containers into a_solutions
        uses: actions/checkout@v4
        with:
          repository: diegonmarcos/cloud-u-containers
          path: a_solutions
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          # Pin to the exact commit the dispatch announced, so the tree that
          # was detected is the tree that gets shipped. Empty on every other
          # event, which checks out the default branch as before.
          ref: ${{ github.event.client_payload.after }}

      # Allowlist: `submodules: recursive` aborts checkout on the first submodule
      # CI cannot reach (vault / notes / cloud-data-lfs are private siblings;
      # cloud-master's own .gitmodules is SSH-only). Init just what is used.
      - uses: ./.github/actions/init-submodules
        with:
          include: I_cloud
          cloud_data_deploy_key: ${{ secrets.CLOUD_DATA_DEPLOY_KEY }}

      - name: Install sops + jq
        run: |
          set -euo pipefail
          curl -fsSL -o sops https://github.com/getsops/sops/releases/download/v3.9.4/sops-v3.9.4.linux.amd64
          chmod +x sops && sudo mv sops /usr/local/bin/
          sudo apt-get update -qq && sudo apt-get install -qq -y jq

      - name: Write SOPS age key from secret
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/sops/age"
          printf '%s' "$SOPS_AGE_KEY" > "$HOME/.config/sops/age/keys.txt"
          chmod 600 "$HOME/.config/sops/age/keys.txt"

      - name: Run coverage lint
        run: bash 1_cicd/src/ops/lint-secrets-coverage.sh

      # Verify secret consumption: scans every service for forbidden patterns
      # (sed/awk/eval/argv/host-mount on secret material). Warn-mode during
      # repo-wide migration; flips to fail-mode in Phase 8 of the redesign.
      - name: Verify secret consumption (warn-mode)
        run: bash 1_cicd/src/scripts/cloud-ship-container-step-verify-secret-consumption.sh --warn
