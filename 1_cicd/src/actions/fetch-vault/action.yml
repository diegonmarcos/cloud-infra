name: "Fetch Vault Secrets"
description: |
  Clones diegonmarcos/vault via VAULT_DEPLOY_KEY (read-only SSH deploy key)
  and runs vault/build.sh env to generate ~/git/cloud-vault/vault-keys-bash.env. All
  infrastructure secrets (SSH keys, SOPS age, WG privatekey, GHCR token)
  land in that one file, which cloud-builder's compose.yaml mounts via
  env_file. After this action, the only GHA-provided secret needed for
  downstream steps is GITHUB_TOKEN (built-in) + VAULT_DEPLOY_KEY (this one).

inputs:
  vault_deploy_key:
    description: "SSH private key with read access to diegonmarcos/vault"
    required: true
  vault_ref:
    description: "Branch/tag/SHA in vault repo to check out"
    required: false
    default: "main"

outputs:
  vault_env_file:
    description: "Absolute path to the generated vault-keys-bash.env"
    value: ${{ steps.generate.outputs.env_file }}

runs:
  using: "composite"
  steps:
    - name: Clone vault (read-only deploy key)
      shell: bash
      env:
        VAULT_DEPLOY_KEY: ${{ inputs.vault_deploy_key }}
      run: |
        set -eu
        mkdir -p ~/.ssh && chmod 700 ~/.ssh
        printf '%s\n' "$VAULT_DEPLOY_KEY" > ~/.ssh/vault_deploy
        chmod 600 ~/.ssh/vault_deploy
        ssh-keyscan github.com 2>/dev/null >> ~/.ssh/known_hosts
        GIT_SSH_COMMAND="ssh -i ~/.ssh/vault_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
          git clone --depth 1 --branch "${{ inputs.vault_ref }}" \
            git@github.com:diegonmarcos/vault.git \
            "$HOME/git/cloud-vault"
        echo "Vault cloned at $HOME/git/cloud-vault @ $(git -C "$HOME/git/cloud-vault" rev-parse --short HEAD)"

    - name: Generate vault-keys-bash.env
      id: generate
      shell: bash
      run: |
        set -eu
        cd "$HOME/git/cloud-vault"
        # build.sh env = generate_env — reads every provider + env_from_files
        # and writes 6 dialect files: bash.env, fish.fish, systemd.envfile,
        # docker.envfile, systemd.yaml, pub.json. Failing to generate any of
        # them is a hard error (downstream cloud-builder mounts docker.envfile
        # via compose env_file: — silent miss = the original CI breakage).
        bash ./build.sh env
        ENV_FILE="$HOME/git/cloud-vault/vault-keys-bash.env"
        DOCKER_ENV="$HOME/git/cloud-vault/vault-keys-docker.envfile"
        [ -f "$ENV_FILE" ]   || { echo "::error::vault-keys-bash.env not generated";   exit 1; }
        [ -f "$DOCKER_ENV" ] || { echo "::error::vault-keys-docker.envfile not generated (cloud-builder compose.yaml mounts this — Ship/gen-configs will abort downstream)"; exit 1; }
        KEYS=$(grep -cvE '^(#|$)' "$ENV_FILE" || true)
        DOCKER_KEYS=$(grep -cvE '^(#|$)' "$DOCKER_ENV" || true)
        echo "vault-keys-bash.env generated: $KEYS keys"
        echo "vault-keys-docker.envfile generated: $DOCKER_KEYS keys"
        echo "env_file=$ENV_FILE" >> "$GITHUB_OUTPUT"

    - name: Verify infrastructure keys present
      shell: bash
      run: |
        set -eu
        ENV_FILE="$HOME/git/cloud-vault/vault-keys-bash.env"
        DOCKER_ENV="$HOME/git/cloud-vault/vault-keys-docker.envfile"
        MISSING=""
        # Multi-line secrets (age key, PEM SSH keys) are emitted by generate_env
        # as <KEY>_FILE=<path>, NOT inline <KEY>=<value> — this is the intended
        # contract and must stay. Scalars (GITHUB_TOKEN, WG_PRIVATE_KEY) stay
        # inline. Accept EITHER form so both dialects validate as present.
        # Key set tracks the LIVE VM fleet (oci-mail, oci-analytics, oci-apps,
        # gcp-proxy). gcp-t4 was decommissioned (moved to z_archive/) so its
        # GCP_T4_SSH_KEY is no longer provisioned in vault — requiring it here
        # would fail this check forever.
        for k in SOPS_AGE_KEY WG_PRIVATE_KEY GITHUB_TOKEN OCI_SSH_KEY GCP_PROXY_SSH_KEY; do
          grep -qE "^${k}(_FILE)?=" "$ENV_FILE" || MISSING="$MISSING $k"
        done
        if [ -n "$MISSING" ]; then
          echo "::error::Missing required infra keys in vault-keys-bash.env:$MISSING"
          exit 1
        fi
        echo "All 5 required infra keys present in vault-keys-bash.env (inline or _FILE)"

        # Sanity: docker.envfile must carry at least the scalar (single-line)
        # secrets that cloud-builder's compose env_file: passes through. The
        # multi-line PEM keys come via parent-shell envvars, not env_file.
        DOCKER_MISSING=""
        for k in GITHUB_TOKEN WG_PRIVATE_KEY; do
          grep -q "^${k}=" "$DOCKER_ENV" || DOCKER_MISSING="$DOCKER_MISSING $k"
        done
        if [ -n "$DOCKER_MISSING" ]; then
          echo "::error::Missing scalar keys in vault-keys-docker.envfile:$DOCKER_MISSING"
          exit 1
        fi
        echo "Docker envfile has required scalar keys"

    - name: Export SOPS_AGE_KEY_FILE for downstream steps
      shell: bash
      run: |
        # Materialise age key as a file so sops commands that use SOPS_AGE_KEY_FILE
        # (not just SOPS_AGE_KEY env) work identically to local dev.
        mkdir -p ~/.config/sops/age
        # The age key may arrive two ways: inline SOPS_AGE_KEY (GHA env secret)
        # or SOPS_AGE_KEY_FILE=<path> (new multi-line contract from generate_env).
        # Prefer inline; fall back to copying the file the path points at.
        # shellcheck disable=SC1091
        set -a; . "$HOME/git/cloud-vault/vault-keys-bash.env"; set +a
        if [ -n "${SOPS_AGE_KEY:-}" ]; then
          printf '%s\n' "$SOPS_AGE_KEY" > ~/.config/sops/age/keys.txt
        elif [ -n "${SOPS_AGE_KEY_FILE:-}" ] && [ -f "${SOPS_AGE_KEY_FILE}" ]; then
          cp "${SOPS_AGE_KEY_FILE}" ~/.config/sops/age/keys.txt
        else
          echo "::error::No SOPS age key available (neither SOPS_AGE_KEY nor SOPS_AGE_KEY_FILE)"; exit 1
        fi
        chmod 600 ~/.config/sops/age/keys.txt
        echo "SOPS_AGE_KEY_FILE=$HOME/.config/sops/age/keys.txt" >> "$GITHUB_ENV"
