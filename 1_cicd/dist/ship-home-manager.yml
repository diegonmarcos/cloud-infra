# ┌──────────────────────────────────────────────────────────────┐
# │  Ship home-manager to VMs                                    │
# │                                                              │
# │  GHA = WG + secrets + docker run. ALL logic in the engine.   │
# │  Per-VM matrix, builder container is self-contained.          │
# └──────────────────────────────────────────────────────────────┘

name: "Ship → home-manager"

# Two triggers, by intent:
#   push        → b_infra/ change auto-ships immediately (code/module level),
#                 but ONLY when the pushed commit carries the required
#                 deploy-authorization marker (see the Gate step below; #414).
#   workflow_run → declaration change made gen-configs regen dist/; this
#                 workflow waits for the new dist/ to commit, THEN ships.
# Manual workflow_dispatch always available, and it requires the
# confirm_fleet_deploy input to be set to true before it will deploy.
on:
  push:
    paths:
      - "b_infra/**"
    branches: [main]
  workflow_run:
    workflows: ["Ship → gen-configs (cloud-data)"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      vm:
        description: "Target VM (e.g. gcp-proxy, oci-apps) or empty for all"
        required: false
        type: string
      confirm_fleet_deploy:
        description: "Set to true to authorise a home-manager fleet deploy. This input exists because a b_infra change used to deploy to ALL FOUR VMs unconditionally (#414)."
        required: false
        default: "false"
        type: boolean
      include_opt_in_vms:
        description: "Also ship the OPT-IN VMs (HM_OPT_IN_VMS: oci-mail) on an all-VM dispatch. Targeting one with `vm` ships it too. Off by default: a ~2GB image activation takes 36-64 min on that 1GB VM."
        required: false
        default: false
        type: boolean

# TWO locks, on purpose (2026-10-14).
#
# 1. Workflow level: this workflow's OWN group, one running + ONE pending run.
#    A newer run cancels the older still-queued one (GitHub's default
#    one-pending-slot eviction — deliberately NO `queue: max` here). A newer
#    run supersedes an older queued one because the gate diffs from the last
#    run that covered the fleet, not just HEAD^..HEAD
#    (cloud-ship-hm-supersede-range.sh). The evicted run reports `cancelled`;
#    ship-reconcile.yml's requeue-evicted-run sees the newer pending run
#    (NEWER_COVERING) and correctly leaves it alone. One run at a time also
#    keeps the per-VM order and means two home-manager runs never touch the
#    same VM at once.
#
# 2. Job level (deploy, below): the fleet-wide WG lock ship-wg-runner, taken
#    PER VM job instead of for the whole run. It used to be held at workflow
#    level (2026-09-06, #844 queue: max). With that, every gen-configs refresh
#    queued another 1-2 h fleet run in the FIFO and service deploys waited
#    behind all of them: on 2026-10-14, 13 queued home-manager runs held
#    Matomo, Dagu, wireguard and Caddy deploys for hours. Now a Ship deploy can
#    take the lock between two VM jobs.
#
# Test: 9_others/test/test_hm_supersede_range.sh (plus the #842/#844 models in
# test_ship_hm_eviction_requeue.sh / test_ship_burst_no_dropped_deploy.sh).
concurrency:
  group: ship-home-manager
  cancel-in-progress: false

jobs:
  deploy:
    # timeout-minutes caps each per-VM matrix job. Without it GitHub's 6h
    # default applies: a wedged ship-hm (slow/failing nix-copy+activate onto a
    # 1GB VM, or a dropped WG tunnel) holds this max-parallel:1 +
    # cancel-in-progress:false group for hours, jamming EVERY subsequent
    # home-manager deploy (observed 2026-07-08: a 1.5h wedge cascaded into
    # repeated queue jams).
    #
    # It was 45, on the belief that 45m is generous for a closure cp to a small
    # VM. Measured, it is not (#657): a docker activation on the 1 GB VMs takes
    # 36-64 min, every one exit 0, so the ship was declared failed while the
    # generation it shipped went live. 90 matches ship.yml's deploy jobs and is
    # far under the ship-wg-runner ceiling (test_wg_group_lock_bounded.sh). A
    # dead activation no longer holds the group for the full budget: the engine
    # fails as soon as the process is gone without an exit code.
    timeout-minutes: 90
    # The fleet-wide WG lock, per VM job (see the workflow-level note above).
    # #844: every ship-wg-runner entrant declares `queue: max` (FIFO, no
    # eviction); mixing entrants with and without it is undocumented.
    concurrency:
      group: ship-wg-runner
      cancel-in-progress: false
      queue: max
    strategy:
      fail-fast: false
      # max-parallel: 1 — all matrix jobs share the same WireGuard address
      # (10.0.0.200/24, hardcoded in cloud-builder entrypoint). When run in
      # parallel, the hub kicks all but one peer → SSH tunnels drop mid-pull
      # with exit 255. Serialising avoids the collision; total wall-clock
      # is ~30% slower but every VM gets a clean tunnel.
      max-parallel: 1
      matrix:
        # ORDER IS LOAD-BEARING: gcp-proxy MUST BE LAST. NEVER FIRST.
        #
        # gcp-proxy is the wg0 mesh HUB (10.0.0.1). Every other VM's deploy
        # tunnels through it, and the runner reaches all of them as 10.0.0.200
        # over that hub. Deploying to gcp-proxy therefore severs the path every
        # remaining job needs — combined with max-parallel: 1 above, anything
        # queued behind it dies with it.
        #
        # It is also the smallest box in the fleet: a GCP e2-micro, 1 GB RAM
        # (944 MB usable, ~209 MB available in steady state), which receives a
        # ~2 GB docker image during activation. On 2026-08-12 that wedged it
        # completely — RUNNING at the hypervisor but no SSH, no WireGuard, no
        # ICMP — and because it was FIRST in this list it took the mesh down
        # before oci-mail, oci-analytics or oci-apps had run. All four jobs then
        # failed with "ssh: connect to host 10.0.0.1 port 22: Connection timed
        # out", which reads as four independent failures and is really one: the
        # hub died and everything behind it lost its route. Two consecutive runs
        # (31600637799, 31610340030) failed this way before the shared cause was
        # found, and recovery needed an out-of-band console reset because every
        # remote path — mesh SSH, rescue SSH, mesh DNS, even the gcloud MCP
        # proxy — runs through that host.
        #
        # Last means a wedge costs only its own job and the mesh stays intact
        # for everything before it. This does NOT make deploying to gcp-proxy
        # safe — it bounds the blast radius to one VM instead of four. The real
        # fix is to stop shipping a 2 GB image to a 1 GB VM that is also the
        # fleet's single point of routing.
        vm: [oci-analytics, oci-mail, oci-apps, gcp-proxy]
    runs-on: ubuntu-latest
    name: ${{ matrix.vm }}
    permissions:
      contents: read
      packages: write
      # actions: read — the gate lists this workflow's runs to find the last
      # run that covered the fleet (cloud-ship-hm-supersede-range.sh).
      actions: read
    # Skip when triggered by gen-configs failure (workflow_run fires
    # regardless of upstream conclusion — guard explicitly).
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    # Job-level so the composite `fetch-vault` action (Fetch vault step) inherits
    # it — that action materialises the age key and sops-decrypts BEFORE the Ship
    # step. Without this the run aborts "No SOPS age key available". Mirrors
    # ship.yml's job-level env (the working reference).
    env:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      # Required marker for a b_infra fleet deploy (#414). A commit touching
      # b_infra/** must carry this string in its message before
      # ship-home-manager.yml will ship home-manager to any VM. Set here (not
      # inline in the gate step) so every invocation of the authorization
      # script reads the same value and it can be audited in one place.
      B_INFRA_DEPLOY_MARKER: "[deploy-fleet]"
      # OPT-IN VMs: shipped only when explicitly requested (dispatch `vm` names
      # it, or include_opt_in_vms=true) or when the commit touches THAT VM's
      # own home-manager config (b_infra/nixhm-sudo-<vm>/ or its own
      # build-vm-<vm>.json). Shared inputs — the consolidated artifact that
      # every gen-configs refresh rewrites — no longer wake them. oci-mail is a
      # 1 OCPU / 954MiB E2.1.Micro running the mail stack: on 2026-10-13 it
      # took 6 HM runs in 3h, each pulling a ~2GB image and activating for
      # 36-64 min, on top of load 6-10 and io PSI ~78%. Every other VM's
      # behaviour is unchanged. Logic: cloud-ship-hm-vm-optin.sh; test:
      # 9_others/test/test_hm_ship_vm_optin.sh.
      HM_OPT_IN_VMS: "oci-mail"
    steps:
      # Checkout FIRST so the gate's `git diff` has history.
      # ref = upstream SHA (workflow_run) so we examine the commit that
      # triggered gen-configs, not whatever HEAD is now.
      # fetch-depth=2 = enough for `git diff $SHA^ $SHA`.
      - uses: actions/checkout@v4
        with:
          submodules: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      # Allowlist: `submodules: true` aborts checkout on the first submodule
      # CI cannot reach (vault / notes / cloud-data-lfs are private siblings;
      # cloud-master's own .gitmodules is SSH-only). Init just what is used.
      - uses: ./.github/actions/init-submodules
        with:
          include: I_cloud
          cloud_data_deploy_key: ${{ secrets.CLOUD_DATA_DEPLOY_KEY }}

      - name: Gate (deploy-authorization + manual VM filter + path-relevance)
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARGET="${{ inputs.vm }}"
          VM="${{ matrix.vm }}"
          # 1. Manual workflow_dispatch with single-VM target
          if [ -n "$TARGET" ] && [ "$TARGET" != "$VM" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::skip — other VM targeted ($TARGET ≠ $VM)"
            exit 0
          fi
          # 1b. Opt-in VMs (HM_OPT_IN_VMS, job env above). Decided before the
          #     authorization gate on purpose: a run that was never going to
          #     touch this VM must not go red on its behalf. Non-opt-in VMs get
          #     "deploy not-opt-in" and fall through to the unchanged gates.
          OPTIN=".github/workflows/scripts/cloud-ship-hm-vm-optin.sh"
          if [ ! -f "$OPTIN" ]; then
            echo "::error::opt-in gate is missing ($OPTIN). Refusing to decide for $VM without it."
            exit 1
          fi
          case "${{ github.event_name }}" in
            push)
              # Every path any commit of the push added/modified/removed.
              OPT_PATHS=$(jq -r '(.commits // [])[] | ((.added // []) + (.modified // []) + (.removed // []))[]' "$GITHUB_EVENT_PATH" | sort -u) ;;
            workflow_run)
              # Same commit the path-relevance block below diffs. A failed
              # diff yields no paths, so an opt-in VM stays skipped (its
              # default) and says so; non-opt-in VMs are unaffected.
              OPT_PATHS=$(git diff --name-only HEAD^ HEAD 2>/dev/null || true) ;;
            *) OPT_PATHS="" ;;
          esac
          # Superseded runs: a newer run cancels an older QUEUED one (workflow
          # concurrency above), so this run must also cover every change since
          # the last run that covered the fleet. RANGE_PATHS = non-b_infra
          # paths changed since then + b_infra paths of [deploy-fleet] commits
          # only. Unknown range (exit 3) keeps the single-commit behaviour.
          RANGE_PATHS=""; RANGE_OK=false
          case "${{ github.event_name }}" in
            push|workflow_run)
              if RANGE_PATHS=$(bash .github/workflows/scripts/cloud-ship-hm-supersede-range.sh paths "${{ github.run_id }}"); then
                RANGE_OK=true
                echo "::notice::supersede-range: $(printf '%s\n' "$RANGE_PATHS" | grep -c . || true) path(s) changed since the last covering run"
              else
                RANGE_PATHS=""
                echo "::warning::supersede-range unavailable — gating on this run's own commit(s) only"
              fi
              OPT_PATHS=$(printf '%s\n%s\n' "$OPT_PATHS" "$RANGE_PATHS" | grep . | sort -u || true) ;;
          esac
          OPT=$(printf '%s\n' "$OPT_PATHS" | HM_OPT_IN_VMS="$HM_OPT_IN_VMS" bash "$OPTIN" "$VM" "${{ github.event_name }}" "$TARGET" "${{ inputs.include_opt_in_vms }}")
          if [ "${OPT%% *}" = "skip" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::skip — ${VM}: ${OPT#skip }"
            echo "### ⏭️ ${VM}: NO DEPLOY PERFORMED (opt-in VM)" >> "$GITHUB_STEP_SUMMARY"
            echo "${VM} is in HM_OPT_IN_VMS: ${OPT#skip }. Ship it with workflow_dispatch vm=${VM} (or include_opt_in_vms=true), or by changing b_infra/nixhm-sudo-${VM}/." >> "$GITHUB_STEP_SUMMARY"
            echo "This run being green does **not** mean the VM was updated." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::notice::${VM}: ${OPT}"
          # 2. Deploy-authorization — FAIL CLOSED. A b_infra deploy to the
          #    fleet used to be unconditional (#414): ANY commit touching
          #    b_infra/** shipped home-manager to all four VMs, recreating the
          #    agent containers on oci-apps and killing every running headless
          #    agent mid-task. Every trigger that can deploy must now prove
          #    consent FIRST. The check lives in one testable engine script
          #    (cloud-ship-b-infra-deploy-authorization.sh); a refusal below
          #    exits non-zero, so the job goes RED and no Ship step runs.
          #    delivery: push requires the marker in every b_infra-touching
          #    commit message; workflow_dispatch requires the
          #    confirm_fleet_deploy input = true; workflow_run requires the
          #    marker on the upstream commit (checked after path-relevance,
          #    below, proves a b_infra change actually flowed).
          AUTH=".github/workflows/scripts/cloud-ship-b-infra-deploy-authorization.sh"
          if [ ! -f "$AUTH" ]; then
            echo "::error::deploy-authorization gate is missing ($AUTH). Refusing to deploy a b_infra change with no gate."
            exit 1
          fi
          case "${{ github.event_name }}" in
            push)
              bash "$AUTH" push "$GITHUB_EVENT_PATH"
              ;;
            workflow_dispatch)
              bash "$AUTH" workflow_dispatch "$GITHUB_EVENT_PATH" "${{ inputs.confirm_fleet_deploy }}"
              ;;
            workflow_run)
              # Authorization for workflow_run happens inside block 3 below,
              # after path-relevance decides whether b_infra actually changed.
              ;;
          esac
          # 3. workflow_run path-relevance: skip if upstream commit didn't
          #    touch b_infra/**, AND authorise (require the marker) when it did.
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            # FAIL CLOSED (deploy), NOT OPEN (skip), WHEN THE DIFF ITSELF FAILS.
            # This used to be one pipeline ending in `|| true`, so a git error
            # was indistinguishable from "nothing relevant changed" — both
            # produced an empty CHANGED and skipped. A skip reports the job as
            # SUCCESS, so any git fault here (missing HEAD^ under a shallower
            # checkout, a bad ref, a detached-head edge case) would silently
            # turn every deploy into a green no-op: the fleet stops being
            # updated while the dashboard says everything is fine. That is the
            # worst possible direction to fail in. Capture git's exit status
            # separately and, if the diff cannot be computed, DEPLOY rather
            # than assume there was nothing to do. That same worst-case
            # direction is why the DEPLOY-AUTHORIZATION gate runs BEFORE the
            # diff is even attempted: a refusal is loud and red, never a green
            # skip.
            DIFF_OUT=$(git diff --name-only HEAD^ HEAD 2>&1); DIFF_RC=$?
            if [ "$DIFF_RC" -ne 0 ]; then
              echo "::warning::path-relevance diff failed (exit $DIFF_RC) — deploying rather than skipping. git said: ${DIFF_OUT}"
              CHANGED="forced-by-diff-failure"
            else
              # Relevance = b_infra/ OR any file this VM's build reads from
              # outside b_infra (derived from the symlinks the build follows:
              # the consolidated artifact, build-vm-<vm>.json, hm-config.json).
              # Grepping ^b_infra/ alone skipped every VM on a gen-configs
              # commit that changed only the consolidated artifact — a green
              # ship that deployed nothing (#662). The helper exits non-zero
              # when it cannot derive the input set; that fails the job RED.
              REL=$(printf '%s\n' "$DIFF_OUT" | bash .github/workflows/scripts/cloud-ship-hm-path-relevance.sh "$VM")
              KIND="${REL%% *}"; CHANGED="${REL#* }"
              # Nothing in this commit — but a superseded (cancelled) older
              # run may have carried this VM's change. RANGE_PATHS holds only
              # consented b_infra paths, so a hit there needs no further
              # marker on THIS commit (KIND=range).
              if [ -z "$CHANGED" ] && [ "$RANGE_OK" = true ] && [ -n "$RANGE_PATHS" ]; then
                REL=$(printf '%s\n' "$RANGE_PATHS" | bash .github/workflows/scripts/cloud-ship-hm-path-relevance.sh "$VM")
                if [ -n "$REL" ]; then KIND="range"; CHANGED="${REL#* } (since the last covering run)"; fi
              fi
            fi
            if [ -z "$CHANGED" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "::notice::skip — upstream commit touched neither b_infra/ nor any file ${VM}'s build reads"
              # Make a no-deploy run unmistakable on the run page. A skipped
              # gate still reports the JOB as green, which in the runs list is
              # indistinguishable from a successful deploy. Without this note a
              # deploy path that has been broken for days looks perfectly
              # healthy — which is exactly what happened here: every recent
              # green run had skipped, so nobody saw that shipping was broken.
              echo "### ⏭️ ${VM}: NO DEPLOY PERFORMED" >> "$GITHUB_STEP_SUMMARY"
              echo "Gate skipped this VM — upstream commit touched no \`b_infra/\` path and no build input of this VM." >> "$GITHUB_STEP_SUMMARY"
              echo "This run being green does **not** mean the VM was updated." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::notice::deploy — upstream commit changed ${CHANGED} (${KIND:-forced})"
            # A b_infra change really did flow via gen-configs — require the
            # same marker the push path demands, so no regeneration silently
            # deploys an unmarked b_infra change under a second trigger.
            # A regenerated build INPUT alone (KIND=input) is the declared-data
            # path this trigger exists for (header: "declaration change made
            # gen-configs regen dist/ … THEN ships"); the gen-configs
            # auto-commit never carries the marker, so demanding it there
            # would turn every data delivery red instead of shipping it.
            if [ "${KIND:-}" != "input" ] && [ "${KIND:-}" != "range" ]; then
              bash "$AUTH" workflow_run "$GITHUB_EVENT_PATH"
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      # Detect transient VMs (Spot/preemptible) — failure is non-fatal.
      # Source of truth: build.json:.vm.transient (data-driven per Fire Rule #4).
      # Used to set continue-on-error on the Ship step below.
      - name: Detect transient VM
        id: transient
        if: steps.gate.outputs.skip != 'true'
        run: |
          BJ="b_infra/nixhm-sudo-${{ matrix.vm }}/build.json"
          T=$(jq -r '.vm.transient // false' "$BJ" 2>/dev/null)
          echo "transient=${T}" >> "$GITHUB_OUTPUT"
          [ "$T" = "true" ] && echo "::notice::${{ matrix.vm }} is transient — failure non-fatal" || true

      # NO local dist/ regen here — gen-configs already ran first and
      # committed the canonical dist/ to origin/main, which actions/checkout
      # above pulled. Single source of truth, not a runner-local rebuild.

      # Vault clone — provides ~/git/cloud-vault/vault-keys-docker.envfile that
      # cloud-builder's compose.yaml references via env_file:. Without it,
      # `docker compose run cloud-builder` aborts: "env file ... not found".
      - name: Fetch vault
        if: steps.gate.outputs.skip != 'true'
        uses: ./.github/actions/fetch-vault
        with:
          vault_deploy_key: ${{ secrets.VAULT_DEPLOY_KEY }}

      - name: Resolve builder image
        if: steps.gate.outputs.skip != 'true'
        uses: ./.github/actions/resolve-builder-image

      - name: Ship
        if: steps.gate.outputs.skip != 'true'
        # Transient VMs (Spot instances, preemptible, manually stopped) are
        # often unreachable. continue-on-error makes the matrix green even
        # when their job fails — the persistent VMs are what gates the
        # workflow's overall conclusion.
        continue-on-error: ${{ steps.transient.outputs.transient == 'true' }}
        # The engine's wait for the detached activation ends before this step
        # does, and the step ends before the job does: HM_DEADLINE_EPOCH below
        # hands the engine the wall-clock end of this step (85 min - 3 for
        # teardown), so an activation still running then is reported as STILL
        # RUNNING with its markers kept, instead of a constant of its own
        # declaring it failed (#657) or GitHub SIGKILLing the poller mid-wait.
        # Same pattern as ship.yml's SHIP_DEADLINE_EPOCH.
        timeout-minutes: 85
        env:
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          GCP_PROXY_SSH_KEY: ${{ secrets.GCP_PROXY_SSH_KEY }}
          GCP_T4_SSH_KEY: ${{ secrets.GCP_T4_SSH_KEY }}
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          WG_PRIVATE_KEY: ${{ secrets.WG_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_ACTIONS: true
          GITHUB_REPOSITORY: diegonmarcos/cloud-infra
          GITHUB_SHA: ${{ github.sha }}
        run: |
          export HM_DEADLINE_EPOCH=$(( $(date +%s) + 4920 ))
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # BUILDER_IMAGE is exported by ./.github/actions/resolve-builder-image
          # which reads II_Unix/cb_containers-builders/build.json (master).
          IMAGE="$BUILDER_IMAGE"
          docker pull "$IMAGE"
          # Write secrets to runner fs — compose mounts ~/.ssh and ~/.config/sops as :ro
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$OCI_SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null || true
          mkdir -p ~/.config/sops/age
          echo "$SOPS_AGE_KEY" > ~/.config/sops/age/keys.txt
          # Run — --cap-add NET_ADMIN bootstraps wg-quick inside the container
          # until new cloud-builder images ship with cap_add baked in compose.yaml.
          docker run --rm "$IMAGE" cat /opt/cloud-builder/compose.yaml > /tmp/cloud-builder-compose.yaml
          # Mount the runner's checkout as the container's cloud repo so the
          # HM build reads the CURRENT committed canonical cloud-data, not the
          # image-baked /root/git/cloud-infra (whose git-nuke-to-origin is unreliable
          # → stale dist/pilot → newly-added wg-public peers silently dropped).
          # step_build regenerates dist/ from src/ inside this mount; ephemeral.
          docker compose -f /tmp/cloud-builder-compose.yaml run --rm \
            --cap-add NET_ADMIN \
            -v "$HOME/git/cloud-vault:/root/git/cloud-vault:ro" \
            -v "$GITHUB_WORKSPACE:/root/git/cloud-infra" \
            -e VM="${{ matrix.vm }}" \
            -e HM_DEADLINE_EPOCH \
            cloud-builder ship-hm ${{ matrix.vm }}
