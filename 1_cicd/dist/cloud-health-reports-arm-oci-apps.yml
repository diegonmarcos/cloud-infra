name: Cloud Health Reports (ARM GHA)

# Deliberately NOT scheduled. This is the arm64 variant of the same report,
# kept for manual runs when an arch-specific check is needed. Cloud Health
# Reports (cloud-health-reports.yml) owns the daily cron. All three variants
# publish to the same cloud-data/y_old/reports/dist/, so running them on one
# shared cron made them race: whichever finished last silently overwrote the
# others, and on 2026-09-07 the x86 variant was simply cancelled.
on:
  workflow_dispatch:
    inputs:
      report:
        description: 'Report target (all|cloud|mail|url|sec-network|sec-data|daily-mail)'
        default: 'all'

concurrency:
  group: cloud-health-reports-arm-oci-apps
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-reports:
    name: Run reports
    runs-on: ubuntu-24.04-arm
    env:
      REPORT_TARGET: ${{ inputs.report || 'all' }}
    steps:
      - uses: actions/checkout@v4
      # a_solutions is its OWN repository (diegonmarcos/cloud-u-containers),
      # NOT a submodule of this one (split out 2026-09-06). It is checked out
      # at the path every in-repo reference already uses, so nothing
      # downstream changes. fetch-depth: 0 — per-service change detection
      # walks its history. Both repos are public, so GITHUB_TOKEN suffices.
      - name: Checkout cloud-u-containers into a_solutions
        uses: actions/checkout@v4
        with:
          repository: diegonmarcos/cloud-u-containers
          path: a_solutions
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Init submodules (a_solutions)
        uses: ./.github/actions/init-submodules
        with:
          include: I_cloud

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull reports image
        run: docker pull ghcr.io/diegonmarcos/cloud-data-reports:arm64

      # One env var per declared key; the renderer matches them to VMs by the
      # ssh_secret name in the declarations. GCP_T4_SSH_KEY is gone: it was
      # written to disk as gcp_t4_key and no Host block ever used it, and the
      # GPU box it belongs to has `gha: null` / no wg_ip in the declarations.
      - name: Setup SSH config for reports container
        env:
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          GCP_PROXY_SSH_KEY: ${{ secrets.GCP_PROXY_SSH_KEY }}
        run: |
          # Third copy of the same hand-written VM → IP → user → key table,
          # identical to the two in cloud-health-reports.yml and
          # health_mail_full.yml. All three now read the declarations
          # (config.json vms[*].gha → 1_cloud-configs/dist/build-gha.json)
          # through one renderer, so an IP change lands in one place (#20).
          #
          # SSH_IDENTITY_DIR is the path the reports CONTAINER sees, which is
          # not where the runner writes the files.
          SSH_CONFIG_DIR="$GITHUB_WORKSPACE/.reports-ssh" SSH_IDENTITY_DIR=/root/.ssh \
            bash 1_cicd/src/scripts/cloud-ship-ci-ssh-config.sh
          chmod 700 "$GITHUB_WORKSPACE/.reports-ssh"

      - name: Run reports
        run: |
          # NOTE: this runner (ubuntu-24.04-arm) is a genuine GitHub-hosted
          # runner, NOT a self-hosted docker-in-docker box — $GITHUB_WORKSPACE
          # is a real path on the same host the docker daemon runs on, exactly
          # like the x86/plain variants. The HOST_RUNNER_WORKDIR/HOST_WS
          # translation this step used to do was leftover from an earlier
          # self-hosted "oci-apps" runner setup and had gone stale (it no
          # longer matched this runner's real work-dir layout at all), which
          # is WHY both mounts silently resolved to empty directories and the
          # whole job died with "No such file or directory" (2026-08-14 -
          # 2026-08-19 outage). Mount $GITHUB_WORKSPACE directly — no
          # translation needed.
          docker run --rm \
            --network host \
            -v "$GITHUB_WORKSPACE:/root/git/cloud-infra" \
            -v "$GITHUB_WORKSPACE/.reports-ssh:/root/.ssh:ro" \
            -e SOPS_AGE_KEY \
            -e GITHUB_TOKEN \
            -e BEARER_TOKEN \
            -e REQUIRE_BEARER=false \
            -e REPORTS_DIR=/root/git/cloud-infra/a_solutions/infra-obs_reports/src \
            -e CLOUD_DATA_DIR=/root/git/cloud-infra/1_cloud-configs/dist \
            ghcr.io/diegonmarcos/cloud-data-reports:arm64 \
            "$REPORT_TARGET"
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEARER_TOKEN: ${{ secrets.BEARER_TOKEN }}

      - name: Fix dist permissions
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE/a_solutions/infra-obs_reports/src/dist/"

      - name: Publish to cloud-data
        env:
          CLOUD_DATA_DEPLOY_KEY: ${{ secrets.CLOUD_DATA_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$CLOUD_DATA_DEPLOY_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git clone --depth=1 \
            --config core.sshCommand="ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no" \
            git@github.com:diegonmarcos/cloud-data.git /tmp/cd
          mkdir -p /tmp/cd/y_old/reports/dist
          cp -r "$GITHUB_WORKSPACE/a_solutions/infra-obs_reports/src/dist/." /tmp/cd/y_old/reports/dist/
          # Publish the manifest the engine writes — see the same block in
          # cloud-health-reports.yml for why it was being left behind.
          mkdir -p /tmp/cd/reports
          cp "$GITHUB_WORKSPACE/a_solutions/infra-obs_reports/src/manifest.json" /tmp/cd/reports/manifest.json
          cd /tmp/cd
          git config user.name  "Claude"
          git config user.email "noreply@anthropic.com"
          git add y_old/reports/dist/ reports/manifest.json
          git diff --cached --quiet && echo "No changes to commit" || \
            git commit -m "chore: update health reports $(date -u +%Y-%m-%dT%H:%M:%SZ)" && \
            git push
