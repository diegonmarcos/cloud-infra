# │  One-time / re-base bootstrap: snapshots the COMPLETE octocode │
# │  DB already on oci-apps (octocode_db volume, the ~12h full     │
# │  GraphRAG build) → GHCR. The incremental producer then builds  │
# │  on THIS base — never from scratch. ZERO logic in YAML; all in │
