name: "cgc-db SEED (existing oci-apps DB → GHCR)"

on:
  workflow_dispatch: {}

concurrency:
  group: ship-wg-runner
  cancel-in-progress: false

jobs:
  seed:
    name: snapshot oci-apps octocode_db → GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_ACTOR: ${{ github.actor }}
      WG_PRIVATE_KEY: ${{ secrets.WG_PRIVATE_KEY }}
      OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Install runtime deps (wireguard-tools, jq)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq wireguard-tools jq

      - name: WireGuard up
        run: bash 1_cicd/src/scripts/cloud-ship-ci-setup-wireguard.sh

      - name: Provision SSH key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$OCI_SSH_KEY" > ~/.ssh/cgc_deploy && chmod 600 ~/.ssh/cgc_deploy

      - name: Seed GHCR from existing oci-apps DB (all logic in the script)
        env:
          CGC_SSH_OPTS: "-i /home/runner/.ssh/cgc_deploy -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
        run: sh 1_cicd/src/ops/cloud-cgc-db-seed.sh
