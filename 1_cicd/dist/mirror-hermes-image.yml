name: Mirror hermes-agent image

# Copies the upstream Docker Hub image into our GHCR so oci-apps pulls it
# authenticated + fast. Docker Hub anonymous pulls are rate-limited and too slow
# to finish the ~900MB pull inside the ship's SSH/compose window (exit 255,
# nothing cached, permanent stall). GHCR pulls are authenticated (the ship
# already does `GHCR login OK`) and complete in the window like every other
# service. `imagetools create` does a registry-to-registry manifest copy — no
# local layer pull on the runner — so the multi-arch manifest is preserved.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 4 * * 1" # weekly Mon 04:00 UTC — pick up upstream hermes-agent updates

concurrency:
  group: mirror-hermes-image
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_ACTOR: ${{ github.actor }}
      SRC: docker.io/nousresearch/hermes-agent:latest
      DST: ghcr.io/diegonmarcos/hermes-agent:latest
    steps:
      - name: Login to GHCR
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Mirror upstream -> GHCR (multi-arch manifest copy)
        run: docker buildx imagetools create -t "$DST" "$SRC"

      - name: Verify GHCR manifest (arm64 + amd64 present)
        run: docker buildx imagetools inspect "$DST"
