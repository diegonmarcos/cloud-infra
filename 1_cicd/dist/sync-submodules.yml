name: Auto-sync submodules

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'  # every 30 min — catches upstream submodule pushes

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          token: ${{ secrets.GITHUB_TOKEN }}

      # Allowlist: `submodules: true` makes checkout abort on the first
      # submodule GITHUB_TOKEN cannot reach — vault, notes and cloud-data-lfs
      # are private siblings, and the token is scoped to this repo only.
      # Only the pins this job actually bumps need to be checked out.
      - uses: ./.github/actions/init-submodules
        with:
          include: I_cloud
          cloud_data_deploy_key: ${{ secrets.CLOUD_DATA_DEPLOY_KEY }}

      - name: Update submodules
        run: git submodule update --remote -- cloud

      - name: Run
        shell: bash {0}
        run: |
          # Stage submodule pointer changes first, then check staged diff.
          #
          # `.gitmodules` has `ignore=all` per submodule. That setting also
          # propagates into `git diff --cached`, silently HIDING gitlink-SHA
          # bumps even after `git add`. Result: this workflow used to
          # always see "clean" → never commit → submodule pins drift
          # forever (verified 2026-05-05: II_Unix pin was 36+ days stale).
          #
          # Fix: pass `--ignore-submodules=none` to override the per-module
          # ignore setting, so cached gitlink changes are visible to the
          # `--quiet` check. Tested: with the override, exit=1 when a pin
          # has bumped, exit=0 when nothing changed.
          git config user.name  "Claude"
          git config user.email "noreply@anthropic.com"
          git add 1_cicd/dist cloud
          if ! git diff --cached --ignore-submodules=none --quiet; then
            git commit -m "auto: update submodules [skip ci]"
            git push
          fi
