name: "Ship → wrangler"

# Non-VM deploy target, mirrors ship-terraform.yml's precedent: services
# whose build.json declares deploy.wrangler are dropped from _gha.services
# (no deploy.host — correctly, wrangler deploys have no VM) and therefore
# never appear in ship.yml's VM matrix. This workflow discovers them
# directly from build.json instead of bending the VM-shaped matrix around
# a non-VM target. The engine-side logic is already correct: build.sh ship
# short-circuits to step_build; step_secrets; step_wrangler when
# deploy.wrangler=true — this workflow just needs to invoke it.
on:
  push:
    paths:
      - "a_solutions/infra-cloud_cloudflare-worker/src/**"
      - "1_cicd/src/cicd/ship-wrangler.yml"
    branches: [main]
  workflow_dispatch:
    inputs:
      services:
        description: "Comma-separated wrangler service dirs (e.g. infra-cloud_cloudflare-worker) or 'all'"
        required: false
        type: string

concurrency:
  group: wrangler
  cancel-in-progress: false

jobs:
  wrangler:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Job-level so the composite fetch-vault action inherits SOPS_AGE_KEY and
    # its Export step's inline branch succeeds (multi-line keys arrive as
    # SOPS_AGE_KEY_FILE=<path> whose file isn't on the runner). Matches
    # ship-gen-configs / ship / ship-home-manager / ship-terraform.
    env:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      # Allowlist: `submodules: true` aborts checkout on the first submodule
      # CI cannot reach (vault / notes / cloud-data-lfs are private siblings;
      # cloud-master's own .gitmodules is SSH-only). Init just what is used.
      - uses: ./.github/actions/init-submodules
        with:
          include: I_cloud
          cloud_data_deploy_key: ${{ secrets.CLOUD_DATA_DEPLOY_KEY }}

      # Discover targets from build.json directly (deploy.wrangler == "true",
      # matching how the engine reads it) — NOT via _gha.services, which
      # drops wrangler-deploy services because they have no deploy.host.
      - name: Discover wrangler services
        id: discover
        run: |
          set -eu
          ALL=""
          for f in a_solutions/*/build.json; do
            [ -f "$f" ] || continue
            if jq -e '.deploy.wrangler == "true"' "$f" >/dev/null 2>&1; then
              ALL="$ALL $(basename "$(dirname "$f")")"
            fi
          done
          ALL="$(echo "$ALL" | xargs -n1 | sort -u | xargs)"
          echo "Discovered wrangler services: ${ALL:-<none>}"

          INPUT_SERVICES="${{ inputs.services }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$INPUT_SERVICES" ] && [ "$INPUT_SERVICES" != "all" ]; then
            SELECTED="$(echo "$INPUT_SERVICES" | tr ',' ' ')"
          elif [ "${{ github.event_name }}" = "push" ]; then
            DIFF=$(git diff --name-only HEAD^ HEAD 2>/dev/null || true)
            SELECTED=""
            for svc in $ALL; do
              echo "$DIFF" | grep -q "^a_solutions/$svc/src/" && SELECTED="$SELECTED $svc"
            done
          else
            SELECTED="$ALL"
          fi
          SELECTED="$(echo "$SELECTED" | xargs -n1 | sort -u | xargs)"
          echo "services=$SELECTED" >> "$GITHUB_OUTPUT"
          if [ -z "$SELECTED" ]; then
            echo "::notice::no wrangler services matched — skipping"
          else
            echo "Shipping: $SELECTED"
          fi

      # Vault clone — provides ~/git/cloud-vault/vault-keys-docker.envfile that
      # cloud-builder's compose.yaml references via env_file:. Without it,
      # `docker compose run cloud-builder` aborts: "env file ... not found".
      - name: Fetch vault
        if: ${{ steps.discover.outputs.services != '' }}
        uses: ./.github/actions/fetch-vault
        with:
          vault_deploy_key: ${{ secrets.VAULT_DEPLOY_KEY }}

      - name: Resolve builder image
        if: ${{ steps.discover.outputs.services != '' }}
        uses: ./.github/actions/resolve-builder-image

      - name: Ship via cloud-builder
        if: ${{ steps.discover.outputs.services != '' }}
        env:
          SERVICES: ${{ steps.discover.outputs.services }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -eu
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # BUILDER_IMAGE is exported by ./.github/actions/resolve-builder-image
          # which reads II_Unix/cb_containers-builders/build.json (master).
          IMAGE="$BUILDER_IMAGE"
          docker pull "$IMAGE"
          # Pull the canonical compose.yaml from the image, then ship inside
          # it. `build.sh ship` is the universal engine — same script runs
          # locally + in CI; for deploy.wrangler=true services it short-
          # circuits to step_build; step_secrets; step_wrangler.
          docker run --rm "$IMAGE" cat /opt/cloud-builder/compose.yaml > /tmp/cb.yaml
          docker compose -f /tmp/cb.yaml run --rm \
            --cap-add NET_ADMIN \
            -v "$HOME/git/cloud-vault:/root/git/cloud-vault:ro" \
            -v "$GITHUB_WORKSPACE:/root/git/cloud-gha" \
            -e SERVICES \
            -e CLOUDFLARE_API_KEY -e CLOUDFLARE_EMAIL \
            cloud-builder \
            sh -c 'cd /root/git/cloud-gha && for svc in $SERVICES; do echo "== Shipping $svc ==" && bash "a_solutions/$svc/build.sh" ship || exit 1; done'
