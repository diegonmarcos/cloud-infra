name: "Ship → Reports image"

on:
  push:
    paths:
      # Actual layout is reports/src/<crate>/src/** (crates live under
      # reports/src/, not directly under reports/) — the old
      # "reports/*/src/**" glob only matched a nonexistent
      # reports/<crate>/src/** shape and silently never fired on any
      # report source change (confirmed: no run for the mail-health-full
      # fix commit that should have triggered it, 2026-07-03).
      - "reports/src/**"
      - "reports/Cargo.toml"
      - "reports/Dockerfile"
      - "reports/entrypoint.sh"
      - "reports/build-deps.json"
      - "reports/docker-compose.yml"
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  preflight-symlinks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on broken symlinks (source trees only)
        run: |
          set -e
          # Scope: source files used in builds. Skip dist/target/node_modules/.git —
          # those are build outputs, not inputs, and can legitimately contain
          # machine-local symlinks (e.g. cargo deps symlinked into ~/.cargo).
          broken=$(find . -xtype l \
            -not -path "./.git/*" \
            -not -path "*/dist/*" \
            -not -path "*/target/*" \
            -not -path "*/node_modules/*" 2>/dev/null || true)
          if [ -n "$broken" ]; then
            echo "::error::Broken symlinks found in source tree:"
            echo "$broken"
            exit 1
          fi
          echo "No broken symlinks in source tree."

  build:
    name: "Build + push reports image (per-arch native + manifest)"
    needs: preflight-symlinks
    runs-on: ubuntu-latest
    # Hang guard (same doctrine as ship-home-manager 2026-07-08): a wedged
    # remote build must never hold the runner hostage. Native arm64 Rust
    # build on the 4-OCPU A1 runner is ~10-20 min cold, minutes warm.
    timeout-minutes: 75
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_ACTOR: ${{ github.actor }}
      # arm64 leg: the builder entrypoint brings wg0 up (WG_PRIVATE_KEY) and
      # writes ~/.ssh/id_deploy (SSH_KEY) BEFORE dispatching ship-reports.
      # The script then builds natively on the declared arm64 runner
      # (build-workflows.json .runners.arm64 → oci-apps) over the mesh —
      # NO QEMU (banned by pre-commit content scan, 2026-06-20).
      SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
      WG_PRIVATE_KEY: ${{ secrets.WG_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      # unix carries cb_containers-builders/build.json — the builder-image
      # master that ./.github/actions/resolve-builder-image (below) reads.
      # Bare checkout leaves it uninitialised and that action fails.
      - uses: ./.github/actions/init-submodules
        with:
          include: I_cloud
          cloud_data_deploy_key: ${{ secrets.CLOUD_DATA_DEPLOY_KEY }}

      # Vault clone — provides ~/git/cloud-vault/vault-keys-docker.envfile that
      # cloud-builder's compose.yaml references via env_file:. Without it,
      # `docker compose run cloud-builder` aborts: "env file ... not found".
      # Same wiring as ship-gen-configs.yml / ship-home-manager.yml.
      - name: Fetch vault
        uses: ./.github/actions/fetch-vault
        with:
          vault_deploy_key: ${{ secrets.VAULT_DEPLOY_KEY }}

      - name: Resolve builder image
        uses: ./.github/actions/resolve-builder-image

      - name: Ship via cloud-builder
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # BUILDER_IMAGE is exported by ./.github/actions/resolve-builder-image
          # which reads II_Unix/cb_containers-builders/build.json (master).
          IMAGE="$BUILDER_IMAGE"
          docker pull "$IMAGE"
          # NET_ADMIN + /dev/net/tun — required for wg-quick up wg0 inside
          # the builder (SSH to the arm64 runner is WG-only, never public).
          docker run --rm \
            --cap-add NET_ADMIN \
            --device /dev/net/tun \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e GITHUB_TOKEN \
            -e GITHUB_ACTOR \
            -e SSH_KEY \
            -e WG_PRIVATE_KEY \
            "$IMAGE" ship-reports
