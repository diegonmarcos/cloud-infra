# Flex oci-p-flex_1 iptables (custom INPUT rules)
# Strict firewall: REJECT default, allow SSH + ICMP + WireGuard subnet
#
# *filter
# :INPUT ACCEPT
# -A INPUT -m state --state RELATED,ESTABLISHED -j ACCEPT
# -A INPUT -p icmp -j ACCEPT
# -A INPUT -i lo -j ACCEPT
# -A INPUT -p tcp -m state --state NEW -m tcp --dport 22 -j ACCEPT
# -A INPUT -s 10.0.0.0/24 -j ACCEPT
# -A INPUT -s 35.226.147.64/32 -p tcp -m tcp --dport 8443 -j ACCEPT
# -A INPUT -j REJECT --reject-with icmp-host-prohibited
# -A FORWARD -j DOCKER-USER
# -A FORWARD -j DOCKER-FORWARD
# -A FORWARD -j REJECT --reject-with icmp-host-prohibited
#
# Note: Gitea SSH on port 2222, exposed via Docker NAT
# Note: PhotoPrism bound to 10.0.0.2:2342 (WireGuard only)
