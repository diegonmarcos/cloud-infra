<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>vm-pilot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button class="hamburger" id="hamburger" aria-label="Toggle sidebar">&#9776;</button>
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h2 id="vm-name">vm-pilot</h2>
      <button class="close-btn" id="close-btn">&times;</button>
    </div>
    <section class="sidebar-section">
      <h3>VM</h3>
      <ul id="vm-info"></ul>
    </section>
    <section class="sidebar-section">
      <h3>Services</h3>
      <ul id="services-list"></ul>
    </section>
    <section class="sidebar-section">
      <h3>Other VMs</h3>
      <ul id="other-vms"></ul>
    </section>
    <section class="sidebar-section">
      <h3>Data</h3>
      <ul id="data-links">
        <li><a href="/health/latest.json" target="_blank">health.json</a></li>
        <li><a href="/pilot/data/containers.json" target="_blank">containers.json</a></li>
        <li><a href="/pilot/data/journal-errors.json" target="_blank">journal-errors.json</a></li>
      </ul>
    </section>
  </nav>
  <main class="content">
    <iframe id="terminal" src="/ttyd/"></iframe>
  </main>
  <script src="pilot.js"></script>
</body>
</html>
