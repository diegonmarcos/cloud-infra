# SMTP Proxy - HTTP to SMTP gateway
# Deployed on: oci-f-micro_1 (130.110.251.193)
# Path on server: /home/ubuntu/smtp-proxy/

services:
  smtp-proxy:
    build: .
    container_name: smtp-proxy
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SMTP_HOST=front
      - SMTP_PORT=25
      - API_KEY=${SMTP_PROXY_API_KEY}
      - LISTEN_PORT=8080
    networks:
      - mailu_default

networks:
  mailu_default:
    external: true
