# Docker Mailserver
# Deployed on: oci-f-micro_1 (130.110.251.193)
# Path on server: /home/ubuntu/mail/

services:
  mail-app:
    image: docker.io/mailserver/docker-mailserver:latest
    container_name: mail-app
    hostname: mail
    domainname: diegonmarcos.com
    restart: unless-stopped
    ports:
      - '25:25'
      - '587:587'
      - '993:993'
    volumes:
      - mail_data:/var/mail
      - mail_state:/var/mail-state
      - mail_logs:/var/log/mail
      - mail_config:/tmp/docker-mailserver
      - /etc/localtime:/etc/localtime:ro
    environment:
      - ENABLE_SPAMASSASSIN=1
      - ENABLE_CLAMAV=0
      - ENABLE_FAIL2BAN=1
      - ENABLE_POSTGREY=0
      - ONE_DIR=1
      - DMS_DEBUG=0
      - SSL_TYPE=letsencrypt
      - PERMIT_DOCKER=network
    cap_add:
      - NET_ADMIN
      - SYS_PTRACE
    healthcheck:
      test: ss --listening --tcp | grep -P 'LISTEN.+:smtp'
      timeout: 3s
      retries: 0

volumes:
  mail_data:
  mail_state:
  mail_logs:
  mail_config:
