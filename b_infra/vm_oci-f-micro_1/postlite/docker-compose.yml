# Postlite - PostgreSQL wire protocol for SQLite
# Deployed on: oci-f-micro_1 (130.110.251.193)
# Path on server: /home/ubuntu/postlite/

services:
  postlite-mailu:
    image: postlite:latest
    container_name: postlite-mailu
    restart: unless-stopped
    ports:
      - "5433:5432"
    volumes:
      - /opt/mailu/data:/data:ro
    command: ["-addr", ":5432", "-dsn", "/data/main.db"]
    networks:
      - mailu_default

  postlite-roundcube:
    image: postlite:latest
    container_name: postlite-roundcube
    restart: unless-stopped
    ports:
      - "5434:5432"
    volumes:
      - /opt/mailu/webmail:/data:ro
    command: ["-addr", ":5432", "-dsn", "/data/roundcube.db"]
    networks:
      - mailu_default

networks:
  mailu_default:
    external: true
