# Palantir Monitor - Infrastructure Security Scanner
# Deployed on: oci-f-micro_1 (130.110.251.193)
# Path on server: /opt/palantir-monitor/

services:
  palantir-monitor:
    container_name: palantir-monitor
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    cpus: 0.25
    mem_limit: 64m
    volumes:
      - ${SSH_KEY_OCI:-~/.ssh/id_rsa}:/root/.ssh/id_rsa:ro
      - ${SSH_KEY_GCP:-~/.ssh/google_compute_engine}:/root/.ssh/google_compute_engine:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - palantir-reports:/app/reports
      - ./config:/app/config:ro
    environment:
      - SMTP_PROXY_URL=http://130.110.251.193:8080/
      - SMTP_PROXY_KEY=${SMTP_PROXY_API_KEY}
      - SMTP_USER=no-reply@diegonmarcos.com
      - SMTP_PASS=${SMTP_PASS:-}
      - DAEMON_MODE=false
      - CHECK_INTERVAL=86400
      - OCI_MICRO_1=130.110.251.193
      - OCI_MICRO_2=129.151.228.66
      - GCP_MICRO_1=35.226.147.64
      - OCI_FLEX_1=84.235.234.87
    networks:
      - monitor

  palantir-cron:
    container_name: palantir-cron
    image: debian:bookworm-slim
    restart: unless-stopped
    cpus: 0.05
    mem_limit: 64m
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    entrypoint: /bin/bash
    command:
      - -c
      - |
        apt-get update && apt-get install -y --no-install-recommends docker.io cron && rm -rf /var/lib/apt/lists/*
        echo "0 7 * * * root docker start palantir-monitor" > /etc/cron.d/palantir
        chmod 0644 /etc/cron.d/palantir
        cron -f
    networks:
      - monitor

volumes:
  palantir-reports:

networks:
  monitor:
    driver: bridge
