# GCP gcp-f-micro_1 iptables (non-Docker rules)
# Note: Docker manages its own chains (DOCKER, DOCKER-BRIDGE, etc)
# Only custom/OS-level rules are documented here
#
# The GCP firewall is the primary perimeter; iptables is Docker-managed only.
# No custom INPUT/OUTPUT rules — GCP firewall allows: SSH(22), HTTP(80), HTTPS(443), WireGuard(51820)
#
# Custom raw rules (Docker network isolation):
# -A PREROUTING -d <container_ip> ! -i <bridge> -j DROP  (per-container isolation)
# -A PREROUTING -d 127.0.0.1 ! -i lo -p tcp --dport 9091 -j DROP  (authelia localhost-only)
# -A PREROUTING -d 127.0.0.1 ! -i lo -p tcp --dport 8090 -j DROP  (ntfy localhost-only)
# -A PREROUTING -d 127.0.0.1 ! -i lo -p tcp --dport 6379 -j DROP  (redis localhost-only)
#
# NAT: WireGuard masquerade
# -A POSTROUTING -s 10.0.0.0/24 -o wg0 -j MASQUERADE
#
# Postlite/ws4sqlite bound to WireGuard IP only (10.0.0.1:8880-8883, 5433-5436)
