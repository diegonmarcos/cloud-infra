# Sauron Lite - Lightweight Security Scanner
# Deployed on: oci-f-micro_2 (129.151.228.66)
# Path on server: /home/ubuntu/sauron-lite/

version: "3.8"

services:
  sauron:
    container_name: sauron
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - /etc:/watch/etc:ro
      - /home:/watch/home:ro
      - ./yara-rules:/etc/sauron/yara-rules:ro
      - sauron-data:/var/log/sauron
      - sauron-queue:/var/spool/sauron
    environment:
      - VM_NAME=${VM_NAME:-unknown}
      - WATCH_DIRS=/watch/etc /watch/home
      - QUEUE_FILE=/var/spool/sauron/scan-queue.txt
      - ALERTS_FILE=/var/log/sauron/alerts.jsonl
      - RULES_DIR=/etc/sauron/yara-rules
    mem_limit: 64m
    mem_reservation: 16m
    cpus: 0.5
    cpu_shares: 256
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    networks:
      - security
    healthcheck:
      test: ["CMD", "pgrep", "-f", "inotifywait"]
      interval: 60s
      timeout: 5s
      retries: 3

  forwarder:
    image: debian:bookworm-slim
    container_name: sauron-forwarder
    restart: unless-stopped
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        apt-get update && apt-get install -y --no-install-recommends netcat-openbsd && rm -rf /var/lib/apt/lists/*
        tail -F /var/log/sauron/alerts.jsonl 2>/dev/null | while read line; do
          echo "$$line" | nc -w1 $${CENTRAL_HOST} $${CENTRAL_PORT} 2>/dev/null || true
        done
    volumes:
      - sauron-data:/var/log/sauron:ro
    environment:
      - CENTRAL_HOST=${CENTRAL_HOST:-34.55.55.234}
      - CENTRAL_PORT=${CENTRAL_PORT:-5514}
    depends_on:
      - sauron
    mem_limit: 16m
    cpus: 0.05
    networks:
      - security

volumes:
  sauron-data:
  sauron-queue:

networks:
  security:
    driver: bridge
