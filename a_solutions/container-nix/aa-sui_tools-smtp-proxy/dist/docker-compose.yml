services:
  smtp-proxy:
    build: .
    container_name: smtp-proxy
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SMTP_HOST=front
      - SMTP_PORT=25
      - API_KEY=REDACTED
      - LISTEN_PORT=8080
    networks:
      - mailu_default

networks:
  mailu_default:
    external: true
