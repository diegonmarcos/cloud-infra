# git.yaml — Cloud repo git workflow config
# Used by git.sh to automate push/merge behavior

# Files where remote always wins on merge conflict
# (regenerated by engines — local version is always stale after rebase)
remote_wins:
  - config.json
  - cloud-topology.json
  - cloud-topology.md
  - cloud-configs.json
  - cloud-configs.md
  - cloud-configs.md.njk

# Files regenerated on every push (folded into last commit, no extra GHA commit)
regenerate:
  engine: a_solutions/bc-obs_c3-mcp-api/src
  outputs:
    - config.json
    - cloud-topology.json
    - cloud-topology.md
    - cloud-configs.json
    - cloud-configs.md
