# git.yaml — Cloud repo git workflow config
# Used by git.sh to automate push/merge behavior
#
# 2026-04-28 migrated: cloud-data-{topology,configs}.json moved to
# dist/z_archive/. The new master file is _cloud-data-consolidated.json,
# emitted by 1_configs/src/engine/cloud-data-config-consolidated.ts.
# Per-container build-{name}.json files live at dist/ root (one per
# container, plus one for each container-less service).

# Files where remote always wins on merge conflict
# (regenerated by engines — local version is always stale after rebase)
remote_wins:
  - config.json
  - 1_configs/dist/_cloud-data-consolidated.json
  - 1_configs/dist/build-*.json
  - 1_configs/dist/z_archive/cloud-data-*.json
  - 1_configs/dist/manifest.json
  - 1_configs/manifest.json
  - cloud-topology.md
  - cloud-configs.md
  - cloud-configs.md.njk

# Files regenerated on every push (folded into last commit, no extra GHA commit)
regenerate:
  engine: 1_configs/src/engine/cloud-data-config-consolidated.ts
  derive: 1_configs/src/engine/cloud-data-config-derive.ts
  outputs:
    - 1_configs/dist/_cloud-data-consolidated.json
    - 1_configs/dist/build-*.json
    - 1_configs/dist/z_archive/cloud-data-*.json
    - 1_configs/dist/manifest.json
    - cloud-topology.md
    - cloud-configs.md
